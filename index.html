<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOMS 306 textbook, notebook, worked homework, and interactive practice in one course mastery studio.">
  <title>SOMS 306 · Course Mastery Studio</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/companion.css">
  <link rel="stylesheet" href="./css/notebook.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/operations.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="studio-header">
    <button id="menu-toggle" class="shell-button mobile-menu" aria-label="Open course navigation" aria-expanded="false" aria-controls="studio-sidebar">☰</button>
    <a class="studio-brand" href="#/dashboard/ch1"><span class="brand-mark" aria-hidden="true">306</span><span><strong>SOMS 306</strong><small>Course Mastery Studio</small></span></a>
    <div class="header-actions">
      <button id="theme-toggle" class="shell-button" type="button">Theme: Auto</button>
      <button id="export-backup" class="shell-button" type="button">Export backup</button>
      <button id="import-backup" class="shell-button" type="button">Import backup</button>
    </div>
  </header>
  <div class="studio-layout">
    <aside id="studio-sidebar" class="studio-sidebar" aria-label="Course navigation">
      <nav id="main-navigation" class="main-navigation" aria-label="Main sections">
        <button type="button" data-section="dashboard"><span aria-hidden="true">◫</span> Dashboard</button>
        <button type="button" data-section="textbook"><span aria-hidden="true">▤</span> Textbook</button>
        <button type="button" data-section="notebook"><span aria-hidden="true">✎</span> Notebook</button>
        <button type="button" data-section="homework"><span aria-hidden="true">✓</span> Homework</button>
        <button type="button" data-section="study"><span aria-hidden="true">◎</span> Study</button>
        <button type="button" data-section="practice"><span aria-hidden="true">◇</span> Practice</button>
      </nav>
      <label class="sidebar-label" for="chapter-select">Current chapter</label>
      <select id="chapter-select" aria-label="Choose chapter"></select>
      <div id="chapter-progress" class="chapter-progress" aria-live="polite"></div>
      <label class="sidebar-label" for="course-search">Search the course</label>
      <input id="course-search" type="search" placeholder="Concept, formula, or objective…" autocomplete="off">
      <div id="search-results" class="search-results" aria-live="polite"></div>
      <details class="objective-details">
        <summary>Learning objectives</summary><div id="objective-links"></div>
      </details>
      <button id="settings-button" type="button" class="shell-button sidebar-settings">Settings &amp; progress</button>
      <p id="storage-status" class="storage-status" role="status">Progress saved in this browser.</p>
      <p class="sidebar-footnote">Use backups to keep a copy or move progress to another device.</p>
    </aside>
    <main id="main-content" class="studio-main" tabindex="-1">
      <div id="module-tools" class="module-tools" aria-label="Section tools"></div>
      <div id="companion-suite"></div>
      <div id="notebook-suite" class="notebook-suite" hidden></div>
      <noscript>This study platform needs JavaScript. Enable it to read the course and use the study tools.</noscript>
    </main>
  </div>
  <input id="backup-file" type="file" accept=".json,application/json" hidden>
  <div id="studio-message" class="studio-message" role="status" hidden></div>
  <div id="startup-error" class="startup-error" role="alert" hidden></div>
</body>
</html>
