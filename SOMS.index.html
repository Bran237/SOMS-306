service, laid out step by step.", "example": "A restaurant's blueprint mapping ordering, cooking, serving, and even the outsourced laundry service."}, {"id": "operations-management", "term": "Operations management", "tier": "must_know", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The management of systems or processes that create goods and/or provide services.", "plain": "It's the job of running the part of a business that actually makes the thing or performs the service customers pay for.", "why": "The chapter uses a car analogy: if a business were a car, operations would be its engine — the core of what the organization does.", "example": "A hospital's operations management covers scheduling surgeries, staffing nurses, and stocking medical supplies.", "textbookExample": "The chapter states that every book you read, every video you watch, every text you send, and every medical treatment you receive involves the operations function of one or more organizations.", "commonMistake": "Don't confuse operations with just 'manufacturing' — the definition explicitly covers both goods AND services.", "examQuestion": "Using the car analogy from the chapter, explain why operations is described as the 'engine' of a business.", "mnemonic": null, "bookDefinition": "“Operations management is the management of systems or processes that create goods and/or provide services.”"}, {"id": "supply-chain", "term": "Supply chain", "tier": "must_know", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The sequence of organizations—their facilities, functions, and activities—that are involved in producing and delivering a product or service, from basic suppliers to the final customer.", "plain": "Every company, truck, warehouse, and step involved in getting a raw material turned into a finished product in your hands.", "why": "The chapter frames operations and supply chains as intrinsically linked — no business organization can exist without both.", "example": "The chain from a wheat farm to a mill to a bakery to a supermarket shelf, for a loaf of bread.", "textbookExample": "The chapter describes a supply chain as being like a chain (sequential, interconnected links) or like a tree with branches (key suppliers with their own sub-suppliers).", "commonMistake": "A supply chain isn't just external suppliers — the chapter is explicit that supply chains are both external AND internal to the organization.", "examQuestion": "Using the bread supply chain example, explain why the value of the product increases as it moves through the chain.", "mnemonic": null, "bookDefinition": "“A supply chain is the sequence of organizations—their facilities, functions, and activities—that are involved in producing and delivering a product or service.”"}, {"id": "supply-chain-management", "term": "Supply chain management", "tier": "must_know", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The management of the sequence of internal and external facilities, functions, and activities that are involved in producing and delivering a product or service.", "plain": "Actively coordinating that whole chain, instead of just letting each link operate on its own.", "why": "Chapter 1 closes with a whole section (LO1.11) devoted to explaining why organizations can no longer just focus on their own operations and immediate suppliers.", "example": "A retailer sharing real-time sales data with its suppliers so they can plan production more accurately.", "textbookExample": "The chapter lists oscillating inventories, stockouts, and late deliveries as the historical problems that occur when supply chains are NOT actively managed.", "commonMistake": "Don't treat 'supply chain' and 'supply chain management' as identical — one is the structure (the chain itself), the other is the active coordination of it.", "examQuestion": "List three problems the chapter says can occur when supply chains are not actively managed.", "mnemonic": null, "bookDefinition": "“Supply chain management is the management of the sequence of internal and external facilities, functions, and activities that are involved in producing and delivering a product or service.”"}, {"id": "value-added", "term": "Value-added", "tier": "must_know", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "The difference between the cost of inputs and the value or price of outputs.", "plain": "How much more valuable something becomes after a company works on it, compared to what the raw materials cost.", "why": "The chapter calls this the essence of the operations function — the entire point of the transformation process.", "example": "Flour and sugar (cheap inputs) turned into a wedding cake (a much higher-value output).", "textbookExample": "The chapter notes firms use value-added funds for R&D, new facilities and equipment, worker salaries, and profits — and that value can also be psychological, as in branding.", "commonMistake": "Value-added isn't just profit — in nonprofits, the 'value' of outputs is their value to society, not a dollar profit figure.", "examQuestion": "Explain how value-added is measured differently in a for-profit company versus a nonprofit hospital.", "mnemonic": null, "bookDefinition": "“Value-added is the term used to describe the difference between the cost of inputs and the value or price of outputs.”"}, {"id": "goods-service-continuum", "term": "Goods–service continuum", "tier": "must_know", "lo": "1.2", "chapterId": "ch1", "section": "1.2", "definition": "A spectrum ranging from primarily goods with little service, to primarily service with few goods, since most products are actually a combination (a 'product package') of both.", "plain": "Almost nothing you buy is pure product or pure service — most things blend the two to different degrees.", "why": "This explains why 'goods operations' and 'service operations' aren't two totally separate fields — most real businesses sit somewhere in the middle.", "example": "Getting your oil changed: the oil itself is a good, but the labor to change it is a service.", "textbookExample": "The chapter gives house painting as another example: the service is the labor, but the paint itself is a good.", "commonMistake": "Don't assume manufacturing and service management are unrelated — Table 1.3 highlights real differences (customer contact, labor content, uniformity of input) but the chapter stresses many management topics apply to both.", "examQuestion": "Using Table 1.3, name two characteristics where goods and services typically differ, and explain why.", "mnemonic": null, "bookDefinition": "“Because there are relatively few pure goods or pure services, companies usually sell product packages, which are a combination of goods and services.”"}, {"id": "functional-areas", "term": "Three functional areas (Finance, Marketing, Operations)", "tier": "must_know", "lo": "1.4", "chapterId": "ch1", "section": "1.3", "definition": "The three basic functions every business organization has: finance (securing and allocating financial resources), marketing (assessing customer wants and promoting offerings), and operations (producing the goods or services).", "plain": "Every business, no matter the industry, needs someone raising/managing money, someone finding and keeping customers, and someone actually making the product or delivering the service.", "why": "The chapter stresses these three functions constantly interface and depend on each other's information — they don't operate in silos.", "example": "A car wash still needs all three: financing new equipment, marketing to bring in customers, and operations to actually wash the cars.", "textbookExample": "The chapter's Figure 1.6 shows the three functions as overlapping circles, since so many decisions in one area (e.g., a new product) require input from the other two.", "commonMistake": "A common exam trap: adding a fourth 'department' like HR or IT to this list. The book is explicit that these three are THE basic functional areas; other departments (legal, MIS, HR, PR) support them.", "examQuestion": "Explain why the chapter depicts finance, marketing, and operations as overlapping circles rather than separate boxes.", "mnemonic": "Finance funds it, Marketing sells it, Operations makes it.", "bookDefinition": "“Business organizations have three basic functional areas… finance, marketing, and operations.”"}, {"id": "process", "term": "Process", "tier": "must_know", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "One or more actions that transform inputs into outputs.", "plain": "Any sequence of steps that takes something in and turns it into something else.", "why": "The chapter states the central role of ALL management is process management — this is a foundational definition for the whole book.", "example": "A car wash process: car enters dirty (input), goes through wash/rinse/dry steps (transformation), exits clean (output).", "textbookExample": "The chapter frames every business process as a sequence of supplier–customer relationships, where each step is both a customer of the previous step and a supplier to the next.", "commonMistake": "Don't think of 'process' as only referring to factory production lines — the definition applies equally to a service interaction or an administrative task.", "examQuestion": "Explain what it means to say every step in a business process is 'both a customer and a supplier.'", "mnemonic": null, "bookDefinition": "“A process consists of one or more actions that transform inputs into outputs.”"}, {"id": "four-sources-of-variation", "term": "Four sources of variation", "tier": "must_know", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "Variety of goods/services offered, structural variation in demand (trends/seasonality), random variation (natural, uncontrollable), and assignable variation (caused by defective inputs, incorrect methods, or faulty equipment — correctable).", "plain": "The four different reasons a process's output or demand for it can bounce around instead of staying perfectly steady.", "why": "Distinguishing random from assignable variation is critical: one you can't control, the other you can and should fix.", "example": "A café's demand naturally rises on weekends (structural), varies slightly day to day for no clear reason (random), or drops noticeably because a barista trainee keeps making drinks wrong (assignable).", "textbookExample": "The chapter explicitly says assignable variation 'can be reduced or eliminated by analysis and corrective action' — unlike random variation, which managers generally cannot influence.", "commonMistake": "A frequent mix-up is treating all variation as random and un-fixable. Assignable variation specifically CAN and should be corrected.", "examQuestion": "Give an example of assignable variation and explain why it's different from random variation.", "mnemonic": null, "bookDefinition": "“Variation occurs in all business processes. It can be due to variety or variability.”"}, {"id": "model", "term": "Model", "tier": "must_know", "lo": "1.7", "chapterId": "ch1", "section": "1.7", "definition": "An abstraction of reality; a simplified representation of something, classified as physical, schematic, or mathematical.", "plain": "A simplified stand-in for something real and complicated, built to help you think about or test the real thing without dealing with all its messy details.", "why": "The chapter says models are heavily integrated throughout operations management decision making — nearly every technique in the book is some kind of model.", "example": "A toy car (physical model), a blueprint (schematic model), and a financial formula (mathematical model) are all models of different levels of abstraction.", "textbookExample": "The chapter warns that models don't guarantee good decisions, and that quantitative information from a model may be emphasized at the expense of important qualitative information.", "commonMistake": "Don't assume more sophisticated = better. The chapter warns that highly sophisticated models can be misapplied by users who don't understand their assumptions and limitations.", "examQuestion": "Name the three classifications of models the chapter describes, from most to least like their real-life counterparts.", "mnemonic": null, "bookDefinition": "“A model is an abstraction of reality, a simplified representation of something.”"}, {"id": "systems-perspective", "term": "Systems perspective", "tier": "must_know", "lo": "1.7", "chapterId": "ch1", "section": "1.7", "definition": "A 'big picture' view in decision making, where the output and objectives of the organization as a whole take precedence over those of any one subsystem.", "plain": "Making sure a decision that helps one department doesn't quietly hurt the company overall.", "why": "The chapter says this perspective is essential whenever something is designed, redesigned, or changed, because of ripple effects across departments.", "example": "Adding forward-collision braking to a car model requires input from design, training, scheduling, inventory, advertising, and suppliers all at once.", "textbookExample": "The chapter's central theme: 'the whole is greater than the sum of its individual parts.'", "commonMistake": "Don't confuse this with just 'communication' — it specifically means prioritizing organization-wide outcomes over any single subsystem's local optimum.", "examQuestion": "Using the forward-collision braking example, list three departments that would need to be involved in that single design decision.", "mnemonic": null, "bookDefinition": "“A system is defined as a set of interrelated parts that must work together… the whole is greater than the sum of its individual parts.”"}, {"id": "pareto-phenomenon", "term": "Pareto phenomenon", "tier": "must_know", "lo": "1.7", "chapterId": "ch1", "section": "1.7", "definition": "The observation that a relatively few issues or items are very important, so that addressing them has a disproportionately large impact on results.", "plain": "The 80/20 rule: a small number of causes usually drive most of the effect, so focus your energy there first.", "why": "The chapter calls this one of the most important and pervasive concepts in operations management, applicable at every level of management.", "example": "A factory finds that 3 of its 40 machines cause 70% of all downtime — fixing those 3 has the biggest impact.", "textbookExample": "The chapter notes this effect applies to 'every aspect of decision making, both professional and personal,' not just factory settings.", "commonMistake": "Don't assume it's always exactly '80/20' — the core idea is disproportionate impact from a few factors, not a fixed ratio.", "examQuestion": "Explain the Pareto phenomenon and give an example outside of business.", "mnemonic": null, "bookDefinition": "“This well-known effect is called the Pareto phenomenon, and it is one of the most important and pervasive concepts in operations management.”"}, {"id": "scientific-management", "term": "Scientific management", "tier": "must_know", "lo": "1.8", "chapterId": "ch1", "section": "1.8", "definition": "A management approach pioneered by Frederick Winslow Taylor based on observation, measurement, analysis and improvement of work methods, and economic incentives.", "plain": "Treating the design of work itself as something you can study and optimize scientifically, rather than just leaving it to tradition or guesswork.", "why": "It's the historical foundation the chapter credits for bringing 'widespread changes to the management of factories,' setting up everything that follows in the chapter's history section.", "example": "Timing exactly how long each step of an assembly task takes and redesigning the workstation to cut wasted motion.", "textbookExample": "The chapter notes Taylor was called to testify before Congress in 1911 (the same year his book Principles of Scientific Management was published) after public outcry that his methods were used to unfairly increase output without corresponding pay increases.", "commonMistake": "Don't credit Taylor with everything from this era — Gilbreth (motion study), Gantt (scheduling charts), and Emerson (organizational efficiency) were separate contributors within the same movement.", "examQuestion": "Explain why scientific management was controversial with workers, using the 1911 congressional hearings as an example.", "mnemonic": null, "bookDefinition": "“Taylor believed in a ‘science of management’ based on observation, measurement, analysis and improvement of work methods, and economic incentives.”"}, {"id": "mass-production", "term": "Mass production", "tier": "must_know", "lo": "1.9", "chapterId": "ch1", "section": "1.8", "definition": "A system of production in which large volumes of standardized goods are produced by low- or semiskilled workers using highly specialized, often costly equipment.", "plain": "Cranking out huge quantities of identical products using simplified tasks and specialized machines, instead of skilled all-around craftsmen.", "why": "The chapter credits mass production, built on interchangeable parts and division of labor, with launching the modern factory system via Henry Ford's Model T.", "example": "Ford's moving assembly line, where each worker performed one narrow task repeatedly as the car moved past them.", "textbookExample": "The chapter notes Ford's Model T was such a success the company had trouble keeping up with orders — which is exactly what pushed Ford toward scientific management and the moving assembly line.", "commonMistake": "Don't confuse mass production with lean production — mass production prioritizes volume and low unit cost with narrow, low-skill tasks; lean production emphasizes flexibility, quality, and a highly skilled workforce.", "examQuestion": "Explain how interchangeable parts and division of labor together enabled mass production.", "mnemonic": null, "bookDefinition": "“Mass production, a system of production in which large volumes of standardized goods are produced by low or semiskilled workers using highly specialized, and often costly, equipment.”"}, {"id": "lean-production", "term": "Lean production", "tier": "must_know", "lo": "1.9", "chapterId": "ch1", "section": "1.9", "definition": "An approach to production emphasizing quality, flexibility, time reduction, and teamwork, using much less of certain resources (space, inventory, workers) than mass production to produce a comparable output.", "plain": "Making the same amount of stuff with a lot less waste, using flexible, highly-skilled teams instead of narrow specialists.", "why": "The chapter frames lean as blending the best of mass production (high volume, low cost) and craft production (variety, flexibility, quality) into one approach.", "example": "A worker on a lean line who is trained and empowered to immediately stop the line if they spot a defect, rather than letting it pass through.", "textbookExample": "The chapter notes lean has spread beyond manufacturing into services, including health care, offices, and shipping and delivery.", "commonMistake": "Don't assume lean production makes jobs easier — the chapter explicitly notes it demands more from workers (teamwork, active improvement roles) and can create more pressure and anxiety than traditional systems.", "examQuestion": "Explain how lean production combines advantages of both mass production and craft production.", "mnemonic": null, "bookDefinition": "“Lean production… incorporates a number of the recent trends listed here, with an emphasis on quality, flexibility, time reduction, and teamwork.”"}, {"id": "agility", "term": "Agility", "tier": "supporting", "lo": "1.9", "chapterId": "ch1", "section": "1.9", "definition": "The ability of an organization to respond quickly to demands or opportunities, via a flexible system.", "plain": "Being able to pivot fast when what customers want, or how much they want, suddenly changes.", "example": "Zara and H&M getting trendy new fashions to shelves quickly by sourcing from nearby low-cost producers, unlike slower competitors like Macy's."}, {"id": "sustainability-om", "term": "Sustainability", "tier": "supporting", "lo": "1.10", "chapterId": "ch1", "section": "1.10", "definition": "Service and production processes that use resources in ways that do not harm ecological systems supporting current and future human existence.", "plain": "Running a business in a way that doesn't wreck the environment for future generations.", "example": "Puma's 'Clever Little Bag' packaging redesign, which uses 65% less cardboard and is projected to cut 10,000 tons of CO2 emissions a year."}, {"id": "five-ethical-principles", "term": "Five ethical principles (Markula Center)", "tier": "supporting", "lo": "1.10", "chapterId": "ch1", "section": "1.10", "definition": "Utilitarian (good outweighs harm), Rights (respect others' moral rights), Fairness (equals treated equally), Common Good (benefits the community), and Virtue (consistent with ideal character traits).", "plain": "Five different lenses for checking whether a decision is the ethical one.", "example": "Equal pay for equal work is the chapter's example of the Fairness Principle in action."}, {"id": "goods", "term": "Goods", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "Physical items that include raw materials, parts, subassemblies, and final products.", "plain": "Anything physical you can see or touch that a business produces.", "example": "A motherboard that goes into a computer is a good, just like the finished computer itself."}, {"id": "services", "term": "Services", "tier": "supporting", "lo": "1.1", "chapterId": "ch1", "section": "1.1", "definition": "Activities that provide some combination of time, location, form, or psychological value.", "plain": "Something done for or to you, rather than a physical object handed to you.", "example": "A physician's examination or a lawn care visit."}, {"id": "line-functions", "term": "Line functions", "tier": "supporting", "lo": "1.3", "chapterId": "ch1", "section": "1.3", "definition": "The primary functions in a business organization — operations and sales — which all other functions (accounting, finance, marketing support, IT) exist to support.", "plain": "The two functions that directly generate what a business sells and delivers, as opposed to functions that support them.", "example": "A company's IT department supports operations and sales, but doesn't itself make or sell the product."}, {"id": "business-process-categories", "term": "Three categories of business processes", "tier": "supporting", "lo": "1.5", "chapterId": "ch1", "section": "1.5", "definition": "Upper-management processes (organizational governance/strategy), operational processes (the core value stream: purchasing, production, marketing, sales), and supporting processes (accounting, HR, IT).", "plain": "Every business process falls into one of three buckets: steering the whole ship, doing the core work, or supporting the people doing the core work.", "example": "Organizational strategy (upper-management), producing a product (operational), and running payroll (supporting)."}, {"id": "system-design", "term": "System design (decisions)", "tier": "supporting", "lo": "1.6", "chapterId": "ch1", "section": "1.6", "definition": "Decisions relating to system capacity, facility location, department/equipment arrangement, product/service planning, and equipment acquisition — usually long-term, strategic commitments.", "plain": "The big, hard-to-reverse decisions about how the whole operation will be built and laid out.", "example": "Deciding where to build a new factory and how much capacity it should have."}, {"id": "system-operation", "term": "System operation (decisions)", "tier": "supporting", "lo": "1.6", "chapterId": "ch1", "section": "1.6", "definition": "Decisions relating to management of personnel, inventory planning and control, scheduling, project management, and quality assurance — generally tactical and operational decisions.", "plain": "The day-to-day decisions about running the operation that's already been built.", "example": "Deciding which shift a particular worker will cover this week."}, {"id": "trade-offs", "term": "Trade-off decisions", "tier": "supporting", "lo": "1.7", "chapterId": "ch1", "section": "1.7", "definition": "Decisions that require weighing competing advantages and disadvantages of a course of action.", "plain": "Choices where getting more of one good thing means giving up some of another.", "example": "Stocking more inventory improves customer service but increases holding costs — a classic operations trade-off."}, {"id": "analytics-types", "term": "Four types of analytics", "tier": "supporting", "lo": "1.7", "chapterId": "ch1", "section": "1.7", "definition": "Descriptive (summarizing data), diagnostic (why something happened), predictive (what will happen), and prescriptive (how to influence a desired change).", "plain": "Four different questions data analysis can answer: what happened, why it happened, what will happen next, and what should we do about it.", "example": "Forecasting techniques (Chapter 3) are the book's example of predictive analytics."}, {"id": "division-of-labor", "term": "Division of labor", "tier": "supporting", "lo": "1.8", "chapterId": "ch1", "section": "1.8", "definition": "Dividing an operation into a series of small tasks, with individual workers assigned to just one of those tasks.", "plain": "Breaking a big job into tiny, simple pieces so each worker only has to master one small part.", "example": "Adam Smith described this in The Wealth of Nations (1776); Ford applied it on the automobile assembly line."}, {"id": "interchangeable-parts", "term": "Interchangeable parts", "tier": "supporting", "lo": "1.8", "chapterId": "ch1", "section": "1.8", "definition": "Standardized parts, such that any part in a batch will fit any product coming down the assembly line, eliminating the need for custom fitting.", "plain": "Parts made so precisely the same that any one of them works as a replacement for any other.", "example": "Eli Whitney applying the concept to assembling muskets in the late 1700s."}, {"id": "human-relations-movement", "term": "Human relations movement", "tier": "supporting", "lo": "1.8", "chapterId": "ch1", "section": "1.8", "definition": "A management movement emphasizing the human element in job design, in contrast to scientific management's focus on technical efficiency.", "plain": "The realization that treating workers like interchangeable robots hurt productivity, and that motivation and human factors mattered too.", "example": "Elton Mayo's Hawthorne studies at Western Electric, which revealed worker motivation was critical to productivity."}, {"id": "time-series", "term": "Time series", "tier": "must_know", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "A time-ordered sequence of observations taken at regular intervals (hourly, daily, weekly, monthly, quarterly, annually).", "plain": "A list of numbers for the same thing (like weekly sales), recorded at regular checkpoints over time.", "why": "Every technique in LO3.6–LO3.12 (naive, averaging, trend, seasonality) is a way of analyzing a time series.", "example": "A restaurant's daily sales totals for the past year.", "textbookExample": "The chapter warns a demand forecast should be based on a time series of past DEMAND, not unit sales — sales will understate demand if stockouts occurred.", "commonMistake": "Don't use raw sales data when stockouts have occurred — sales will understate true demand.", "examQuestion": "Why does the chapter warn against basing a demand forecast on sales data alone?", "mnemonic": null, "bookDefinition": "“A time series is a time-ordered sequence of observations taken at regular intervals (hourly, daily, weekly, monthly, quarterly, annually).”"}, {"id": "trend", "term": "Trend", "tier": "must_know", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "A long-term upward or downward movement in time-series data.", "plain": "The general direction a series is heading over the long run, ignoring the day-to-day wiggles.", "why": "It's one of the four patterns (with seasonality, cycles, and random variation) you must identify before choosing a forecasting technique.", "example": "Steadily rising smartphone ownership over the past 15 years.", "textbookExample": "The chapter attributes trend to factors like population shifts, changing incomes, and cultural changes.", "commonMistake": "Don't confuse trend (long-term direction) with a cycle (multi-year wave) — they're different patterns needing different techniques.", "examQuestion": "Name two real-world factors the chapter cites as causes of trend.", "mnemonic": null, "bookDefinition": "“Trend refers to a long-term upward or downward movement in the data.”"}, {"id": "seasonality", "term": "Seasonality", "tier": "must_know", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "Short-term, fairly regular variations in a time series generally related to the calendar or time of day.", "plain": "A pattern that repeats predictably on a fixed short cycle — daily, weekly, or by season.", "why": "Once identified, seasonality is measured with seasonal relatives (LO3.12) and can be added into or removed from a forecast.", "example": "A bank seeing heavier foot traffic right before closing time every day.", "textbookExample": "The chapter notes restaurants and theaters experience 'seasonal' variation even within a single week.", "commonMistake": "Seasonality isn't limited to yearly seasons — the chapter explicitly applies the term to daily, weekly, and monthly recurring patterns too.", "examQuestion": "Give an example of daily seasonality from the chapter (not related to weather or holidays).", "mnemonic": null, "bookDefinition": "“Seasonality refers to short-term, fairly regular variations generally related to factors such as the calendar or time of day.”"}, {"id": "cycles", "term": "Cycles", "tier": "supporting", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "Wavelike variations in a time series lasting more than one year, often tied to economic, political, or agricultural conditions.", "plain": "Slow, multi-year ups and downs, like a business cycle.", "example": "The chapter recommends searching for a leading indicator (like housing starts) since cycles are hard to project from past data alone."}, {"id": "irregular-variations", "term": "Irregular variations", "tier": "supporting", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "Variation caused by unusual circumstances such as severe weather, strikes, or a major product change; not typical behavior.", "plain": "One-off disruptions that distort the data and should be removed before analysis if possible.", "example": "A snowstorm causing a sudden spike in generator sales."}, {"id": "random-variations", "term": "Random variations", "tier": "supporting", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "Residual variations that remain in a time series after trend, seasonality, cycles, and irregular variations have been accounted for.", "plain": "The leftover noise nobody can explain or predict, no matter how good the model.", "example": "The small day-to-day 'bumps' in a demand chart with no identifiable cause."}, {"id": "naive-forecast", "term": "Naive forecast", "tier": "must_know", "lo": "3.6", "chapterId": "ch3", "section": "3.6", "definition": "A forecast that uses a single previous value of a time series as the basis of the forecast.", "plain": "The simplest possible forecast: just assume next period looks like the last one (or last season, or continues the same recent change).", "why": "Its accuracy serves as a baseline: is a fancier technique worth its extra cost if it only slightly beats the naive forecast?", "example": "If demand last week was 20 cases, the naive forecast for this week is also 20 cases.", "textbookExample": "For trend data, the naive forecast adds the last change to the last value: if the last two values were 50 and 53 (a +3 change), the next forecast is 53 + 3 = 56.", "commonMistake": "Don't dismiss the naive method as too simple to matter — the chapter calls it 'a legitimate forecasting tool' precisely because of its zero cost and ease of use.", "examQuestion": "Given the last two values in a trending series were 50 and 53, what is the naive forecast for the next period?", "formula": "Stable series: F(next) = Last value. Trend: F(next) = Last value + (Last value − Previous value).", "mnemonic": null, "bookDefinition": "“A naive forecast uses a single previous value of a time series as the basis of a forecast.”"}, {"id": "moving-average", "term": "Moving average (MA)", "tier": "must_know", "lo": "3.7", "chapterId": "ch3", "section": "3.7", "definition": "A forecast that uses the average of a fixed number of the most recent actual data values, updated by dropping the oldest value and adding the newest each period.", "plain": "Average your last few periods of actual data to predict the next one, sliding the window forward each time.", "why": "It fixes the naive method's biggest weakness (no smoothing) by basing the forecast on several recent periods instead of just one.", "why_extra": null, "example": "A 3-week moving average forecast for next week is just the average of the last 3 weeks' actual demand.", "textbookExample": "Given demand of 43, 40, and 41 in the three most recent periods, MA3 forecast = (43+40+41)/3 = 41.33. If actual demand turns out to be 38 next, the next forecast becomes (40+41+38)/3 = 39.67.", "commonMistake": "Fewer periods in the average = more responsive to real changes AND more sensitive to random noise. More periods = smoother but slower to react. There's no free lunch — you're always trading responsiveness for stability.", "examQuestion": "Given demand of 24, 19, and 20 over the last three weeks, compute the 3-period moving average forecast.", "formula": "F(t) = (A(t-n) + … + A(t-2) + A(t-1)) ÷ n", "mnemonic": null, "bookDefinition": "“A moving average (MA) forecast uses a number of the most recent actual data values (A) in generating a forecast (F).”"}, {"id": "weighted-moving-average", "term": "Weighted moving average", "tier": "must_know", "lo": "3.8", "chapterId": "ch3", "section": "3.8", "definition": "Similar to a moving average, but assigns different (usually decimal) weights to each period, typically giving more weight to more recent values; the weights must sum to 1.00.", "plain": "A moving average where you get to say 'the most recent data matters more,' by giving it a bigger multiplier.", "why": "It fixes the plain moving average's weakness of treating a 10-week-old data point exactly the same as yesterday's.", "example": "Weights of .40 (most recent), .30, .20, .10 (oldest of the four periods used).", "textbookExample": "Given demand of 42, 40, 43, 40, 41 for periods 1–5, and weights .40/.30/.20/.10, the forecast for period 6 is .10(40) + .20(43) + .30(40) + .40(41) = 41.0.", "commonMistake": "The weights must sum to exactly 1.00 (100%) — forgetting this is a common calculation error.", "examQuestion": "Using weights .40/.30/.20/.10 (most to least recent) on demands of 43, 40, 41, 39 (most to least recent), compute the forecast.", "formula": "F(t) = W(t-n)·A(t-n) + … + W(t-2)·A(t-2) + W(t-1)·A(t-1), where all weights sum to 1.00", "mnemonic": null, "bookDefinition": "“A weighted average is similar to a moving average, except that it typically assigns more weight to the most recent values in a time series.”"}, {"id": "exponential-smoothing", "term": "Exponential smoothing", "tier": "must_know", "lo": "3.9", "chapterId": "ch3", "section": "3.9", "definition": "A weighted averaging method where each new forecast equals the previous forecast plus a percentage (the smoothing constant, alpha) of the previous forecast error.", "plain": "Nudge your last forecast a bit toward whatever actually happened, using one simple adjustable dial (alpha) to control how big that nudge is.", "why": "It's one of the most widely used forecasting techniques precisely because it's easy to calculate and easy to adjust — you only ever change one number, alpha.", "example": "Previous forecast 42, actual demand 40, alpha = .10: new forecast = 42 + .10(40 − 42) = 41.8.", "textbookExample": "Continuing the example, if the next actual demand is 43: new forecast = 41.8 + .10(43 − 41.8) = 41.92. Commonly used alpha values range from .05 to .50; low alpha for stable series, higher alpha when the average is more likely to shift.", "commonMistake": "A higher alpha means MORE responsiveness and LESS smoothing — students sometimes get this backwards. Alpha near 0 = heavy smoothing/slow to react; alpha near 1 = fast reaction/little smoothing.", "examQuestion": "Previous forecast was 100, actual demand was 90, and alpha = .20. Compute the new forecast.", "formula": "F(t) = F(t-1) + α[A(t-1) − F(t-1)]  (equivalently: F(t) = (1−α)F(t-1) + α·A(t-1))", "mnemonic": "Alpha near 0 = smooth and slow; alpha near 1 = fast and jumpy.", "bookDefinition": "“Exponential smoothing is a sophisticated weighted averaging method that is nonetheless relatively easy to use and understand.”"}, {"id": "trend-equation", "term": "Trend equation (linear trend line)", "tier": "must_know", "lo": "3.10", "chapterId": "ch3", "section": "3.10", "definition": "A straight-line equation Ft = a + bt used to forecast a series exhibiting a linear trend, where a is the y-intercept and b is the slope.", "plain": "Fit a straight line through your data, then just plug in a future time period to get its forecast.", "why": "Unlike moving averages, a trend line can project forecasts many periods into the future, not just the next one.", "example": "Given Ft = 45 + 5t, the forecast at t=10 is 45 + 5(10) = 95.", "textbookExample": "Using 10 weeks of cell phone sales data, the fitted trend line was Ft = 699.40 + 7.51t. Forecasts: F11 = 699.40 + 7.51(11) = 782.01; F12 = 699.40 + 7.51(12) = 789.52.", "commonMistake": "Don't interpret the y-intercept 'a' (the value at t=0) literally as a real prediction — t=0 is often outside the range of actual observed data.", "examQuestion": "Given the trend equation Ft = 20 + 3t, what is the forecast for period t = 8?", "formula": "F(t) = a + b·t,  where b = [nΣty − ΣtΣy] ÷ [nΣt² − (Σt)²]  and  a = [Σy − bΣt] ÷ n  (or ȳ − bṫ)", "mnemonic": null, "bookDefinition": "“Analysis of trend involves developing an equation that will suitably describe the trend.”"}, {"id": "trend-adjusted-smoothing", "term": "Trend-adjusted exponential smoothing", "tier": "must_know", "lo": "3.11", "chapterId": "ch3", "section": "3.11", "definition": "A variation of exponential smoothing (also called double smoothing) that adds a trend factor, used when a series has a linear trend; simple smoothing alone would otherwise always lag the trend.", "plain": "Regular exponential smoothing but with a second smoothing dial (beta) added specifically to track the trend, so forecasts don't perpetually run behind an increasing or decreasing series.", "why": "Simple exponential smoothing systematically under-forecasts a rising trend and over-forecasts a falling one; this fixes that lag.", "example": "An initial trend estimate of 9.33 (from an average change of 28 over 3 periods) plus a period-4 value of 728 gives a period-5 starting forecast of 728 + 9.33 = 737.33.", "textbookExample": "Using the cell phone data with alpha = .40 and beta = .30, the trend-adjusted forecast is built from a smoothed error term (St) and a current trend estimate (Tt), each updated every period.", "commonMistake": "Don't forget this method needs TWO smoothing constants (alpha for the average, beta for the trend), unlike simple exponential smoothing's one.", "examQuestion": "Why does simple exponential smoothing perform poorly on trending data, and what does trend-adjusted smoothing add to fix it?", "formula": "TAF(t+1) = S(t) + T(t),  where S(t) = TAF(t) + α[A(t) − TAF(t)]  and  T(t) = T(t-1) + β[TAF(t) − TAF(t-1) − T(t-1)]", "mnemonic": null, "bookDefinition": "“A variation of simple exponential smoothing can be used when a time series exhibits a linear trend. It is called trend-adjusted exponential smoothing, or sometimes double smoothing.”"}, {"id": "seasonal-relative", "term": "Seasonal relative (seasonal index)", "tier": "must_know", "lo": "3.12", "chapterId": "ch3", "section": "3.12", "definition": "In the multiplicative model of seasonality, a percentage of the average (or trend) amount used to multiply a series value to incorporate seasonality (e.g., 1.20 means 20% above average).", "plain": "A multiplier that tells you how much higher or lower than normal a particular season typically runs.", "why": "Businesses use the multiplicative model far more than the additive model because it better reflects real-world experience.", "example": "A seasonal relative of 1.20 for May toy sales means May sales run 20% above the monthly average; a relative of .90 for July means July sales are 90% of average.", "textbookExample": "To forecast with both trend and seasonality: first get the trend estimate, then multiply it by the matching seasonal relative (e.g., trend estimate for period 9 of 191.5 × a Q1 relative of 1.20 = 229.8).", "commonMistake": "To deseasonalize data, you DIVIDE by the seasonal relative; to add seasonality back into a trend forecast, you MULTIPLY by it — mixing these up is a common error.", "examQuestion": "A trend estimate for a given quarter is 200, and the seasonal relative for that quarter is 0.90. What is the seasonally adjusted forecast?", "formula": "Deseasonalize: Value ÷ Seasonal relative.  Forecast with seasonality: Trend estimate × Seasonal relative.", "mnemonic": "Divide to remove a season, multiply to add one back in.", "bookDefinition": "“The seasonal percentages in the multiplicative model are called seasonal relatives or seasonal indexes.”"}, {"id": "deseasonalize", "term": "Deseasonalize", "tier": "supporting", "lo": "3.12", "chapterId": "ch3", "section": "3.12", "definition": "To remove the seasonal component from data (by dividing each value by its seasonal relative) in order to see the underlying trend more clearly.", "plain": "Strip out the predictable up-and-down seasonal swings so you can see the real underlying direction of the data.", "example": "Dividing November retail sales by the November seasonal relative to compare it fairly against other months."}, {"id": "simple-linear-regression", "term": "Simple linear regression", "tier": "must_know", "lo": "3.13", "chapterId": "ch3", "section": "3.13", "definition": "An associative technique that fits a straight line (yc = a + bx) minimizing the sum of squared vertical deviations (least squares) to predict a dependent variable from one independent (predictor) variable.", "plain": "Find the best-fit straight line between two related things (like sales and profit) so you can predict one from the other.", "why": "Unlike time-series methods, regression explicitly identifies and uses a related (explanatory) variable, not just past values of the same series.", "example": "Predicting a store's profit from its sales figures using a fitted line.", "textbookExample": "For 12 Healthy Hamburgers stores, the fitted equation was yc = 0.0506 + 0.0159x. For sales of $10 million, predicted profit = 0.0506 + 0.0159(10) = 0.2099, or about $209,900.", "commonMistake": "Don't use the regression line to predict outside the range of your original data — the chapter explicitly warns the relationship may be nonlinear outside the observed range.", "examQuestion": "Using yc = 0.0506 + 0.0159x, what profit would this equation predict for sales of $20 million, and why should you be cautious about that estimate?", "formula": "yc = a + bx,  where b = [nΣxy − ΣxΣy] ÷ [nΣx² − (Σx)²]  and  a = [Σy − bΣx] ÷ n  (or ȳ − bx̄)", "mnemonic": null, "bookDefinition": "“The simplest and most widely used form of regression involves a linear relationship between two variables.”"}, {"id": "correlation-coefficient", "term": "Correlation coefficient (r)", "tier": "must_know", "lo": "3.13", "chapterId": "ch3", "section": "3.13", "definition": "A value ranging from −1.00 to +1.00 measuring the strength and direction of the linear relationship between two variables.", "plain": "A single number that tells you how tightly two things move together, and whether they move in the same or opposite directions.", "why": "It's one of three required conditions for a valid leading indicator: a logical relationship, correct timing, and a fairly high correlation.", "example": "A correlation near +1.00 means the two variables consistently rise and fall together; near −1.00 means one rises as the other falls.", "textbookExample": "New house sales versus 3-month-lagged unemployment had r = −.966 — a strong negative correlation, meaning higher unemployment three months earlier predicted lower home sales.", "commonMistake": "A correlation close to zero doesn't necessarily mean 'no relationship' — it specifically means little LINEAR relationship; a strong nonlinear relationship could still exist.", "examQuestion": "What does a correlation coefficient of r = −.966 tell you about the relationship between two variables?", "formula": "r = [nΣxy − ΣxΣy] ÷ √{[nΣx² − (Σx)²][nΣy² − (Σy)²]}", "mnemonic": null, "bookDefinition": "“Correlation measures the strength and direction of a relationship between two variables.”"}, {"id": "coefficient-of-determination", "term": "Coefficient of determination (r²)", "tier": "supporting", "lo": "3.13", "chapterId": "ch3", "section": "3.13", "definition": "The square of the correlation coefficient, ranging from 0 to 1.00, measuring the percentage of variability in y explained by the independent variable x.", "plain": "How much of the up-and-down in your outcome variable is actually accounted for by the predictor you're using.", "example": "An r² of .80 or higher indicates a good predictor; .25 or lower indicates a poor one; in between is moderate.", "formula": "r² = (correlation coefficient r)²"}, {"id": "standard-error-of-estimate", "term": "Standard error of estimate (Se)", "tier": "must_know", "lo": "3.13", "chapterId": "ch3", "section": "3.13", "definition": "A measure of how much actual data points scatter around a regression line, computed from the squared vertical differences between actual and predicted values.", "plain": "On average, how far off the regression line's predictions tend to be from the real data points.", "why": "Tighter scatter around the line (lower Se) means more confidence in the regression's predictions.", "example": "A small Se relative to the scale of the data suggests the regression line is a reliable predictor.", "textbookExample": "For the Healthy Hamburgers data (n=12), summed squared errors of .01659 gave Se = √(.01659/10) = .0407 million.", "commonMistake": "The denominator is n − 2, not n — a common calculation slip (two degrees of freedom are used up estimating a and b).", "examQuestion": "If the sum of squared errors is .04 and n = 10, compute the standard error of estimate.", "formula": "Se = √{ Σ(y − yc)² ÷ (n − 2) }", "mnemonic": null, "bookDefinition": "“The scatter can be summarized using the standard error of estimate.”"}, {"id": "forecast-error", "term": "Forecast error", "tier": "supporting", "lo": "3.2", "chapterId": "ch3", "section": "3.10", "definition": "The difference between the actual value and the forecasted value for a given period: Error = Actual − Forecast.", "plain": "How far off your prediction was, and in which direction.", "example": "If actual demand was 100 and the forecast was 90, the error is +10 (the forecast was too low).", "formula": "e(t) = A(t) − F(t)"}, {"id": "mad", "term": "Mean absolute deviation (MAD)", "tier": "must_know", "lo": "3.14", "chapterId": "ch3", "section": "3.14", "definition": "The average absolute forecast error, weighting all errors evenly regardless of size or direction.", "plain": "On average, how many units off your forecasts tend to be, ignoring whether they were too high or too low.", "why": "It's the easiest of the three accuracy measures to compute, but it treats a huge error the same (proportionally) as a small one.", "example": "If your errors over 5 periods were 2, -3, 1, -4, 2, MAD averages their absolute values: (2+3+1+4+2)/5 = 2.4.", "textbookExample": "For 8 periods of account-servicing data with absolute errors summing to 22, MAD = 22/8 = 2.75.", "commonMistake": "MAD is NOT the same as average error — it uses ABSOLUTE values, so positive and negative errors don't cancel out.", "examQuestion": "Given absolute errors of 4, 7, 4, 4, 5 over 5 periods, compute the MAD.", "formula": "MAD = Σ|Actual − Forecast| ÷ n", "mnemonic": null, "bookDefinition": "“MAD is the average absolute error.”"}, {"id": "mse", "term": "Mean squared error (MSE)", "tier": "must_know", "lo": "3.14", "chapterId": "ch3", "section": "3.14", "definition": "The average of squared forecast errors, giving disproportionately more weight to larger errors.", "plain": "Like MAD, but it punishes big misses much harder than small ones, since it squares each error first.", "why": "MSE is also the basis for control chart limits, since its square root approximates the standard deviation of forecast errors.", "example": "A forecasting method with one huge miss and several tiny ones will have a much higher MSE than a method with consistent, moderate errors — even if their MADs are similar.", "textbookExample": "For the same 8-period data (squared errors summing to 76), MSE = 76/(8−1) = 10.86.", "commonMistake": "The denominator for MSE is n − 1, not n — easy to mix up with MAD's plain n.", "examQuestion": "Given squared errors summing to 50 over 6 periods, compute the MSE.", "formula": "MSE = Σ(Actual − Forecast)² ÷ (n − 1)", "mnemonic": null, "bookDefinition": "“MSE is the average of squared errors.”"}, {"id": "mape", "term": "Mean absolute percent error (MAPE)", "tier": "must_know", "lo": "3.14", "chapterId": "ch3", "section": "3.14", "definition": "The average absolute percentage error, expressing each error relative to the actual value it corresponds to.", "plain": "How far off your forecasts are on average, expressed as a percentage of what actually happened — so errors are automatically put in context.", "why": "An error of 10 means very different things for a forecast of 15 versus a forecast of 10,000; MAPE is the measure that makes those comparable.", "example": "A 10-unit error on a forecast of 15 is a MAPE contribution of about 67%; the same 10-unit error on a forecast of 10,000 is basically 0.1%.", "textbookExample": "For the 8-period account-servicing example, the percent errors summed to 10.26%, so MAPE = 10.26%/8 = 1.28%.", "commonMistake": "Don't confuse MAPE with MAD expressed as a percentage — MAPE divides each individual error by its OWN period's actual value before averaging, not by an overall average.", "examQuestion": "Why would MAPE be preferred over MAD when comparing forecast accuracy across a store-brand product and a national-brand product with very different sales volumes?", "formula": "MAPE = Σ[(|Actual − Forecast>| ÷ Actual) × 100] ÷ n", "mnemonic": null, "bookDefinition": "“MAPE is the average absolute percent error.”"}, {"id": "control-chart", "term": "Control chart (for forecast errors)", "tier": "must_know", "lo": "3.15", "chapterId": "ch3", "section": "3.15", "definition": "A chart plotting forecast errors over time against upper and lower control limits (based on 0 ± z standard deviations), used to detect whether errors are random ('in control') or show a nonrandom pattern.", "plain": "A visual check that plots your forecast misses over time to catch two problems at once: errors that are too big, AND errors that form a suspicious pattern (like a long streak all positive or all negative).", "why": "The chapter states the control chart approach is generally superior to the tracking signal, since every error is judged individually rather than being buried inside a cumulative total.", "example": "If nearly all your recent errors are positive, that's a sign of bias even if none individually exceeds the control limits.", "textbookExample": "With MSE = 9.0 and z = 2, s = √9.0 = 3.0, so UCL = 0 + 2(3.0) = +6.0 and LCL = 0 − 2(3.0) = −6.0.", "commonMistake": "Being 'in control' requires BOTH conditions: all errors within the limits AND no visible pattern (trend, cycle, or one-sided cluster) — satisfying only one isn't enough.", "examQuestion": "If MSE = 16 and z = 2, compute the upper and lower control limits.", "formula": "Control limits = 0 ± z√MSE  (s = √MSE is the estimated standard deviation of the errors)", "mnemonic": null, "bookDefinition": "“A very useful tool for detecting nonrandomness in errors is a control chart.”"}, {"id": "tracking-signal", "term": "Tracking signal", "tier": "must_know", "lo": "3.15", "chapterId": "ch3", "section": "3.15", "definition": "A ratio of cumulative forecast error to the (smoothed) mean absolute deviation, used to detect bias — a persistent tendency for errors to be positive or negative.", "plain": "A running score that flags whether your forecast has been consistently too high or too low over time, not just off by chance.", "why": "It was historically popular because computing an average deviation was easier than computing a standard deviation before modern computers — but the chapter notes control charts are now considered superior.", "example": "Typical acceptable limits are ±4 or ±5; a tracking signal outside that range flags a biased forecast needing correction.", "textbookExample": "In the financial-seminar attendance example, the tracking signal stayed within ±4 for all 15 months tracked, suggesting no bias problem by that method — even though a control chart on the same data revealed suspicious strings of same-sign errors that the tracking signal missed.", "commonMistake": "A major weakness: because it uses CUMULATIVE error, large positive and negative errors can cancel out and hide a real problem — exactly what happened in the chapter's own worked example.", "examQuestion": "Explain, using the chapter's own example, why a tracking signal can appear fine (within limits) even when a control chart reveals a problem.", "formula": "Tracking signal(t) = [Cumulative(Actual − Forecast)] ÷ MAD(t)", "mnemonic": null, "bookDefinition": "“Another method is the tracking signal. It relates the cumulative forecast error to the average absolute error (i.e., MAD).”"}, {"id": "delphi-method", "term": "Delphi method", "tier": "supporting", "lo": "3.5", "chapterId": "ch3", "section": "3.7", "definition": "An iterative forecasting process using anonymous, circulated questionnaires among knowledgeable individuals to build toward a consensus forecast.", "plain": "Repeatedly polling experts anonymously, refining the questions each round, until opinions converge.", "example": "Predicting when a new vaccine might be ready for mass distribution, where hard data barely exists yet."}, {"id": "executive-opinions", "term": "Executive opinions (jury of executive opinion)", "tier": "supporting", "lo": "3.5", "chapterId": "ch3", "section": "3.7", "definition": "A forecast developed collectively by a small group of upper-level managers from different functions.", "plain": "Getting senior leaders from different departments in a room to hash out a forecast together.", "example": "Marketing, operations, and finance executives jointly forecasting demand for a new product line."}, {"id": "salesforce-opinions", "term": "Salesforce opinions", "tier": "supporting", "lo": "3.5", "chapterId": "ch3", "section": "3.7", "definition": "Forecasts built from the input of sales or customer-service staff, who have direct contact with customers.", "plain": "Asking the people who actually talk to customers every day what they expect demand to look like.", "example": "A risk noted in the chapter: salespeople may give low estimates if forecasts are used to set their own sales quotas."}, {"id": "consumer-surveys", "term": "Consumer surveys", "tier": "supporting", "lo": "3.5", "chapterId": "ch3", "section": "3.7", "definition": "Forecasts built by sampling opinions directly from current or potential customers.", "plain": "Just asking a sample of customers what they plan to do or buy.", "example": "The chapter warns surveys must contend with irrational buying behavior — like a customer's careful research being overridden by showroom glitter."}, {"id": "qualitative-techniques", "term": "Qualitative techniques", "tier": "must_know", "lo": "3.5", "chapterId": "ch3", "section": "3.5", "definition": "Forecasting methods consisting mainly of subjective inputs, which often defy precise numerical description.", "plain": "Forecasts built on judgment, opinions, and hunches rather than hard numbers.", "why": "They're one of the two general approaches to forecasting, and they're especially useful for explaining WHY a quantitative forecast came out the way it did.", "example": "A panel of executives forecasting demand for a totally new, never-before-sold product.", "textbookExample": "The chapter notes qualitative and quantitative methods work well together in a portfolio of predictive analytics: qualitative input helps explain the predicted outputs from quantitative methods.", "commonMistake": "Qualitative doesn't mean 'guessing randomly' — it specifically means incorporating soft information (human factors, opinions) that's hard or impossible to quantify.", "examQuestion": "Why might a company use both qualitative and quantitative forecasting methods together rather than choosing just one?", "mnemonic": null, "bookDefinition": "“Qualitative methods consist mainly of subjective inputs, which often defy precise numerical description.”"}, {"id": "quantitative-techniques", "term": "Quantitative techniques", "tier": "must_know", "lo": "3.5", "chapterId": "ch3", "section": "3.5", "definition": "Forecasting methods that project historical data forward or use associative models with causal (explanatory) variables.", "plain": "Forecasts built from hard, objective data rather than opinions.", "why": "They split into the two specific families — time-series forecasts and associative models — that make up most of the rest of this chapter.", "example": "Using last year's exact monthly sales figures to project this year's demand.", "textbookExample": "The chapter notes quantitative techniques usually avoid the personal biases that can contaminate qualitative methods.", "commonMistake": "Quantitative doesn't automatically mean 'more accurate' — it just means the input is objective, hard data rather than subjective opinion.", "examQuestion": "Name the two sub-types of quantitative forecasting technique described in the chapter.", "mnemonic": null, "bookDefinition": "“Quantitative methods involve either the projection of historical data or the development of associative models that attempt to use causal (explanatory) variables to make a forecast.”"}, {"id": "judgmental-forecasts", "term": "Judgmental forecasts", "tier": "must_know", "lo": "3.5", "chapterId": "ch3", "section": "3.5", "definition": "Forecasts relying on analysis of subjective inputs from sources such as consumer surveys, sales staff, managers and executives, and panels of experts.", "plain": "Forecasts built entirely from asking people — customers, salespeople, or experts — what they think will happen.", "why": "It's one of the chapter's three named categories of forecasting technique (alongside time-series and associative), and it covers all of the qualitative methods from this LO at once.", "example": "Asking a panel of industry experts to estimate when a new technology will reach mainstream adoption.", "textbookExample": "The chapter groups executive opinions, salesforce opinions, consumer surveys, and the Delphi method all under this single category.", "commonMistake": "Judgmental forecasts are still a legitimate, widely used category — don't assume 'subjective' means 'unreliable.' They're often the ONLY option when no historical data exists yet.", "examQuestion": "Name the four specific techniques that all fall under the umbrella of judgmental forecasts.", "mnemonic": null, "bookDefinition": "“Judgmental forecasts rely on analysis of subjective inputs obtained from various sources, such as consumer surveys, the sales staff, managers and executives, and panels of experts.”"}, {"id": "time-series-forecasts", "term": "Time-series forecasts", "tier": "must_know", "lo": "3.5", "chapterId": "ch3", "section": "3.5", "definition": "Forecasts that project past experience into the future, assuming the future will resemble the past, without trying to identify what causes the pattern.", "plain": "Just look at what happened before and assume something similar will keep happening — no need to explain why.", "why": "This category covers nearly every technique later in the chapter: naive, moving average, weighted average, exponential smoothing, trend, and seasonal methods are all time-series forecasts.", "example": "Using the last 12 months of ice cream sales to project next summer's demand, without asking WHY sales rise in summer.", "textbookExample": "The chapter notes some time-series models merely smooth out random variation, while others identify specific patterns (trend, seasonality) and extrapolate them forward.", "commonMistake": "Don't confuse this forecasting APPROACH with the underlying time-series DATA itself — the data is just the input; the time-series forecast is the technique applied to it.", "examQuestion": "Why don't time-series forecasts try to identify the causes behind a pattern in the data?", "mnemonic": null, "bookDefinition": "“Time-series forecasts simply attempt to project past experience into the future.”"}, {"id": "associative-models", "term": "Associative models", "tier": "must_know", "lo": "3.5", "chapterId": "ch3", "section": "3.5", "definition": "Forecasting equations that use one or more explanatory (predictor) variables believed to be related to the variable being forecast.", "plain": "Predict one thing using a DIFFERENT, related thing — like predicting paint sales from advertising spending.", "why": "This is the third named category, covered in depth later through simple linear regression.", "example": "Predicting demand for paint from its price per gallon and the amount spent advertising it.", "textbookExample": "The chapter's own example: demand for paint might be related to price per gallon, advertising spend, and even the paint's drying time or ease of cleanup.", "commonMistake": "Associative models require IDENTIFYING a related variable first — unlike time-series methods, which only need the variable's own past values.", "examQuestion": "Using the paint example, explain what makes associative models different from time-series forecasts.", "mnemonic": null, "bookDefinition": "“Associative models use equations that consist of one or more explanatory variables that can be used to predict demand.”"}, {"id": "reactive-approach", "term": "Reactive approach", "tier": "supporting", "lo": "3.16", "chapterId": "ch3", "section": "3.16", "definition": "Viewing forecasts as probable future demand and reacting to meet that demand (adjusting production, inventory, or workforce).", "plain": "Waiting to see what the forecast says, then adjusting your plans to match it.", "example": "A factory increasing its workforce because the forecast predicts higher demand next quarter."}, {"id": "proactive-approach", "term": "Proactive approach", "tier": "supporting", "lo": "3.16", "chapterId": "ch3", "section": "3.16", "definition": "Actively trying to influence demand itself, through advertising, pricing, or product/service changes, rather than just reacting to a forecast.", "plain": "Instead of just accepting the forecast, trying to actually change what the forecast will say.", "example": "A retailer running a discount promotion specifically to boost demand above what was originally forecast."}, {"id": "capacity", "term": "Capacity", "tier": "must_know", "lo": "5.1", "chapterId": "ch5", "section": "5.1", "definition": "An upper limit or ceiling on the load that an operating unit (a plant, department, machine, store, or worker) can handle.", "plain": "The most a system can produce or handle before it simply can't take on more.", "why": "It's the foundational concept for the entire chapter — every capacity decision is ultimately about managing this ceiling.", "example": "A bakery that can only bake 500 loaves a day no matter how many orders come in has a capacity of 500 loaves/day.", "textbookExample": "The chapter notes capacity needs include equipment, space, and employee skills, and the 'load' might be physical units produced (bicycles assembled per hour) or services performed (computers upgraded per hour).", "commonMistake": "Capacity isn't just about factories or machines — it applies equally to a single worker, a department, or an entire organization.", "examQuestion": "Give an example of capacity measured in terms of services performed, rather than physical units produced.", "bookDefinition": "“Capacity refers to an upper limit or ceiling on the load that an operating unit can handle.”", "mnemonic": null}, {"id": "overcapacity", "term": "Overcapacity (excess capacity)", "tier": "supporting", "lo": "5.1", "chapterId": "ch5", "section": "5.1", "definition": "Having more capacity than is needed to meet demand, which causes operating costs that are too high.", "plain": "Building or keeping more capacity than you actually need, which wastes money.", "example": "The chapter's own reading notes telecom and auto manufacturing have both suffered from major excess capacity, forcing layoffs and incentives to boost demand.", "bookDefinition": "“Overcapacity (also known as excess capacity) causes operating costs that are too high.”"}, {"id": "undercapacity", "term": "Undercapacity", "tier": "supporting", "lo": "5.1", "chapterId": "ch5", "section": "5.1", "definition": "Not having enough capacity to meet demand, which causes strained resources and a possible loss of customers.", "plain": "Not being able to keep up with how much people want, so you lose business.", "example": "Microsoft's Xbox launch and flu vaccine shortages in some years are both examples the chapter cites of real costs from insufficient capacity.", "bookDefinition": "“Undercapacity (i.e., not enough capacity to meet demand) causes strained resources and a possible loss of customers.”"}, {"id": "design-capacity", "term": "Design capacity", "tier": "must_know", "lo": "5.3", "chapterId": "ch5", "section": "5.3", "definition": "The maximum output rate or service capacity an operation, process, or facility is designed for.", "plain": "The absolute best a system could possibly do, under perfect conditions.", "why": "It's the baseline against which capacity utilization is measured, and it's always the bigger of the two capacity numbers.", "example": "A factory line engineered to produce 50 trucks a day at full, ideal operation has a design capacity of 50 trucks/day.", "textbookExample": "The chapter states design capacity is 'the maximum rate of output achieved under ideal conditions.'", "commonMistake": "Don't confuse design capacity with what the system actually, typically achieves — that's effective capacity, which is always lower.", "examQuestion": "Why is design capacity always higher than effective capacity?", "bookDefinition": "“Design capacity: The maximum output rate or service capacity an operation, process, or facility is designed for.”", "mnemonic": null}, {"id": "effective-capacity", "term": "Effective capacity", "tier": "must_know", "lo": "5.3", "chapterId": "ch5", "section": "5.3", "definition": "Design capacity minus allowances such as personal time and preventive maintenance.", "plain": "What a system can realistically produce once you account for breaks, maintenance, and changeovers.", "why": "This is the realistic planning number most managers actually use, since it accounts for real-world realities design capacity ignores.", "example": "A vehicle repair department designed for 50 trucks/day might realistically manage only 40 trucks/day once breaks and changeovers are factored in.", "textbookExample": "The chapter lists specific causes of the gap: changing product mix, periodic maintenance of equipment, lunch breaks, coffee breaks, and problems in scheduling and balancing operations.", "commonMistake": "Actual output can still fall short of effective capacity too — due to machine breakdowns, absenteeism, material shortages, or quality problems.", "examQuestion": "List three specific factors the chapter gives for why effective capacity is less than design capacity.", "bookDefinition": "“Effective capacity: Design capacity minus allowances such as personal time and preventive maintenance.”", "mnemonic": null}, {"id": "capacity-efficiency", "term": "Efficiency (capacity)", "tier": "must_know", "lo": "5.3", "chapterId": "ch5", "section": "5.3", "definition": "The ratio of actual output to effective capacity, expressed as a percentage.", "plain": "Of what you could realistically produce, how much did you actually produce?", "why": "The chapter warns that focusing exclusively on efficiency can be misleading, especially when effective capacity itself is already low compared to design capacity.", "example": "Producing 36 units when your effective capacity is 40 gives an efficiency of 90% — which looks great, even if your design capacity was really 50.", "textbookExample": "In the vehicle repair example, 36 actual trucks out of 40 effective capacity gives 90% efficiency — but only 72% utilization against the 50-truck design capacity.", "commonMistake": "A high efficiency number can hide a much lower utilization number — always check both before concluding a system is running well.", "examQuestion": "Why might a manager who only looks at efficiency (not utilization) get a falsely rosy picture of performance?", "formula": "Efficiency = (Actual output &divide; Effective capacity) &times; 100%", "bookDefinition": "“Efficiency is the ratio of actual output to effective capacity.”", "mnemonic": null}, {"id": "capacity-utilization", "term": "Capacity utilization", "tier": "must_know", "lo": "5.3", "chapterId": "ch5", "section": "5.3", "definition": "The ratio of actual output to design capacity, expressed as a percentage.", "plain": "Of the absolute maximum you could ever produce, how much are you actually producing?", "why": "Utilization gives the more complete, 'big picture' comparison, since it's measured against the true ceiling (design capacity), not just the realistic one.", "example": "The same 36 trucks per day, measured against a 50-truck design capacity, gives only 72% utilization.", "textbookExample": "The chapter stresses high utilization is only beneficial when real demand for the output actually exists — otherwise it just builds costly, unwanted inventory.", "commonMistake": "Don't assume maximizing utilization is always the goal — without matching demand, high utilization can raise both variable and inventory carrying costs.", "examQuestion": "Explain why focusing exclusively on utilization can be counterproductive when demand for the output doesn't exist.", "formula": "Utilization = (Actual output &divide; Design capacity) &times; 100%", "bookDefinition": "“Capacity utilization is the ratio of actual output to design capacity.”", "mnemonic": null}, {"id": "leading-capacity-strategy", "term": "Leading capacity strategy", "tier": "must_know", "lo": "5.5", "chapterId": "ch5", "section": "5.5", "definition": "A strategy that builds capacity in anticipation of future demand increases.", "plain": "Build the extra capacity BEFORE you actually need it, betting that demand will show up.", "why": "It's one of three named capacity strategies the chapter asks you to compare and contrast.", "example": "A hotel chain constructing a new wing a year before a planned local event it expects to spike demand.", "textbookExample": "The chapter notes this strategy may be the best option specifically when capacity increases involve a long lead time.", "commonMistake": "Leading is risky if the anticipated demand never materializes — it isn't automatically the 'best' strategy, just the one suited to long-lead-time situations.", "examQuestion": "Why might a leading capacity strategy make more sense for a power plant than for a small retail kiosk?", "bookDefinition": "“A leading capacity strategy builds capacity in anticipation of future demand increases.”", "mnemonic": null}, {"id": "following-capacity-strategy", "term": "Following capacity strategy", "tier": "must_know", "lo": "5.5", "chapterId": "ch5", "section": "5.5", "definition": "A strategy that builds capacity only once demand exceeds current capacity.", "plain": "Wait until you're already out of room, then add more.", "example": "A restaurant that only adds a second dining room once it's been consistently turning away customers.", "bookDefinition": "“A following strategy builds capacity when demand exceeds current capacity.”"}, {"id": "tracking-capacity-strategy", "term": "Tracking capacity strategy", "tier": "must_know", "lo": "5.5", "chapterId": "ch5", "section": "5.5", "definition": "A strategy similar to following, but capacity is added in relatively small increments to keep pace with increasing demand.", "plain": "Like the following strategy, but adding capacity in small, frequent steps instead of one big jump.", "example": "A cloud computing provider adding a few new servers every month as usage steadily climbs, rather than building one giant data center.", "bookDefinition": "“A tracking strategy is similar to a following strategy, but it adds capacity in relatively small increments to keep pace with increasing demand.”"}, {"id": "capacity-cushion", "term": "Capacity cushion", "tier": "must_know", "lo": "5.5", "chapterId": "ch5", "section": "5.5", "definition": "An amount of capacity in excess of expected demand, used when there is uncertainty about demand; capacity cushion = capacity − expected demand.", "plain": "Extra breathing room built into your capacity in case demand turns out higher than expected.", "why": "It connects directly to risk: the chapter states the greater the uncertainty about demand, the greater the cushion typically used.", "example": "A concert venue sized slightly above its average expected attendance, in case ticket sales run hotter than forecast.", "textbookExample": "The chapter notes organizations with standard products or services generally use smaller capacity cushions than those with more unpredictable, customized output.", "commonMistake": "A bigger cushion isn't automatically 'safer' — it also means more unused capacity sitting idle most of the time, which has its own cost.", "examQuestion": "Why would a company with highly standardized products typically carry a smaller capacity cushion than one with highly customized products?", "formula": "Capacity cushion = Capacity &minus; Expected demand", "bookDefinition": "“a capacity cushion, which is an amount of capacity in excess of expected demand when there is some uncertainty about demand.”", "mnemonic": null}, {"id": "bottleneck-operation", "term": "Bottleneck operation", "tier": "must_know", "lo": "5.6", "chapterId": "ch5", "section": "5.9", "definition": "An operation in a sequence of operations whose capacity is lower than the capacities of the other operations in the sequence.", "plain": "The one slow step in a chain of steps that ends up limiting how fast the WHOLE process can go, no matter how fast the other steps are.", "why": "The chapter calls an unbalanced system (one with a bottleneck) the key risk of not taking a 'big-picture' approach to capacity changes.", "example": "Four prep stations each capable of 10 units/hour feeding into one oven that can only bake 30 units/hour — the oven is the bottleneck, and output is capped at 30/hour no matter how fast prep runs.", "textbookExample": "The chapter's own example: four operations each with a capacity of 10 units per hour feed into a fifth operation that can process only 30 units per hour — the system's output is limited to 30 units/hour, and a line of unprocessed units builds up at a rate of 10 per hour.", "commonMistake": "Adding more capacity to a NON-bottleneck operation does nothing for total system output — only increasing the bottleneck's own capacity raises the ceiling.", "examQuestion": "In a 3-step process with capacities of 20, 10, and 15 units/hour, what is the system's overall output rate, and why?", "bookDefinition": "“A bottleneck operation is an operation in a sequence of operations whose capacity is lower than the capacities of other operations in the sequence.”", "mnemonic": null}, {"id": "economies-of-scale", "term": "Economies of scale", "tier": "must_know", "lo": "5.6", "chapterId": "ch5", "section": "5.9", "definition": "A situation in which increasing the output rate (up to the optimal operating level) results in decreasing average unit costs.", "plain": "The more you make, the cheaper each individual unit gets to produce — up to a point.", "why": "It's one half of the U-shaped cost curve the chapter uses to explain why every production unit has an ideal size.", "example": "A large bakery's oven run at higher volume spreads its fixed cost over more loaves, lowering the cost per loaf.", "textbookExample": "The chapter lists three reasons: fixed costs spread over more units, construction costs that increase at a decreasing rate with facility size, and processing costs that fall as output becomes more standardized.", "commonMistake": "Economies of scale don't continue forever — past the optimal operating level, the same facility flips into diseconomies of scale instead.", "examQuestion": "Name two of the three reasons the chapter gives for economies of scale.", "bookDefinition": "“increasing the output rate will result in decreasing average unit costs, a situation known as economies of scale.”", "mnemonic": null}, {"id": "diseconomies-of-scale", "term": "Diseconomies of scale", "tier": "must_know", "lo": "5.6", "chapterId": "ch5", "section": "5.9", "definition": "A situation in which increasing output beyond the optimal operating level causes average unit costs to become increasingly larger.", "plain": "Past a certain size, making more actually starts costing MORE per unit, not less.", "why": "It explains why bigger isn't always better — every facility size has its own best operating rate and its own minimum cost point.", "example": "A single giant warehouse that's grown so large that internal communication and coordination problems start driving costs up faster than its scale saves money.", "textbookExample": "The chapter lists distribution costs (traffic congestion, shipping from one centralized facility), complexity, inflexibility, and added bureaucracy as causes.", "commonMistake": "Larger plants don't universally have worse economics — the chapter notes larger plants tend to have higher optimal output rates AND lower minimum costs than smaller plants; it's exceeding YOUR OWN optimal rate that causes diseconomies.", "examQuestion": "Name two of the four reasons the chapter gives for diseconomies of scale.", "bookDefinition": "“if output is increased beyond the optimal level, average unit costs will become increasingly larger, a situation known as diseconomies of scale.”", "mnemonic": null}, {"id": "constraint", "term": "Constraint", "tier": "must_know", "lo": "5.7", "chapterId": "ch5", "section": "5.10", "definition": "Something that limits the performance of a process or system in achieving its goals.", "plain": "Whatever is holding your system back from doing better right
