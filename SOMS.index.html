<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Management Study Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0F131B;
  --sidebar-bg:#0A0D13;
  --card:#171C28;
  --paper-2:#1E2536;
  --ink:#F1EDE3;
  --ink-soft:#A9AFC0;
  --rule:#2C3346;
  --rule-soft:#232A3B;
  --lo1:#4FC3AC; --lo2:#E3924F; --lo3:#7DA6F0; --lo4:#C48EDA; --lo5:#E5C15C;
  --lo1-tint:#123128; --lo2-tint:#33220F; --lo3-tint:#16233F; --lo4-tint:#2C1E38; --lo5-tint:#332B10;
  --good:#57C98A; --good-bg:#12301F;
  --bad:#E2685E; --bad-bg:#3A1815;
  --warn:#E3924F;
  --accent:#7DA6F0;
  --font-head:'Fraunces',Georgia,serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow: 0 2px 10px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;color:var(--ink);}
button{font-family:var(--font-body);cursor:pointer;}
a{color:inherit;}
.mono{font-family:var(--font-mono);}
::selection{background:#3A5A8C;color:#fff;}

.topbar{display:none;position:sticky;top:0;z-index:40;background:var(--sidebar-bg);color:var(--ink);padding:10px 14px;align-items:center;gap:10px;border-bottom:1px solid var(--rule);}
.topbar button{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:13px;}
.topbar .brand{font-family:var(--font-head);font-weight:600;font-size:15px;}
.panel-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.panel-header h1{font-size:1.4rem;}

.layout{display:flex;min-height:100vh;}
.sidebar{
  width:270px;flex-shrink:0;background:var(--sidebar-bg);color:var(--ink);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--rule);
}
.sidebar .brand{font-family:var(--font-head);font-size:18px;font-weight:600;margin:0 0 14px;color:var(--ink);}
.sidebar .brand .sub{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);font-weight:400;margin-top:2px;letter-spacing:.04em;}

.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.04);border-radius:10px;padding:4px;margin-bottom:12px;}
.mode-toggle button{border:none;background:transparent;padding:8px 0;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.mode-toggle button.active{background:var(--ink);color:var(--sidebar-bg);}

.side-search{width:100%;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;background:rgba(255,255,255,.03);color:var(--ink);margin-bottom:6px;}
.side-search::placeholder{color:#6B7186;}
.side-search-results{margin-bottom:14px;max-height:240px;overflow-y:auto;}
.side-search-item{padding:7px 8px;font-size:12.5px;border-radius:6px;cursor:pointer;color:var(--ink);}
.side-search-item:hover{background:rgba(255,255,255,.06);}
.side-search-item .ssi-sub{font-size:10.5px;color:var(--ink-soft);display:block;}

.chapter-block{margin-bottom:4px;}
.chapter-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:9px 8px;border-radius:7px;font-weight:600;font-size:13px;}
.chapter-head:hover{background:rgba(255,255,255,.05);}
.chapter-head .kicker-mini{display:block;font-weight:400;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.chevron{transition:transform .25s;font-size:11px;color:var(--ink-soft);}
.chevron.open{transform:rotate(90deg);}
.lo-list{list-style:none;margin:0;padding:0 0 0 8px;max-height:0;overflow:hidden;transition:max-height .35s ease;}
.lo-list.open{max-height:1600px;}
.lo-list li a{display:block;text-decoration:none;color:#C7CBD8;font-size:12px;padding:6px 8px;border-radius:6px;border-left:3px solid transparent;cursor:pointer;}
.lo-list li a:hover{background:rgba(255,255,255,.06);}

.sidebar-utility{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;}
.util-link{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;border:none;background:transparent;color:#C7CBD8;font-size:12.5px;text-align:left;width:100%;}
.util-link:hover{background:rgba(255,255,255,.06);}
.sidebar-footer{margin-top:12px;padding:10px 8px 4px;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--rule);}

.main{flex:1;min-width:0;}
.main-inner{padding:26px 40px 90px;max-width:900px;margin:0 auto;}
.mode-panel{display:none;}
.mode-panel.active{display:block;}

@media (max-width:860px){
  .topbar{display:flex;}
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .25s ease;z-index:50;box-shadow:2px 0 16px rgba(0,0,0,.5);}
  .sidebar.open{transform:translateX(0);}
  .main-inner{padding:20px 18px 70px;}
}

.hl-toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:10px 14px;background:var(--card);border:1px solid var(--rule);border-radius:9px;flex-wrap:wrap;}
.hl-toolbar .lbl{font-size:12px;color:var(--ink-soft);margin-right:2px;}
.swatch{padding:5px 11px;border-radius:999px;border:1.5px solid var(--rule);cursor:pointer;font-size:11px;font-family:var(--font-mono);color:#111;font-weight:600;}
.swatch.selected{outline:2px solid var(--ink);outline-offset:1px;}
.hl-clear{margin-left:auto;border:1px solid var(--rule);background:var(--paper-2);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);}
mark.uhl{padding:0 2px;border-radius:3px;cursor:pointer;color:#0C0F14;}

.chapter-kicker{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;}
.chapter-title{font-size:26px;font-weight:700;margin:0 0 20px;}

section.lo{margin-bottom:26px;scroll-margin-top:20px;}
.lo-banner{display:flex;align-items:baseline;gap:12px;padding:12px 18px;border-radius:10px 10px 0 0;color:#0B0D12;}
.lo-banner .lo-num{font-family:var(--font-head);font-size:20px;font-weight:700;opacity:.75;}
.lo-banner h2{font-size:15px;font-weight:700;color:#0B0D12;}
.lo-banner .lo-sec-label{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:700;color:#0B0D12;opacity:.7;background:rgba(255,255,255,.35);border-radius:6px;padding:2px 8px;white-space:nowrap;}
.book-quote{background:var(--paper-2);border-left:3px solid var(--lo3);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:12px;}
.book-quote .bq-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:4px;}
.book-quote .bq-text{font-style:italic;font-size:14px;line-height:1.5;color:var(--ink);}
.fc-book-quote{font-style:italic;font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--rule);padding-top:8px;margin-top:8px;}

/* ===================== AUDIO STUDY MODE: Listen & Follow Along + Commute Mode ===================== */
.lo-banner{flex-wrap:wrap;}
.lo-listen-btn,.lo-markread-btn{font-family:var(--font-mono);font-size:10.5px;font-weight:700;border:1px solid rgba(11,13,18,.3);background:rgba(255,255,255,.35);color:#0B0D12;border-radius:999px;padding:3px 10px;cursor:pointer;margin-left:6px;white-space:nowrap;}
.lo-banner .lo-sec-label{margin-left:8px;}
.lo-markread-btn.done{background:rgba(255,255,255,.7);}

.audio-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;margin-bottom:14px;}
.audio-toolbar .at-btn{font-size:12.5px;font-weight:700;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;}
.audio-toolbar .at-btn.primary{background:var(--lo3);color:#fff;border-color:var(--lo3);}

/* Listen & Follow strip: sticky mini-player while narrating inline */
#followBar{position:sticky;top:0;z-index:40;background:var(--sidebar-bg,var(--ink));color:#fff;border-radius:10px;padding:9px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.18);}
#followBar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;}
#followBar button:hover{background:rgba(255,255,255,.24);}
#followBar .fb-title{font-weight:700;flex:1;min-width:120px;}
#followBar input[type=range]{width:70px;}

.audio-current{background:rgba(255,205,60,.22)!important;outline:2px solid rgba(255,180,40,.85);border-radius:6px;transition:background .25s;}

/* Commute Mode: full-screen, minimal, eyes-off player */
body.commute-active .sidebar,body.commute-active .topbar{display:none!important;}
#commuteOverlay{position:fixed;inset:0;z-index:2000;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;text-align:center;}
#commuteOverlay .cm-close{position:absolute;top:18px;right:20px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;}
#commuteOverlay .cm-chapter{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;}
#commuteOverlay .cm-lo{font-family:var(--font-head);font-size:22px;font-weight:700;margin:8px 0 2px;max-width:640px;}
#commuteOverlay .cm-progresstext{font-size:12.5px;opacity:.7;margin-bottom:18px;}
#commuteOverlay .cm-bar{width:min(480px,80vw);height:6px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-bottom:26px;}
#commuteOverlay .cm-bar-fill{height:100%;background:var(--lo3);border-radius:999px;transition:width .3s;}
#commuteOverlay .cm-playbtn{width:92px;height:92px;border-radius:50%;background:var(--lo3);border:none;color:#fff;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
#commuteOverlay .cm-row{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
#commuteOverlay .cm-row button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
#commuteOverlay .cm-row button.active{background:var(--lo3);border-color:var(--lo3);}
#commuteOverlay .cm-row button:disabled{opacity:.35;cursor:default;}
#commuteOverlay .cm-settings{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12.5px;opacity:.85;}
#commuteOverlay .cm-settings label{display:flex;flex-direction:column;gap:4px;}
#commuteOverlay select,#commuteOverlay input[type=range]{accent-color:var(--lo3);}
#commuteOverlay .cm-current-text{max-width:600px;font-size:14px;line-height:1.6;margin:18px 0;min-height:44px;opacity:.9;}

.commute-summary{background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;padding:20px;margin:14px 0;}
.commute-summary .cs-stat{display:inline-block;margin:6px 14px 6px 0;font-size:13px;}
.commute-summary .cs-stat b{font-size:18px;display:block;color:var(--lo3);}
.review-remaining{background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;padding:22px;text-align:center;}
.review-remaining .rr-bar{width:100%;height:8px;background:var(--card);border-radius:999px;overflow:hidden;margin:14px 0;}
.review-remaining .rr-bar-fill{height:100%;background:var(--good);border-radius:999px;transition:width .3s;}
.lo-card{background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 10px 10px;padding:22px 24px;}
.lo-card h3.section-heading{font-size:14px;font-weight:700;margin:0 0 8px;}
.lo-card .lo-section + .lo-section{margin-top:18px;}
.lo-card p{font-size:14px;line-height:1.65;margin:0 0 12px;max-width:70ch;color:var(--ink);}
.lo-card ul,.lo-card ol{margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.6;color:var(--ink);}
.lo-card li{margin-bottom:5px;}
span.term{font-weight:700;color:var(--ink);border-bottom:1.5px dotted var(--ink-soft);cursor:pointer;}
span.term:hover{color:var(--lo3);border-bottom-color:var(--lo3);}
section.lo.flash .lo-banner{animation:flashglow 1.3s ease;}
@keyframes flashglow{0%{filter:brightness(1.6);}100%{filter:brightness(1);}}
.term-jump{outline:3px solid var(--lo5);outline-offset:2px;border-radius:3px;animation:termpulse 1.7s ease;}
@keyframes termpulse{0%{background:var(--lo5-tint);}70%{background:var(--lo5-tint);}100%{background:transparent;}}

.example{border-left:4px solid var(--rule);background:var(--paper-2);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;font-size:13.5px;line-height:1.55;color:var(--ink);}
.example-label{display:block;font-weight:700;font-size:12px;margin-bottom:4px;color:var(--ink-soft);}
.formula{font-family:var(--font-head);font-size:16px;font-weight:600;background:var(--paper-2);border-radius:8px;padding:10px 16px;margin:10px 0;color:var(--ink);}

table.mini-table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px;}
table.mini-table th{background:var(--paper-2);text-align:left;padding:7px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
table.mini-table td{padding:7px 10px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink);}

.wrapup-banner{background:var(--paper-2);color:var(--ink);padding:12px 18px;border-radius:10px 10px 0 0;border:1px solid var(--rule);border-bottom:none;}
.wrapup-card{background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 10px 10px;padding:22px 24px;margin-bottom:26px;}
.wrapup-card p{font-size:14px;line-height:1.65;margin:0;color:var(--ink);}

.gloss-banner{background:var(--paper-2);color:var(--ink);padding:12px 18px;border-radius:10px 10px 0 0;border:1px solid var(--rule);border-bottom:none;}
.gloss-note{font-weight:400;font-size:11.5px;color:var(--ink-soft);}
table.gloss{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;}
table.gloss th{background:var(--paper-2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 14px;color:var(--ink-soft);}
table.gloss td{padding:9px 14px;font-size:13px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink);}
table.gloss td.term-cell{font-weight:700;white-space:nowrap;cursor:pointer;border-left:4px solid transparent;}
table.gloss td.term-cell:hover{text-decoration:underline;}
table.gloss td.tier-mk{font-size:9.5px;font-family:var(--font-mono);color:var(--bad);}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);}
.card.clickable{cursor:pointer;transition:transform .1s,border-color .15s;}
.card.clickable:hover{transform:translateY(-2px);border-color:var(--ink-soft);}
.stat-card .stat-value{font-family:var(--font-head);font-weight:700;font-size:1.9rem;color:var(--ink);}
.stat-card .stat-label{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-soft);}
.progress-bar{height:8px;border-radius:999px;background:var(--paper-2);overflow:hidden;border:1px solid var(--rule);}
.progress-bar > div{height:100%;background:var(--lo3);border-radius:999px;}
.small-muted{font-size:.76rem;color:var(--ink-soft);}
.divider{height:1px;background:var(--rule);margin:16px 0;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.flex-row{display:flex;gap:10px;align-items:center;}
.wrap-row{display:flex;gap:8px;flex-wrap:wrap;}
.empty-state{text-align:center;padding:44px 18px;color:var(--ink-soft);}

.badge{display:inline-block;font-family:var(--font-mono);font-size:.63rem;padding:3px 9px;border-radius:999px;font-weight:700;}
.badge-status-notstarted{background:var(--paper-2);color:var(--ink-soft);}
.badge-status-learning{background:var(--lo2-tint);color:var(--lo2);}
.badge-status-improving{background:var(--lo5-tint);color:var(--lo5);}
.badge-status-mastered{background:var(--lo1-tint);color:var(--lo1);}
.badge-tier-must_know{background:var(--bad);color:#fff;}
.badge-tier-supporting{background:var(--paper-2);color:var(--ink-soft);}
.lo-chip{font-family:var(--font-mono);font-size:.65rem;padding:5px 11px;border-radius:999px;font-weight:700;}

.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;}
.btn:hover{border-color:var(--ink-soft);}
.btn.primary{background:var(--ink);color:var(--sidebar-bg);border-color:var(--ink);}
.btn.secondary{background:var(--paper-2);color:var(--ink);border-color:var(--rule);}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
.btn.ghost{background:transparent;border-color:var(--rule);}
.btn.small{padding:6px 12px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
input[type=text],input[type=number],textarea,select{
  font-family:var(--font-body);padding:9px 11px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--paper-2);color:var(--ink);width:100%;font-size:13.5px;
}
textarea{resize:vertical;min-height:100px;}
label{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-soft);display:block;margin-bottom:5px;}

.practice-toggle{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.practice-toggle button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.practice-toggle button.active{background:var(--ink);color:var(--sidebar-bg);border-color:var(--ink);}
.practice-panel{display:none;} .practice-panel.active{display:block;}
.pill-btn{font-family:var(--font-mono);font-size:.72rem;padding:6px 13px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-soft);}
.pill-btn.active{color:#0B0D12;font-weight:700;background:var(--ink);border-color:var(--ink);}

.fc-scene{perspective:1400px;width:100%;max-width:520px;height:270px;margin:0 auto 14px;cursor:pointer;}
.fc-card{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.3,1);transform-style:preserve-3d;}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;}
.fc-face.back{transform:rotateY(180deg);}
.fc-term{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--ink);}
.fc-def{font-size:14px;line-height:1.5;color:var(--ink);}
.fc-controls{display:flex;justify-content:center;gap:8px;max-width:520px;margin:0 auto;flex-wrap:wrap;}
.fc-progress{align-self:center;font-size:12.5px;color:var(--ink-soft);min-width:70px;text-align:center;}

.quiz-card{max-width:580px;margin:0 auto;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;}
.q-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:10px;}
.opt-btn{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:8px;}
.opt-btn:hover:not(:disabled){border-color:var(--ink-soft);}
.opt-btn.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700;}
.opt-btn.incorrect{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700;}
.q-feedback{border-radius:8px;padding:11px 13px;font-size:13px;margin:12px 0;}
.q-feedback.correct{background:var(--good-bg);color:var(--good);}
.q-feedback.incorrect{background:var(--bad-bg);color:var(--bad);}
.match-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.match-row select{flex:1;}
.timer-display{font-family:var(--font-mono);font-size:.9rem;padding:4px 10px;border-radius:6px;background:var(--paper-2);color:var(--warn);}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:680px;margin:0 auto;}
.match-cell{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:12.5px;text-align:left;line-height:1.35;}
.match-cell.term-cell{font-weight:700;font-family:var(--font-head);font-size:13.5px;}
.match-cell.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;}
.match-cell.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);}
.match-cell.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.match-head{display:flex;justify-content:space-between;max-width:680px;margin:0 auto 12px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}

.xw-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.xw-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;}
.xw-grid{display:inline-grid;border:2px solid var(--ink);}
.xw-cell{width:25px;height:25px;position:relative;border:1px solid var(--rule);background:var(--paper-2);}
.xw-cell.block{background:var(--sidebar-bg);border-color:var(--sidebar-bg);}
.xw-cell input{width:100%;height:100%;border:none;text-align:center;font-size:12.5px;font-weight:700;text-transform:uppercase;background:transparent;padding:0;font-family:var(--font-body);color:var(--ink);}
.xw-cell input:focus{outline:2px solid var(--lo3);}
.xw-cell input.ok{background:var(--good-bg);color:var(--good);}
.xw-cell input.no{background:var(--bad-bg);color:var(--bad);}
.xw-num{position:absolute;top:0;left:1px;font-size:7px;color:var(--ink-soft);}
.xw-clues{min-width:220px;font-size:12.5px;color:var(--ink);}
.xw-clues h4{font-family:var(--font-head);margin:0 0 6px;font-size:13.5px;}
.xw-clues ol{padding-left:18px;margin:0 0 14px;}
.xw-clues li{margin-bottom:6px;line-height:1.4;}

.modal-backdrop{position:fixed;inset:0;background:rgba(5,6,10,.7);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-box{background:var(--card);border:1px solid var(--rule);border-radius:12px;max-width:640px;width:100%;padding:24px 26px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--ink-soft);font-size:1.2rem;}
.concept-field{margin-bottom:10px;}
.concept-field .fl{font-family:var(--font-mono);font-size:.63rem;color:var(--ink-soft);margin-bottom:2px;}
.concept-field .fv{font-size:.9rem;line-height:1.5;color:var(--ink);}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sidebar-bg);padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s;font-weight:600;}
#toast.show{opacity:1;}

/* ===================== FORMULA CARD (visual, step-by-step) ===================== */
.formula-card{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:14px 0;}
.formula-card .fc-title{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:10px;}
.formula-card .fc-main{font-family:var(--font-head);font-size:19px;font-weight:700;text-align:center;padding:14px 10px;background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-bottom:12px;color:var(--ink);letter-spacing:.01em;}
.fc-vars{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.fc-var-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink);}
.fc-var-chip .sym{font-family:var(--font-head);font-weight:700;color:var(--lo3);}
.fc-steps{counter-reset:step;margin:0;padding:0;}
.fc-steps li{list-style:none;counter-increment:step;position:relative;padding:9px 0 9px 36px;border-top:1px dashed var(--rule);font-size:13.5px;line-height:1.5;color:var(--ink);}
.fc-steps li:first-child{border-top:none;}
.fc-steps li::before{content:counter(step);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--lo3);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.fc-answer{margin-top:10px;padding:11px 14px;background:var(--good-bg);color:var(--good);border-radius:8px;font-weight:700;text-align:center;font-size:14px;}
.section-tag{display:inline-block;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle;}

/* ===================== SOURCE BOX (collapsible, named after the textbook figure) ===================== */
.source-box{margin:8px 0 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-2);overflow:hidden;}
.source-box summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);list-style:none;display:flex;align-items:center;gap:7px;user-select:none;}
.source-box summary::-webkit-details-marker{display:none;}
.source-box summary::before{content:'\25B8';display:inline-block;transition:transform .18s;font-size:10px;color:var(--lo3);}
.source-box[open] summary::before{transform:rotate(90deg);}
.source-box .source-content{padding:2px 14px 13px;font-size:13px;line-height:1.55;color:var(--ink);border-top:1px dashed var(--rule);margin-top:1px;padding-top:10px;}
.source-box .source-content p{margin:0 0 8px;font-size:13px;}
.source-box .source-content p:last-child{margin-bottom:0;}
table.src-table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12.5px;}
table.src-table th, table.src-table td{border:1px solid var(--rule);padding:5px 9px;text-align:center;}
table.src-table th{background:var(--card);font-weight:700;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;}
table.src-table td{background:var(--card);}
table.src-table td.excluded{opacity:.42;}
table.src-table td.excluded .src-badge{opacity:.6;}
table.src-table tr.excluded-row td{opacity:.42;}
table.src-table td.rowlabel{text-align:left;font-weight:700;background:var(--paper-2);}

/* Source badges: shared visual identifier linking a table cell to its use inside a formula step */
.src-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:5px;font-size:9.5px;font-weight:800;margin-right:3px;border:1.6px solid currentColor;cursor:pointer;vertical-align:middle;line-height:1;background:transparent;}
.src-badge.b-a{color:#2563eb;} .src-badge.b-b{color:#c2410c;} .src-badge.b-c{color:#15803d;} .src-badge.b-d{color:#a21caf;} .src-badge.b-e{color:#b91c1c;} .src-badge.b-f{color:#0f766e;}
.src-num{cursor:pointer;border-bottom:1.5px dotted currentColor;}
.flash{animation:flashglow 1.3s ease;border-radius:4px;}
@keyframes flashglow{0%{box-shadow:0 0 0 3px rgba(255,196,64,.95);background:rgba(255,196,64,.4);}100%{box-shadow:0 0 0 0 rgba(255,196,64,0);background:transparent;}}

/* Progressive step walkthrough */
.walk-btn{display:inline-flex;align-items:center;gap:6px;margin:6px 0 10px;padding:7px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;}
.walk-btn:disabled{opacity:.55;cursor:default;}
.fc-steps li[hidden]{display:none;}
.excluded-note{font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:6px;}
.flow-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;font-size:12.5px;}
.flow-chain .fc-node{background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:5px 10px;font-weight:600;}
.flow-chain .fc-arrow{color:var(--ink-soft);font-weight:700;}
</style>

d": "lo1.8", "chapterId": "ch1", "code": "1.8", "text": "Briefly describe the historical evolution of operations management.", "sections": ["1.8"], "keyConcepts": ["scientific-management", "division-of-labor", "interchangeable-parts", "human-relations-movement"]}, {"id": "lo1.9", "chapterId": "ch1", "code": "1.9", "text": "Describe current issues in business that impact operations management.", "sections": ["1.9"], "keyConcepts": ["mass-production", "lean-production", "agility", "sustainability-om"]}, {"id": "lo1.10", "chapterId": "ch1", "code": "1.10", "text": "Explain the importance of ethical decision making.", "sections": ["1.10"], "keyConcepts": ["five-ethical-principles"]}, {"id": "lo1.11", "chapterId": "ch1", "code": "1.11", "text": "Explain the need to manage supply chains.", "sections": ["1.10"], "keyConcepts": ["supply-chain-management"]}, {"id": "lo3.1", "chapterId": "ch3", "code": "3.1", "text": "List features common to all forecasts.", "sections": ["3.2"], "keyConcepts": ["forecast", "time-horizon"]}, {"id": "lo3.2", "chapterId": "ch3", "code": "3.2", "text": "Explain why forecasts are generally wrong.", "sections": ["3.2", "3.4"], "keyConcepts": ["forecast-error"]}, {"id": "lo3.3", "chapterId": "ch3", "code": "3.3", "text": "List the elements of a good forecast.", "sections": ["3.3"], "keyConcepts": []}, {"id": "lo3.4", "chapterId": "ch3", "code": "3.4", "text": "Outline the steps in the forecasting process.", "sections": ["3.5"], "keyConcepts": []}, {"id": "lo3.5", "chapterId": "ch3", "code": "3.5", "text": "Describe four qualitative forecasting techniques.", "sections": ["3.6", "3.7"], "keyConcepts": ["executive-opinions", "salesforce-opinions", "consumer-surveys", "delphi-method", "qualitative-techniques", "quantitative-techniques", "judgmental-forecasts", "time-series-forecasts", "associative-models"]}, {"id": "lo3.6", "chapterId": "ch3", "code": "3.6", "text": "Use a naive method to make a forecast.", "sections": ["3.8"], "keyConcepts": ["time-series", "trend", "seasonality", "cycles", "irregular-variations", "random-variations", "naive-forecast"]}, {"id": "lo3.7", "chapterId": "ch3", "code": "3.7", "text": "Prepare a moving average forecast.", "sections": ["3.8"], "keyConcepts": ["moving-average"]}, {"id": "lo3.8", "chapterId": "ch3", "code": "3.8", "text": "Prepare a weighted-average forecast.", "sections": ["3.8"], "keyConcepts": ["weighted-moving-average"]}, {"id": "lo3.9", "chapterId": "ch3", "code": "3.9", "text": "Prepare an exponential smoothing forecast.", "sections": ["3.8"], "keyConcepts": ["exponential-smoothing"]}, {"id": "lo3.10", "chapterId": "ch3", "code": "3.10", "text": "Prepare a linear trend forecast.", "sections": ["3.8"], "keyConcepts": ["trend-equation"]}, {"id": "lo3.11", "chapterId": "ch3", "code": "3.11", "text": "Prepare a trend-adjusted exponential smoothing forecast.", "sections": ["3.8"], "keyConcepts": ["trend-adjusted-smoothing"]}, {"id": "lo3.12", "chapterId": "ch3", "code": "3.12", "text": "Compute and use seasonal relatives.", "sections": ["3.8"], "keyConcepts": ["seasonal-relative", "deseasonalize"]}, {"id": "lo3.13", "chapterId": "ch3", "code": "3.13", "text": "Compute and use regression and correlation coefficients.", "sections": ["3.9"], "keyConcepts": ["simple-linear-regression", "correlation-coefficient", "coefficient-of-determination", "standard-error-of-estimate"]}, {"id": "lo3.14", "chapterId": "ch3", "code": "3.14", "text": "Summarize forecast errors and use summaries to make decisions.", "sections": ["3.10"], "keyConcepts": ["mad", "mse", "mape"]}, {"id": "lo3.15", "chapterId": "ch3", "code": "3.15", "text": "Construct control charts and use them to monitor forecast errors.", "sections": ["3.11"], "keyConcepts": ["control-chart", "tracking-signal"]}, {"id": "lo3.16", "chapterId": "ch3", "code": "3.16", "text": "Describe the key factors and trade-offs to consider when choosing a forecasting technique.", "sections": ["3.12", "3.13", "3.14", "3.15"], "keyConcepts": ["reactive-approach", "proactive-approach"]}, {"id": "lo5.1", "chapterId": "ch5", "code": "5.1", "text": "Name the three key questions in capacity planning.", "sections": ["5.1"], "keyConcepts": ["capacity", "overcapacity", "undercapacity"]}, {"id": "lo5.2", "chapterId": "ch5", "code": "5.2", "text": "Explain the importance of capacity planning.", "sections": ["5.2"], "keyConcepts": []}, {"id": "lo5.3", "chapterId": "ch5", "code": "5.3", "text": "Describe ways of defining and measuring capacity.", "sections": ["5.3"], "keyConcepts": ["design-capacity", "effective-capacity", "capacity-efficiency", "capacity-utilization"]}, {"id": "lo5.4", "chapterId": "ch5", "code": "5.4", "text": "Name several determinants of effective capacity.", "sections": ["5.4"], "keyConcepts": []}, {"id": "lo5.5", "chapterId": "ch5", "code": "5.5", "text": "Discuss factors to consider when deciding whether to perform in-house or outsource.", "sections": ["5.5", "5.6", "5.7", "5.8"], "keyConcepts": ["leading-capacity-strategy", "following-capacity-strategy", "tracking-capacity-strategy", "capacity-cushion"]}, {"id": "lo5.6", "chapterId": "ch5", "code": "5.6", "text": "Discuss the major considerations related to developing capacity alternatives.", "sections": ["5.9"], "keyConcepts": ["bottleneck-operation", "economies-of-scale", "diseconomies-of-scale"]}, {"id": "lo5.7", "chapterId": "ch5", "code": "5.7", "text": "Describe the steps used to resolve constraint issues.", "sections": ["5.10"], "keyConcepts": ["constraint"]}, {"id": "lo5.8", "chapterId": "ch5", "code": "5.8", "text": "Briefly describe approaches that are useful for evaluating capacity alternatives.", "sections": ["5.11"], "keyConcepts": ["cost-volume-analysis", "fixed-costs", "variable-costs"]}], "concepts": [{"id": "competitiveness", "term": "Competitiveness", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "How well an organization meets customer wants and needs relative to rivals, via price, delivery time, and differentiation.", "plain": "It's basically how good a company is at winning customers away from competitors, judged on price, speed, and how different its offer is.", "why": "It's the chapter's central concept — nearly every other idea (strategy, productivity, design) ultimately exists to serve competitiveness.", "example": "A coffee shop that's slightly pricier than the chain down the street but wins customers anyway because it's faster and friendlier.", "textbookExample": "The chapter notes Indian call centers now provide over one million jobs handling Western companies' customer service — a deliberate use of location and cost to compete.", "commonMistake": "Students sometimes think competitiveness is only about price. The chapter frames it as price, delivery time, AND differentiation together.", "examQuestion": "Name the three broad factors the chapter says businesses compete on, and give an example of a company competing primarily on one of them.", "mnemonic": null}, {"id": "supply-chain-management", "term": "Supply chain management", "tier": "must_know", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "Coordinating internal and external operations (buyers and suppliers) for timely, cost-effective delivery.", "plain": "Making sure everything from raw materials to the finished product moves smoothly and cheaply from supplier to customer.", "why": "It's called out as one of the nine competitive levers operations controls, and it's specifically cited as Walmart's core advantage.", "example": "A grocery chain that negotiates directly with farms to cut out a costly middleman.", "textbookExample": "The chapter credits Walmart's success partly to how well it manages its supply chain — a case of exceeding, not just matching, a competitor's capability.", "commonMistake": "Don't confuse this with just 'shipping' — it covers coordination with both suppliers (upstream) and buyers (downstream), not just logistics.", "examQuestion": "Using Walmart as an example, explain how supply chain management can become a genuine competitive advantage rather than just a cost center.", "mnemonic": null, "bookDefinition": "“Supply chain management is the management of the sequence of internal and external facilities, functions, and activities that are involved in producing and delivering a product or service.”"}, {"id": "mission-statement", "term": "Mission statement", "tier": "must_know", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "A statement of an organization's reason for existing, answering \"what business are we in?\"", "plain": "It's the one- or two-sentence answer to 'why do we exist as a company?'", "why": "Everything else in the chapter's planning hierarchy — goals, strategy, tactics, operations — cascades down from this one statement.", "example": "A nonprofit's mission might be 'end childhood hunger in our city' — short, clear, and everything else follows from it.", "textbookExample": "Starbucks' mission centers on inspiring and nurturing the human spirit 'one cup and one neighborhood at a time'; Microsoft's centers on helping people and businesses realize their full potential.", "commonMistake": "Students often confuse mission with strategy. A mission answers 'what business are we in,' not 'how will we win.'", "examQuestion": "Using Starbucks' mission statement, trace how it might cascade down into a specific operations strategy.", "mnemonic": null}, {"id": "core-competencies", "term": "Core competencies", "tier": "must_know", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "The special attributes or abilities an organization possesses that give it a competitive edge.", "plain": "The one or two things your company is just genuinely better at than almost anyone else.", "why": "Effective strategy formulation starts here — you build strategy around what you're distinctly good at, not just what's popular.", "example": "A small bakery's core competency might be scratch-made sourdough nobody else in town can replicate.", "textbookExample": "The chapter notes that merely matching a competitor's quality usually isn't enough — Walmart had to actually exceed rivals via its core competency in supply chain management to win.", "commonMistake": "A core competency isn't just 'something you do' — it has to be a genuine source of competitive edge, not just a routine capability.", "examQuestion": "Explain why 'matching' a competitor's core competency is usually not enough to win market share, per the chapter.", "mnemonic": null}, {"id": "swot-analysis", "term": "SWOT analysis", "tier": "must_know", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "An assessment of Strengths, Weaknesses (internal) and Opportunities, Threats (external) linking strategy to operations.", "plain": "A structured way of checking what you're good/bad at internally, and what's happening in the outside world that could help or hurt you.", "why": "The chapter calls SWOT the actual link between organizational strategy and operations strategy — it's the bridge, not just a planning exercise.", "example": "A restaurant lists 'great location' (strength), 'small kitchen' (weakness), 'new food-delivery apps' (opportunity), and 'rising rent' (threat).", "textbookExample": "The chapter specifies that Strengths and Weaknesses are typically assessed by operations, while Opportunities and Threats are typically assessed by marketing.", "commonMistake": "A common exam trap: assuming operations handles all four quadrants. Only S and W are typically operations' job; O and T are typically marketing's.", "examQuestion": "Which two SWOT quadrants does operations typically assess, and which two does marketing typically assess?", "mnemonic": "Strengths/Weaknesses = look inward (operations); Opportunities/Threats = look outward (marketing)."}, {"id": "order-winner", "term": "Order winner", "tier": "must_know", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "A characteristic that causes an offering to be perceived as better than the competition's.", "plain": "The specific thing that actually makes a customer pick you over the other guy.", "why": "Distinguishing this from an order qualifier is one of the most commonly tested distinctions in the chapter.", "example": "Two pizza places both taste fine (qualifier), but one delivers in 15 minutes flat — that speed is the order winner.", "textbookExample": "The chapter notes a characteristic like quality can be an order winner in one market but only an order qualifier in another, and winners can decay into mere qualifiers over time as competitors catch up.", "commonMistake": "Don't assume order winners are permanent — the chapter is explicit that today's winner can become tomorrow's baseline qualifier.", "examQuestion": "Explain, with an example, how an order winner can eventually turn into an order qualifier.", "mnemonic": null}, {"id": "productivity", "term": "Productivity", "tier": "must_know", "lo": "2.6", "chapterId": "ch2", "section": "2.6", "definition": "An index of output relative to the input used to produce it (Output/Input).", "plain": "A simple ratio: how much good stuff you got out, compared to how much it cost you in resources to get it.", "why": "It's the chapter's core performance yardstick and the entire justification for a low-cost strategy.", "example": "A workshop that makes more usable chairs per labor hour than before has raised its productivity.", "textbookExample": "Four workers installing 720 square yards of carpet in 8 hours each works out to 720 ÷ 32 = 22.5 yards per labor hour.", "commonMistake": "Productivity isn't the same as working faster — it specifically weighs output against input cost, not raw speed.", "examQuestion": "Calculate the productivity of a machine that produces 70 pieces in 2 hours, 2 of which are defective.", "mnemonic": null}, {"id": "productivity-growth", "term": "Productivity growth", "tier": "must_know", "lo": "2.6", "chapterId": "ch2", "section": "2.6", "definition": "The percentage change in productivity from one period to the previous period.", "plain": "How much better (or worse) productivity got compared to last time, expressed as a percent.", "why": "The chapter ties this directly to a nation's inflation rate and standard of living, not just company performance.", "example": "If a bakery went from making 40 loaves/hour to 42 loaves/hour, that's a 5% productivity growth rate.", "textbookExample": "The chapter's own example: productivity rising from 80 to 84 is (84-80)/80 × 100 = 5% growth.", "commonMistake": "Don't forget to divide by the PREVIOUS value, not the current one — a common calculation error.", "examQuestion": "If productivity fell from 100 to 90, what is the productivity growth rate, and what does the negative sign mean?", "mnemonic": null}, {"id": "efficiency", "term": "Efficiency", "tier": "must_know", "lo": "2.7", "chapterId": "ch2", "section": "2.7", "definition": "Getting the most out of a fixed set of resources — narrower than productivity.", "plain": "Doing the best you can with what you've already got, rather than asking if you have the right tools at all.", "why": "The chapter uses this to draw a sharp, frequently tested distinction from productivity.", "example": "Finding the fastest route to mow a lawn with the mower you own is efficiency; buying a better mower entirely is the broader productivity question.", "textbookExample": "The chapter's hand-mower vs. power-mower example illustrates exactly this distinction.", "commonMistake": "Don't treat efficiency and productivity as synonyms — efficiency is the narrower, resource-optimization half of the productivity picture.", "examQuestion": "Using the mower example, explain the difference between an efficiency improvement and a productivity improvement.", "mnemonic": null}, {"id": "systems-viewpoint", "term": "Systems viewpoint", "tier": "must_know", "lo": "2.7", "chapterId": "ch2", "section": "2.7", "definition": "Judging a productivity improvement by its effect on the whole system's output, not just one stage.", "plain": "Speeding up one part of a process is pointless if some other part is still the bottleneck holding everything back.", "why": "It's the chapter's key caution against celebrating a local improvement that doesn't actually move the needle overall.", "example": "Upgrading one machine on an assembly line does nothing for total output if the very next machine is still the slowest link.", "textbookExample": "The chapter's example: two sequential stages each capable of 20 units/hour — doubling the first stage's speed still caps system output at 20 units/hour.", "commonMistake": "A tempting mistake is assuming any local speedup automatically raises overall productivity — the systems viewpoint says it doesn't unless the bottleneck itself is addressed.", "examQuestion": "Using the two-stage example, explain why doubling one stage's productivity doesn't raise the system's overall output.", "mnemonic": null}, {"id": "quick-response", "term": "Quick response", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "The ability to rapidly bring new offerings to market, fill orders, or resolve complaints.", "plain": "Being fast — fast to launch, fast to deliver, fast to fix problems.", "example": "A retailer that can restock a sold-out item within a day instead of a week."}, {"id": "flexibility", "term": "Flexibility", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "The ability to adjust design, volume, or product/service mix in response to change.", "plain": "Being able to bend without breaking when demand or requirements shift.", "example": "A factory that can switch from making blue widgets to red widgets in an afternoon."}, {"id": "service-quality", "term": "Service quality", "tier": "supporting", "lo": "2.1", "chapterId": "ch2", "section": "2.1", "definition": "After-sale and in-process value that customers perceive; often a sustainable differentiator.", "plain": "How good the experience feels around the actual product — support, courtesy, follow-through.", "example": "A company that replaces a broken item with no questions asked, building lasting loyalty."}, {"id": "organizational-goals", "term": "Organizational goals", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "The more detailed targets a mission cascades into, providing scope for strategy.", "plain": "The concrete targets that translate a broad mission into something actionable.", "example": "A hospital's mission to 'heal the community' cascades into a goal like 'reduce ER wait times by 15%.'"}, {"id": "organizational-strategy", "term": "Organizational strategy", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "The company-wide roadmap that guides functional strategies and supports the mission and goals.", "plain": "The big-picture game plan for the whole company.", "example": "A retailer's strategy to compete on convenience by opening smaller stores in more neighborhoods."}, {"id": "functional-strategy", "term": "Functional strategy", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "A strategy specific to one functional area that should support the organization's overall strategy.", "plain": "Each department's own game plan, built to support the company-wide one.", "example": "If the company strategy is 'compete on speed,' operations' functional strategy might be to add regional warehouses."}, {"id": "tactics", "term": "Tactics", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "The specific methods and actions used to carry out a strategy.", "plain": "The concrete how-to steps between a big strategy and the daily work.", "example": "If the strategy is 'go to college,' a tactic is 'choose a major and financing plan.'"}, {"id": "order-qualifier", "term": "Order qualifier", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "A minimum standard of acceptability a product/service must meet just to be considered for purchase.", "plain": "The bare minimum that gets you in the running — not what wins the sale.", "example": "A restaurant needs a health inspection pass just to be considered at all, regardless of how good the food is."}, {"id": "environmental-scanning", "term": "Environmental scanning", "tier": "supporting", "lo": "2.3", "chapterId": "ch2", "section": "2.3", "definition": "Monitoring events and trends for threats or opportunities.", "plain": "Keeping an eye on the outside world — competitors, laws, tech, the economy — so you're not blindsided.", "example": "A car company tracking emerging EV battery technology years before it needs to act on it."}, {"id": "quality-based-strategy", "term": "Quality-based strategy", "tier": "supporting", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "A strategy focused on maintaining, improving, or rebuilding a reputation for quality.", "plain": "Competing mainly by being known as the reliably 'good' option.", "example": "A car brand that markets itself around long-term reliability ratings."}, {"id": "time-based-strategy", "term": "Time-based strategy", "tier": "supporting", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "A strategy focused on reducing the time needed for planning, design, production, changeover, delivery, or complaint response.", "plain": "Competing mainly by being faster than everyone else at every stage.", "example": "A pizza chain that guarantees delivery in under 30 minutes."}, {"id": "agile-operations", "term": "Agile operations", "tier": "supporting", "lo": "2.5", "chapterId": "ch2", "section": "2.5", "definition": "A strategic emphasis on flexibility to thrive amid change.", "plain": "Building a whole operation around being able to pivot quickly, not just occasionally.", "example": "A clothing maker that can shift its whole product line to follow a sudden fashion trend."}, {"id": "partial-productivity", "term": "Partial productivity", "tier": "supporting", "lo": "2.6", "chapterId": "ch2", "section": "2.6", "definition": "A productivity measure using a single input.", "plain": "A productivity ratio using just one resource, like labor hours or energy.", "example": "Output per labor hour is a partial productivity measure."}, {"id": "multifactor-productivity", "term": "Multifactor productivity", "tier": "supporting", "lo": "2.6", "chapterId": "ch2", "section": "2.6", "definition": "A productivity measure combining more than one input.", "plain": "A productivity ratio using two or more resources combined, like labor and machine time together.", "example": "Units produced per (labor cost + materials cost) combined."}, {"id": "total-productivity", "term": "Total productivity", "tier": "supporting", "lo": "2.6", "chapterId": "ch2", "section": "2.6", "definition": "A productivity measure using all inputs.", "plain": "A productivity ratio using literally every resource that went into making something.", "example": "Total value of goods produced divided by the total value of every input used."}, {"id": "process-yield", "term": "Process yield", "tier": "supporting", "lo": "2.6", "chapterId": "ch2", "section": "2.6", "definition": "The ratio of good output to the input used to produce it.", "plain": "How much of what you started with actually turned into something usable.", "example": "A car rental agency's yield is the number of cars actually rented divided by the number available."}, {"id": "product-service-design", "term": "Product and service design", "tier": "must_know", "lo": "4.1", "chapterId": "ch4", "section": "4.1", "definition": "The set of activities that translate customer wants and needs into product/service and process requirements.", "plain": "Everything involved in turning 'what customers want' into an actual, buildable thing.", "why": "The chapter frames this as central to strategy — it drives cost, quality, time-to-market, and competitive advantage all at once.", "example": "Translating 'I want a quieter blender' into an actual redesigned motor and housing.", "textbookExample": "The chapter notes design touches nearly every function — marketing, finance, operations, accounting, IT, HR — and that faulty design is a common root cause of operations failures, recalls, and lawsuits.", "commonMistake": "Don't treat this as purely an engineering task — the chapter stresses it needs a 'big picture' cross-functional systems view.", "examQuestion": "Explain why the chapter treats product and service design as a strategic issue rather than a purely technical one.", "mnemonic": null}, {"id": "reverse-engineering", "term": "Reverse engineering", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Dismantling and inspecting a competitor's product to find ways to improve your own.", "plain": "Buying the competitor's thing, taking it apart, and (legally, usually) borrowing their best ideas.", "why": "It's one of the chapter's main sources of design ideas, and it can let a company leapfrog rivals entirely.", "example": "A car company disassembles a rival's dashboard to find the best door-handle design.", "textbookExample": "The chapter notes some forms of reverse engineering are illegal under the Digital Millennium Copyright Act, even though the practice is generally legal.", "commonMistake": "Don't assume reverse engineering is always legal — the chapter flags DMCA restrictions on some forms of it.", "examQuestion": "Is reverse engineering generally legal? What's the specific legal exception the chapter mentions?", "mnemonic": null}, {"id": "research-and-development", "term": "Research and development (R&D)", "tier": "must_know", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Organized efforts directed at increasing scientific knowledge and product or process innovation.", "plain": "The formal, funded effort a company puts into inventing or improving things.", "why": "It's a major source of design ideas, and being first to market from R&D can mean a temporary monopoly and premium pricing.", "example": "A pharma company's years-long effort to develop a new drug.", "textbookExample": "The chapter notes IBM spends about $6 billion a year on R&D and Hewlett-Packard Enterprise about $2 billion, with some companies spending over $1 million a day.", "commonMistake": "R&D success doesn't always mean patents — many valuable discoveries are never patented, sometimes deliberately.", "examQuestion": "Using IBM's and HPE's R&D spending figures, explain why the chapter says R&D costs can be very high.", "mnemonic": null}, {"id": "product-liability", "term": "Product liability", "tier": "must_know", "lo": "4.6", "chapterId": "ch4", "section": "4.6", "definition": "A manufacturer's legal responsibility for injuries or damages caused by a faulty or defective product.", "plain": "If your product hurts someone because it was poorly made or designed, you're legally on the hook.", "why": "It's a major incentive for design improvements and a source of real financial risk (lawsuits, recalls, insurance costs).", "example": "A ladder manufacturer being sued after a design flaw causes a fall.", "textbookExample": "The chapter cites Firestone Tire & Rubber, Ford, General Motors, tobacco companies, and toy manufacturers as firms that have faced major product liability litigation, reinforced by implied warranties under the Uniform Commercial Code.", "commonMistake": "Product liability isn't just about intentional wrongdoing — it covers unintentional design or manufacturing flaws too.", "examQuestion": "Explain how the Uniform Commercial Code's implied warranties relate to product liability.", "mnemonic": null}, {"id": "cradle-to-grave-assessment", "term": "Cradle-to-grave assessment", "tier": "must_know", "lo": "4.7", "chapterId": "ch4", "section": "4.7", "definition": "Evaluating a product or service's environmental impact across its entire life, from raw material extraction to final disposal.", "plain": "Tracking a product's environmental footprint from literally being mined/grown all the way to being thrown away.", "why": "Its explicit goal is finding the option with the least environmental impact that's still economically viable — a genuine decision-making tool, not just a report.", "example": "Comparing the total lifetime environmental cost of a plastic bottle vs. a reusable one.", "textbookExample": "The chapter ties this approach directly to the ISO 14000 environmental management standards.", "commonMistake": "Don't think this only applies to products — the chapter notes services also get cradle-to-grave assessed, since they still consume energy.", "examQuestion": "What is the stated goal of cradle-to-grave assessment, and what standard is it formally tied to?", "mnemonic": null}, {"id": "remanufacturing", "term": "Remanufacturing", "tier": "must_know", "lo": "4.8", "chapterId": "ch4", "section": "4.8", "definition": "Refurbishing a used product by replacing worn or defective components, then reselling it.", "plain": "Fixing up a used product with new parts and selling it again, usually much cheaper than new.", "why": "It's one of the three Rs, with a very specific, testable cost figure attached.", "example": "A refurbished printer sold at half the price of a new one.", "textbookExample": "The chapter states remanufactured products typically sell for about 50% of the cost of a new product, using mostly unskilled and semiskilled labor.", "commonMistake": "Remanufacturing isn't the same as recycling — remanufacturing keeps the product's identity (it's still 'the same' product, refurbished), while recycling breaks materials down for reuse elsewhere.", "examQuestion": "About what percentage of a new product's cost does a remanufactured version typically sell for?", "mnemonic": null}, {"id": "recycling", "term": "Recycling", "tier": "must_know", "lo": "4.8", "chapterId": "ch4", "section": "4.8", "definition": "Recovering materials from used products or production processes for future use.", "plain": "Reclaiming raw materials from something used up so they can be made into something new.", "why": "EU market access can require it — the chapter notes companies doing business there must show a specified proportion of their products is recyclable.", "example": "Melting down aluminum cans to make new cans.", "textbookExample": "The chapter cites China's 2018 'National Sword' policy, which cut China and Hong Kong's share of G7 plastic waste imports from 60% to 10% within a year by imposing a strict 0.5% impurity standard.", "commonMistake": "Recycling isn't limited to finished parts — the chapter notes it also applies to production byproducts like lubricants and solvents.", "examQuestion": "Using China's National Sword policy, explain how a single country's regulation reshaped global recycling markets.", "mnemonic": null}, {"id": "standardization", "term": "Standardization", "tier": "must_know", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "The absence of variety in a product, service, or process, achieved through identical, interchangeable units.", "plain": "Making everything the same instead of custom, so it's cheaper and easier to produce and fix.", "why": "The chapter frames this as a core trade-off: real cost/consistency benefits, but real risk of frozen designs and reduced appeal.", "example": "An automatic car wash gives every car the identical wash, regardless of how dirty it is.", "textbookExample": "The chapter notes U.S. manufacturers' continued use of the English measurement system (versus the metric system used by most of the world) has created real competitive disadvantages selling into and buying from foreign markets, especially the EU.", "commonMistake": "Standardization isn't purely good — the chapter is explicit about its disadvantages: frozen imperfect designs and reduced consumer appeal.", "examQuestion": "Using the English-vs-metric example, explain a real competitive disadvantage caused by a lack of standardization.", "mnemonic": null}, {"id": "mass-customization", "term": "Mass customization", "tier": "must_know", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "Producing standardized goods or services while incorporating some degree of individual customization.", "plain": "Getting the low cost of mass production and still feeling like you got something made just for you.", "why": "It's presented as the resolution to a core tension: standardization is cheap but boring, full customization is appealing but expensive.", "example": "A build-your-own sandwich shop uses the same core ingredients but lets you pick the combination.", "textbookExample": "The chapter's fast-food example: pulled pork takes about four hours to cook, so chains pre-cook it and assemble sandwiches to order with different sauces — delayed differentiation in action.", "commonMistake": "Mass customization isn't full custom manufacturing — it still relies on standardized components or processes underneath the customized surface.", "examQuestion": "Using the pulled-pork example, explain how delayed differentiation supports mass customization.", "mnemonic": null}, {"id": "reliability", "term": "Reliability", "tier": "must_know", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "The ability of a product, part, service, or system to perform its intended function under specified conditions.", "plain": "Whether something keeps working the way it's supposed to, under normal use.", "why": "The chapter ties the OPTIMAL level of reliability to a specific cost-benefit rule, a favorite exam target.", "example": "A smoke alarm that reliably triggers only when there's real smoke, not randomly and not never.", "textbookExample": "The chapter states the optimal level of reliability is the point where incremental benefit equals incremental cost — not 100% reliability, since improvements get progressively more expensive.", "commonMistake": "Don't assume more reliability is always better — the chapter frames it as an economic trade-off, not a maximize-at-all-costs goal.", "examQuestion": "Explain, using the incremental cost/benefit rule, why a light bulb and an airplane don't need the same level of reliability.", "mnemonic": null}, {"id": "robust-design", "term": "Robust design", "tier": "must_know", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A design that performs well across a wide range of conditions rather than only a narrow one.", "plain": "A design tough enough to keep working well even when conditions aren't ideal.", "why": "It's specifically linked to Taguchi's parameter design method, a concrete, testable technique.", "example": "Heavy rubber boots (robust) versus fine leather boots (not robust) for mud and snow.", "textbookExample": "The chapter's example: testing every combination of 12 chemicals from 2 suppliers would require 2^12 = 4,096 test runs; Taguchi's parameter design approach finds a near-optimal combination testing only a small, expert-chosen subset, perhaps 32 runs.", "commonMistake": "Robust design doesn't guarantee the mathematically optimal result — the chapter notes critics say Taguchi's method can produce a near-optimal, not truly optimal, solution.", "examQuestion": "Using the chemical-testing example, explain how Taguchi's approach makes robust design testing more efficient.", "mnemonic": null}, {"id": "quality-function-deployment", "term": "Quality function deployment (QFD)", "tier": "must_know", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A structured method for translating the \"voice of the customer\" into technical design requirements, via the \"house of quality.\"", "plain": "A formal system for making sure what customers actually say they want gets translated into real engineering specs.", "why": "It's one of the chapter's named formal tools, tied to a specific named diagram (the house of quality).", "example": "A customer says 'easy to adjust lawn mower height' — QFD translates that into a specific spring tension and mechanism spec.", "textbookExample": "The chapter's house of quality example includes a correlation matrix that reveals a strong negative correlation between 'paper thickness' and 'roll roundness,' forcing designers into a trade-off decision.", "commonMistake": "QFD isn't just a customer survey — its core structure is the matrix connecting customer requirements (what) to technical requirements (how).", "examQuestion": "What is the 'house of quality,' and what kind of conflict can its correlation matrix reveal?", "mnemonic": null}, {"id": "kano-model", "term": "Kano model", "tier": "must_know", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A framework classifying quality into basic, performance, and excitement categories based on how each affects customer satisfaction.", "plain": "A way of sorting product features by whether they just avoid complaints, actively please people proportionally, or genuinely delight them as a surprise.", "why": "It directly challenges the 'more is always better' assumption about quality, and it explains why features change categories over time.", "example": "A too-short phone charger cord annoys people, but a longer-than-needed one doesn't win extra praise — a basic quality feature.", "textbookExample": "The chapter's example of excitement quality: an unexpected voucher for a free hotel dinner at check-in.", "commonMistake": "Don't assume all quality features work the same way — the whole point of Kano is that basic, performance, and excitement features affect satisfaction very differently.", "examQuestion": "Explain, with an example, how a feature can migrate from excitement quality to performance quality to basic quality over time.", "mnemonic": null}, {"id": "concurrent-engineering", "term": "Concurrent engineering", "tier": "must_know", "lo": "4.10", "chapterId": "ch4", "section": "4.10", "definition": "Bringing design, manufacturing, and other functions together early to develop product and process simultaneously.", "plain": "Getting the people who'll build it in the room with the people designing it, from day one, instead of tossing the design 'over the wall' when it's done.", "why": "It directly replaces an older, slower, more conflict-prone approach the chapter names explicitly.", "example": "Manufacturing engineers flagging a hard-to-assemble part during the design phase, not after production starts.", "textbookExample": "The chapter contrasts this with the old 'over-the-wall' approach, which bred an 'us versus them' mentality between design and manufacturing and slowed product development significantly.", "commonMistake": "Concurrent engineering isn't automatically easy just because people are in the same room — the chapter notes breaking down long-standing design/manufacturing boundaries takes real, sustained effort.", "examQuestion": "Contrast concurrent engineering with the 'over-the-wall' approach it replaced.", "mnemonic": null}, {"id": "service-design", "term": "Service design", "tier": "must_know", "lo": "4.11", "chapterId": "ch4", "section": "4.11", "definition": "The process of developing the service strategy, package, and delivery system that will meet customer requirements.", "plain": "Figuring out exactly what a service includes and how it will actually be delivered to customers.", "why": "The chapter frames this around two specific, testable issues: variability of requirements and degree of customer contact.", "example": "Designing a haircut salon's whole experience, not just the haircut itself — booking, wait area, chair, checkout.", "textbookExample": "The chapter notes that low variability and low customer contact push a service toward standardization (product-design-like methods), while high variability and high contact push it toward customization.", "commonMistake": "Service design isn't just 'good customer service' — it specifically involves the two structural issues of variability and contact level shaping how standardized or customized the whole system needs to be.", "examQuestion": "Name the two key issues in service design and explain how they push a service toward standardization vs. customization.", "mnemonic": null}, {"id": "manufacturability", "term": "Manufacturability", "tier": "supporting", "lo": "4.3", "chapterId": "ch4", "section": "4.3", "definition": "A product's capability of being produced given available knowledge, skills, equipment, and capacity.", "plain": "How realistically buildable something actually is with what a company has to work with.", "example": "A part requiring impossibly tight tolerances may look great on paper but fail on manufacturability."}, {"id": "serviceability", "term": "Serviceability", "tier": "supporting", "lo": "4.3", "chapterId": "ch4", "section": "4.3", "definition": "A service's capability of being delivered given available knowledge, skills, and capacity.", "plain": "The service equivalent of manufacturability — can you actually deliver this with what you've got.", "example": "A restaurant can't promise same-day catering for 500 people without checking serviceability first."}, {"id": "basic-research", "term": "Basic research", "tier": "supporting", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Research aimed at advancing knowledge about a subject with no near-term commercial goal.", "plain": "Pure science for its own sake, not aimed at a product anytime soon.", "example": "A university lab studying a new material's properties with no product in mind yet."}, {"id": "applied-research", "term": "Applied research", "tier": "supporting", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Research aimed at achieving a commercial application.", "plain": "Research done specifically to eventually make money from it.", "example": "A company testing whether that new material could work in phone screens."}, {"id": "development", "term": "Development", "tier": "supporting", "lo": "4.5", "chapterId": "ch4", "section": "4.5", "definition": "Converting the results of applied research into a useful commercial product or service.", "plain": "Turning a promising lab result into an actual sellable thing.", "example": "Engineering that new material into an actual manufacturable phone screen."}, {"id": "end-of-life-programs", "term": "End-of-life (EOL) programs", "tier": "supporting", "lo": "4.7", "chapterId": "ch4", "section": "4.7", "definition": "Programs for managing products once they reach the end of their useful life.", "plain": "What a company does with its products once customers are done with them.", "example": "IBM's program that has collected over 2 billion pounds of product waste over 15 years."}, {"id": "value-analysis", "term": "Value analysis", "tier": "supporting", "lo": "4.8", "chapterId": "ch4", "section": "4.8", "definition": "Examining the function of a part or material to reduce cost and/or improve performance.", "plain": "Asking hard questions about whether a part is even necessary, or could be cheaper or simpler.", "example": "Asking whether two separate brackets could be combined into one cheaper piece."}, {"id": "product-life-cycle", "term": "Product life cycle", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "The introduction, growth, maturity, and decline stages many products/services pass through over time.", "plain": "The typical rise-and-fall arc a product goes through, from new and buggy to mature and eventually fading.", "example": "A hit toy that surges in popularity, plateaus, then fades as trends move on."}, {"id": "product-life-cycle-management", "term": "Product life cycle management (PLM)", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A systematic approach to managing a product's full history of changes, from conception through end-of-life.", "plain": "Software and process for tracking everything that ever happens to a product's design and data.", "example": "A car manufacturer tracking every design revision of a model from concept car to discontinued."}, {"id": "delayed-differentiation", "term": "Delayed differentiation", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "Producing but not quite finishing an item, postponing final customization until customer preferences are known.", "plain": "Building 90% of something, then finishing the last bit only once you know exactly what the customer wants.", "example": "Furniture built and shipped unstained, so the customer picks the stain color last."}, {"id": "modular-design", "term": "Modular design", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "Building products from standardized subassemblies (modules) that can be configured or swapped to create variety.", "plain": "Building from interchangeable building-block parts instead of one-off custom pieces.", "example": "A configurable PC where you swap in different memory or graphics modules."}, {"id": "failure", "term": "Failure", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "Any case where an item doesn't perform as intended — whether it doesn't function, underperforms, or behaves unintentionally.", "plain": "Not working right, in any of several different ways, not just 'totally broken.'", "example": "A smoke alarm that goes off with no smoke present is a failure, just like one that doesn't go off at all."}, {"id": "parameter-design", "term": "Parameter design", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "Taguchi's method of testing a small, carefully chosen set of variable combinations instead of every possibility.", "plain": "A smart shortcut for finding a really good (if not perfect) design setting without testing every single option.", "example": "Testing 32 combinations instead of over 4,000 to find a strong recipe for a new product."}, {"id": "basic-quality", "term": "Basic quality", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A Kano category: causes dissatisfaction if absent, but doesn't increase satisfaction if present.", "plain": "The stuff that just has to be there — you won't get extra credit for it, but you'll get complaints without it.", "example": "A phone that can actually make calls — expected, not exciting."}, {"id": "performance-quality", "term": "Performance quality", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A Kano category: satisfaction rises or falls with how well the feature is delivered.", "plain": "The more/better you deliver, the happier customers get, and vice versa.", "example": "The longer a tire's tread lasts, the happier the customer, in direct proportion."}, {"id": "excitement-quality", "term": "Excitement quality", "tier": "supporting", "lo": "4.9", "chapterId": "ch4", "section": "4.9", "definition": "A Kano category: an unexpected feature that delights customers precisely because it wasn't expected.", "plain": "The surprise bonus nobody asked for but everyone loves.", "example": "A free dessert included with a meal you didn't order."}, {"id": "computer-aided-design", "term": "Computer-aided design (CAD)", "tier": "supporting", "lo": "4.10", "chapterId": "ch4", "section": "4.10", "definition": "Using computer graphics and software to create, modify, test, and store product designs.", "plain": "Designing on a computer instead of by hand, with the ability to rotate, split apart, and test the design digitally.", "example": "An architect modeling a building in 3D software before construction begins."}, {"id": "design-for-manufacturing", "term": "Design for manufacturing (DFM)", "tier": "supporting", "lo": "4.10", "chapterId": "ch4", "section": "4.10", "definition": "Designing products so they're compatible with an organization's actual production capabilities.", "plain": "Making sure the design actually matches what your factory can really build.", "example": "Simplifying a part's shape so existing machines can produce it without new tooling."}, {"id": "design-for-assembly", "term": "Design for assembly (DFA)", "tier": "supporting", "lo": "4.10", "chapterId": "ch4", "section": "4.10", "definition": "Designing products to minimize the number of parts and simplify assembly methods and sequence.", "plain": "Making something with fewer pieces and an easier order of putting it together.", "example": "Redesigning a toy to snap together in 3 steps instead of 8."}, {"id": "component-commonality", "term": "Component commonality", "tier": "supporting", "lo": "4.10", "chapterId": "ch4", "section": "4.10", "definition": "Using the same part or component across multiple products or services to save on design, training, and inventory costs.", "plain": "Reusing the same part across different products instead of designing a new one each time.", "example": "A car maker using the same water pump across several vehicle models."}, {"id": "service", "term": "Service", "tier": "supporting", "lo": "4.11", "chapterId": "ch4", "section": "4.11", "definition": "An act done to or for a customer, delivered by a service delivery system.", "plain": "Something done for you, not something handed to you — delivered through people, processes, and facilities working together.", "example": "A haircut, a tax filing, a hospital visit."}, {"id": "service-blueprint", "term": "Service blueprint", "tier": "supporting", "lo": "4.12", "chapterId": "ch4", "section": "4.12", "definition": "A diagram mapping customer actions, visible staff actions, backstage actions, and support operations in a service process.", "plain": "A map of everything that happens behind the scenes and in front of the customer during a
