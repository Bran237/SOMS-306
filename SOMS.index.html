c\" data-src=\"V4\">V4</span>$10 per unit, revenue = <span class=\"src-badge b-r4\" data-tbaction=\"flashSrc\" data-src=\"R4\">R4</span>$40 per unit. Reading this table: buying more machines raises fixed costs in a step (not smoothly), but also raises the range of output those machines can actually handle.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; (a) Break-even Point for Each Machine Count</div><div class=\"fc-main\">Q<sub>BEP</sub> = FC &divide; (R &minus; v)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">R − v</span>&nbsp;=&nbsp;$40 &minus; $10 = $30 contribution margin, the same for every machine count</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-step\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-step\"><li>One machine: <span class=\"src-badge b-f1\" data-tbaction=\"flashSrc\" data-src=\"F1\">F1</span>$9,600 &divide; $30 = <strong>320 units</strong> &mdash; NOT valid, since 320 falls outside the 1-machine range (0 to 300).</li><li hidden>Two machines: <span class=\"src-badge b-f2\" data-tbaction=\"flashSrc\" data-src=\"F2\">F2</span>$15,000 &divide; $30 = <strong>500 units</strong> &mdash; valid, since 500 falls inside the 2-machine range (301 to 600).</li><li hidden>Three machines: <span class=\"src-badge b-f3\" data-tbaction=\"flashSrc\" data-src=\"F3\">F3</span>$20,000 &divide; $30 = <strong>666.67 units</strong> &mdash; valid, since it falls inside the 3-machine range (601 to 900).</li></ol><div class=\"fc-answer\">Only the 2-machine and 3-machine break-even points are actually achievable</div></div><p><p><strong>(b) Choosing how many machines to buy:</strong> if projected annual demand is between 580 and 660 units, compare that range to the two valid break-even points. The low end of projected demand (580) is already above the 2-machine break-even point (500) and still within the 2-machine range (301–600) — so it yields a profit. The high end of projected demand (660) is still BELOW the 3-machine break-even point (666.67), so it would NOT yield a profit in that range. Since the low end of the projected demand already clears the 2-machine break-even, <strong>the manager should purchase two machines.</strong></p></p>"}, {"heading": "Assumptions, limitations, and financial analysis", "html": "<p>Cost–volume analysis can be a valuable tool for comparing capacity alternatives if certain assumptions are satisfied:</p><ul><li>One product is involved.</li><li>Everything produced can be sold.</li><li>The variable cost per unit is the same regardless of the volume.</li><li>Fixed costs do not change with volume changes, or they are step changes.</li><li>The revenue per unit is the same regardless of volume.</li><li>Revenue per unit exceeds variable cost per unit.</li></ul><p>As with any quantitative tool, it’s important to verify these assumptions are reasonably satisfied for a particular situation: revenue or variable cost per unit isn’t always constant, fixed costs may not be constant over the range of possible output, demand may be subject to random variation, and separating fixed and variable costs is sometimes exceedingly difficult. Cost-volume analysis works best with one product, or a few products that share the same cost characteristics. Its notable benefit is the conceptual framework it provides for integrating cost, revenue, and profit estimates into capacity decisions; if a proposal looks attractive using cost-volume analysis, the next step is to develop cash flow models to see how it fares with the addition of time and more flexible cost functions.</p><p>Operations personnel also need the ability to do <i>financial analysis</i> — a problem universally encountered by managers is how to allocate scarce funds, often through ranking investment proposals while taking into account the time value of money. Two important terms are <span class=\"term\" data-cid=\"cash-flow\">cash flow</span> (the difference between cash received from sales and other sources, and cash outflow for labor, materials, overhead, and taxes) and <span class=\"term\" data-cid=\"present-value\">present value</span> (which expresses in current value the sum of all future cash flows of an investment proposal).</p><p>The three most commonly used methods of financial analysis are <span class=\"term\" data-cid=\"payback\">payback</span>, present value, and internal rate of return.</p><details class=\"source-box\"><summary>EXAMPLE 5 &mdash; Determining Payback Time</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td>Initial cost of new machine</td><td><span class=\"src-badge b-ic\" data-tbaction=\"flashSrc\" data-src=\"IC\">IC</span> $2,000</td></tr><tr><td>Annual savings</td><td><span class=\"src-badge b-as\" data-tbaction=\"flashSrc\" data-src=\"AS\">AS</span> $500 per year</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Payback Time</div><div class=\"fc-main\">Payback time = Initial cost &divide; Annual savings</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Initial cost</span>&nbsp;=&nbsp;what the machine costs up front</span><span class=\"fc-var-chip\"><span class=\"sym\">Annual savings</span>&nbsp;=&nbsp;how much it saves each year</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-payback\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-payback\"><li>Divide initial cost by annual savings: <span class=\"src-badge b-ic\" data-tbaction=\"flashSrc\" data-src=\"IC\">IC</span>$2,000 &divide; <span class=\"src-badge b-as\" data-tbaction=\"flashSrc\" data-src=\"AS\">AS</span>$500/yr.</li></ol><div class=\"fc-answer\">Payback time = 4 years</div></div><p>Payback doesn’t take into account the time value of money, and its use is easier to rationalize for short-term paybacks than long-term ones. The present value (PV) method DOES take the time value of money into account, summarizing the initial cost, estimated annual cash flows, and any expected salvage value in a single value called the equivalent current value. The <span class=\"term\" data-cid=\"internal-rate-of-return\">internal rate of return (IRR)</span> summarizes the initial cost, expected annual cash flows, and estimated future salvage value of an investment proposal in an equivalent interest rate — in other words, it identifies the rate of return that equates the estimated future returns and the initial cost.</p><p>These techniques are appropriate when there is a high degree of certainty associated with estimates of future cash flows. In many instances, however, operations managers must deal with situations better described as risky or uncertain — when conditions of risk or uncertainty are present, <span class=\"term\" data-cid=\"decision-theory\">decision theory</span> is often applied instead. Decision theory involves identifying a set of possible future conditions that could influence results, listing alternative courses of action, and developing a financial outcome for each alternative-future condition combination.</p><p>Two other tools round out the chapter’s approaches to evaluating alternatives. <strong>Waiting-line analysis</strong> is often useful for designing or modifying service systems, since waiting lines are symptoms of bottleneck operations — it helps managers choose a capacity level that is cost-effective by balancing the cost of having customers wait against the cost of providing additional capacity. <strong>Simulation</strong> can be a useful tool for evaluating what-if scenarios.</p>"}, {"heading": "Capacity strategy: tying the chapter together <span class=\"section-tag\">Section 5.12</span>", "html": "<p>The strategic implications of capacity decisions can be enormous, impacting all areas of the organization — capacity decisions establish a set of conditions within which operations will be required to function, so it’s extremely important to include input from operations management people in making these decisions.</p><p>Flexibility can be a key issue, although it isn’t always an option, particularly in capital-intensive industries. Where possible, flexibility allows an organization to be agile (responsive to changes in the marketplace), reduces dependence on long-range forecasts, and makes it easier to take advantage of technological and other innovations. Maintaining excess capacity (a <span class=\"term\" data-cid=\"capacity-cushion\">capacity cushion</span>) may provide a degree of flexibility, albeit at added cost. Some organizations even maintain a capacity cushion specifically to block entry by new competitors, since the excess capacity lets them produce at costs lower than new entrants can — though this strategy means higher-than-necessary unit costs, and it makes it harder to cut back if demand slows or to shift to new offerings.</p><p>Efficiency and utilization improvements can also provide capacity increases, achieved by streamlining operations and reducing waste (the subject of the book’s lean operations chapter). <span class=\"term\" data-cid=\"bottleneck-operation\">Bottleneck</span> management can increase effective capacity by scheduling nonbottleneck operations to achieve maximum utilization of the bottleneck operations themselves.</p><p>Where capacity EXPANSION is being undertaken, there are two strategies for timing it. The <span class=\"term\" data-cid=\"expand-early-strategy\">expand-early strategy</span> builds capacity before demand materializes — intended to achieve economies of scale, expand market share, or preempt competitors, but risking an oversupply that drives prices down, and underutilized equipment that raises unit costs. The <span class=\"term\" data-cid=\"wait-and-see-strategy\">wait-and-see strategy</span> expands capacity only after demand materializes, perhaps incrementally — its advantages include a lower chance of oversupply and higher capacity utilization, but its key risks are a loss of market share, and an inability to meet demand if expansion requires a long lead time or demand rises unexpectedly.</p><p>Where capacity CONTRACTION will instead be undertaken, <span class=\"term\" data-cid=\"capacity-disposal\">capacity disposal</span> strategies become important — these can result from the need to replace aging equipment with newer equipment, or from outsourcing and downsizing operations. The cost or benefit of asset disposal should be taken into account when contemplating these actions.</p>"}]}, "chapterWrapUp": {"ch1": {"title": "Tying It All Together", "html": "<p>Chapter 1 sets up the whole book: operations is the engine that turns inputs into value-added outputs, working alongside finance and marketing as one of the three functional areas, inside a supply chain that must be actively managed, not left to chance. Managers make sense of this complexity through models, a systems perspective, and the Pareto phenomenon's focus on what matters most — all shaped by a history running from craft production through scientific management, mass production, and the human relations movement to today's lean, agile, and sustainability-conscious operations.</p>"}, "ch3": {"title": "Tying It All Together — plus a formula quick-reference", "html": "<p>Chapter 3 builds a toolbox of forecasting techniques — naive, moving average, weighted average, exponential smoothing, trend, trend-adjusted smoothing, and seasonal relatives for time-series data; regression and correlation for associative techniques — then closes the loop with MAD/MSE/MAPE to measure accuracy and control charts/tracking signals to monitor it over time. No single technique wins in every situation: the right choice always balances cost against accuracy, given the data available and the forecast horizon.</p><h4 style='margin:16px 0 8px;font-family:var(--font-head);'>Formula quick-reference (Table 3.7)</h4><table class='mini-table'><tr><th>Technique</th><th>Formula</th></tr><tr><td>MAD</td><td>&Sigma;|e| &divide; n</td></tr><tr><td>MSE</td><td>&Sigma;e&sup2; &divide; (n &minus; 1)</td></tr><tr><td>MAPE</td><td>&Sigma;[(|e| &divide; Actual) &times; 100] &divide; n</td></tr><tr><td>Moving average</td><td>F(t) = &Sigma;A(t-i) &divide; n</td></tr><tr><td>Weighted average</td><td>F(t) = W(t-n)A(t-n) + &hellip; + W(t-1)A(t-1)</td></tr><tr><td>Exponential smoothing</td><td>F(t) = F(t-1) + &alpha;[A(t-1) &minus; F(t-1)]</td></tr><tr><td>Linear trend forecast</td><td>F(t) = a + bt&nbsp;&nbsp;(b, a from least squares)</td></tr><tr><td>Trend-adjusted forecast</td><td>TAF(t+1) = S(t) + T(t)</td></tr><tr><td>Linear regression forecast</td><td>yc = a + bx&nbsp;&nbsp;(b, a from least squares)</td></tr><tr><td>Standard error of estimate</td><td>Se = &radic;[&Sigma;(y&minus;yc)&sup2; &divide; (n&minus;2)]</td></tr><tr><td>Tracking signal</td><td>TS(t) = &Sigma;e &divide; MAD(t)</td></tr><tr><td>Control limits</td><td>UCL/LCL = 0 &plusmn; z&radic;MSE</td></tr></table><h4 style=\"margin:18px 0 8px;font-family:var(--font-head);\">How the forecasting formulas connect</h4><div class=\"flow-chain\"><span class=\"fc-node\">Make a Forecast</span><span class=\"fc-arrow\">&rarr;</span><span class=\"fc-node\">Compare to Actual</span><span class=\"fc-arrow\">&rarr;</span><span class=\"fc-node\">Forecast Error</span><span class=\"fc-arrow\">&rarr;</span><span class=\"fc-node\">MAD / MSE / MAPE</span><span class=\"fc-arrow\">&rarr;</span><span class=\"fc-node\">Tracking Signal or Control Chart</span></div><p style=\"font-size:13px;\">Every accuracy and monitoring technique in this chapter is built on the same raw ingredient: the period-by-period forecast error (Actual &minus; Forecast). MAD, MSE, and MAPE just summarize those errors three different ways; the tracking signal and control chart then use those summaries to decide whether the forecasting method itself still needs fixing.</p>"}, "ch5": {"title": "Tying It All Together", "html": "<p>Chapter 5 builds outward from one core idea — capacity as a ceiling on output — into a full strategic toolkit: defining and measuring it (design vs. effective capacity, efficiency vs. utilization), the many factors that determine it, choosing to build it in-house or buy it from someone else, developing a strategy for growing it (leading, following, or tracking, while watching for bottlenecks and the optimal operating level), managing whatever constrains it, and finally evaluating alternatives with tools like cost–volume analysis.</p><h4 style='margin:16px 0 8px;font-family:var(--font-head);'>How the formulas connect</h4><div class='flow-chain'><span class='fc-node'>Design Capacity</span><span class='fc-arrow'>&rarr;</span><span class='fc-node'>Effective Capacity</span><span class='fc-arrow'>&rarr;</span><span class='fc-node'>Actual Output</span><span class='fc-arrow'>&rarr;</span><span class='fc-node'>Efficiency &amp; Utilization</span><span class='fc-arrow'>&rarr;</span><span class='fc-node'>Cost–Volume Analysis</span></div><table class='mini-table'><tr><th>Technique</th><th>Formula</th></tr><tr><td>Efficiency</td><td>(Actual output &divide; Effective capacity) &times; 100%</td></tr><tr><td>Utilization</td><td>(Actual output &divide; Design capacity) &times; 100%</td></tr><tr><td>Units of capacity needed</td><td>Processing time needed &divide; Processing time capacity per unit</td></tr><tr><td>Capacity cushion</td><td>Capacity &minus; Expected demand</td></tr><tr><td>Total cost</td><td>TC = FC + VC</td></tr><tr><td>Total variable cost</td><td>VC = Q &times; v</td></tr></table>"}}, "crossword": {"ch1": [{"answer": "OPERATIONS", "clue": "What businesses do to create goods and provide services"}, {"answer": "GOODS", "clue": "Physical items you can see or touch"}, {"answer": "SERVICES", "clue": "Activities providing time, location, form, or psychological value"}, {"answer": "PROCESS", "clue": "One or more actions that transform inputs into outputs"}, {"answer": "TAYLOR", "clue": "\"Father\" of scientific management"}, {"answer": "FORD", "clue": "Pioneered the moving assembly line for automobiles"}, {"answer": "LEAN", "clue": "___ production: less space, inventory, and workers for the same output"}, {"answer": "PARETO", "clue": "___ phenomenon: a few issues drive most of the results"}, {"answer": "MODEL", "clue": "A simplified representation of reality"}, {"answer": "AGILITY", "clue": "Ability to respond quickly to demand shifts"}, {"answer": "ETHICS", "clue": "Standards of behavior guiding right and wrong action"}, {"answer": "SUSTAINABILITY", "clue": "Using resources without harming future generations' needs"}, {"answer": "VALUEADDED", "clue": "The difference between input cost and output value"}], "ch2": [{"answer": "PRODUCTIVITY", "clue": "Ratio a low-cost strategy depends on maximizing"}, {"answer": "EFFICIENCY", "clue": "Doing the most with a fixed set of resources"}, {"answer": "STRATEGY", "clue": "The roadmap between goals and tactics"}, {"answer": "TACTICS", "clue": "The specific how-to for carrying out a strategy"}, {"answer": "MISSION", "clue": "A company's stated reason for existing"}, {"answer": "QUALITY", "clue": "What Lexus and Sony compete on"}, {"answer": "FLEXIBILITY", "clue": "Ability to adjust volume, mix, or design on the fly"}, {"answer": "YIELD", "clue": "Good output divided by input, for a process"}, {"answer": "AGILE", "clue": "___ operations: flexible enough to thrive amid change"}, {"answer": "SWOT", "clue": "Four-letter internal/external strategy audit"}, {"answer": "OUTSOURCING", "clue": "Handing production to outside suppliers for lower cost"}, {"answer": "INNOVATION", "clue": "3M and Apple's calling card"}, {"answer": "BENCHMARK", "clue": "A standard used to compare performance, like the PIMS database"}], "ch3": [{"answer": "FORECAST", "clue": "An estimate about the future value of a variable"}, {"answer": "TREND", "clue": "Long-term upward or downward movement in data"}, {"answer": "NAIVE", "clue": "___ method: tomorrow will look just like today"}, {"answer": "SEASONALITY", "clue": "Short-term, regularly repeating variation tied to the calendar"}, {"answer": "REGRESSION", "clue": "Fitting a line to predict one variable from another"}, {"answer": "CORRELATION", "clue": "A measure of the strength and direction of a relationship"}, {"answer": "MAD", "clue": "Average absolute forecast error (abbr.)"}, {"answer": "MSE", "clue": "Squares errors before averaging them (abbr.)"}, {"answer": "MAPE", "clue": "Puts errors in percentage terms (abbr.)"}, {"answer": "ALPHA", "clue": "The smoothing constant in exponential smoothing"}, {"answer": "DELPHI", "clue": "___ method: anonymous rounds of expert questionnaires"}, {"answer": "TRACKING", "clue": "___ signal: cumulative error divided by MAD"}, {"answer": "CYCLES", "clue": "Wavelike variations lasting more than a year"}], "ch4": [{"answer": "STANDARDIZATION", "clue": "Absence of variety, on purpose"}, {"answer": "RELIABILITY", "clue": "How well something performs under normal conditions"}, {"answer": "MODULAR", "clue": "___ design: swap the bad subassembly, not the whole product"}, {"answer": "RECYCLING", "clue": "What China's 2018 \"National Sword\" policy throttled worldwide"}, {"answer": "PROTOTYPE", "clue": "First working unit built to catch design flaws early"}, {"answer": "ROBUST", "clue": "___ design: still works fine outside ideal conditions"}, {"answer": "KANO", "clue": "___ model: sorts quality into basic, performance, and excitement"}, {"answer": "QFD", "clue": "Method that starts with the \"voice of the customer\" (abbr.)"}, {"answer": "CAD", "clue": "Computer-aided tool said to multiply a designer's output"}, {"answer": "CONCURRENT", "clue": "___ engineering: design and manufacturing work side by side, not over the wall"}, {"answer": "FEASIBILITY", "clue": "Phase 1 of product development: does it fit the mission?"}, {"answer": "BLUEPRINT", "clue": "Service ___: maps customer, staff, and backstage actions"}, {"answer": "CUSTOMIZATION", "clue": "Mass ___: standardized production, personalized finish"}], "ch5": [{"answer": "CAPACITY", "clue": "An upper limit or ceiling on the load an operating unit can handle"}, {"answer": "BOTTLENECK", "clue": "The slowest operation in a sequence, which caps the whole system's output"}, {"answer": "CUSHION", "clue": "Capacity ___: extra capacity held above expected demand"}, {"answer": "OUTSOURCE", "clue": "Having another organization produce a good or provide a service for you"}, {"answer": "CONSTRAINT", "clue": "Something that limits a process or system from achieving its goals"}, {"answer": "LEADING", "clue": "___ strategy: build capacity before demand actually arrives"}, {"answer": "TRACKING", "clue": "___ strategy: add capacity in small increments to keep pace with demand"}, {"answer": "UTILIZATION", "clue": "Actual output divided by design capacity"}, {"answer": "EFFICIENCY", "clue": "Actual output divided by effective capacity"}, {"answer": "GOLDRATT", "clue": "Author of The Theory of Constraints"}, {"answer": "CHUNKS", "clue": "Capacity ___: increases that come in large, discrete jumps rather than smooth increments"}, {"answer": "FIXED", "clue": "___ costs: stay the same regardless of volume of output"}, {"answer": "VARIABLE", "clue": "___ costs: change directly with volume of output"}]}, "miniGames": {"whoAmI": [{"id": "wai1", "answer": "Productivity", "clues": ["I'm just a ratio: output over input.", "The higher I am, the lower your unit cost.", "Four workers installing carpet in 8 hours each helped calculate me: 22.5 yards per hour."]}, {"id": "wai2", "answer": "SWOT analysis", "clues": ["I have four boxes: two look inward, two look outward.", "Operations typically handles two of my letters; marketing handles the other two.", "I'm often called the link between strategy and operations."]}, {"id": "wai3", "answer": "Mass customization", "clues": ["I blend standardized production with a personal touch.", "Delayed differentiation and modular design are my two main tactics.", "Unstained furniture waiting for your color choice is a classic example of me."]}, {"id": "wai4", "answer": "Kano model", "clues": ["I sort quality into three types: basic, performance, and excitement.", "A feature that delights you today becomes expected tomorrow, according to me.", "Dr. Noriaki Kano developed me."]}, {"id": "wai5", "answer": "Reverse engineering", "clues": ["I involve buying a rival's product just to take it apart.", "Some forms of me are illegal under the Digital Millennium Copyright Act.", "Automakers use me to find the best-in-class dashboard or door handle."]}, {"id": "wai6", "answer": "Order winner", "clues": ["I'm the reason a customer picks you over a rival.", "I'm not the same as an order qualifier — I go further.", "Given enough time, I can decay into a mere qualifier as competitors catch up."]}, {"id": "wai7", "answer": "Scientific management", "clues": ["Frederick Taylor is my father.", "I'm based on observation, measurement, and economic incentives.", "I was controversial enough to trigger a 1911 congressional hearing."]}, {"id": "wai8", "answer": "Lean production", "clues": ["I use much less space, inventory, and workers than mass production.", "I blend the volume of mass production with the flexibility of craft production.", "Workers on my systems are taught to stop the line the moment they spot a defect."]}, {"id": "wai9", "answer": "Exponential smoothing", "clues": ["I only need one dial, called alpha, to adjust my behavior.", "My new forecast equals the old one plus a percentage of last period's error.", "The closer my alpha is to zero, the smoother — and slower — I am."]}, {"id": "wai10", "answer": "Tracking signal", "clues": ["I divide cumulative error by MAD.", "My typical acceptable range is about plus or minus four.", "I have a weakness: large positive and negative errors can cancel out and hide a real problem from me."]}], "fillTheGap": [{"id": "ftg1", "text": "Productivity = Output ÷ ______.", "answer": "Input"}, {"id": "ftg2", "text": "The three Rs are Reduce, Reuse, and ______.", "answer": "Recycle"}, {"id": "ftg3", "text": "SWOT stands for Strengths, Weaknesses, Opportunities, and ______.", "answer": "Threats"}, {"id": "ftg4", "text": "The four phases of the product life cycle are introduction, growth, maturity, and ______.", "answer": "decline"}, {"id": "ftg5", "text": "Order ______ are the minimum standard just to be considered for purchase.", "answer": "qualifiers"}, {"id": "ftg6", "text": "Concurrent engineering replaces the old '______' hand-off between design and manufacturing.", "answer": "over-the-wall"}, {"id": "ftg7", "text": "Operations, marketing, and ______ are the three basic functional areas of a business.", "answer": "finance"}, {"id": "ftg8", "text": "F(t) = F(t-1) + alpha times (Actual minus ______).", "answer": "F(t-1)"}, {"id": "ftg9", "text": "MAD weights all errors evenly, while ______ squares errors to weight larger ones more heavily.", "answer": "MSE"}, {"id": "ftg10", "text": "Control limits are calculated as 0 plus or minus z times the square root of ______.", "answer": "MSE"}], "orderIt": [{"id": "oi1", "title": "The Planning Hierarchy (mission to daily work)", "steps": ["Mission", "Goals", "Strategy", "Tactics", "Operations"]}, {"id": "oi2", "title": "The Eight Phases of Product Development", "steps": ["Feasibility analysis", "Product specifications", "Process specifications", "Prototype development", "Design review", "Market test", "Product introduction", "Follow-up evaluation"]}, {"id": "oi3", "title": "The Product Life Cycle", "steps": ["Introduction", "Growth", "Maturity", "Decline"]}, {"id": "oi4", "title": "The Six Steps in the Forecasting Process", "steps": ["Determine the purpose of the forecast", "Establish a time horizon", "Obtain, clean, and analyze data", "Select a forecasting technique", "Make the forecast", "Monitor forecast errors"]}, {"id": "oi5", "title": "Historical Evolution of Operations Management (chronological)", "steps": ["Division of labor (Adam Smith)", "Interchangeable parts (Eli Whitney)", "Scientific management (Taylor)", "Moving assembly line (Ford)", "Hawthorne studies (Mayo)", "Quality revolution (Japanese manufacturers)"]}], "matchingPool": ["competitiveness", "supply-chain-management", "mission-statement", "core-competencies", "swot-analysis", "order-winner", "productivity", "productivity-growth", "efficiency", "systems-viewpoint", "product-service-design", "reverse-engineering", "research-and-development", "product-liability", "standardization", "mass-customization", "reliability", "robust-design", "kano-model", "concurrent-engineering"], "connections": [["reliability", "robust-design"], ["productivity", "efficiency"], ["mass-customization", "standardization"], ["swot-analysis", "core-competencies"], ["order-winner", "order-qualifier"], ["concurrent-engineering", "reverse-engineering"], ["kano-model", "quality-function-deployment"], ["mission-statement", "organizational-strategy"], ["scientific-management", "division-of-labor"], ["mass-production", "interchangeable-parts"], ["moving-average", "weighted-moving-average"], ["exponential-smoothing", "trend-adjusted-smoothing"], ["trend-equation", "simple-linear-regression"], ["mad", "mse"], ["control-chart", "tracking-signal"], ["correlation-coefficient", "coefficient-of-determination"]]}};

/* ---------------- persistent storage: db + user capabilities (per-viewer private progress) ---------------- */
let PROGRESS_DOC = null; // DocumentReference for this viewer's private progress, once resolved

async function loadState(){
  CONTENT = JSON.parse(JSON.stringify(SEED_CONTENT));
  PROGRESS = DEFAULT_PROGRESS();

  try{
    if (window.claude && window.claude.use){
      const db = await window.claude.use('db');
      const user = await window.claude.use('user');
      const uid = user ? await user.id() : null;
      if (db && uid){
        PROGRESS_DOC = db.doc('data/users/' + uid + '/studyapp/progress');
        const snap = await PROGRESS_DOC.get();
        if (snap.exists) PROGRESS = Object.assign(DEFAULT_PROGRESS(), snap.data());
      }
    }
  }catch(e){ console.warn('db unavailable — progress will not persist this session', e); }

  PROGRESS.settings = Object.assign({dark:false, ttsRate:1.0}, PROGRESS.settings||{});
  PROGRESS.audio = Object.assign(
    {heard:{}, reviewed:{}, sectionRead:{}, bookmarks:{}, reviewLater:{}, lastLoId:null, voiceURI:null, repeat:false},
    PROGRESS.audio || {}
  );
  buildColorMaps();
}

function saveProgress(){
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(async () => {
    if (!PROGRESS_DOC) return;
    try{ await PROGRESS_DOC.set(PROGRESS); }
    catch(e){ console.warn('progress save failed', e); }
  }, 300);
}

/* ---------------- study time / streak tracking ---------------- */
function logStudyMinutes(mins){
  const day = todayStr();
  let entry = PROGRESS.studyLog.find(l => l.date === day);
  if (!entry){ entry = {date:day, minutes:0}; PROGRESS.studyLog.push(entry); }
  entry.minutes += mins;
  bumpStreak(day);
  saveProgress();
}
function bumpStreak(day){
  if (PROGRESS.lastStudyDate === day) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (PROGRESS.lastStudyDate === y || !PROGRESS.lastStudyDate){ PROGRESS.streakDays = (PROGRESS.streakDays||0) + 1; }
  else { PROGRESS.streakDays = 1; }
  PROGRESS.lastStudyDate = day;
}
function addXP(n){ PROGRESS.xp = (PROGRESS.xp||0) + n; saveProgress(); }

/* ---------------- color maps (generalized for N chapters x N LOs, cycling 5 colors) ---------------- */
const LO_PALETTE = ['#4FC3AC','#E3924F','#7DA6F0','#C48EDA','#E5C15C'];
const LO_PALETTE_VARS = ['var(--lo1)','var(--lo2)','var(--lo3)','var(--lo4)','var(--lo5)'];
const LO_TINT_VARS = ['var(--lo1-tint)','var(--lo2-tint)','var(--lo3-tint)','var(--lo4-tint)','var(--lo5-tint)'];
let CODE_COLOR_MAP = {}, CODE_TINT_MAP = {}, CODE_HEX_MAP = {};
function buildColorMaps(){
  CODE_COLOR_MAP = {}; CODE_TINT_MAP = {}; CODE_HEX_MAP = {};
  CONTENT.course.chapters.forEach(chId => {
    const los = CONTENT.learningObjectives.filter(l=>l.chapterId===chId);
    los.forEach((lo, idx) => {
      const i = idx % 5;
      CODE_COLOR_MAP[lo.code] = LO_PALETTE_VARS[i];
      CODE_TINT_MAP[lo.code] = LO_TINT_VARS[i];
      CODE_HEX_MAP[lo.code] = LO_PALETTE[i];
    });
  });
}
function loColor(section){ return CODE_COLOR_MAP[section] || 'var(--ink)'; }
function loTint(section){ return CODE_TINT_MAP[section] || 'var(--paper-2)'; }
function loColorHex(section){ return CODE_HEX_MAP[section] || '#888'; }

/* ---------------- data lookup helpers ---------------- */
function getConcept(id){ return CONTENT.concepts.find(c => c.id === id); }
function conceptsForChapter(chapterId){ return CONTENT.concepts.filter(c => c.chapterId === chapterId); }
function conceptsForLO(loId){
  const lo = CONTENT.learningObjectives.find(l => l.id === loId);
  if (!lo) return [];
  return CONTENT.concepts.filter(c => (lo.keyConcepts||[]).includes(c.id) || c.lo === lo.code);
}
function loByCode(code, chapterId){ return CONTENT.learningObjectives.find(l => l.code === code && (!chapterId || l.chapterId === chapterId)); }
function quizForScope(scope){
  let qs = CONTENT.quiz.slice();
  if (scope.chapterId) qs = qs.filter(q => q.chapterId === scope.chapterId);
  if (scope.loCode) qs = qs.filter(q => q.lo === scope.loCode);
  if (scope.conceptIds) qs = qs.filter(q => scope.conceptIds.includes(q.concept));
  if (scope.difficulty && scope.difficulty.length) qs = qs.filter(q => scope.difficulty.includes(q.difficulty));
  if (scope.types && scope.types.length) qs = qs.filter(q => scope.types.includes(q.type));
  return qs;
}

/* ---------------- mastery / accuracy computation ---------------- */
function conceptAccuracy(conceptId){
  const attempts = PROGRESS.quizAttempts.filter(a => a.conceptId === conceptId);
  if (!attempts.length) return null;
  const correct = attempts.filter(a => a.correct).length;
  return { attempts: attempts.length, correct, accuracy: Math.round(100*correct/attempts.length) };
}
function loStats(loId){
  const lo = CONTENT.learningObjectives.find(l => l.id === loId);
  const concepts = conceptsForLO(loId);
  const conceptIds = concepts.map(c=>c.id);
  const attempts = PROGRESS.quizAttempts.filter(a => conceptIds.includes(a.conceptId));
  const total = attempts.length;
  const correct = attempts.filter(a=>a.correct).length;
  const accuracy = total ? Math.round(100*correct/total) : null;
  let status = 'Not Started';
  if (total >= 1 && total < 4) status = 'Learning';
  else if (total >= 4 && accuracy !== null && accuracy < 80) status = 'Improving';
  else if (total >= 4 && accuracy !== null && accuracy >= 80) status = 'Mastered';
  const weak = concepts.map(c => ({id:c.id, term:c.term, stat: conceptAccuracy(c.id)}))
                        .filter(c => c.stat && c.stat.accuracy < 70)
                        .sort((a,b)=>a.stat.accuracy-b.stat.accuracy);
  return { lo, total, correct, accuracy, status, weak, concepts };
}
function statusClass(status){
  return {'Not Started':'notstarted','Learning':'learning','Improving':'improving','Mastered':'mastered'}[status] || 'notstarted';
}
function chapterMastery(chapterId){
  const los = CONTENT.learningObjectives.filter(l => l.chapterId === chapterId);
  if (!los.length) return 0;
  const accs = los.map(l => { const s = loStats(l.id); return s.accuracy===null?0:s.accuracy; });
  return Math.round(accs.reduce((a,b)=>a+b,0)/los.length);
}
function weakConceptsList(minAttempts){
  minAttempts = minAttempts || 1;
  return CONTENT.concepts
    .map(c => ({c, stat: conceptAccuracy(c.id)}))
    .filter(x => x.stat && x.stat.attempts >= minAttempts)
    .sort((a,b) => a.stat.accuracy - b.stat.accuracy)
    .slice(0, 12);
}
function flashcardsMasteredCount(){ return Object.values(PROGRESS.flashcardStatus||{}).filter(v => v === 'know').length; }

/* ---------------- SRS (lightweight spaced repetition) ---------------- */
const SRS_INTERVALS = { didnt:0, almost:1, knew:3, easy:7 };
function rateRecall(conceptId, rating){
  const now = new Date();
  const cur = PROGRESS.srs[conceptId] || {interval:0, dueDate:todayStr(), lastRating:null, streak:0};
  let interval = SRS_INTERVALS[rating] ?? 1;
  if (rating === 'easy' && cur.lastRating === 'easy') interval = Math.min((cur.interval||1)*2, 30);
  const due = new Date(now.getTime() + interval*86400000).toISOString().slice(0,10);
  PROGRESS.srs[conceptId] = { interval, dueDate: due, lastRating: rating, streak: rating==='didnt'?0:(cur.streak||0)+1 };
  saveProgress();
}
function dueConcepts(chapterId){
  const today = todayStr();
  const all = conceptsForChapter(chapterId);
  const due = all.filter(c => { const s = PROGRESS.srs[c.id]; return !s || s.dueDate <= today; });
  due.sort((a,b) => (a.tier==='must_know'?0:1) - (b.tier==='must_know'?0:1));
  return due.length ? due : all;
}

  const lo = CONTENT.learningObjectives.find(l => l.code === section && (!chapterId || l.chapterId === chapterId));
  return lo ? lo.id : null;

function navigate(route, param){
  if (route === 'dashboard' || route === 'chapters' || route === 'los'){ setMainMode('dashboard'); return; }
  if (route === 'study' || route === 'learn'){ setMainMode('study'); if (param) scrollToChapterTop(param); return; }
  if (route === 'chapter'){ setMainMode('study'); scrollToChapterTop(param || CONTENT.course.chapters[0]); return; }
  if (route === 'lo'){ setMainMode('study'); jumpToLO(param); return; }
  if (route === 'concept'){ openConceptModal(param); return; }
  if (route === 'flashcards'){ setMainMode('practice'); setPracticeTab('flashcards'); return; }
  if (route === 'quiz'){ setMainMode('practice'); setPracticeTab('quiz'); return; }
  if (route === 'active-recall'){ setMainMode('practice'); setPracticeTab('recall'); return; }
  if (route === 'games'){ gameState = {type:null}; setMainMode('practice'); setPracticeTab('games'); return; }
  if (route === 'exam'){ setMainMode('practice'); setPracticeTab('exam'); return; }
  if (route === 'weak-areas'){ setMainMode('practice'); setPracticeTab('weak'); return; }
  if (route === 'study-session'){ setMainMode('practice'); setPracticeTab('session'); return; }
  if (route === 'highlights'){ setMainMode('progress'); setProgressTab('highlights'); return; }
  if (route === 'progress'){ setMainMode('progress'); setProgressTab('stats'); return; }
  if (route === 'search'){ const s = document.getElementById('sideSearch'); if (s) s.focus(); return; }
  if (route === 'settings'){ openModal({type:'settings'}); return; }
  setMainMode('dashboard');
}

function setPracticeTab(tab){ PRACTICE_TAB = tab; render(); }
function setProgressTab(tab){ PROGRESS_TAB = tab; render(); }
function openModal(m){ ACTIVE_MODAL = m; renderModal(); }
function closeModal(){ ACTIVE_MODAL = null; renderModal(); }
function openConceptModal(conceptId){
  ACTIVE_MODAL = {type:'concept', id:conceptId};
  renderModal();
  // Actively opening a term's definition — in either Listen & Follow or Commute mode, or
  // plain reading — is what counts as "reviewed" (distinct from merely "heard" via narration).
  if (conceptId && !PROGRESS.audio.reviewed[conceptId]){
    PROGRESS.audio.reviewed[conceptId] = true;
    saveProgress();
  }
}

function scrollToChapterTop(chapterId){
  const el = document.getElementById('chapter-'+chapterId);

function jumpToLO(loId){
  const target = document.getElementById('sec-'+loId);

  target.scrollIntoView({behavior:'smooth', block:'start'});
  target.classList.add('flash');

function jumpToGlossaryTerm(conceptId){
  const c = getConcept(conceptId);
  if (!c) return;
  const loId = sectionToLoId(c.lo, c.chapterId);
  if (!loId) return;
  jumpToLO(loId);
  setTimeout(() => {

    if (span){
      span.scrollIntoView({behavior:'smooth', block:'center'});
      span.classList.add('term-jump');
      setTimeout(()=>span.classList.remove('term-jump'), 1700);
    }
  }, 350);
}

  t.textContent = msg;

  clearTimeout(toast._t);

}

function onSidebarSearch(){
  const q = this.value.trim().toLowerCase();
  const box = document.getElementById('sideSearchResults');
  if (q.length < 2){ box.innerHTML = ''; return; }
  const results = [];
  CONTENT.concepts.forEach(c => {
    const hay = [c.term, c.definition, c.plain, c.example].filter(Boolean).join(' ').toLowerCase();
    if (hay.includes(q)) results.push({kind:'concept', id:c.id, label:c.term, sub:'LO '+c.section});
  });
  CONTENT.learningObjectives.forEach(lo => {
    if (lo.text.toLowerCase().includes(q)) results.push({kind:'lo', id:lo.id, label:'LO '+lo.code, sub:lo.text.slice(0,50)});
  });
  if (!results.length){ box.innerHTML = '<div class="side-search-item">No matches</div>'; return; }
  box.innerHTML = results.slice(0,20).map((r,i) => `<div class="side-search-item" data-i="${i}">${r.label}<span class="ssi-sub">${r.sub}</span></div>`).join('');
  box._results = results;
  box.querySelectorAll('.side-search-item').forEach(item => {
    item.addEventListener('click', () => {
      const r = box._results[parseInt(item.dataset.i,10)];
      if (!r) return;
      closeMobileSidebar(); setMainMode('study');
      if (r.kind === 'concept') setTimeout(()=>jumpToGlossaryTerm(r.id), 30);
      else setTimeout(()=>jumpToLO(r.id), 30);
    });
  });
}

function attachHighlightHandlers(panel){
  panel.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      if (hlCategory === sw.dataset.cat){ hlCategory = null; panel.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected')); }
      else { hlCategory = sw.dataset.cat; panel.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected', s===sw)); }
    });
  });
  const clearBtn = panel.querySelector('#hlClearBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    panel.querySelectorAll('mark.uhl').forEach(unwrapMark);
    PROGRESS.highlights = [];
    saveProgress();
    toast('Highlights cleared');
  });
  panel.addEventListener('mouseup', (e) => {
    if (e.target.tagName === 'MARK' && e.target.classList.contains('uhl')){
      const id = e.target.dataset.hid;
      unwrapMark(e.target);
      if (id){ PROGRESS.highlights = PROGRESS.highlights.filter(h=>h.id!==id); saveProgress(); }
      return;
    }
    if (!hlCategory) return;
    if (e.target.closest('.hl-toolbar') || e.target.closest('table.gloss')) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    if (!panel.contains(sel.anchorNode)) return;
    const text = sel.toString().trim();
    if (!text || text.length < 2) return;
    try{
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      const hid = uid('hl');
      mark.className = 'uhl'; mark.dataset.hid = hid;
      mark.style.background = hlCatColor(hlCategory);
      range.surroundContents(mark);
      sel.removeAllRanges();
      const sourceSec = mark.closest('section.lo');
      PROGRESS.highlights.push({ id:hid, ts:Date.now(), text, category:hlCategory, note:'',
        source:{ type:'lo', id: sourceSec ? sourceSec.id.replace('sec-','') : '', label: sourceSec ? sourceSec.querySelector('h2').textContent : 'Study text' } });
      saveProgress(); addXP(1);
      toast('Highlight saved ('+hlCategory+')');
    }catch(err){ sel.removeAllRanges(); }
  });
}
function unwrapMark(m){
  const parent = m.parentNode;
  while (m.firstChild) parent.insertBefore(m.firstChild, m);
  parent.removeChild(m);
  parent.normalize();
}

function computeBadges(){
  const b = [];
  if (PROGRESS.streakDays >= 3) b.push('3-Day Streak');
  if (PROGRESS.streakDays >= 7) b.push('7-Day Streak');
  CONTENT.course.chapters.forEach(chId => {

    const chLOs = CONTENT.learningObjectives.filter(l=>l.chapterId===chId);
    const masteredCount = Object.keys(PROGRESS.flashcardStatus||{}).filter(id=>{
      const c = getConcept(id); return c && c.chapterId===chId && PROGRESS.flashcardStatus[id]==='know';
    }).length;
    if (chConcepts.length && masteredCount >= chConcepts.length) b.push(`Chapter ${ch.number} Flashcards Mastered`);
    if (chLOs.length && chLOs.every(l=>loStats(l.id).status==='Mastered')) b.push(`Chapter ${ch.number} Complete`);
  });
  const perfectQuiz = PROGRESS.examHistory.find(e => e.score === e.total && e.total>0);
  if (perfectQuiz) b.push('Perfect Quiz');
  return b;
}

/* =====================================================================
   MATCH GAME
   ===================================================================== */
let matchGame = { round:0, matched:0, selectedKey:null, rounds:[] };
function initMatchGame(){
  const pool = pickSpreadConcepts(PRACTICE_CHAPTER_ID, 18);
  const rounds = [];
  for (let i=0;i<pool.length;i+=6) rounds.push(pool.slice(i,i+6));
  matchGame = { round:0, matched:0, selectedKey:null, rounds };
  _matchedKeys = [];
}
function pickSpreadConcepts(chapterId, max){
  const bySection = {}; const order = [];
  conceptsForChapter(chapterId).forEach(c => {
    if (!bySection[c.section]){ bySection[c.section]=[]; order.push(c.section); }
    bySection[c.section].push(c);
  });
  const pool = []; let idx=0, more=true;
  while (pool.length < max && more){
    more = false;
    for (const sec of order){
      const arr = bySection[sec];
      if (arr[idx]){ pool.push(arr[idx]); more=true; if (pool.length>=max) break; }
    }
    idx++;
  }
  return pool;
}
function viewMatchGame(){
  if (!matchGame.rounds.length) initMatchGame();
  const roundConcepts = matchGame.rounds[matchGame.round];
  if (!roundConcepts) return '<div class="empty-state">Round data missing. <button class="btn small" data-action="matchRestart">Restart</button></div>';
  if (!matchGame._terms || matchGame._roundKey !== matchGame.round){
    const terms = roundConcepts.map((c,i)=>({key:'t'+i, text:c.term}));
    const defs = roundConcepts.map((c,i)=>({key:'t'+i, text:c.definition}));
    matchGame._terms = shuffleArr(terms);
    matchGame._defs = shuffleArr(defs);
    matchGame._roundKey = matchGame.round;
    matchGame.matched = 0; matchGame.selectedKey = null;
  }
  return `
    <div class="match-head"><span>Round ${matchGame.round+1} of ${matchGame.rounds.length}</span><span>Matched ${matchGame.matched} / ${roundConcepts.length}</span></div>
    <div class="match-grid">

/* =====================================================================
   CROSSWORD
   ===================================================================== */
let xwState = null;
function buildCrossword(wordList){
  const GRID = 26;
  const grid = []; for (let r=0;r<GRID;r++) grid.push(new Array(GRID).fill(null));
  const placements = [];
  const words = shuffleArr(wordList.slice()).sort((a,b)=>b.answer.length-a.answer.length);

  function inb(r,c){ return r>=0 && c>=0 && r<GRID && c<GRID; }
  function get(r,c){ return inb(r,c) ? grid[r][c] : undefined; }
  function canPlace(answer,row,col,dir){
    for (let i=0;i<answer.length;i++){
      const r = dir==='down'?row+i:row, c = dir==='across'?col+i:col;
      if (!inb(r,c)) return false;
      const cell = grid[r][c];
      if (cell && cell!==answer[i]) return false;
      if (!cell){
        if (dir==='across'){ if (get(r-1,c) || get(r+1,c)) return false; }
        else { if (get(r,c-1) || get(r,c+1)) return false; }
      }
    }
    if (dir==='across'){ if (get(row,col-1) || get(row,col+answer.length)) return false; }
    else { if (get(row-1,col) || get(row+answer.length,col)) return false; }
    return true;
  }
  function place(answer,row,col,dir){
    for (let i=0;i<answer.length;i++){ const r=dir==='down'?row+i:row, c=dir==='across'?col+i:col; grid[r][c]=answer[i]; }
  }
  const first = words[0];
  const startRow = Math.floor(GRID/2), startCol = Math.floor((GRID-first.answer.length)/2);
  place(first.answer, startRow, startCol, 'across');
  placements.push({answer:first.answer, clue:first.clue, row:startRow, col:startCol, dir:'across'});

  for (let wi=1; wi<words.length; wi++){
    const w = words[wi];
    let best = null;
    for (let pi=0; pi<placements.length && !best; pi++){
      const p = placements[pi];
      for (let i=0;i<w.answer.length && !best;i++){
        for (let j=0;j<p.answer.length && !best;j++){
          if (w.answer[i] !== p.answer[j]) continue;
          const dir = p.dir==='across' ? 'down' : 'across';
          let row,col;
          if (dir==='down'){ row=p.row-i; col=p.col+j; } else { row=p.row+j; col=p.col-i; }
          if (canPlace(w.answer,row,col,dir)) best = {row,col,dir};
        }
      }
    }
    if (best){ place(w.answer,best.row,best.col,best.dir); placements.push({answer:w.answer,clue:w.clue,row:best.row,col:best.col,dir:best.dir}); }
    else {
      outer: for (let r2=0;r2<GRID;r2++){
        for (let c2=0;c2<=GRID-w.answer.length;c2++){
          if (canPlace(w.answer,r2,c2,'across')){ place(w.answer,r2,c2,'across'); placements.push({answer:w.answer,clue:w.clue,row:r2,col:c2,dir:'across'}); break outer; }
        }
      }
    }
  }
  let minR=GRID,maxR=0,minC=GRID,maxC=0;
  placements.forEach(p => {
    const r2 = p.dir==='down'?p.row+p.answer.length-1:p.row;
    const c2 = p.dir==='across'?p.col+p.answer.length-1:p.col;
    minR=Math.min(minR,p.row); maxR=Math.max(maxR,r2); minC=Math.min(minC,p.col); maxC=Math.max(maxC,c2);
  });
  placements.forEach(p => { p.row-=minR; p.col-=minC; });
  const rows = maxR-minR+1, cols = maxC-minC+1;
  const hasLetter=[]; for(let r=0;r<rows;r++) hasLetter.push(new Array(cols).fill(false));
  const solution=[]; for(let r=0;r<rows;r++) solution.push(new Array(cols).fill(null));
  placements.forEach(p => { for(let i=0;i<p.answer.length;i++){ const r=p.dir==='down'?p.row+i:p.row, c=p.dir==='across'?p.col+i:p.col; hasLetter[r][c]=true; solution[r][c]=p.answer[i]; } });
  const numberGrid=[]; for(let r=0;r<rows;r++) numberGrid.push(new Array(cols).fill(null));
  let num=1;
  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      if (!hasLetter[r][c]) continue;
      const startsAcross = (c===0 || !hasLetter[r][c-1]) && (c+1<cols && hasLetter[r][c+1]);
      const startsDown = (r===0 || !hasLetter[r-1][c]) && (r+1<rows && hasLetter[r+1][c]);
      if (startsAcross || startsDown){ numberGrid[r][c]=num; num++; }
    }
  }
  placements.forEach(p => { p.number = numberGrid[p.row][p.col]; });
  placements.sort((a,b) => a.number-b.number || (a.dir>b.dir?1:-1));
  return { rows, cols, hasLetter, solution, numberGrid, placements };
}
function viewCrosswordGame(){
  if (!xwState) xwState = buildCrossword((CONTENT.crossword && CONTENT.crossword[PRACTICE_CHAPTER_ID]) || []);
  const xw = xwState;
  let gridHtml = `<div class="xw-grid" style="grid-template-columns:repeat(${xw.cols},25px);grid-template-rows:repeat(${xw.rows},25px);display:grid;">`;
  for (let r=0;r<xw.rows;r++){
    for (let c=0;c<xw.cols;c++){
      if (!xw.hasLetter[r][c]) gridHtml += '<div class="xw-cell block"></div>';
      else {
        const n = xw.numberGrid[r][c];
        gridHtml += `<div class="xw-cell">${n?`<span class="xw-num">${n}</span>`:''}<input maxlength="1" data-r="${r}" data-c="${c}"></div>`;
      }
    }
  }
  gridHtml += '</div>';
  const across = xw.placements.filter(p=>p.dir==='across');
  const down = xw.placements.filter(p=>p.dir==='down');
  const cluesHtml = `<div class="xw-clues"><h4>Across</h4><ul style="list-style:none;padding-left:0;">${across.map(p=>`<li>${p.number}. ${p.clue}</li>`).join('')}</ul>
    <h4>Down</h4><ul style="list-style:none;padding-left:0;">${down.map(p=>`<li>${p.number}. ${p.clue}</li>`).join('')}</ul></div>`;
  return `
    <div class="xw-toolbar">
      <button class="btn small" data-action="xwCheck">Check answers</button>
      <button class="btn small" data-action="xwReveal">Reveal answers</button>
      <button class="btn small" data-action="xwNew">New layout</button>
    </div>
    <div class="xw-wrap">${gridHtml}${cluesHtml}</div>
  `;
}

  } else if (id === 'whoami'){
    const items = shuffleArr(CONTENT.miniGames.whoAmI.slice());
    gameState = {type:'whoami', items, index:0, clueIdx:0, score:0, done:false};
  } else if (id === 'fillgap'){
    const items = shuffleArr(CONTENT.miniGames.fillTheGap.slice());
    gameState = {type:'fillgap', items, index:0, score:0, revealed:false};
  } else if (id === 'orderit'){
    const items = shuffleArr(CONTENT.miniGames.orderIt.slice());
    gameState = {type:'orderit', items, index:0, score:0, current:null, built:[]};
    setupOrderItRound();
  } else if (id === 'twotruths'){
    const items = shuffleArr(CONTENT.quiz.filter(q=>q.type==='two_truths_trap'));
    gameState = {type:'twotruths', items, index:0, score:0, answered:false};
  } else if (id === 'sort'){
    const items = shuffleArr(conceptsForChapter(PRACTICE_CHAPTER_ID)).slice(0,10);
    gameState = {type:'sort', items, index:0, score:0, answered:false};
  } else if (id === 'connections'){
    const pairs = buildConceptConnections();
    gameState = {type:'connections', pairs, index:0, score:0, answered:false};
  } else if (id === 'scenario'){
    const items = shuffleArr(CONTENT.quiz.filter(q=>q.type==='scenario'));
    gameState = {type:'scenario', items, index:0, score:0, answered:false};
  } else if (id === 'boss'){
    startQuiz({chapterId:PRACTICE_CHAPTER_ID, difficulty:['hard','exam'], count:999});
    return;
  }
  setPracticeTab('games');
}
function buildConceptConnections(){
  const CURATED = (CONTENT.miniGames.connections || []);
  const all = CONTENT.concepts;
  return CURATED.map(([aId,bId]) => {
    const a = getConcept(aId), b = getConcept(bId);
    if (!a || !b) return null;
    const distractors = shuffleArr(all.filter(c=>c.id!==aId && c.id!==bId)).slice(0,3).map(c=>c.term);
    return { a, correct: b.term, options: shuffleArr([b.term, ...distractors]) };
  }).filter(Boolean);
}
function setupOrderItRound(){
  const item = gameState.items[gameState.index];
  if (!item) return;
  gameState.current = { correct: item.steps, shuffled: shuffleArr(item.steps) };
  gameState.built = [];
}

}

/* =====================================================================
   ACTION DISPATCHER
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});

const ACTIONS = {
  nav(el){ navigate(el.dataset.route, el.dataset.param); },

  // ---- Audio Study Mode ----
  startListen(el){ startAudioSession('follow', CONTENT.learningObjectives.find(l=>l.id===el.dataset.lo).chapterId, el.dataset.lo); },
  openCommute(el){
    const loId = el.dataset.lo || PROGRESS.audio.lastLoId || CONTENT.learningObjectives[0].id;
    const lo = CONTENT.learningObjectives.find(l => l.id === loId) || CONTENT.learningObjectives[0];
    startAudioSession('commute', lo.chapterId, lo.id);
  },
  closeCommute(){ stopAudioSession(true); },
  dismissCommuteSummary(){ const s = document.querySelector('.commute-summary'); if (s) s.remove(); },
  commutePlayPause(){ if (AUDIO.playing) pauseAudio(); else playAudio(); },
  commuteSeekFwd(){ seekUtterance(3); },
  commuteSeekBack(){ seekUtterance(-3); },
  commutePrevSection(){ goToSection(-1); },
  commuteNextSection(){ goToSection(1); },
  commuteRepeatToggle(){ AUDIO.repeat = !AUDIO.repeat; PROGRESS.audio.repeat = AUDIO.repeat; saveProgress(); renderCommuteOverlay(); },
  commuteBookmark(){
    const lo = currentLO();
    PROGRESS.audio.bookmarks[lo.id] = { uttIdx: AUDIO.uttIdx, savedAt: Date.now() };
    AUDIO.sessionBookmarks += 1; saveProgress(); toast('Bookmarked this spot.');
  },
  commuteReviewLater(){
    const utt = AUDIO.utterances[AUDIO.uttIdx];
    (utt ? utt.conceptIds : []).forEach(cid => { PROGRESS.audio.reviewLater[cid] = true; });
    saveProgress(); toast('Marked for later review.');
  },
  followPlayPause(){ if (AUDIO.playing) pauseAudio(); else playAudio(); },
  followStop(){ stopAudioSession(false); },
  followPrevLO(){ goToSection(-1); },
  followNextLO(){ goToSection(1); },
  markSectionRead(el){
    PROGRESS.audio.sectionRead[el.dataset.lo] = true; saveProgress();
    el.textContent = '✓ Read'; el.classList.add('done');
  },
  startReviewRemaining(){ startReviewRemainingFlow(); },
  revealRemainingDef(){
    REVIEW_REMAINING.revealed = true;
    const cid = REVIEW_REMAINING.ids[REVIEW_REMAINING.idx];
    if (cid && !PROGRESS.audio.reviewed[cid]){ PROGRESS.audio.reviewed[cid] = true; saveProgress(); }
    renderReviewRemaining();
  },
  nextRemaining(){
    REVIEW_REMAINING.ids.splice(REVIEW_REMAINING.idx, 1);
    if (REVIEW_REMAINING.idx >= REVIEW_REMAINING.ids.length) REVIEW_REMAINING.idx = 0;
    REVIEW_REMAINING.revealed = false;
    renderReviewRemaining();
  },
  skipRemaining(){
    const id = REVIEW_REMAINING.ids.splice(REVIEW_REMAINING.idx, 1)[0];
    REVIEW_REMAINING.ids.push(id);
    if (REVIEW_REMAINING.idx >= REVIEW_REMAINING.ids.length) REVIEW_REMAINING.idx = 0;
    REVIEW_REMAINING.revealed = false;
    renderReviewRemaining();
  },
  closeReviewRemaining(){ const b = document.getElementById('reviewRemainingBox'); if (b) b.remove(); },
  cardsFilter(el){ cardsFilter[el.dataset.key] = el.dataset.val; render(); },
  openConcept(el){ openConceptModal(el.dataset.id); },
  jumpLO(el){ setMainMode('study'); setTimeout(()=>jumpToLO(el.dataset.lo), 30); },
  modalJumpToLO(el){
    const c = getConcept(el.dataset.id);
    closeModal(); setMainMode('study');
    if (c) setTimeout(()=>jumpToGlossaryTerm(c.id), 30);
  },
  markFlashcard(el){
    const id = el.dataset.id, status = el.dataset.status;
    PROGRESS.flashcardStatus[id] = PROGRESS.flashcardStatus[id] === status ? undefined : status;
    saveProgress(); addXP(2);
    if (ACTIVE_MODAL && ACTIVE_MODAL.type==='concept') renderModal();
    render();
  },
  fcFlip(){ fcState.flipped = !fcState.flipped; render(); },
  fcNav(el){
    const dir = parseInt(el.dataset.dir,10);
    fcState.index = (fcState.index + dir + fcState.deck.length) % fcState.deck.length;
    fcState.flipped = false; render();

/* =====================================================================
   AFTER-RENDER SIDE EFFECTS
   ===================================================================== */
function afterRender(){
  if (MAIN_MODE === 'practice' && PRACTICE_TAB === 'exam' && examState.phase === 'active' && examState.config && examState.config.timerSec){
    clearInterval(examState.timerId);
    const myExam = examState;
    myExam.timerId = setInterval(() => {
      if (examState !== myExam){ clearInterval(myExam.timerId); return; }
      myExam.timeLeft--;
      const d = document.getElementById('ex-timer-display');
      if (d) d.textContent = myExam.timeLeft + 's';
      if (myExam.timeLeft <= 0){ myExam.answers.push({correct:false}); examNextQuestion(); }
    }, 1000);
  }
  if (MAIN_MODE === 'practice' && PRACTICE_TAB === 'games' && gameState.type === 'speed' && gameState.qs && gameState.qs[gameState.index] && !gameState.timerId){
    const myGame = gameState;
    myGame.timerId = setInterval(() => {
      if (gameState !== myGame){ clearInterval(myGame.timerId); return; }
      myGame.timeLeft--;
      if (myGame.timeLeft <= 0 || !myGame.qs[myGame.index]){ clearInterval(myGame.timerId); myGame.timeLeft = 0; render(); }
      else { const el = document.querySelector('.timer-display'); if (el) el.textContent = '⏳ ' + myGame.timeLeft + 's'; }
    }, 1000);
  }
  if (MAIN_MODE === 'practice' && PRACTICE_TAB === 'crossword'){
    document.querySelectorAll('.xw-cell input').forEach(inp => {
      if (inp._wired) return;
      inp._wired = true;
      inp.addEventListener('input', () => {
        inp.value = inp.value.toUpperCase().slice(-1);
        inp.classList.remove('ok','no');
        const r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
        if (inp.value){
          const right = document.querySelector(`.xw-cell input[data-r="${r}"][data-c="${c+1}"]`);
          const down_ = document.querySelector(`.xw-cell input[data-r="${r+1}"][data-c="${c}"]`);
          if (right) right.focus(); else if (down_) down_.focus();
        }
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value){
          const r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
          const left = document.querySelector(`.xw-cell input[data-r="${r}"][data-c="${c-1}"]`);
          if (left) left.focus();
        }
      });
    });
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
/* =========================================================
   AUDIO STUDY MODE: shared narration engine (Web Speech API)
   used by both "Listen & Follow Along" (inline, visible) and
   "Commute Mode" (full-screen, eyes-off).
   ===================================================================== */
const AUDIO = {
  active: false,        // is a narration session running at all
  mode: null,            // 'follow' | 'commute'
  chapterId: null,
  loList: [],             // ordered LO objects for the current chapter
  loIdx: 0,
  blocks: [],             // current LO's readable blocks: {el, kind, conceptIds:[...]}
  utterances: [],         // flattened: {blockIdx, text, conceptIds:[...]}
  uttIdx: 0,
  playing: false,
  rate: 1.0,
  voiceURI: null,
  repeat: false,
  sessionStart: null,
  sessionHeard: new Set(),
  sessionReviewed: new Set(),
  sessionSectionsRead: new Set(),
  sessionBookmarks: 0,
};

function speakifyFormula(text){
  return text
    .replace(/×/g, ' multiplied by ')
    .replace(/÷/g, ' divided by ')
    .replace(/±/g, ' plus or minus ')
    .replace(/−/g, ' minus ')
    .replace(/√/g, ' the square root of ')
    .replace(/Σ/g, ' the sum of ')
    .replace(/∑/g, ' the sum of ')
    .replace(/α/g, ' alpha ')
    .replace(/β/g, ' beta ')
    .replace(/²/g, ' squared ')
    .replace(/→|⟶/g, ' leads to ')
    .replace(/&/g, ' and ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function textForSpeech(elm){
  const clone = elm.cloneNode(true);
  clone.querySelectorAll('.src-badge').forEach(b => b.remove());
  return clone.textContent.replace(/\s+/g, ' ').trim();
}

function splitSentences(text){
  const parts = text.split(/(?<=[.!?])\s+(?=[A-Z0-9"“])/).map(s => s.trim()).filter(Boolean);
  return parts.length ? parts : [text];
}

// Build the ordered, readable script for one LO directly from its live DOM
// (this guarantees the spoken script always matches what's on screen).
function collectBlocksForLO(loId){
  const sec = document.getElementById('sec-' + loId);
  if (!sec) return [];
  const card = sec.querySelector('.lo-card');
  if (!card) return [];
  const nodes = card.querySelectorAll('h3.section-heading, .source-box > summary, p, li, .fc-main, .fc-answer');
  const blocks = [];
  nodes.forEach(nd => {
    // skip anything living inside a variable-key chip row or a raw data table (never read cell-by-cell)
    if (nd.closest('.fc-vars') || nd.closest('table')) return;
    let kind = 'para', prefix = '';
    if (nd.tagName === 'H3') { kind = 'heading'; prefix = 'Moving to the next part: '; }
    else if (nd.tagName === 'SUMMARY') { kind = 'caption'; prefix = "Here's a table in your textbook: "; }
    else if (nd.classList.contains('fc-main')) { kind = 'formula'; }
    else if (nd.classList.contains('fc-answer')) { kind = 'answer'; prefix = 'So, the answer is: '; }
    else if (nd.tagName === 'LI') { kind = 'step'; }
    let raw = textForSpeech(nd);
    if (!raw) return;
    if (kind === 'formula') raw = speakifyFormula(raw);
    const conceptIds = Array.from(nd.querySelectorAll('.term[data-cid]')).map(t => t.dataset.cid);
    if (nd.classList && nd.classList.contains('term') && nd.dataset.cid) conceptIds.push(nd.dataset.cid);
    blocks.push({ el: nd, kind, text: prefix + raw, conceptIds, revealIfHidden: nd.tagName === 'LI' });
  });
  return blocks;
}

function buildUtterances(blocks){
  const utts = [];
  blocks.forEach((b, bi) => {
    const sentences = (b.kind === 'para') ? splitSentences(b.text) : [b.text];
    sentences.forEach(s => utts.push({ blockIdx: bi, text: s, conceptIds: b.conceptIds }));
  });
  return utts;
}

function loadLOIntoPlayer(loId){
  AUDIO.blocks = collectBlocksForLO(loId);
  AUDIO.utterances = buildUtterances(AUDIO.blocks);
  AUDIO.uttIdx = 0;
  PROGRESS.audio.lastLoId = loId;
}

function currentLO(){ return AUDIO.loList[AUDIO.loIdx] || null; }

function pickVoice(){
  const voices = speechSynthesis.getVoices();
  if (AUDIO.voiceURI){
    const v = voices.find(v => v.voiceURI === AUDIO.voiceURI);
    if (v) return v;
  }
  return voices.find(v => v.lang && v.lang.startsWith('en')) || voices[0] || null;
}

function clearHighlight(){
  document.querySelectorAll('.audio-current').forEach(e => e.classList.remove('audio-current'));
}

function highlightBlock(blockIdx){
  clearHighlight();
  const b = AUDIO.blocks[blockIdx];
  if (!b) return;
  if (b.revealIfHidden && b.el.hasAttribute('hidden')) b.el.removeAttribute('hidden');
  b.el.classList.add('audio-current');
  if (AUDIO.mode === 'follow'){
    b.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function markHeard(conceptIds){
  (conceptIds || []).forEach(cid => {
    AUDIO.sessionHeard.add(cid);
    if (!PROGRESS.audio.heard[cid]){ PROGRESS.audio.heard[cid] = true; saveProgress(); }
  });
}

function speakNext(){
  if (!AUDIO.active) return;
  if (AUDIO.uttIdx >= AUDIO.utterances.length){
    // finished this LO's narration all the way through — counts as "read"
    const lo = currentLO();
    if (lo){
      AUDIO.sessionSectionsRead.add(lo.id);
      if (!PROGRESS.audio.sectionRead[lo.id]){ PROGRESS.audio.sectionRead[lo.id] = true; saveProgress(); }
    }
    if (AUDIO.repeat){
      loadLOIntoPlayer(lo.id);
      speakNext();
      return;
    }
    if (AUDIO.loIdx < AUDIO.loList.length - 1){
      AUDIO.loIdx += 1;
      loadLOIntoPlayer(currentLO().id);
      if (AUDIO.mode === 'commute') renderCommuteOverlay();
      speakNext();
      return;
    }
    // end of chapter — stop and show summary (commute) or just stop (follow)
    stopAudioSession(true);
    return;
  }
  const utt = AUDIO.utterances[AUDIO.uttIdx];
  highlightBlock(utt.blockIdx);
  markHeard(utt.conceptIds);
  const u = new SpeechSynthesisUtterance(utt.text);
  u.rate = AUDIO.rate;
  const v = pickVoice();
  if (v) u.voice = v;
  u.onend = () => { if (AUDIO.playing){ AUDIO.uttIdx += 1; speakNext(); } };
  u.onerror = () => { if (AUDIO.playing){ AUDIO.uttIdx += 1; speakNext(); } };
  AUDIO.playing = true;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  if (AUDIO.mode === 'commute') updateCommuteProgress();
}

function playAudio(){ AUDIO.playing = true; speakNext(); if (AUDIO.mode === 'commute') renderCommuteOverlay(); else renderFollowBar(); }
function pauseAudio(){ AUDIO.playing = false; speechSynthesis.cancel(); if (AUDIO.mode === 'commute') renderCommuteOverlay(); else renderFollowBar(); }

function seekUtterance(delta){
  AUDIO.uttIdx = Math.max(0, Math.min(AUDIO.utterances.length - 1, AUDIO.uttIdx + delta));
  if (AUDIO.playing) speakNext(); else { highlightBlock(AUDIO.utterances[AUDIO.uttIdx].blockIdx); if (AUDIO.mode==='commute') updateCommuteProgress(); }
}

function goToSection(delta){
  const newIdx = AUDIO.loIdx + delta;
  if (newIdx < 0 || newIdx >= AUDIO.loList.length) return;
  AUDIO.loIdx = newIdx;
  loadLOIntoPlayer(currentLO().id);
  if (AUDIO.playing) speakNext();
  if (AUDIO.mode === 'commute') renderCommuteOverlay(); else renderFollowBar();
}

function startAudioSession(mode, chapterId, loId){
  AUDIO.active = true;
  AUDIO.mode = mode;
  AUDIO.chapterId = chapterId;
  AUDIO.loList = CONTENT.learningObjectives.filter(l => l.chapterId === chapterId);
  AUDIO.loIdx = Math.max(0, AUDIO.loList.findIndex(l => l.id === loId));
  AUDIO.rate = PROGRESS.settings.ttsRate || 1.0;
  AUDIO.voiceURI = PROGRESS.audio.voiceURI || null;
  AUDIO.repeat = !!PROGRESS.audio.repeat;
  AUDIO.sessionStart = Date.now();
  AUDIO.sessionHeard = new Set();
  AUDIO.sessionReviewed = new Set();
  AUDIO.sessionSectionsRead = new Set();
  loadLOIntoPlayer(currentLO().id);
  if (mode === 'commute'){
    document.body.classList.add('commute-active');
    renderCommuteOverlay();
  } else {
    renderFollowBar();
  }
  playAudio();
}

function stopAudioSession(showSummary){
  AUDIO.playing = false;
  speechSynthesis.cancel();
  clearHighlight();
  const wasCommute = AUDIO.mode === 'commute';
  AUDIO.active = false;
  document.body.classList.remove('commute-active');
  const overlay = document.getElementById('commuteOverlay'); if (overlay) overlay.remove();
  const bar = document.getElementById('followBar'); if (bar) bar.remove();
  if (showSummary && wasCommute) renderCommuteSummary();
  AUDIO.mode = null;
}

/* ---------------- Follow & Along inline strip ---------------- */
function renderFollowBar(){
  let bar = document.getElementById('followBar');
  const panel = document.getElementById('modePanelStudy');
  if (!panel) return;
  if (!bar){
    bar = document.createElement('div');
    bar.id = 'followBar';
    panel.insertBefore(bar, panel.firstChild);
  }
  const lo = currentLO();
  bar.innerHTML = `
    <span class="fb-title">🎧 Listening: ${lo ? lo.code + ' — ' + lo.text : ''}</span>
    <button data-action="followPrevLO">⟵ Prev LO</button>
    <button data-action="followPlayPause">${AUDIO.playing ? '⏸ Pause' : '▶ Play'}</button>
    <button data-action="followNextLO">Next LO ⟶</button>
    <label style="display:flex;align-items:center;gap:4px;">Speed
      <input type="range" min="0.75" max="2" step="0.25" value="${AUDIO.rate}" id="followRate">
      <span id="followRateLabel">${AUDIO.rate}x</span>
    </label>
    <button data-action="followStop">✕ Stop</button>
  `;
  const rate = document.getElementById('followRate');
  if (rate) rate.addEventListener('input', () => {
    AUDIO.rate = parseFloat(rate.value);
    document.getElementById('followRateLabel').textContent = AUDIO.rate + 'x';
    PROGRESS.settings.ttsRate = AUDIO.rate; saveProgress();
    if (AUDIO.playing) speakNext();
  });
}

/* ---------------- Commute Mode: full-screen player ---------------- */
function updateCommuteProgress(){
  const fill = document.querySelector('#commuteOverlay .cm-bar-fill');
  const txt = document.querySelector('#commuteOverlay .cm-progresstext');
  const cur = document.querySelector('#commuteOverlay .cm-current-text');
  if (!fill) return;
  const pct = AUDIO.utterances.length ? Math.round(((AUDIO.uttIdx + 1) / AUDIO.utterances.length) * 100) : 0;
  fill.style.width = pct + '%';
  if (txt) txt.textContent = `Section ${AUDIO.loIdx + 1} of ${AUDIO.loList.length} · ${pct}%`;
  if (cur && AUDIO.utterances[AUDIO.uttIdx]) cur.textContent = AUDIO.utterances[AUDIO.uttIdx].text;
}

function renderCommuteOverlay(){
  let ov = document.getElementById('commuteOverlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'commuteOverlay';
    document.body.appendChild(ov);
  }
  const lo = currentLO();
  const ch = CONTENT.chapters[AUDIO.chapterId];
  const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('en'));
  ov.innerHTML = `
    <button class="cm-close" data-action="closeCommute">&times;</button>
    <div class="cm-chapter">Chapter ${ch.number}: ${ch.title}</div>
    <div class="cm-lo">${lo ? lo.code + ' — ' + lo.text : ''}</div>
    <div class="cm-progresstext">Section ${AUDIO.loIdx + 1} of ${AUDIO.loList.length}</div>
    <div class="cm-bar"><div class="cm-bar-fill" style="width:0%"></div></div>
    <button class="cm-playbtn" data-action="commutePlayPause">${AUDIO.playing ? '⏸' : '▶'}</button>
    <div class="cm-row">
      <button data-action="commuteSeekBack">⟲ 15s</button>
      <button data-action="commutePrevSection">⏮ Prev Section</button>
      <button data-action="commuteNextSection">Next Section ⏭</button>
      <button data-action="commuteSeekFwd">15s ⟳</button>
    </div>
    <div class="cm-row">
      <button class="${AUDIO.repeat?'active':''}" data-action="commuteRepeatToggle">🔁 Repeat</button>
      <button data-action="commuteBookmark">🔖 Bookmark</button>
      <button data-action="commuteReviewLater">⏰ Review Later</button>
    </div>
    <div class="cm-current-text"></div>
    <div class="cm-settings">
      <label>Speed (${AUDIO.rate}x)<input type="range" id="cmRate" min="0.75" max="2" step="0.25" value="${AUDIO.rate}"></label>
      <label>Voice<select id="cmVoice">${voices.map(v => `<option value="${v.voiceURI}" ${v.voiceURI===AUDIO.voiceURI?'selected':''}>${v.name}</option>`).join('')}</select></label>
    </div>
  `;
  const rate = document.getElementById('cmRate');
  if (rate) rate.addEventListener('input', () => {
    AUDIO.rate = parseFloat(rate.value);
    PROGRESS.settings.ttsRate = AUDIO.rate; saveProgress();
    renderCommuteOverlay();
    if (AUDIO.playing) speakNext();
  });
  const voiceSel = document.getElementById('cmVoice');
  if (voiceSel) voiceSel.addEventListener('change', () => {
    AUDIO.voiceURI = voiceSel.value;
    PROGRESS.audio.voiceURI = voiceSel.value; saveProgress();
    if (AUDIO.playing) speakNext();
  });
  updateCommuteProgress();
}

function renderCommuteSummary(){
  const panel = document.getElementById('modePanelStudy');
  if (!panel) return;
  const mins = Math.max(1, Math.round((Date.now() - AUDIO.sessionStart) / 60000));
  const totalTerms = CONTENT.concepts.length;
  const reviewedTotal = Object.keys(PROGRESS.audio.reviewed).length;
  const box = el(`<div class="commute-summary">
    <h3 style="margin-bottom:10px;">Session summary</h3>
    <div class="cs-stat"><b>${mins}</b>minutes listened</div>
    <div class="cs-stat"><b>${AUDIO.sessionSectionsRead.size}</b>sections marked read</div>
    <div class="cs-stat"><b>${AUDIO.sessionHeard.size}</b>terms heard this session</div>
    <div class="cs-stat"><b>${reviewedTotal}/${totalTerms}</b>terms reviewed overall</div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary small" data-action="startReviewRemaining">Review Remaining Terms →</button>
      <button class="btn small ghost" data-action="dismissCommuteSummary">Close</button>
    </div>
  </div>`);
  panel.insertBefore(box, panel.firstChild);
}

/* ---------------- Review Remaining Terms (drive unreviewed terms to 100%) ---------------- */
let REVIEW_REMAINING = { ids: [], idx: 0, revealed: false };
function startReviewRemainingFlow(){
  const remaining = CONTENT.concepts.filter(c => !PROGRESS.audio.reviewed[c.id]).map(c => c.id);
  REVIEW_REMAINING = { ids: remaining, idx: 0, revealed: false };
  renderReviewRemaining();
}
function renderReviewRemaining(){
  const panel = document.getElementById('modePanelStudy');
  if (!panel) return;
  const old = document.getElementById('reviewRemainingBox'); if (old) old.remove();
  const summary = document.querySelector('.commute-summary'); if (summary) summary.remove();
  const total = CONTENT.concepts.length;
  const reviewedCount = total - REVIEW_REMAINING.ids.length + REVIEW_REMAINING.idx;
  const pct = Math.round((reviewedCount / total) * 100);
  let inner;
  if (REVIEW_REMAINING.ids.length === 0){
    inner = `<h3>All terms reviewed — 100%! 🎉</h3><p>Every concept in your course has now been actively opened at least once.</p>
      <button class="btn small ghost" data-action="closeReviewRemaining">Close</button>`;
  } else {
    const cid = REVIEW_REMAINING.ids[REVIEW_REMAINING.idx];
    const c = CONTENT.concepts.find(x => x.id === cid);
    inner = `
      <div class="rr-bar"><div class="rr-bar-fill" style="width:${pct}%"></div></div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">${pct}% of all terms reviewed &middot; ${REVIEW_REMAINING.idx+1} of ${REVIEW_REMAINING.ids.length} remaining</p>
      <h3 style="margin-bottom:10px;">${c.term}</h3>
      ${REVIEW_REMAINING.revealed
        ? `<p style="font-size:14px;line-height:1.55;">${c.definition}</p>${c.bookDefinition?`<div class="book-quote" style="text-align:left;"><div class="bq-label">As written in your textbook</div><div class="bq-text">${c.bookDefinition}</div></div>`:''}`
        : `<button class="btn primary small" data-action="revealRemainingDef">Show Definition</button>`}
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        ${REVIEW_REMAINING.revealed ? `<button class="btn primary small" data-action="nextRemaining">Next Term →</button>` : `<button class="btn small ghost" data-action="skipRemaining">Skip for now</button>`}
        <button class="btn small ghost" data-action="closeReviewRemaining">Close</button>
      </div>`;
  }
  const box = el(`<div class="review-remaining" id="reviewRemainingBox">${inner}</div>`);
  panel.insertBefore(box, panel.firstChild);
}

async function initApp(){
  await loadState();
  renderShell();
}
initApp();

/* =========================================================
   TRACEABLE FORMULA NUMBERS: click a badge/number to flash
   every matching value (table cell + formula step) that
   shares the same data-src key, and jump to it.
   ===================================================================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-tbaction]');
  if (!el) return;
  var act = el.dataset.tbaction;
  if (act === 'flashSrc'){
    var scope = el.closest('.lo-section') || document;
    var key = el.dataset.src;
    if (!key) return;
    var matches = scope.querySelectorAll('[data-src="' + key + '"]');
    matches.forEach(function(m){
      m.classList.add('flash');
      setTimeout(function(){ m.classList.remove('flash'); }, 1300);
    });
    if (matches.length){ matches[0].scrollIntoView({behavior:'smooth', block:'center'}); }
  } else if (act === 'walkNext'){
    var list = document.getElementById(el.dataset.list);
    if (!list) return;
    var hidden = list.querySelector('li[hidden]');
    if (hidden){ hidden.hidden = false; }
    if (!list.querySelector('li[hidden]')){
      el.textContent = 'All steps revealed ✓';
      el.setAttribute('disabled', 'disabled');
    }
  }
});

</script>
