 now.", "why": "The chapter's whole constraint management framework (seven categories, five resolution steps) is built around identifying and systematically removing this.", "example": "A bakery that could sell more bread but is limited by having only one oven is constrained by a resource limitation.", "textbookExample": "The chapter lists seven categories of constraints: market, resource, material, financial, supplier, knowledge or competency, and policy.", "commonMistake": "Not every constraint needs an elaborate fix — the chapter's first step is literally to check whether it can easily be overcome before doing anything else.", "examQuestion": "Name the seven categories of constraints the chapter identifies, and give an example of one.", "bookDefinition": "“A constraint is something that limits the performance of a process or system in achieving its goals.”", "mnemonic": null}, {"id": "cost-volume-analysis", "term": "Cost–volume analysis", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "A technique focusing on relationships between cost, revenue, and volume of output, used to estimate an organization's income under different operating conditions.", "plain": "A way of mapping out how your costs and revenue change as you produce more or less, so you can compare different capacity options financially.", "why": "It's one of the chapter's named approaches for evaluating capacity alternatives from an economic standpoint, alongside financial analysis, decision theory, waiting-line analysis, and simulation.", "example": "Comparing a small facility (lower fixed costs, higher variable costs per unit) against a large facility (higher fixed costs, lower variable costs per unit) to see which wins at a given expected volume.", "textbookExample": "The chapter notes this technique is 'particularly useful as a tool for comparing capacity alternatives,' and that its use requires identifying all costs as either fixed or variable.", "commonMistake": "Don't assume variable cost PER UNIT changes with volume — the chapter's simplified model assumes it stays constant regardless of volume of output.", "examQuestion": "What two categories must every cost related to production be sorted into before cost-volume analysis can be used?", "bookDefinition": "“Cost–volume analysis focuses on relationships between cost, revenue, and volume of output.”", "mnemonic": null}, {"id": "fixed-costs", "term": "Fixed costs", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "Costs that tend to remain constant regardless of volume of output, such as rental costs, property taxes, equipment costs, and certain administrative costs.", "plain": "Bills you pay no matter how much or how little you produce.", "example": "Property taxes on a factory stay the same whether the factory runs at full output or sits half-idle.", "bookDefinition": "“Fixed costs tend to remain constant regardless of volume of output.”"}, {"id": "variable-costs", "term": "Variable costs", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "Costs that vary directly with volume of output, generally made up of materials costs and labor costs.", "plain": "Costs that go up and down directly with how much you actually produce.", "example": "The raw ingredients used in each loaf of bread — bake twice as many loaves, and that cost roughly doubles.", "bookDefinition": "“Variable costs vary directly with volume of output.”"}, {"id": "break-even-point", "term": "Break-even point (BEP)", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "The volume of output at which total cost and total revenue are equal; below it there is a loss, above it there is a profit.", "plain": "The exact number of units you need to sell before you stop losing money and start making a profit.", "why": "It's the central number cost-volume analysis is built to find, and the basis for formula 5-9 (QBEP).", "example": "A pie shop needs to sell 1,200 pies a month just to cover its costs — pie number 1,201 onward is where real profit starts.", "textbookExample": "The chapter notes the greater the deviation (in either direction) from the break-even point, the greater the resulting profit or loss.", "commonMistake": "The break-even point is a single quantity for a SPECIFIC cost structure — when fixed costs are step costs (jump at certain volumes), there can be multiple break-even points, one for each range.", "examQuestion": "What happens to profit when volume is exactly at the break-even point?", "bookDefinition": "“The volume at which total cost and total revenue are equal is the break-even point (BEP). When volume is less than the break-even point, there is a loss; when volume is greater than the break-even point, there is a profit.”", "formula": "Q_BEP = FC &divide; (R &minus; v)", "mnemonic": null}, {"id": "contribution-margin", "term": "Contribution margin", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "The difference between revenue per unit and variable cost per unit (R − v).", "plain": "How much money each additional unit sold actually contributes toward covering your fixed costs (and then profit).", "why": "It's the denominator in every one of the chapter's break-even and profit formulas — a bigger contribution margin means you break even faster.", "example": "If a pie sells for $7 and costs $2 in ingredients/labor to make, its contribution margin is $5 — that's how much of each sale goes toward paying off the oven lease.", "bookDefinition": "“The difference between revenue per unit and variable cost per unit, R − v, is known as the contribution margin.”", "formula": "Contribution margin = R &minus; v", "mnemonic": null}, {"id": "step-costs", "term": "Step costs", "tier": "supporting", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "Costs that increase stepwise as potential volume increases, rather than continuously.", "plain": "Costs that jump up in chunks at certain volume thresholds, instead of rising smoothly.", "example": "Fixed costs that jump from $9,600 to $15,000 the moment a second machine must be purchased to handle more volume.", "bookDefinition": "“Capacity alternatives may involve step costs, which are costs that increase stepwise as potential volume increases.”"}, {"id": "payback", "term": "Payback method", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "A financial analysis method that focuses on the length of time it will take for an investment to return its original cost.", "plain": "How many years (or months) until an investment has paid for itself.", "why": "It's the simplest of the three financial analysis methods the chapter names, though it ignores the time value of money.", "example": "A $2,000 machine that saves $500 a year pays for itself in 4 years.", "textbookExample": "The chapter notes payback's use is easier to rationalize for short-term paybacks than for long-term ones, since it ignores the time value of money.", "commonMistake": "Payback tells you WHEN you recoup your cost, not how profitable the investment is overall — it says nothing about cash flows after the payback period ends.", "examQuestion": "Why might payback be a poor way to compare two investments that both pay back in 4 years, but one keeps generating savings for 10 more years and the other stops immediately?", "bookDefinition": "“Payback is a crude but widely used method that focuses on the length of time it will take for an investment to return its original cost.”", "formula": "Payback time = Initial cost &divide; Annual savings", "mnemonic": null}, {"id": "present-value", "term": "Present value (PV)", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "A method that expresses, in current value, the sum of all future cash flows of an investment proposal.", "plain": "Converting a stream of future dollars into what they're really worth in today's dollars, accounting for interest and inflation.", "why": "Unlike payback, this method DOES account for the time value of money — a dollar next year is worth less than a dollar today.", "example": "Comparing two machines by converting both of their entire future cost/savings streams into a single, comparable value in today's dollars.", "bookDefinition": "“Present value expresses in current value the sum of all future cash flows of an investment proposal.”", "mnemonic": null}, {"id": "internal-rate-of-return", "term": "Internal rate of return (IRR)", "tier": "supporting", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "A method that summarizes the initial cost, expected annual cash flows, and estimated future salvage value of an investment proposal as a single equivalent interest rate.", "plain": "The single interest rate that, if you'd earned it instead, would have made your money grow exactly as much as this investment did.", "example": "Comparing two investment proposals by seeing which one has a higher IRR — similar to comparing two savings accounts by their interest rates.", "bookDefinition": "“The internal rate of return (IRR) summarizes the initial cost, expected annual cash flows, and estimated future salvage value of an investment proposal in an equivalent interest rate.”"}, {"id": "cash-flow", "term": "Cash flow", "tier": "supporting", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "The difference between the cash received from sales and other sources, and the cash outflow for labor, materials, overhead, and taxes.", "plain": "The actual money moving in and out of the business, as opposed to accounting profit on paper.", "example": "Selling an old piece of equipment counts as cash flowing IN, even though it isn't a sale of your normal product."}, {"id": "decision-theory", "term": "Decision theory", "tier": "supporting", "lo": "5.8", "chapterId": "ch5", "section": "5.11", "definition": "A tool for financial comparison of alternatives under conditions of risk or uncertainty, involving identifying possible future conditions, listing alternative actions, and developing a financial outcome for each combination.", "plain": "A structured way to compare your options when you genuinely don't know for sure what the future holds.", "why": "The chapter notes payback, present value, and IRR all assume a high degree of certainty about future cash flows — decision theory is what operations managers reach for when that certainty isn't there.", "bookDefinition": "“Decision theory is a helpful tool for financial comparison of alternatives under conditions of risk or uncertainty.”"}, {"id": "expand-early-strategy", "term": "Expand-early strategy", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.12", "definition": "A capacity expansion strategy that adds capacity before demand materializes.", "plain": "Build the extra capacity now, betting demand will show up to use it.", "why": "It's one of two named strategies for timing capacity expansion, directly paralleling the leading vs. following capacity strategies from earlier in the chapter.", "example": "A chipmaker building a new fabrication plant years before a hoped-for surge in demand, to grab economies of scale and lock out competitors.", "textbookExample": "The chapter notes the intent might be to achieve economies of scale, expand market share, or preempt competitors — but the risks are an oversupply that drives prices down, and underutilized equipment that raises unit costs.", "commonMistake": "Expanding early isn't automatically the 'aggressive, better' choice — it carries real, named risks (oversupply, underutilization) that the wait-and-see approach specifically avoids.", "examQuestion": "Name one potential benefit and one real risk of an expand-early strategy.", "bookDefinition": "“The expand-early strategy (i.e., before demand materializes). The intent might be to achieve economies of scale, to expand market share, or to preempt competitors from expanding.”", "mnemonic": null}, {"id": "wait-and-see-strategy", "term": "Wait-and-see strategy", "tier": "must_know", "lo": "5.8", "chapterId": "ch5", "section": "5.12", "definition": "A capacity expansion strategy that expands capacity only after demand materializes, perhaps incrementally.", "plain": "Hold off building more capacity until you can actually SEE the demand is really there.", "why": "It's the other half of the expand-early/wait-and-see pairing, trading risk of oversupply for risk of missing out.", "example": "A restaurant chain only opening a second location in a city once the first is consistently at capacity for months.", "textbookExample": "The chapter notes the advantages include a lower chance of oversupply and higher capacity utilization, but the key risks are loss of market share and an inability to meet demand if expansion requires a long lead time or demand rises unexpectedly.", "commonMistake": "Wait-and-see isn't automatically the 'safer' choice overall — it specifically trades oversupply risk for the risk of losing market share to faster-moving competitors.", "examQuestion": "What two specific risks does the chapter attach to a wait-and-see strategy?", "bookDefinition": "“The other approach is the wait-and-see strategy (i.e., to expand capacity only after demand materializes, perhaps incrementally).”", "mnemonic": null}, {"id": "capacity-disposal", "term": "Capacity disposal", "tier": "supporting", "lo": "5.8", "chapterId": "ch5", "section": "5.12", "definition": "Strategies for reducing capacity, which can result from the need to replace aging equipment, or from outsourcing and downsizing operations.", "plain": "Deciding how to responsibly get rid of capacity you no longer need.", "example": "Selling off manufacturing equipment after a product line is discontinued or outsourced to another company.", "bookDefinition": "“In cases where capacity contraction will be undertaken, capacity disposal strategies become important.”"}], "caseStudies": [{"id": "cs-amazon-strategy", "title": "Amazon's Multi-Strategy Playbook", "lo": "2.3", "tier": "helpful_example", "chapterId": "ch2", "summary": "Amazon runs low cost, quick/reliable delivery, and standout customer service all at once. When a New Jersey customer received a used workbook sold as 'like new,' the third-party merchant ignored her complaint — but Amazon refunded her immediately without even asking for the book back. Amazon treats service as both a customer-experience tool and a way to flag problem merchants: sellers with a defect rate above 1% of orders risk removal from the site.", "whyItMatters": "Shows that a company doesn't have to pick just one of the three basic strategies (low cost, responsiveness, differentiation) — Amazon blends all three, with service quality itself becoming a competitive weapon."}, {"id": "cs-boston-coach-strategy", "title": "Boston Market's Overexpansion vs. Coach's Reinvention", "lo": "2.3", "tier": "helpful_example", "chapterId": "ch2", "summary": "Boston Market dazzled investors in the 1990s, expanded too fast, nearly went bankrupt, and was absorbed by McDonald's in 2000 — a growth strategy that outran what the business could sustain. Coach took the opposite path: instead of one durable handbag per customer, it introduced totes, clutches, and overnight bags for different occasions, plus new colors and styles, successfully growing its market.", "whyItMatters": "A side-by-side case in strategy formulation: uncontrolled growth without matching capability can sink a company, while a deliberate strategic repositioning can revive one."}, {"id": "cs-dutch-tomatoes", "title": "Dutch Tomato Growers' Productivity Edge", "lo": "2.6", "tier": "helpful_example", "chapterId": "ch2", "summary": "Dutch tomato growers achieve roughly ten times the yield per square yard of growers in Italy and Greece. Computerized, climate-controlled greenhouses (with a 'soil' spun from basalt and chalk) let them grow tomatoes year-round, an engineered variety holds up to shipping at peak ripeness, and an integrated Dutch trading company matches supply directly to supermarket demand across Europe.", "whyItMatters": "A concrete illustration that productivity gaps often come from technology and supply chain coordination, not just labor effort or hours worked."}, {"id": "cs-stryker-productivity", "title": "Stryker Howmedica's Productivity Turnaround", "lo": "2.7", "tier": "helpful_example", "chapterId": "ch2", "summary": "Stryker Howmedica redesigned a device-packaging line using a Toyota-style one-piece-flow approach, nearly doubling output from 36 to 60 devices per hour while cutting standard cost by 10%. The gain came from rethinking the whole process (a systems-viewpoint fix), not from simply pushing workers to move faster.", "whyItMatters": "Directly illustrates the systems viewpoint and the methods factor in productivity improvement — real gains often come from redesigning the process, not adding effort."}, {"id": "cs-kraft-sustainability", "title": "Kraft's Packaging Redesign", "lo": "4.8", "tier": "helpful_example", "chapterId": "ch4", "summary": "Slimmer pizza cartons let Kraft ship two extra boxes per case and 14% more pizzas per pallet, saving about 1.4 million pounds of packaging a year. A 30%-thinner paperboard package for Oscar Mayer Deli Creations cut 1.2 million pounds of packaging annually, and a salad-dressing bottle using 19% less plastic saved 3 million pounds a year while boosting transportation efficiency by 18%.", "whyItMatters": "Shows that the 'Reduce' part of the three Rs isn't just an environmental checkbox — it produced real, quantifiable cost and efficiency savings."}, {"id": "cs-wegmans", "title": "Wegmans Food Markets Operations Tour", "lo": "1.6", "tier": "helpful_example", "chapterId": "ch1", "summary": "Wegmans operates 100,000-square-foot superstores with 25–35 checkout lanes, sourcing local produce directly from farms to cut inventory costs and reduce bruising. A shift from in-store meat cutting to centralized processing and vacuum packaging extended shelf life and reduced staffing needs. Full-time turnover is about 6%, versus a 20% industry average, credited partly to $8,000 average training investment per new employee.", "whyItMatters": "A single running example touching nearly every operations topic — forecasting, capacity, location, inventory, quality, scheduling — in one real company."}, {"id": "cs-dell-forecast", "title": "Focus Forecasting and the Chrysler Minivan", "lo": "3.16", "tier": "helpful_example", "chapterId": "ch3", "summary": "The Chrysler minivan's demand vastly exceeded its original forecast. Building capacity to meet that unforeseen demand from day one would have been reckless given the risk the product could have flopped instead — the value of good demand-forecasting technology was in helping the company add capacity responsively once real demand became clear.", "whyItMatters": "Illustrates why forecasts, even when wrong, still add value by supporting a coordinated, responsive reaction rather than a guess made in either direction."}, {"id": "cs-lilacs", "title": "Rochester's Lilac Festival and Trend Extrapolation", "lo": "3.13", "tier": "helpful_example", "chapterId": "ch3", "summary": "Highland Park's lilacs have trended toward earlier blooming over the years, likely tied to warming temperatures. Even with a clear linear trend in the data, park employees can't rely on the trend line alone — a single unusually warm or cold stretch of weather can shift the actual bloom date and festival timing that year.", "whyItMatters": "A caution about trend lines: a real historical trend doesn't guarantee next year's single data point will land on it, especially when short-term random factors (weather) can dominate."}, {"id": "cs-hospital-outsourcing", "title": "Case: Outsourcing of Hospital Services", "lo": "5.5", "tier": "helpful_example", "chapterId": "ch5", "summary": "The chapter's end-of-chapter case (page 225) examines a hospital weighing which services to keep in-house versus outsource. The in-house-vs-outsource factors from Section 5.8 — available capacity, expertise, quality considerations, nature of demand, cost, and risk — are the framework for working through this case.", "whyItMatters": "Applies the chapter's outsourcing decision factors to a real, structured business scenario rather than a single textbook example."}, {"id": "cs-claudia-capacity", "title": "OM Is Personal: Choosing the Right Approach to Capacity", "lo": "5.1", "tier": "helpful_example", "chapterId": "ch5", "summary": "Claudia, operations manager for a company that builds factories and industrial facilities, sits on an upper-level management committee struggling to decide the best strategy for when to invest in building more capacity — illustrating the real, high-stakes tension between a wait-and-see strategy and an expand-early strategy.", "whyItMatters": "A running example tying together capacity strategy (leading vs. following), demand forecasting, and the real financial risk of guessing wrong in either direction."}], "quiz": [{"id": "q1", "type": "multiple_choice", "lo": "2.1", "difficulty": "medium", "chapterId": "ch2", "concept": "competitiveness", "prompt": "Businesses primarily compete through some combination of price, delivery time, and:", "options": ["Differentiation", "Headcount", "Stock price", "Office location"], "correctIndex": 0, "explanation": "Competitiveness is framed as some mix of price, delivery time, and product/service differentiation."}, {"id": "q2", "type": "multiple_choice", "lo": "2.2", "difficulty": "medium", "chapterId": "ch2", "concept": "competitiveness", "prompt": "Which of these is a commonly cited reason organizations fail?", "options": ["Too much emphasis on long-term R&D", "Overemphasis on short-term financial performance at the expense of R&D", "Excessive investment in employee training", "Too much communication between departments"], "correctIndex": 1, "explanation": "Over-focusing on short-term financial performance at the expense of R&D is a key failure mode; the other options are the opposite of real failure causes."}, {"id": "q3", "type": "multiple_choice", "lo": "2.3", "difficulty": "medium", "chapterId": "ch2", "concept": "swot-analysis", "prompt": "In a SWOT analysis, which pair is externally focused and typically assessed by marketing?", "options": ["Strengths and Weaknesses", "Opportunities and Threats", "Strengths and Opportunities", "Weaknesses and Threats"], "correctIndex": 1, "explanation": "Opportunities and Threats look outward and are typically assessed by marketing; Strengths and Weaknesses are internal and assessed by operations."}, {"id": "q4", "type": "multiple_choice", "lo": "2.3", "difficulty": "hard", "chapterId": "ch2", "concept": "order-winner", "prompt": "A characteristic that makes a company's offering perceived as better than competitors' is called a(n):", "options": ["Order qualifier", "Order winner", "Core competency", "Environmental scan"], "correctIndex": 1, "explanation": "Order winners tip the purchase decision in the company's favor, unlike order qualifiers, which are just the minimum bar to be considered."}, {"id": "q5", "type": "multiple_choice", "lo": "2.4", "difficulty": "medium", "chapterId": "ch2", "concept": "organizational-strategy", "prompt": "What is the key difference between strategic, tactical, and operational decisions?", "options": ["Time frame", "Number of people involved", "Which country they apply to", "Whether marketing or finance owns them"], "correctIndex": 0, "explanation": "The main differentiator is time horizon: strategic decisions are long-term, operational decisions are short-term and highly detailed."}, {"id": "q6", "type": "multiple_choice", "lo": "2.5", "difficulty": "medium", "chapterId": "ch2", "concept": "time-based-strategy", "prompt": "What is the main rationale behind a time-based strategy?", "options": ["Reducing time generally lowers cost, raises quality, and improves customer service", "Reducing time always increases defects", "Time-based strategy only applies to manufacturing", "Speed has no relationship to cost"], "correctIndex": 0, "explanation": "Cutting time from planning, design, production, or delivery tends to lower costs, raise productivity and quality, and improve service all at once."}, {"id": "q7", "type": "multiple_choice", "lo": "2.6", "difficulty": "hard", "chapterId": "ch2", "concept": "productivity-growth", "prompt": "Productivity rose from 80 to 84. What is the productivity growth rate?", "options": ["4%", "5%", "80%", "84%"], "correctIndex": 1, "explanation": "(84 − 80)/80 × 100 = 5%."}, {"id": "q8", "type": "multiple_choice", "lo": "2.6", "difficulty": "medium", "chapterId": "ch2", "concept": "multifactor-productivity", "prompt": "Which productivity measure combines more than one input, like labor and machine time together?", "options": ["Partial productivity", "Multifactor productivity", "Total productivity", "Process yield"], "correctIndex": 1, "explanation": "Multifactor productivity combines two or more (but not necessarily all) inputs, e.g. Output/(Labor+Machine)."}, {"id": "q9", "type": "multiple_choice", "lo": "2.7", "difficulty": "medium", "chapterId": "ch2", "concept": "efficiency", "prompt": "Which of these is NOT one of the five categories of factors that affect productivity?", "options": ["Methods", "Capital", "Quality", "Advertising budget"], "correctIndex": 3, "explanation": "Advertising budget isn't one of the five — the categories are Methods, Capital, Quality, Technology, and Management."}, {"id": "q10", "type": "multiple_choice", "lo": "2.7", "difficulty": "hard", "chapterId": "ch2", "concept": "efficiency", "prompt": "What is the key difference between efficiency and productivity?", "options": ["They mean the same thing", "Efficiency is about best use of a fixed set of resources; productivity is broader, covering overall resource effectiveness", "Efficiency only applies to services", "Productivity is a purely financial metric"], "correctIndex": 1, "explanation": "Efficiency optimizes within a fixed set of resources; productivity is the broader question of whether those are even the right resources to use."}, {"id": "q11", "type": "true_false", "lo": "2.3", "difficulty": "medium", "chapterId": "ch2", "concept": "order-winner", "prompt": "Order winners can never turn into order qualifiers over time.", "correctAnswer": false, "explanation": "False — the chapter is explicit that a characteristic can decay from an order winner into a mere order qualifier as competitors catch up."}, {"id": "q12", "type": "fill_blank", "lo": "2.6", "difficulty": "easy", "chapterId": "ch2", "concept": "productivity", "prompt": "Productivity = Output ÷ ______.", "correctAnswer": "input", "acceptableAnswers": ["input", "Input"], "explanation": "Productivity is the ratio of output to the input used to produce it."}, {"id": "q13", "type": "matching", "lo": "2.4", "difficulty": "hard", "chapterId": "ch2", "concept": "organizational-strategy", "prompt": "Match each planning level to what it relates to.", "pairs": [{"left": "Strategic", "right": "Product design, location, technology, new facilities"}, {"left": "Tactical", "right": "Employment levels, equipment selection, facility layout"}, {"left": "Operational", "right": "Scheduling, output-rate adjustments, inventory, purchasing"}], "explanation": "Table 2.3 maps each planning level to its typical decisions, moving from broad/long-term (strategic) to narrow/short-term (operational)."}, {"id": "q14", "type": "scenario", "lo": "2.7", "difficulty": "exam", "chapterId": "ch2", "concept": "efficiency", "prompt": "A bakery raises output 10% but doubles its overtime costs to do it. This is best described as:", "options": ["Effective but not efficient", "Efficient but not effective", "Both effective and efficient", "Neither effective nor efficient"], "correctIndex": 0, "explanation": "The goal (higher output) was met, so it's effective — but the ballooning overtime cost means it wasn't achieved efficiently."}, {"id": "q15", "type": "two_truths_trap", "lo": "2.3", "difficulty": "exam", "chapterId": "ch2", "concept": "swot-analysis", "prompt": "Which statement about SWOT analysis is INCORRECT?", "options": ["Strengths and Weaknesses are internal and typically assessed by operations.", "Opportunities and Threats are external and typically assessed by marketing.", "All four SWOT quadrants are typically assessed by finance."], "correctIndex": 2, "explanation": "Finance isn't the typical owner of any SWOT quadrant in the chapter's framework — operations handles S/W, marketing handles O/T."}, {"id": "q16", "type": "multiple_choice", "lo": "4.1", "difficulty": "medium", "chapterId": "ch4", "concept": "product-service-design", "prompt": "Many operations failures can be traced back to:", "options": ["Faulty design", "Excessive marketing spend", "Overly conservative pricing", "Too much cross-functional collaboration"], "correctIndex": 0, "explanation": "Designs that are poorly thought out, incorrectly implemented, or unclear can directly cause product/service failures, recalls, and even lawsuits."}, {"id": "q17", "type": "multiple_choice", "lo": "4.4", "difficulty": "medium", "chapterId": "ch4", "concept": "product-service-design", "prompt": "Which of these is NOT one of the categories of change that typically triggers redesign?", "options": ["Economic", "Technological", "Astrological", "Competitive"], "correctIndex": 2, "explanation": "The real drivers are economic, social/demographic, political/legal, competitive, cost/availability, technological, and environmental changes."}, {"id": "q18", "type": "multiple_choice", "lo": "4.5", "difficulty": "medium", "chapterId": "ch4", "concept": "reverse-engineering", "prompt": "Buying a competitor's product, taking it apart, and studying it for improvement ideas is called:", "options": ["Value analysis", "Reverse engineering", "Concurrent engineering", "Benchmarking"], "correctIndex": 1, "explanation": "This process is reverse engineering — legal in most cases, though some forms run afoul of the Digital Millennium Copyright Act."}, {"id": "q19", "type": "multiple_choice", "lo": "4.8", "difficulty": "medium", "chapterId": "ch4", "concept": "remanufacturing", "prompt": "A remanufactured product typically sells for about what percentage of the cost of a new one?", "options": ["10%", "50%", "90%", "It costs more than new"], "correctIndex": 1, "explanation": "Remanufactured products can typically be sold for about 50% of the cost of a new product."}, {"id": "q20", "type": "multiple_choice", "lo": "4.9", "difficulty": "hard", "chapterId": "ch4", "concept": "standardization", "prompt": "What is a major disadvantage of standardization?", "options": ["It increases training costs", "It can freeze a design with imperfections still in it, and reduce consumer appeal", "It makes purchasing and inventory less routine", "It always increases unit costs"], "correctIndex": 1, "explanation": "Standardization can freeze an imperfect design in place and reduce variety, which can hurt appeal to customers who want more choice."}, {"id": "q21", "type": "multiple_choice", "lo": "4.9", "difficulty": "medium", "chapterId": "ch4", "concept": "mass-customization", "prompt": "Producing an almost-finished item and waiting until the customer's preference is known before completing it is called:", "options": ["Modular design", "Delayed differentiation", "Concurrent engineering", "Value analysis"], "correctIndex": 1, "explanation": "This postponement tactic is delayed differentiation — one of the two main tactics behind mass customization."}, {"id": "q22", "type": "multiple_choice", "lo": "4.9", "difficulty": "hard", "chapterId": "ch4", "concept": "kano-model", "prompt": "In the Kano model, which category causes dissatisfaction if missing, but does NOT increase satisfaction if present?", "options": ["Excitement quality", "Performance quality", "Basic quality", "Robust quality"], "correctIndex": 2, "explanation": "Basic quality features cause dissatisfaction when absent or too low, but adding more beyond the expected baseline doesn't increase satisfaction."}, {"id": "q23", "type": "multiple_choice", "lo": "4.9", "difficulty": "exam", "chapterId": "ch4", "concept": "reliability", "prompt": "The optimal level of reliability is generally the point where:", "options": ["Cost is minimized regardless of benefit", "Incremental benefit equals incremental cost", "Reliability reaches 100%", "Customer complaints reach zero"], "correctIndex": 1, "explanation": "Reliability improvements get progressively more expensive, so the optimal level is where incremental benefit equals incremental cost."}, {"id": "q24", "type": "multiple_choice", "lo": "4.10", "difficulty": "medium", "chapterId": "ch4", "concept": "concurrent-engineering", "prompt": "What core question does the feasibility analysis phase of product development answer?", "options": ["Does it fit with the mission?", "What color should it be?", "Who will manufacture it overseas?", "How should it be advertised?"], "correctIndex": 0, "explanation": "Feasibility analysis combines market, economic, and technical analysis to answer whether the product fits the organization's mission."}, {"id": "q25", "type": "multiple_choice", "lo": "4.11", "difficulty": "medium", "chapterId": "ch4", "concept": "service-design", "prompt": "What are the two key issues in service design?", "options": ["Price and location", "Degree of variation in service requirements and degree of customer contact/involvement", "Number of employees and building size", "Advertising budget and market share"], "correctIndex": 1, "explanation": "These two factors determine how standardized or customized a service delivery system needs to be."}, {"id": "q26", "type": "true_false", "lo": "4.8", "difficulty": "medium", "chapterId": "ch4", "concept": "remanufacturing", "prompt": "Remanufactured products typically sell for about 90% of the cost of a new product.", "correctAnswer": false, "explanation": "False — remanufactured products typically sell for about 50% of the cost of a new product, not 90%."}, {"id": "q27", "type": "fill_blank", "lo": "4.8", "difficulty": "easy", "chapterId": "ch4", "concept": "recycling", "prompt": "The three Rs are Reduce, Reuse, and ______.", "correctAnswer": "recycle", "acceptableAnswers": ["recycle", "Recycle"], "explanation": "The three Rs framing cost and environmental reduction are Reduce, Reuse, and Recycle."}, {"id": "q28", "type": "matching", "lo": "4.9", "difficulty": "hard", "chapterId": "ch4", "concept": "kano-model", "prompt": "Match each Kano quality category to its effect on customer satisfaction.", "pairs": [{"left": "Basic quality", "right": "Causes dissatisfaction if missing; no extra satisfaction if present"}, {"left": "Performance quality", "right": "Satisfaction scales directly with how well it's delivered"}, {"left": "Excitement quality", "right": "Delights precisely because it was unexpected"}], "explanation": "The Kano model's three categories affect satisfaction in structurally different ways — this is the chapter's key distinction to test."}, {"id": "q29", "type": "scenario", "lo": "4.10", "difficulty": "exam", "chapterId": "ch4", "concept": "concurrent-engineering", "prompt": "A design team ships a hit product on time, but manufacturing struggled with a late, disconnected handoff, causing costly rework. What would most directly have prevented this?", "options": ["Concurrent engineering", "Value analysis", "Reverse engineering", "Quality function deployment"], "correctIndex": 0, "explanation": "Concurrent engineering brings design and manufacturing together early to avoid exactly this kind of costly, conflict-prone 'over-the-wall' handoff."}, {"id": "q30", "type": "two_truths_trap", "lo": "4.8", "difficulty": "exam", "chapterId": "ch4", "concept": "recycling", "prompt": "Which statement about the three Rs is INCORRECT?", "options": ["Reduce relates to value analysis.", "Reuse relates to remanufacturing.", "Recycle means exactly the same thing as remanufacturing."], "correctIndex": 2, "explanation": "Recycling and remanufacturing are distinct: remanufacturing refurbishes and resells the same product, while recycling breaks materials down for reuse elsewhere."}, {"id": "q1c1", "type": "multiple_choice", "lo": "1.1", "difficulty": "easy", "chapterId": "ch1", "concept": "operations-management", "prompt": "Operations management is best defined as:", "options": ["The management of systems or processes that create goods and/or provide services", "The management of a company's advertising budget", "The process of hiring and training new employees", "The management of a company's stock price"], "correctIndex": 0, "explanation": "This is the textbook's core definition — operations management covers the systems/processes behind both goods and services."}, {"id": "q2c1", "type": "multiple_choice", "lo": "1.4", "difficulty": "medium", "chapterId": "ch1", "concept": "functional-areas", "prompt": "Which of these is NOT one of the three basic functional areas of a business organization, per the chapter?", "options": ["Finance", "Marketing", "Operations", "Human Resources"], "correctIndex": 3, "explanation": "The three basic functional areas are finance, marketing, and operations. HR is a supporting function, not one of the three primary areas."}, {"id": "q3c1", "type": "multiple_choice", "lo": "1.8", "difficulty": "medium", "chapterId": "ch1", "concept": "scientific-management", "prompt": "Who is referred to as the \"father of scientific management\"?", "options": ["Henry Ford", "Frederick Winslow Taylor", "Adam Smith", "Eli Whitney"], "correctIndex": 1, "explanation": "Frederick Winslow Taylor pioneered scientific management, based on observation, measurement, and analysis of work methods."}, {"id": "q4c1", "type": "multiple_choice", "lo": "1.8", "difficulty": "medium", "chapterId": "ch1", "concept": "interchangeable-parts", "prompt": "The concept of interchangeable parts is most often attributed to:", "options": ["Henry Ford", "Frank Gilbreth", "Eli Whitney", "Elton Mayo"], "correctIndex": 2, "explanation": "Eli Whitney applied interchangeable parts to musket assembly in the late 1700s; Ford later used the same concept for automobiles."}, {"id": "q5c1", "type": "true_false", "lo": "1.8", "difficulty": "medium", "chapterId": "ch1", "concept": "division-of-labor", "prompt": "Division of labor was an idea originally introduced by Henry Ford.", "correctAnswer": false, "explanation": "False — Adam Smith wrote about division of labor in The Wealth of Nations (1776); Ford applied the concept on his assembly line."}, {"id": "q6c1", "type": "multiple_choice", "lo": "1.5", "difficulty": "hard", "chapterId": "ch1", "concept": "four-sources-of-variation", "prompt": "Which of these is NOT one of the four sources of variation described in the chapter?", "options": ["Variety of goods/services offered", "Structural variation in demand", "Random variation", "Managerial variation"], "correctIndex": 3, "explanation": "The four sources are variety, structural, random, and assignable variation — \"managerial variation\" is not one of them."}, {"id": "q7c1", "type": "fill_blank", "lo": "1.7", "difficulty": "medium", "chapterId": "ch1", "concept": "pareto-phenomenon", "prompt": "The ______ phenomenon states that a relatively few issues or items are very important, and addressing them has a disproportionately large impact.", "correctAnswer": "pareto", "acceptableAnswers": ["pareto", "Pareto"], "explanation": "This is the Pareto phenomenon, described as one of the most pervasive concepts in operations management."}, {"id": "q8c1", "type": "multiple_choice", "lo": "1.9", "difficulty": "medium", "chapterId": "ch1", "concept": "lean-production", "prompt": "Compared to mass production, lean production systems use:", "options": ["Much more space, inventory, and workers for the same output", "Much less space, inventory, and workers for comparable output", "The exact same amount of every resource", "More unskilled labor and less worker involvement"], "correctIndex": 1, "explanation": "Lean systems are named for using much less of certain resources — space, inventory, workers — to produce a comparable amount of output."}, {"id": "q9c1", "type": "scenario", "lo": "1.9", "difficulty": "exam", "chapterId": "ch1", "concept": "sustainability-om", "prompt": "A shoe company redesigns its packaging to use 65% less cardboard and projects cutting 10,000 tons of CO2 emissions per year. This best illustrates:", "options": ["Sustainability / a \"green initiative\"", "Scientific management", "The human relations movement", "Division of labor"], "correctIndex": 0, "explanation": "This mirrors the chapter's Puma \"Clever Little Bag\" example — a green initiative reducing environmental impact through redesign."}, {"id": "q10c1", "type": "multiple_choice", "lo": "1.10", "difficulty": "medium", "chapterId": "ch1", "concept": "five-ethical-principles", "prompt": "\"Equal pay for equal work\" is the chapter's example of which ethical principle?", "options": ["The Utilitarian Principle", "The Fairness Principle", "The Common Good Principle", "The Virtue Principle"], "correctIndex": 1, "explanation": "The Fairness Principle holds that equals should be evaluated by the same standards — equal pay for equal work is the chapter's exact example."}, {"id": "q1c3", "type": "multiple_choice", "lo": "3.6", "difficulty": "medium", "chapterId": "ch3", "concept": "naive-forecast", "prompt": "The last two values in a trending time series were 50 and 53. Using the naive method, what is the forecast for the next period?", "options": ["50", "53", "56", "103"], "correctIndex": 2, "explanation": "For trend data, the naive forecast adds the last change (+3) to the last value: 53 + 3 = 56."}, {"id": "q2c3", "type": "multiple_choice", "lo": "3.7", "difficulty": "medium", "chapterId": "ch3", "concept": "moving-average", "prompt": "Given demand of 43, 40, and 41 in the three most recent periods, what is the 3-period moving average forecast?", "options": ["41.33", "124.00", "41.00", "42.50"], "correctIndex": 0, "explanation": "(43 + 40 + 41) ÷ 3 = 41.33."}, {"id": "q3c3", "type": "multiple_choice", "lo": "3.8", "difficulty": "hard", "chapterId": "ch3", "concept": "weighted-moving-average", "prompt": "Using weights .40 (most recent), .30, .20, .10 (oldest) on demand of 41, 40, 43, 40 (most recent to oldest), what is the weighted average forecast?", "options": ["41.0", "40.2", "40.0", "41.5"], "correctIndex": 0, "explanation": "F = .40(41) + .30(40) + .20(43) + .10(40) = 16.4 + 12.0 + 8.6 + 4.0 = 41.0, matching the textbook's Example 2 result."}, {"id": "q4c3", "type": "multiple_choice", "lo": "3.9", "difficulty": "medium", "chapterId": "ch3", "concept": "exponential-smoothing", "prompt": "Previous forecast was 42, actual demand was 40, and α = .10. What is the new exponential smoothing forecast?", "options": ["41.8", "40.2", "42.0", "41.0"], "correctIndex": 0, "explanation": "F = 42 + .10(40 − 42) = 42 − 0.2 = 41.8."}, {"id": "q5c3", "type": "multiple_choice", "lo": "3.10", "difficulty": "medium", "chapterId": "ch3", "concept": "trend-equation", "prompt": "Given the trend equation F(t) = 45 + 5t, what is the forecast at t = 10?", "options": ["50", "95", "55", "450"], "correctIndex": 1, "explanation": "F(10) = 45 + 5(10) = 45 + 50 = 95."}, {"id": "q6c3", "type": "true_false", "lo": "3.9", "difficulty": "medium", "chapterId": "ch3", "concept": "exponential-smoothing", "prompt": "A smoothing constant (α) close to 1.00 produces heavier smoothing and slower responsiveness than an α close to 0.", "correctAnswer": false, "explanation": "False — it's the reverse. An α close to 0 means slower responsiveness and greater smoothing; an α close to 1.00 means greater responsiveness and less smoothing."}, {"id": "q7c3", "type": "fill_blank", "lo": "3.10", "difficulty": "easy", "chapterId": "ch3", "concept": "forecast-error", "prompt": "Forecast error is calculated as Actual minus ______.", "correctAnswer": "forecast", "acceptableAnswers": ["forecast", "Forecast"], "explanation": "Error = Actual − Forecast. A positive error means the forecast was too low; a negative error means it was too high."}, {"id": "q8c3", "type": "multiple_choice", "lo": "3.13", "difficulty": "medium", "chapterId": "ch3", "concept": "correlation-coefficient", "prompt": "A correlation coefficient of r = −.966 between unemployment and new house sales indicates:", "options": ["A strong positive relationship — both rise together", "A strong negative relationship — as one rises, the other falls", "No meaningful relationship at all", "That house sales cause unemployment"], "correctIndex": 1, "explanation": "A correlation near −1.00 indicates a strong negative (inverse) relationship — higher unemployment is associated with lower house sales."}, {"id": "q9c3", "type": "multiple_choice", "lo": "3.14", "difficulty": "hard", "chapterId": "ch3", "concept": "mse", "prompt": "Compared to MAD, MSE:", "options": ["Weights all errors evenly", "Gives disproportionately more weight to larger errors", "Expresses error as a percentage", "Ignores the sign of the error entirely, same as MAD"], "correctIndex": 1, "explanation": "MSE squares each error before averaging, so larger errors are penalized much more heavily than under MAD, which weights all errors evenly (in absolute terms)."}, {"id": "q10c3", "type": "scenario", "lo": "3.15", "difficulty": "exam", "chapterId": "ch3", "concept": "control-chart", "prompt": "If MSE = 16 and z = 2, what are the upper and lower control limits for forecast errors?", "options": ["+8.0 and −8.0", "+4.0 and −4.0", "+32.0 and −32.0", "+2.0 and −2.0"], "correctIndex": 1, "explanation": "s = √16 = 4.0. UCL = 0 + 2(4.0) = +4.0; LCL = 0 − 2(4.0) = −4.0."}, {"id": "q11c3", "type": "two_truths_trap", "lo": "3.15", "difficulty": "exam", "chapterId": "ch3", "concept": "tracking-signal", "prompt": "Which statement about the tracking signal is INCORRECT?", "options": ["It relates cumulative forecast error to MAD.", "Common acceptable limits are around ±4 or ±5.", "It is generally considered superior to the control chart approach for detecting nonrandom errors."], "correctIndex": 2, "explanation": "It's the reverse: the chapter states the control chart approach is generally SUPERIOR to the tracking signal, since cumulative errors in a tracking signal can hide problems that a control chart catches."}, {"id": "q12c3", "type": "matching", "lo": "3.14", "difficulty": "hard", "chapterId": "ch3", "concept": "mape", "prompt": "Match each accuracy measure to how it treats forecast errors.", "pairs": [{"left": "MAD", "right": "Weights every error evenly (absolute value)"}, {"left": "MSE", "right": "Squares errors, penalizing large misses more"}, {"left": "MAPE", "right": "Expresses each error as a percentage of that period's actual value"}], "explanation": "MAD, MSE, and MAPE differ specifically in how they weight the size of each individual error before averaging."}, {"id": "q1c5", "type": "multiple_choice", "lo": "5.1", "difficulty": "easy", "chapterId": "ch5", "concept": "capacity", "prompt": "Capacity is best defined as:", "options": ["An upper limit or ceiling on the load an operating unit can handle", "The total revenue a facility generates in a year", "The number of employees working at a facility", "The physical square footage of a facility"], "correctIndex": 0, "explanation": "Capacity refers to an upper limit or ceiling on the load that an operating unit (a plant, department, machine, store, or worker) can handle."}, {"id": "q2c5", "type": "multiple_choice", "lo": "5.1", "difficulty": "medium", "chapterId": "ch5", "concept": "undercapacity", "prompt": "Which of the following are the THREE key questions in capacity planning?", "options": ["What kind of capacity is needed? How much is needed? When is it needed?", "How much will it cost? Who will manage it? Where is it located?", "What is the demand forecast? What is the budget? What is the timeline?", "Is it feasible? Is it profitable? Is it sustainable?"], "correctIndex": 0, "explanation": "The chapter names exactly these three: what kind of capacity (capability) is needed, how much is needed to match demand, and when it is needed."}, {"id": "q3c5", "type": "multiple_choice", "lo": "5.3", "difficulty": "medium", "chapterId": "ch5", "concept": "capacity-efficiency", "prompt": "A vehicle repair department has a design capacity of 50 trucks/day, effective capacity of 40 trucks/day, and actual output of 36 trucks/day. What is its efficiency?", "options": ["72%", "90%", "80%", "36%"], "correctIndex": 1, "explanation": "Efficiency = Actual output ÷ Effective capacity × 100% = 36 ÷ 40 × 100% = 90%."}, {"id": "q4c5", "type": "multiple_choice", "lo": "5.3", "difficulty": "medium", "chapterId": "ch5", "concept": "capacity-utilization", "prompt": "Using the same data (design capacity 50, effective capacity 40, actual output 36 trucks/day), what is the utilization?", "options": ["90%", "72%", "80%", "100%"], "correctIndex": 1, "explanation": "Utilization = Actual output ÷ Design capacity × 100% = 36 ÷ 50 × 100% = 72%."}, {"id": "q5c5", "type": "true_false", "lo": "5.3", "difficulty": "medium", "chapterId": "ch5", "concept": "design-capacity", "prompt": "Effective capacity is always greater than or equal to design capacity.", "correctAnswer": false, "explanation": "False — it's the reverse. Effective capacity is design capacity minus allowances (maintenance, breaks, changeovers), so it is always LESS than design capacity."}, {"id": "q6c5", "type": "multiple_choice", "lo": "5.5", "difficulty": "medium", "chapterId": "ch5", "concept": "leading-capacity-strategy", "prompt": "A company builds a new factory wing well before expected demand actually arrives, because construction takes two years. This best illustrates a:", "options": ["Following strategy", "Tracking strategy", "Leading strategy", "Lagging strategy"], "correctIndex": 2, "explanation": "A leading capacity strategy builds capacity in anticipation of future demand increases — the chapter notes this is especially appropriate when capacity increases involve a long lead time."}, {"id": "q7c5", "type": "fill_blank", "lo": "5.5", "difficulty": "medium", "chapterId": "ch5", "concept": "capacity-cushion", "prompt": "Capacity cushion = Capacity minus ______.", "correctAnswer": "expected demand", "acceptableAnswers": ["expected demand", "demand"], "explanation": "Capacity cushion is the amount of capacity held in excess of expected demand to account for uncertainty."}, {"id": "q8c5", "type": "scenario", "lo": "5.6", "difficulty": "exam", "chapterId": "ch5", "concept": "bottleneck-operation", "prompt": "Four operations each with a capacity of 10 units/hour feed into a fifth operation that can process only 30 units/hour. What is the system's actual output?", "options": ["40 units/hour", "30 units/hour", "10 units/hour", "25 units/hour"], "correctIndex": 1, "explanation": "The fifth operation is the bottleneck. Even though 40 units/hour arrive from the four upstream operations combined, the system's output is capped at the bottleneck's own capacity: 30 units/hour."}, {"id": "q9c5", "type": "multiple_choice", "lo": "5.6", "difficulty": "medium", "chapterId": "ch5", "concept": "economies-of-scale", "prompt": "Economies of scale refers to:", "options": ["Average unit costs decreasing as output rises toward the optimal operating level", "Average unit costs always decreasing no matter how much output rises", "Total costs always staying flat regardless of volume", "Average unit costs rising as output increases"], "correctIndex": 0, "explanation": "Economies of scale specifically describes the decrease in average unit cost as output rises UP TO the optimal operating level; beyond that point, diseconomies of scale take over instead."}, {"id": "q10c5", "type": "multiple_choice", "lo": "5.7", "difficulty": "medium", "chapterId": "ch5", "concept": "constraint", "prompt": "A company has unreliable suppliers with long lead times. Per the chapter's seven categories, this is best classified as a:", "options": ["Market constraint", "Resource constraint", "Supplier constraint", "Policy constraint"], "correctIndex": 2, "explanation": "The supplier category covers exactly this: unreliable suppliers, long lead time, or substandard quality."}, {"id": "q11c5", "type": "multiple_choice", "lo": "5.8", "difficulty": "medium", "chapterId": "ch5", "concept": "cost-volume-analysis", "prompt": "If fixed costs are $20,000 and total variable cost at a given volume is $30,000, what is total cost?", "options": ["$10,000", "$50,000", "$20,000", "$30,000"], "correctIndex": 1, "explanation": "TC = FC + VC = $20,000 + $30,000 = $50,000."}, {"id": "q12c5", "type": "two_truths_trap", "lo": "5.8", "difficulty": "exam", "chapterId": "ch5", "concept": "variable-costs", "prompt": "Which statement about fixed and variable costs is INCORRECT?", "options": ["Fixed costs tend to remain constant regardless of volume of output.", "Variable costs vary directly with volume of output.", "In this chapter's simplified cost-volume model, variable cost PER UNIT changes significantly as volume changes."], "correctIndex": 2, "explanation": "The chapter's simplified cost-volume model explicitly assumes variable cost per unit remains the SAME regardless of volume of output — only the TOTAL variable cost changes with volume."}], "rawSections": {"2.2": "2.2 COMPETITIVENESS\n\nCompanies must be competitive to sell their goods and services in the marketplace. Competitiveness is an important factor in determining whether a company prospers, barely gets by, or fails. Business organizations compete through some combination of price, delivery time, and product or service differentiation.\n\nOperations has a major influence on competitiveness through product and service design, cost, location, quality, response time, flexibility, inventory and supply chain management, and service. Quality refers to materials, workmanship, design, and service. Consumers judge quality in terms of how well they think a product or service will satisfy its intended purpose. Customers are generally willing to pay more for a product or service if they perceive that the product or service has a higher quality than a competitor's.\n\nWhy Some Organizations Fail: Neglecting operations strategy. Failing to take advantage of strengths and opportunities, and/or failing to recognize competitive threats. Putting too much emphasis on short-term financial performance at the expense of research and development. Placing too much emphasis on product and service design and not enough on process design and improvement. Neglecting investments in capital and human resources. Failing to establish good internal communications and cooperation among different functional areas. Failing to consider customer wants and needs based on historical and other data.\n\nThe key to successfully competing is to determine what customers want and then directing efforts toward meeting (or even exceeding) customer expectations.", "2.3": "2.3 MISSION AND STRATEGIES\n\nAn organization's mission is the reason for its existence. It is expressed in a mission statement. For a business organization, the mission statement should answer the question \"What business are we in?\" A mission statement serves as the basis for organizational goals, which provide more detail and describe the scope of the mission. Goals serve as a foundation for the development of organizational strategies.\n\nThere are three basic business strategies: Low cost. Responsiveness. Differentiation from competitors.\n\nStrategy formulation takes into account the way organizations compete and a particular organization's assessment of its own strengths and weaknesses in order to take advantage of its core competencies—those special attributes or abilities possessed by an organization that give it a competitive edge.\n\nStrengths and weaknesses have an internal focus and are typically evaluated by operations people. Threats and opportunities have an external focus and are typically evaluated by marketing people. SWOT is often regarded as the link between organizational strategy and operations strategy. An alternative to SWOT analysis is Michael Porter's five forces model, which takes into account the threat of new competition, the threat of substitute products or services, the bargaining power of customers, the bargaining power of suppliers, and the intensity of competition.\n\nOrder qualifiers are those characteristics that potential customers perceive as minimum standards of acceptability for a product to be considered for purchase. Order winners are those characteristics of an organization's goods or services that cause them to be perceived as better than the competition.", "2.4": "2.4 OPERATIONS STRATEGY\n\nThe organization strategy provides the overall direction for the organization. It is broad in scope, covering the entire organization. Operations strategy is narrower in scope, dealing primarily with the operations aspect of the organization.\n\nFor operations strategy to be truly effective, it is important to link it to organization strategy. In the 1970s and early 1980s, operations strategy in the United States was often neglected in favor of marketing and financial strategies. Meanwhile, foreign competitors began to fill the resulting vacuum with a careful focus on operations strategy.\n\nTraditional strategies of business organizations have tended to emphasize cost minimization or product differentiation. While not abandoning those strategies, many organizations have embraced strategies based on quality and/or time. Time-based strategies focus on reducing the time required to accomplish various activities. The rationale is that by reducing time, costs are generally less, productivity is higher, quality tends to be higher, product innovations appear on the market sooner, and customer service is improved.\n\nAgile operations is a strategic approach for competitive advantage that emphasizes the use of flexibility to adapt and prosper in an environment of change.", "2.5": "2.5 IMPLICATIONS OF ORGANIZATION STRATEGY FOR OPERATIONS MANAGEMENT\n\nOrganization strategy has a major impact on operations and supply chain management strategies. Organizations that use a low-cost, high-volume strategy limit the amount of variety offered to customers, so variations for operations and the supply chain are minimal. Conversely, a strategy to offer a wide variety of products or services creates substantial operational and supply chain variations, making the matching of supply to demand more difficult. Increasing service reduces the ability to compete on price.", "2.6": "2.6 TRANSFORMING STRATEGY INTO ACTION: THE BALANCED SCORECARD\n\nThe Balanced Scorecard (BSC) is a top-down management system that organizations can use to clarify their vision and strategy and transform them into action. It was introduced in the early 1990s by Robert Kaplan and David Norton. The idea was to move away from a purely financial perspective of the organization and integrate other perspectives such as customers, internal business processes, and learning and growth.\n\nAlthough the BSC helps focus managers' attention on strategic issues and the implementation of strategy, it is important to note that it has no role in strategy formulation. This approach pays little attention to suppliers and government regulations, and community, environmental, and sustainability issues are missing.", "2.7": "2.7 PRODUCTIVITY\n\nOne of the primary responsibilities of a manager is to achieve productive use of an organization's resources. Productivity is an index that measures output (goods and services) relative to the input (labor, materials, energy, and other resources) used to produce it. It is usually expressed as the ratio of output to input: Productivity = Output / Input.\n\nProductivity measures can be based on a single input (partial productivity), on more than one input (multifactor productivity), or on all inputs (total productivity). Partial measures are often of greatest use in operations management.\n\nA commonly held misconception is that workers are the main determinant of productivity. However, many productivity gains in the past have come from other sources, such as technological improvements. Factors that affect productivity can be categorized as: Methods, Capital, Quality, Technology, Management.\n\nDon't confuse productivity with efficiency. Efficiency is a narrower concept that pertains to getting the most out of a fixed set of resources; productivity is a broader concept that pertains to effective use of overall resources.", "4.1": "4.1 INTRODUCTION TO PRODUCT AND SERVICE DESIGN\n\nThe primary focus of product and service design should be customer satisfaction. Product and service design involves or affects nearly every functional area of an organization. However, marketing and operations have major involvement.\n\nKey Questions: Is there demand for it? Can we do it (manufacturability for products, serviceability for services)? What level of quality is appropriate? Does it make sense from an economic standpoint?\n\nReasons for Product and Service Design (or Redesign): the main forces that initiate design or redesign are market opportunities and threats, which can stem from economic, social and demographic, political/liability/legal, competitive, cost/availability, technological, and environmental changes.", "4.2": "4.2 IDEA GENERATION\n\nIdeas for new or redesigned products or services can come from a variety of sources, including customers, the supply chain, competitors, employees, and research. Some companies purchase a competitor's product and then carefully dismantle and inspect it, searching for ways to improve their own product. This process is called reverse engineering. However, some forms of reverse engineering are illegal under the Digital Millennium Copyright Act.\n\nResearch and development (R&D) refers to organized efforts that are directed toward increasing scientific knowledge and product or process innovation. R&D efforts may involve basic research, applied research, or development. IBM spends about $6 billion a year on R&D, and Hewlett-Packard Enterprises spends about $2 billion a year.", "4.3": "4.3 LEGAL AND ETHICAL CONSIDERATIONS\n\nDesigners must be careful to take into account a wide array of legal and ethical considerations. Product liability is the responsibility of a manufacturer for injuries or damages caused by a faulty product because of poor design or manufacturing. Manufacturers are faced with the implied warranties created by state laws under the Uniform Commercial Code, which says that products carry an implication of merchantability and fitness.\n\nOne example of what can happen is \"vaporware,\" when a software company doesn't issue a release of software as scheduled because it is struggling with production problems or bugs in the software.", "4.4": "4.4 HUMAN FACTORS\n\nHuman-factor issues arise in the design of consumer products. Safety and liability are two critical issues that designers must consider. \"Creeping featurism\" is particularly evident in electronic products such as handheld devices that continue to offer new features, and more complexity, even while they are shrinking in size. The result may be low consumer ratings in terms of \"ease of use.\"", "4.5": "4.5 CULTURAL FACTORS\n\nProduct designers in companies that operate globally must take into account the cultures of the countries or regions in which the product is sold. To be successful around the globe, McDonald's has regionalized its menu items to conform to local culinary preferences, laws, and religious traditions — for example, green tea ice cream in China, kale soup in Portugal, and poutine in Canada.", "4.6": "4.6 GLOBAL PRODUCT AND SERVICE DESIGN\n\nOrganizations that operate globally are discovering advantages in global product design, which uses the combined efforts of a team of designers who work in different countries and even on different continents. These virtual teams can engage the best human resources from around the world and operate on a 24-hour basis, decreasing time to market. However, care must be taken in managing the diversity, because if it is mismanaged, it can lead to conflicts and miscommunications.", "4.7": "4.7 ENVIRONMENTAL FACTORS: SUSTAINABILITY\n\nCradle-to-grave assessment, also known as life cycle analysis, is the assessment of the environmental impact of a product or service throughout its useful life. The goal of cradle-to-grave assessment is to choose products and services that have the least environmental impact, while still taking into account economic considerations. The procedures of cradle-to-grave assessment are part of the ISO 14000 environmental management standards.\n\nDesigners reflect on three particular aspects of saving on costs and reducing environmental impact: reducing the use of materials through value analysis; refurbishing and then reselling returned goods deemed to have additional useful life, called remanufacturing; and reclaiming parts of unusable products for recycling. Remanufactured products can be sold for about 50 percent of the cost of a new product.", "4.8": "4.8 OTHER DESIGN CONSIDERATIONS\n\nMost products and services go through a series of phases over their useful life: introduction, growth, maturity, and decline. Standardization refers to the extent to which there is absence of variety in a product, service, or process. Mass customization is a strategy of producing standardized goods or services, but incorporating some degree of customization in the final product or service, achieved through delayed differentiation and modular design.\n\nReliability is a measure of the ability of a product, a part, a service, or an entire system to perform its intended function under a prescribed set of conditions. Robust design means a product or service will function as designed over a broad range of conditions. Genichi Taguchi's approach involves parameter design: determining specification settings that will result in robust design.\n\nQuality function deployment (QFD) is a structured approach for integrating the \"voice of the customer\" into both the product and service development process, using a \"house of quality\" matrix. The Kano model, developed by Dr. Noriaki Kano, employs three definitions of quality: basic, performance, and excitement.", "4.9": "4.9 PHASES IN PRODUCT DESIGN AND DEVELOPMENT\n\nProduct design and development generally proceed in a series of phases: (1) Feasibility analysis — market, economic, and technical analysis; does it fit with the mission? (2) Product specifications. (3) Process specifications. (4) Prototype development. (5) Design review. (6) Market test. (7) Product introduction. (8) Follow-up evaluation.", "4.10": "4.10 DESIGNING FOR PRODUCTION\n\nTo achieve a smoother transition from product design to production, many companies are using concurrent engineering — bringing design and manufacturing engineering people together early in the design phase, rather than the traditional \"over-the-wall\" approach. Computer-aided design (CAD) uses computer graphics for product design; a rough estimate is that CAD increases the productivity of designers from 3 to 10 times.\n\nThe term design for manufacturing (DFM) is used to indicate the designing of products that are compatible with an organization's capabilities. A related concept, design for assembly (DFA), focuses on reducing the number of parts in an assembly. Component commonality means using a part in multiple products, saving design time and enabling bulk purchasing.", "4.11": "4.11 SERVICE DESIGN\n\nUnlike manufacturing, where production and delivery are usually separated in time, services are usually created and delivered simultaneously. Two key issues in service design are the degree of variation in service requirements and the degree of customer contact and customer involvement in the delivery system. The lower the degree of customer contact and service requirement variability, the more standardized the service can be.\n\nWell-designed service systems have a number of characteristics: being consistent with the organization's mission, being user-friendly, being robust, being easy to sustain, being cost-effective, having value that is obvious to customers, having effective linkages between back-of-the-house and front-of-the-house operations, having a single unifying theme, and having design features that ensure reliable, high-quality service.\n\nA service blueprint is a method for describing and analyzing a service process, showing customer actions, direct-contact service people, backstage contacts, and support operations.", "4.12": "4.12 DESIGN STRATEGY\n\nProduct and service design is a fertile area for achieving competitive advantage. Potential sources of such benefits include: packaging products and ancillary services to increase sales; using multiple-use platforms; implementing tactics that achieve high volume while satisfying customer needs for variety; continually monitoring products and services for small improvements rather than the \"big bang\" approach; and shortening the time it takes to get new or redesigned goods and services to market. Companies using a \"first-to-market\" approach are able to enter markets ahead of their competitors, allowing them to set higher selling prices.", "1.1": "1.1 INTRODUCTION TO OPERATIONS AND SUPPLY CHAIN MANAGEMENT\n\nOperations is that part of a business organization that is responsible for producing goods and/or services. Business organizations have three basic functional areas: finance, marketing, and operations. If a business organization were a car, operations would be its engine — the core of what the organization does. Operations management is the management of systems or processes that create goods and/or provide services.\n\nA supply chain is the sequence of organizations — their facilities, functions, and activities — that are involved in producing and delivering a product or service. Supply chain management is the management of the sequence of internal and external facilities, functions, and activities involved in producing and delivering a product or service.\n\nThe essence of the operations function is to add value during the transformation process. Value-added is the difference between the cost of inputs and the value or price of outputs.", "1.2": "1.2 PRODUCTION OF GOODS VERSUS PROVIDING SERVICES\n\nProduction of goods results in a tangible output. Delivery of service generally implies an act. Key points of comparison include degree of customer contact, labor content of jobs, uniformity of inputs, and measurement of productivity — all of which tend to be more challenging for services than for goods. Because there are relatively few pure goods or pure services, companies usually sell product packages, a combination of goods and services.", "1.3": "1.3 WHY LEARN ABOUT OPERATIONS MANAGEMENT? / 1.4 CAREER OPPORTUNITIES\n\nOperations and sales are the two line (primary) functions in a business organization. All other functions — accounting, finance, marketing, IT — support these two. Finance, marketing, and operations must interface on product and process design, forecasting, setting realistic schedules, and quality decisions.", "1.5": "1.5 PROCESS MANAGEMENT\n\nA process consists of one or more actions that transform inputs into outputs. There are three categories of business processes: upper-management processes, operational processes, and supporting processes. Two basic aspects of process management are managing a process to meet demand and dealing with process variability. There are four basic sources of variation: the variety of goods or services offered, structural variation in demand, random variation, and assignable variation.", "1.6": "1.6 THE SCOPE OF OPERATIONS MANAGEMENT\n\nOperations management people are involved in product and service design, process selection, technology, work systems, location planning, facilities planning, and quality improvement. System design involves decisions on capacity, location, layout, and equipment — typically long-term, strategic decisions. System operation involves personnel management, inventory planning, scheduling, and quality assurance — generally tactical and operational decisions.", "1.7": "1.7 OPERATIONS MANAGEMENT AND DECISION MAKING\n\nA model is an abstraction of reality, a simplified representation of something, classified as physical, schematic, or mathematical. Managers use trade-off analysis, performance metrics, and analytics (descriptive, diagnostic, predictive, prescriptive) in decision making. A systems perspective emphasizes that the whole is greater than the sum of its parts. The Pareto phenomenon holds that a relatively few issues or items are very important, so dealing with those factors will generally have a disproportionately large impact on results.", "1.8": "1.8 THE HISTORICAL EVOLUTION OF OPERATIONS MANAGEMENT\n\nThe Industrial Revolution began in the 1770s in England. Craft production (highly skilled workers, custom-fitted parts) had major shortcomings including slow, costly production and no economies of scale. Frederick Winslow Taylor, the father of scientific management, believed in a science of management based on observation, measurement, analysis, and economic incentives. Henry Ford introduced mass production, built on interchangeable parts (Eli Whitney) and division of labor (Adam Smith). The human relations movement, including Elton Mayo's Hawthorne studies, emphasized the importance of the human element in job design.", "1.9": "1.9 OPERATIONS TODAY\n\nE-business, technology (product/service, process, and information technology), globalization, and new tariffs have shaped modern operations management. Agility refers to the ability of an organization to respond quickly to demands or opportunities. Lean production emphasizes quality, flexibility, time reduction, and teamwork, using much less of certain resources — space, inventory, and workers — than typical mass production systems.", "1.10": "1.10 KEY ISSUES FOR TODAY'S BUSINESS OPERATIONS\n\nKey issues include economic conditions, innovation, quality problems, risk management, cybersecurity, and competing in a global economy. Sustainability refers to service and production processes that use resources in ways that do not harm ecological systems supporting current and future human existence. The Markula Center for Applied Ethics identifies five principles: Utilitarian, Rights, Fairness, Common Good, and Virtue. Supply chain management is receiving increasing attention as organizations face mounting pressure to improve management of their supply chains, given increasing outsourcing, globalization, and e-business.", "3.1": "3.1 INTRODUCTION TO FORECASTING\n\nA forecast is an estimate about the future value of a variable such as demand. Forecasts are made with reference to a specific time horizon and affect decisions and activities throughout an organization — accounting, finance, human resources, marketing, MIS, and operations. Despite its use of data and sophisticated models, forecasting is not an exact science; it requires a skillful blending of science and intuition.", "3.2": "3.2 FEATURES COMMON TO ALL FORECASTS\n\nForecasting techniques generally assume the same underlying causal system that existed in the past will continue into the future. Forecasts are not perfect; forecasts for groups of items tend to be more accurate than forecasts for individual items; and forecast accuracy decreases as the time horizon increases. A manager cannot simply delegate forecasting to models and forget about it, because unplanned occurrences can wreak havoc with forecasts.", "3.3": "3.3 ELEMENTS OF A GOOD FORECAST\n\nA properly prepared forecast should be timely, accurate (with the degree of accuracy stated), reliable, expressed in meaningful units, in writing, simple to understand and use, and cost-effective.", "3.4": "3.4 FORECASTING AND THE SUPPLY CHAIN / 3.5 STEPS IN THE FORECASTING PROCESS\n\nSubstantially inaccurate forecasts can lead to shortages and excesses throughout the supply chain. There are six basic steps in the forecasting process: determine the purpose, establish a time horizon, obtain/clean/analyze data, select a technique, make the forecast, and monitor forecast errors.", "3.5": "3.6 APPROACHES TO FORECASTING / 3.7 QUALITATIVE FORECASTS\n\nThere are two general approaches: qualitative (subjective inputs) and quantitative (time-series or associative). Qualitative techniques include executive opinions, salesforce opinions, consumer surveys, and expert opinions such as the Delphi method — an iterative process using anonymous circulated questionnaires to build a consensus forecast, useful for long-term technological forecasting.", "3.6": "3.8 FORECASTS BASED ON TIME-SERIES DATA (Naive Methods)\n\nA time series is a time-ordered sequence of observations. Patterns include trend, seasonality, cycles, irregular variations, and random variations. A naive forecast uses a single previous value of a time series as the basis of a forecast: for a stable series, the last data point becomes the next forecast; for trend, the forecast equals the last value plus or minus the last observed change.", "3.7": "TECHNIQUES FOR AVERAGING: MOVING AVERAGE\n\nA moving average (MA) forecast uses a number of the most recent actual data values in generating a forecast. As each new actual value becomes available, the forecast is updated by adding the newest value and dropping the oldest, then recomputing the average. Fewer data points make the average more responsive; more data points make it smoother but slower to react.", "3.8": "WEIGHTED MOVING AVERAGE\n\nA weighted average is similar to a moving average, except it assigns more weight to the most recent values. Weights must sum to 1.00, with the heaviest weight assigned to the most recent value. The choice of weights is somewhat arbitrary, generally requiring trial and error.", "3.9": "EXPONENTIAL SMOOTHING\n\nException smoothing is a sophisticated weighted averaging method: each new forecast equals the previous forecast plus a smoothing constant (alpha) times the previous forecast error. Commonly used alpha values range from .05 to .50 — low values for a stable average, higher values when the average is more susceptible to change.", "3.10": "TECHNIQUES FOR TREND (Trend Equation and Trend-Adjusted Smoothing)\n\nA linear trend equation has the form Ft = a + bt, where a is the y-intercept and b is the slope. Trend-adjusted exponential smoothing (double smoothing) is used when a series exhibits a linear trend, since simple exponential smoothing alone will always lag the trend.", "3.11": "TECHNIQUES FOR SEASONALITY\n\nSeasonal variations are regularly repeating upward or downward movements tied to recurring events. The multiplicative model, more widely used in practice than the additive model, expresses seasonality as a percentage (seasonal relative) of the average or trend amount. Seasonal relatives are used to deseasonalize data (divide by the relative) or to incorporate seasonality into a trend forecast (multiply by the relative).", "3.12": "3.9 ASSOCIATIVE FORECASTING TECHNIQUES (Simple Linear Regression) / 3.10 FORECAST ACCURACY / 3.11 MONITORING FORECAST ERROR / 3.12 CHOOSING A FORECASTING TECHNIQUE\n\nAssociative techniques rely on identifying related variables to predict the variable of interest, most commonly through simple linear regression (yc = a + bx), which minimizes the sum of squared vertical deviations from the line. Forecast accuracy is commonly summarized using MAD, MSE, a
