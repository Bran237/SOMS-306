h><th>= Deseasonalized</th></tr><tr><td>1</td><td>1</td><td><span class=\"src-badge b-x\" data-tbaction=\"flashSrc\" data-src=\"X\">X</span> 158.4</td><td><span class=\"src-badge b-y\" data-tbaction=\"flashSrc\" data-src=\"Y\">Y</span> 1.20</td><td>132.0</td></tr><tr><td>2</td><td>2</td><td>153.0</td><td>1.1</td><td>139.1</td></tr><tr><td>3</td><td>3</td><td>110.0</td><td>0.75</td><td>146.7</td></tr><tr><td>4</td><td>4</td><td>146.3</td><td>0.95</td><td>154.0</td></tr><tr><td>5</td><td>1</td><td>192.0</td><td>1.2</td><td>160.0</td></tr><tr><td>6</td><td>2</td><td>187.0</td><td>1.1</td><td>170.0</td></tr><tr><td>7</td><td>3</td><td>132.0</td><td>0.75</td><td>176.0</td></tr><tr><td>8</td><td>4</td><td>173.8</td><td>0.95</td><td>182.9</td></tr></table><p>Reading this table: each row is one quarter’s actual sales. Dividing sales by that quarter’s seasonal relative strips out the predictable seasonal swing, revealing the underlying deseasonalized trend (rising steadily from 132.0 up to 182.9 across two years).</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Deseasonalizing a Value</div><div class=\"fc-main\">Deseasonalized Value = Actual Value &divide; Seasonal Relative</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Actual value</span>&nbsp;=&nbsp;158.4, Period 1's real sales</span><span class=\"fc-var-chip\"><span class=\"sym\">Seasonal relative</span>&nbsp;=&nbsp;1.20 for a first-quarter period</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-season-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-season-1\"><li>Divide the actual value by the seasonal relative: <span class=\"src-badge b-x\" data-tbaction=\"flashSrc\" data-src=\"X\">X</span>158.4 &divide; <span class=\"src-badge b-y\" data-tbaction=\"flashSrc\" data-src=\"Y\">Y</span>1.20.</li></ol><div class=\"fc-answer\">Deseasonalized sales = 132.0</div></div><p>To go the other direction — adding seasonality INTO a trend forecast — multiply instead of divide:</p><details class=\"source-box\"><summary>EXAMPLE 4 continued &mdash; Adding Seasonality Back Into a Trend Forecast</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td>Trend equation</td><td>F(t) = 124 + 7.5t</td></tr><tr><td>Period 9 is which quarter?</td><td>Quarter 1</td></tr><tr><td>Q1 seasonal relative</td><td><span class=\"src-badge b-r\" data-tbaction=\"flashSrc\" data-src=\"R\">R</span> 1.2</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Forecasting Period 9 With Trend + Seasonality</div><div class=\"fc-main\">Seasonal Forecast = Trend Estimate &times; Seasonal Relative</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Trend estimate</span>&nbsp;=&nbsp;from the trend equation F(t) = 124 + 7.5t</span><span class=\"fc-var-chip\"><span class=\"sym\">Seasonal relative</span>&nbsp;=&nbsp;1.20 for a first-quarter period</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-season-2\">Show next step →</button><ol class=\"fc-steps\" id=\"w-season-2\"><li>Compute the trend estimate for period 9: 124 + 7.5(9) = <strong>191.5</strong>.</li><li hidden>Multiply by the Q1 seasonal relative: 191.5 &times; <span class=\"src-badge b-r\" data-tbaction=\"flashSrc\" data-src=\"R\">R</span>1.20.</li></ol><div class=\"fc-answer\">Seasonally adjusted forecast for Period 9 = 229.8</div></div><p><strong>Divide to remove a season, multiply to add one back in.</strong></p><p>Where do seasonal relatives like 1.20 actually come from in the first place? The textbook’s Example 5 shows the full computation:</p><details class=\"source-box\"><summary>EXAMPLE 5 &mdash; Computing Seasonal Relatives (Call Center Volume, 21 Days)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Day</th><td>Tues</td><td>Wed</td><td>Thurs</td><td>Fri</td><td>Sat</td><td>Sun</td><td>Mon</td></tr><tr><th>Week 1 Volume</th><td>67</td><td>75</td><td>82</td><td>98</td><td>90</td><td>36</td><td>55</td></tr><tr><th>Week 2 Volume</th><td>60</td><td>73</td><td>85</td><td>99</td><td>86</td><td>40</td><td>52</td></tr><tr><th>Week 3 Volume</th><td>64</td><td>76</td><td>87</td><td>96</td><td>88</td><td>44</td><td>50</td></tr><tr><th>Resulting Index</th><td><strong>0.87</strong></td><td><strong>1.05</strong></td><td><strong>1.20</strong></td><td><strong>1.37</strong></td><td><strong>1.24</strong></td><td><strong>0.53</strong></td><td><strong>0.75</strong></td></tr></table><p>Reading this table: the manager tracked call volume for the 9&ndash;10am hour over 3 full weeks. Averaging each day-of-week’s volume across all 3 weeks (using a centered moving average to also account for any trend) produces the seasonal index in the bottom row — for example, Friday runs 37% ABOVE the daily average (index 1.37), while Sunday runs 47% below it (index 0.53).</p></div></details><p>To <span class=\"term\" data-cid=\"deseasonalize\">deseasonalize</span> data means to remove the seasonal component so the underlying trend is visible — exactly what the division step above accomplishes.</p>"}], "3.13": [{"heading": "Simple linear regression", "html": "<p><span class=\"term\" data-cid=\"simple-linear-regression\">Simple linear regression</span> is an associative technique: instead of projecting a variable’s own past values, it predicts one variable (yc) from a related predictor variable (x), fitting the line that minimizes squared vertical deviations (least squares).</p><details class=\"source-box\"><summary>EXAMPLE 7 &mdash; Healthy Hamburgers Sales vs. Profit (12 Stores)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Store</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td></tr><tr><th>Sales, x ($M)</th><td>7</td><td>2</td><td>6</td><td>4</td><td>14</td><td>15</td><td>16</td><td>12</td><td>14</td><td>20</td><td>15</td><td>7</td></tr><tr><th>Profit, y ($M)</th><td>0.15</td><td>0.1</td><td>0.13</td><td>0.15</td><td>0.25</td><td>0.27</td><td>0.24</td><td>0.2</td><td>0.27</td><td>0.44</td><td>0.34</td><td>0.17</td></tr></table><p>Reading this table: each column is one of the 12 Healthy Hamburgers stores. Sales (x) is the INDEPENDENT/predictor variable; profit (y) is the DEPENDENT variable we’re trying to predict. Plotting all 12 (x,y) points and checking that they roughly follow a straight line is the first step before trusting a regression line at all.</p><table class=\"src-table\" style=\"margin-top:10px;\"><tr><th>Fitted regression line</th><th>Value</th></tr><tr><td>Intercept, a</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 0.0506</td></tr><tr><td>Slope, b</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 0.0159</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Predicting Profit from Sales</div><div class=\"fc-main\">yc = a + bx</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">yc</span>&nbsp;=&nbsp;predicted profit</span><span class=\"fc-var-chip\"><span class=\"sym\">a</span>&nbsp;=&nbsp;the fitted intercept</span><span class=\"fc-var-chip\"><span class=\"sym\">b</span>&nbsp;=&nbsp;the fitted slope</span><span class=\"fc-var-chip\"><span class=\"sym\">x</span>&nbsp;=&nbsp;sales, in millions of dollars</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-regr-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-regr-1\"><li>Multiply the slope by x: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>0.0159 &times; 10 = <strong>0.159</strong>.</li><li hidden>Add the intercept: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>0.0506 + 0.159.</li></ol><div class=\"fc-answer\">Predicted profit = 0.2099 (about $209,900) &mdash; don't extrapolate far outside the $2–$20M sales range the line was built from</div></div>"}, {"heading": "Correlation and the standard error of estimate", "html": "<p>The <span class=\"term\" data-cid=\"correlation-coefficient\">correlation coefficient (r)</span> ranges from &minus;1.00 to +1.00 and measures the strength/direction of a linear relationship. Its square, <span class=\"term\" data-cid=\"coefficient-of-determination\">r&sup2;</span>, tells you what percentage of the variation in y is explained by x.</p><details class=\"source-box\"><summary>EXAMPLE 8 &mdash; New House Sales vs. 3-Month-Lagged Unemployment</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td></tr><tr><th>Units sold, y</th><td>20</td><td>41</td><td>17</td><td>35</td><td>25</td><td>31</td><td>38</td><td>50</td><td>15</td><td>19</td><td>14</td></tr><tr><th>Unemployment %, x (3-mo lag)</th><td>7.2</td><td>4.0</td><td>7.3</td><td>5.5</td><td>6.8</td><td>6.0</td><td>5.4</td><td>3.6</td><td>8.4</td><td>7.0</td><td>9.0</td></tr></table><p>Reading this table: unemployment (x) is measured 3 months BEFORE the matching house-sales period (y), because the book is testing whether unemployment LEADS house sales by a quarter. Notice that when unemployment is high (period 9: 8.4%), house sales are low (15 units) &mdash; an inverse relationship.</p></div></details><p>Running this data through the correlation formula gives r = &minus;.966 &mdash; a strong negative correlation, meaning higher unemployment three months earlier is strongly associated with lower house sales.</p><p>The <span class=\"term\" data-cid=\"standard-error-of-estimate\">standard error of estimate</span> measures how tightly the data scatters around the regression line, using the same Healthy Hamburgers data from above:</p><details class=\"source-box\"><summary>EXAMPLE 7 continued &mdash; Standard Error of Estimate</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td>Sum of squared errors, &Sigma;(y&minus;yc)&sup2;</td><td><span class=\"src-badge b-s\" data-tbaction=\"flashSrc\" data-src=\"S\">S</span> 0.01659</td></tr><tr><td>Number of stores, n</td><td><span class=\"src-badge b-n\" data-tbaction=\"flashSrc\" data-src=\"N\">N</span> 12</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Standard Error of Estimate</div><div class=\"fc-main\">Se = &radic;[ &Sigma;(y &minus; yc)&sup2; &divide; (n &minus; 2) ]</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">&Sigma;(y-yc)&sup2;</span>&nbsp;=&nbsp;the sum of all squared errors between actual and predicted profit</span><span class=\"fc-var-chip\"><span class=\"sym\">n</span>&nbsp;=&nbsp;the number of data points (12 stores)</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-se-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-se-1\"><li>Subtract 2 from n: <span class=\"src-badge b-n\" data-tbaction=\"flashSrc\" data-src=\"N\">N</span>12 &minus; 2 = <strong>10</strong>.</li><li hidden>Divide the summed squared errors by that: <span class=\"src-badge b-s\" data-tbaction=\"flashSrc\" data-src=\"S\">S</span>.01659 &divide; 10 = <strong>.001659</strong>.</li><li hidden>Take the square root: &radic;.001659.</li></ol><div class=\"fc-answer\">Standard error of estimate = .0407 million</div></div><p>A valid indicator variable needs a logical explanation for the relationship, correct timing (it must lead the variable of interest with enough lead time to act on), and a fairly high correlation — all three hold for the unemployment/house-sales example above.</p>"}], "3.14": [{"heading": "MAD, MSE, and MAPE: summarizing forecast accuracy", "html": "<p><span class=\"term\" data-cid=\"mad\">MAD</span> weights every error evenly. <span class=\"term\" data-cid=\"mse\">MSE</span> squares errors first, so it punishes large misses much harder. <span class=\"term\" data-cid=\"mape\">MAPE</span> expresses each error as a percentage of that period’s actual value, essential when comparing forecasts of very different scale.</p><details class=\"source-box\"><summary>EXAMPLE 9 &mdash; Computing MAD, MSE, and MAPE (Accounts Serviced)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr><tr><th>Actual (A)</th><td>217</td><td>213</td><td>216</td><td>210</td><td>213</td><td>219</td><td>216</td><td>212</td></tr><tr><th>Forecast (F)</th><td>215</td><td>216</td><td>215</td><td>214</td><td>211</td><td>214</td><td>217</td><td>216</td></tr><tr><th>Error (A&minus;F)</th><td>+2</td><td>-3</td><td>+1</td><td>-4</td><td>+2</td><td>+5</td><td>-1</td><td>-4</td></tr><tr><th>|Error|</th><td>2</td><td>3</td><td>1</td><td>4</td><td>2</td><td>5</td><td>1</td><td>4</td></tr><tr><th>Error&sup2;</th><td>4</td><td>9</td><td>1</td><td>16</td><td>4</td><td>25</td><td>1</td><td>16</td></tr><tr><th>(|Error| &divide; Actual) &times; 100</th><td>0.92%</td><td>1.41%</td><td>0.46%</td><td>1.90%</td><td>0.94%</td><td>2.28%</td><td>0.46%</td><td>1.89%</td></tr></table><p>Reading this table: MAD uses the <strong>|Error|</strong> row, MSE uses the <strong>Error&sup2;</strong> row, and MAPE uses the <strong>percent-error</strong> row — all three measures are built from this exact same 8-period table, they just weight the errors differently.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Mean Absolute Deviation (MAD)</div><div class=\"fc-main\">MAD = &Sigma;|Actual &minus; Forecast| &divide; n</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">&Sigma;|e|</span>&nbsp;=&nbsp;sum of the |Error| row above</span><span class=\"fc-var-chip\"><span class=\"sym\">n</span>&nbsp;=&nbsp;number of periods (8)</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-mad-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-mad-1\"><li>Add up all 8 values in the |Error| row: 2+3+1+4+2+5+1+4 = <strong>22</strong>.</li><li hidden>Divide by n = 8: 22 &divide; 8.</li></ol><div class=\"fc-answer\">MAD = 2.75</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Mean Squared Error (MSE)</div><div class=\"fc-main\">MSE = &Sigma;(Actual &minus; Forecast)&sup2; &divide; (n &minus; 1)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">&Sigma;e&sup2;</span>&nbsp;=&nbsp;sum of the Error&sup2; row above</span><span class=\"fc-var-chip\"><span class=\"sym\">n &minus; 1</span>&nbsp;=&nbsp;one less than the number of periods (7)</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-mse-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-mse-1\"><li>Add up all 8 values in the Error&sup2; row: 4+9+1+16+4+25+1+16 = <strong>76</strong>.</li><li hidden>Divide by (n&minus;1) = 7: 76 &divide; 7.</li></ol><div class=\"fc-answer\">MSE = 10.86</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Mean Absolute Percent Error (MAPE)</div><div class=\"fc-main\">MAPE = &Sigma;[(|Actual &minus; Forecast| &divide; Actual) &times; 100] &divide; n</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">&Sigma; of percent-error row</span>&nbsp;=&nbsp;sum of the bottom row above</span><span class=\"fc-var-chip\"><span class=\"sym\">n</span>&nbsp;=&nbsp;number of periods (8)</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-mape-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-mape-1\"><li>Add up all 8 percent-error values: .92+1.41+.46+1.90+.94+2.28+.46+1.89 = <strong>10.26%</strong>.</li><li hidden>Divide by n = 8: 10.26 &divide; 8.</li></ol><div class=\"fc-answer\">MAPE = 1.28%</div></div>"}], "3.15": [{"heading": "Control charts for forecast errors", "html": "<p>A <span class=\"term\" data-cid=\"control-chart\">control chart</span> plots forecast errors over time against upper and lower control limits, where s = &radic;MSE approximates the standard deviation of the errors. Errors are “in control” (random) only if BOTH: all errors fall within the limits, AND no pattern (trend, cycle, or a long run of same-sign errors) is visible.</p><details class=\"source-box\"><summary>EXAMPLE 10 &mdash; Computing Control Limits</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td>MSE</td><td><span class=\"src-badge b-m\" data-tbaction=\"flashSrc\" data-src=\"M\">M</span> 9.0</td></tr><tr><td>z (standard deviations)</td><td><span class=\"src-badge b-z\" data-tbaction=\"flashSrc\" data-src=\"Z\">Z</span> 2</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Computing Control Limits</div><div class=\"fc-main\">Control limits = 0 &plusmn; z&radic;MSE</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">MSE</span>&nbsp;=&nbsp;the mean squared error</span><span class=\"fc-var-chip\"><span class=\"sym\">z</span>&nbsp;=&nbsp;the number of standard deviations</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-cc-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-cc-1\"><li>Find s, the square root of MSE: &radic;<span class=\"src-badge b-m\" data-tbaction=\"flashSrc\" data-src=\"M\">M</span>9.0 = <strong>3.0</strong>.</li><li hidden>Multiply by z: <span class=\"src-badge b-z\" data-tbaction=\"flashSrc\" data-src=\"Z\">Z</span>2 &times; 3.0 = <strong>6.0</strong>.</li><li hidden>Add and subtract from zero: UCL = 0 + 6.0, LCL = 0 &minus; 6.0.</li></ol><div class=\"fc-answer\">UCL = +6.0 &nbsp;&nbsp; LCL = &minus;6.0</div></div>"}, {"heading": "The tracking signal, and why control charts are usually better", "html": "<p>The <span class=\"term\" data-cid=\"tracking-signal\">tracking signal</span> flags bias (a persistent tendency toward positive or negative errors) using limits typically around &plusmn;4 or &plusmn;5. Its major weakness: because it relies on a CUMULATIVE total, large positive and negative errors can cancel out and hide a real problem.</p><details class=\"source-box\"><summary>EXAMPLE 11 &mdash; Seminar Attendance, 24 Months of Actual vs. Forecast</summary><div class=\"source-content\"><table class=\"src-table\" style=\"font-size:11px;\"><tr><th>Month</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td></tr><tr><th>Actual</th><td>47</td><td>51</td><td>54</td><td>55</td><td>49</td><td>46</td><td>38</td><td>32</td><td>25</td><td>24</td><td>30</td><td>35</td><td>44</td><td>57</td><td>60</td><td>55</td><td>51</td><td>48</td><td>42</td><td>30</td><td>28</td><td>25</td><td>35</td><td>38</td></tr><tr><th>Forecast</th><td>43</td><td>44</td><td>50</td><td>51</td><td>54</td><td>48</td><td>46</td><td>44</td><td>35</td><td>26</td><td>25</td><td>32</td><td>34</td><td>50</td><td>51</td><td>54</td><td>55</td><td>51</td><td>50</td><td>43</td><td>38</td><td>27</td><td>27</td><td>32</td></tr><tr><th>Error (A&minus;F)</th><td>+4</td><td>+7</td><td>+4</td><td>+4</td><td>-5</td><td>-2</td><td>-8</td><td>-12</td><td>-10</td><td>-2</td><td>+5</td><td>+3</td><td>+10</td><td>+7</td><td>+9</td><td>+1</td><td>-4</td><td>-3</td><td>-8</td><td>-13</td><td>-10</td><td>-2</td><td>+8</td><td>+6</td></tr><tr><th>|Error|</th><td>4</td><td>7</td><td>4</td><td>4</td><td>5</td><td>2</td><td>8</td><td>12</td><td>10</td><td>2</td><td>5</td><td>3</td><td>10</td><td>7</td><td>9</td><td>1</td><td>4</td><td>3</td><td>8</td><td>13</td><td>10</td><td>2</td><td>8</td><td>6</td></tr></table><p>Reading this table: 24 months of a financial-planning seminar’s attendance, with the forecast and resulting error for each month. The first 10 months’ absolute errors sum to 58, which is where the tracking signal calculation below starts.</p></div></details><details class=\"source-box\"><summary>EXAMPLE 11 continued &mdash; Tracking Signal Computation (Months 10&ndash;24)</summary><div class=\"source-content\"><table class=\"src-table\" style=\"font-size:11px;\"><tr><th>Month</th><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td></tr><tr><th>|Error|</th><td>2</td><td>5</td><td>3</td><td>10</td><td>7</td><td>9</td><td>1</td><td>4</td><td>3</td><td>8</td><td>13</td><td>10</td><td>2</td><td>8</td><td>6</td></tr><tr><th>MAD(t)</th><td>5.800</td><td>5.640</td><td>5.112</td><td>6.090</td><td>6.272</td><td>6.818</td><td>5.654</td><td>5.323</td><td>4.858</td><td>5.486</td><td>6.989</td><td>7.591</td><td>6.473</td><td>6.778</td><td>6.622</td></tr><tr><th>Cumulative Error</th><td>-20</td><td>-15</td><td>-12</td><td>-2</td><td>+5</td><td>+14</td><td>+15</td><td>+11</td><td>+8</td><td>+0</td><td>-13</td><td>-23</td><td>-25</td><td>-17</td><td>-11</td></tr><tr><th>Tracking Signal</th><td>-3.45</td><td>-2.66</td><td>-2.35</td><td>-0.33</td><td>0.80</td><td>2.05</td><td>2.65</td><td>2.07</td><td>1.65</td><td>0.00</td><td>-1.86</td><td>-3.03</td><td>-3.86</td><td>-2.51</td><td>-1.66</td></tr></table><p>Reading this table: MAD(t) is updated every month with exponential smoothing (&alpha;=.2) rather than recomputed from scratch. Tracking signal = Cumulative Error &divide; MAD(t) for that same month.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Tracking Signal at Month 11</div><div class=\"fc-main\">Tracking Signal = Cumulative Error &divide; MAD(t)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Cumulative error</span>&nbsp;=&nbsp;the running total of (Actual &minus; Forecast) through this month</span><span class=\"fc-var-chip\"><span class=\"sym\">MAD(t)</span>&nbsp;=&nbsp;the smoothed mean absolute deviation at this point</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ts-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ts-1\"><li>Take the cumulative error at month 11 from the table above: <strong>&minus;15</strong>.</li><li hidden>Take MAD at month 11 from the table above: <strong>5.640</strong>.</li><li hidden>Divide: &minus;15 &divide; 5.640.</li></ol><div class=\"fc-answer\">Tracking signal at month 11 = &minus;2.66 (within the &plusmn;4 acceptable range)</div></div><p>Across all 24 months, the tracking signal stayed within &plusmn;4 the entire time, suggesting no bias by that measure alone. But a control chart built on the SAME data revealed suspicious strings of same-sign errors that the tracking signal completely missed — illustrating exactly why the book calls the control chart approach generally superior.</p>"}], "3.16": [{"heading": "Choosing among forecasting techniques <span class=\"section-tag\">Section 3.12</span>", "html": "<p>The two most important factors are cost and accuracy — higher accuracy generally costs more, so the best technique balances the two rather than maximizing either alone. Other factors: how much historical data is available, what software exists, how much time is available to prepare the forecast, and the forecast horizon (moving averages and exponential smoothing suit the short range; trend equations project further; qualitative methods like Delphi suit long-range forecasts with no historical data at all). Managers sometimes run multiple techniques in parallel: agreement across methods builds confidence, disagreement signals a need for more analysis, and the technique with the lowest recent error can be selected period by period (similar to focus forecasting).</p>"}, {"heading": "Using forecast information <span class=\"section-tag\">Section 3.13</span>", "html": "<p>Once a forecast exists, a manager can take a <span class=\"term\" data-cid=\"reactive-approach\">reactive approach</span> — treating the forecast as probable demand and adjusting production, inventory, or workforce to meet it — or a <span class=\"term\" data-cid=\"proactive-approach\">proactive approach</span>, actively trying to shape demand itself through advertising, pricing, or product changes. A proactive approach generally needs either an explanatory (associative) model or a subjective judgment about how much influence is possible; a manager might even build two forecasts side by side — one assuming the status quo, one modeling a proposed change — to compare outcomes before acting.</p>"}, {"heading": "Software and forecast strategy <span class=\"section-tag\">Section 3.14–3.15</span>", "html": "<p>Spreadsheet templates and built-in forecasting functions (moving averages, exponential smoothing, trend, seasonality, regression) let managers revise forecasts quickly without manual computation — Excel’s own forecasting tools include an exponential triple smoothing (ETS) algorithm. Strategically, since forecast accuracy decreases as the time horizon grows, a worthwhile strategy is to invest in improving SHORT-term forecasts and shortening the lead time needed to respond to them (through flexible operations, shorter supply lead times, or faster new-product development), rather than only chasing more sophisticated long-range models. Sharing forecasts and demand data across the supply chain — as Hewlett-Packard and IBM require of their resellers — also improves forecast quality system-wide.</p>"}], "5.1": [{"heading": "What capacity means, and why it gets out of balance <span class=\"section-tag\">Section 5.1</span>", "html": "<p><span class=\"term\" data-cid=\"capacity\">Capacity</span> refers to an upper limit or ceiling on the load that an operating unit can handle. The load might be in terms of the number of physical units produced (e.g., bicycles assembled per hour) or the number of services performed (e.g., computers upgraded per hour). The operating unit might be a plant, department, machine, store, or worker. Capacity needs include equipment, space, and employee skills.</p><p>The goal of strategic capacity planning is to achieve a match between an organization’s long-term supply capabilities and the predicted level of long-term demand. A gap between current and desired capacity results in capacity that is out of balance: <span class=\"term\" data-cid=\"overcapacity\">overcapacity</span> causes operating costs that are too high, while <span class=\"term\" data-cid=\"undercapacity\">undercapacity</span> causes strained resources and a possible loss of customers.</p><p>As the textbook’s reading <i>Excess Capacity Can Be Bad News Too!</i> explains, huge gaps between supply and demand have left companies in industries like telecom and auto manufacturing losing millions of dollars a year to excess capacity — cutting prices, laying off workers, and offering incentives just to raise demand back up to match it. So too much capacity is just as real a problem as too little.</p>"}, {"heading": "The three key questions in capacity planning", "html": "<p>The three key questions in capacity planning are:</p><ol><li>What kind of capacity (i.e., capability) is needed?</li><li>How much capacity is needed to match demand?</li><li>When is it needed?</li></ol><p>The question of what KIND of capacity is needed depends on the products and services management intends to produce or provide — in particular, the organization’s current and future core competencies. Forecasts are the key inputs used to answer the questions of how much capacity is needed and when it is needed.</p><p>Related questions include how much it will cost and how it will be funded; the potential benefits and risks, including the degree of uncertainty in demand forecasts; whether sustainability issues need to be addressed; whether capacity should change all at once or through several smaller changes; and whether the supply chain can actually handle the necessary changes.</p>"}, {"heading": "Why capacity decisions are hard to time", "html": "<p>Because of uncertainties, some organizations prefer to delay capacity investment until demand materializes. However, such strategies often inhibit growth, because adding capacity takes time and customers won’t usually wait. Conversely, organizations that add capacity in anticipation of growth often discover that the new capacity actually attracts growth. Some organizations “hedge their bets” by making a series of small changes and then evaluating the results before committing to the next change. The frequency of capacity choices is generally influenced by the stability of demand, the rate of technological change in equipment and product design, and competitive factors, including whether style changes are important (as in automobiles and clothing).</p>"}], "5.2": [{"heading": "Eight reasons capacity decisions are fundamental <span class=\"section-tag\">Section 5.2</span>", "html": "<p>Capacity decisions are among the most fundamental of all the design decisions managers must make — in fact, they can be critical for an organization. The chapter gives eight reasons:</p><ol><li><strong>Real impact on meeting future demand.</strong> Capacity essentially limits the rate of output possible. When Microsoft introduced its new Xbox, insufficient supplies resulted in lost sales and unhappy customers; shortages of flu vaccine in some years similarly limited availability due to production problems.</li><li><strong>Affects operating costs.</strong> Ideally, capacity and demand requirements are matched, minimizing operating costs — though in practice this match isn’t always achieved because actual demand differs from expected demand.</li><li><strong>Major determinant of initial cost.</strong> Typically, the greater the capacity of a productive unit, the greater its cost — though larger units tend to cost proportionately less than smaller ones.</li><li><strong>Long-term commitment of resources.</strong> Once capacity decisions are implemented, they may be difficult or impossible to modify without incurring major costs.</li><li><strong>Affects competitiveness.</strong> Excess capacity, or the ability to quickly add capacity, can serve as a barrier to entry for other firms, and capacity can affect delivery speed, a competitive advantage.</li><li><strong>Affects ease of management.</strong> Appropriate capacity makes management easier than when capacity is mismatched.</li><li><strong>Globalization has increased complexity.</strong> Far-flung supply chains and distant markets add to the uncertainty about capacity needs.</li><li><strong>Requires planning far in advance.</strong> It may take years for a new power-generating plant to be constructed and become operational — time lags that increase the risk that the designated amount of capacity won’t match actual demand or reserve requirements when it finally becomes available.</li></ol>"}], "5.3": [{"heading": "Design capacity vs. effective capacity <span class=\"section-tag\">Section 5.3</span>", "html": "<p>Capacity often refers to an upper limit on the rate of output, but there are subtle difficulties in actually measuring it. In selecting a measure of capacity, it’s important to choose one that does not require updating — dollar amounts, for instance, are often a poor measure because price changes necessitate updating.</p><details class=\"source-box\"><summary>TABLE 5.1 &mdash; Measures of Capacity</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Business</th><th>Inputs</th><th>Outputs</th></tr><tr><td>Auto manufacturing</td><td>Labor hours, machine hours</td><td>Number of cars per shift</td></tr><tr><td>Steel mill</td><td>Furnace size</td><td>Tons of steel per day</td></tr><tr><td>Oil refinery</td><td>Refinery size</td><td>Gallons of fuel per day</td></tr><tr><td>Farming</td><td>Number of acres, number of cows</td><td>Bushels of grain per acre per year, gallons of milk per day</td></tr><tr><td>Restaurant</td><td>Number of tables, seating capacity</td><td>Number of meals served per day</td></tr><tr><td>Theater</td><td>Number of seats</td><td>Number of tickets sold per performance</td></tr><tr><td>Retail sales</td><td>Square feet of floor space</td><td>Revenue generated per day</td></tr></table><p>Reading this table: capacity is always expressed as an OUTPUT measure, tailored to the business — but it’s often tracked alongside the INPUT that drives it, since a measure of capacity shouldn’t require constant updating (a dollar-based measure, for instance, breaks every time prices change).</p></div></details><p>This general definition can be refined into two useful, more precise definitions: <span class=\"term\" data-cid=\"design-capacity\">design capacity</span> is the maximum output rate or service capacity an operation, process, or facility is designed for — the rate achieved under ideal conditions. <span class=\"term\" data-cid=\"effective-capacity\">Effective capacity</span> is design capacity minus allowances such as personal time and preventive maintenance, and is always less than design capacity owing to realities like changing product mix, periodic equipment maintenance, lunch and coffee breaks, and scheduling problems. Actual output can never exceed effective capacity, and is often even less, due to machine breakdowns, absenteeism, material shortages, and quality problems.</p>"}, {"heading": "Efficiency and utilization: two measures that can disagree", "html": "<p>These measures of capacity define two measures of system effectiveness. <span class=\"term\" data-cid=\"capacity-efficiency\">Efficiency</span> is the ratio of actual output to effective capacity. <span class=\"term\" data-cid=\"capacity-utilization\">Capacity utilization</span> is the ratio of actual output to design capacity. Both are expressed as percentages.</p><details class=\"source-box\"><summary>EXAMPLE 1 &mdash; Computing Efficiency and Utilization (Vehicle Repair Department)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td>Design capacity</td><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 50 trucks per day</td></tr><tr><td>Effective capacity</td><td><span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span> 40 trucks per day</td></tr><tr><td>Actual output</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 36 trucks per day</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Efficiency</div><div class=\"fc-main\">Efficiency = (Actual output &divide; Effective capacity) &times; 100%</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Actual output</span>&nbsp;=&nbsp;what the department really produced</span><span class=\"fc-var-chip\"><span class=\"sym\">Effective capacity</span>&nbsp;=&nbsp;what it could realistically produce</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-eff\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-eff\"><li>Divide actual output by effective capacity: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>36 &divide; <span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span>40 = <strong>0.90</strong>.</li><li hidden>Multiply by 100% to express as a percentage: 0.90 &times; 100%.</li></ol><div class=\"fc-answer\">Efficiency = 90%</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Utilization</div><div class=\"fc-main\">Utilization = (Actual output &divide; Design capacity) &times; 100%</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Actual output</span>&nbsp;=&nbsp;what the department really produced</span><span class=\"fc-var-chip\"><span class=\"sym\">Design capacity</span>&nbsp;=&nbsp;the true maximum, under ideal conditions</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-util\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-util\"><li>Divide actual output by design capacity: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>36 &divide; <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>50 = <strong>0.72</strong>.</li><li hidden>Multiply by 100%: 0.72 &times; 100%.</li></ol><div class=\"fc-answer\">Utilization = 72%</div></div><p>Compared to the effective capacity of 40 units per day, 36 units per day looks pretty good (90% efficiency). But compared to the design capacity of 50 units per day, 36 units per day is much less impressive (only 72% utilization) — although probably more meaningful. Because effective capacity acts as a lid on actual output, the real key to improving utilization is to increase effective capacity itself: correcting quality problems, maintaining equipment in good operating condition, fully training employees, improving bottleneck operations, and eliminating waste through lean operation.</p><p>It’s important to recognize that the benefits of high utilization are only realized when there is actual demand for the output. When demand isn’t there, focusing exclusively on utilization can be counterproductive — excess output generates both additional variable costs and the costs of carrying that output as inventory. High utilization can also raise operating costs through increased waiting time caused by bottleneck conditions.</p>"}], "5.4": [{"heading": "Facilities, products, and process factors <span class=\"section-tag\">Section 5.4</span>", "html": "<p>Many decisions about system design — and many operating decisions — have an impact on capacity. The main factors relate to facilities, products and services, processes, human considerations, policy factors, operational factors, the supply chain, and external forces.</p><p><strong>Facilities:</strong> The design of facilities, including size and provision for expansion, is key. Locational factors (transportation costs, distance to market, labor supply, energy sources, room for expansion), layout of the work area, and environmental factors (heating, lighting, ventilation) all play a significant role.</p><p><strong>Product and service factors:</strong> Product or service design can have a tremendous influence on capacity. When items are similar, a system’s ability to produce them is generally much greater than when successive items differ — a restaurant with a limited menu can usually prepare and serve meals faster than one with an extensive menu. The more uniform the output, the more opportunities for standardization, which leads to greater capacity.</p><p><strong>Process factors:</strong> The quantity capability of a process is an obvious determinant of capacity, but output QUALITY is a more subtle one — if quality doesn’t meet standards, the rate of output will be slowed by inspection and rework activities. Productivity also affects capacity: process improvements that increase quality and productivity can increase capacity. When multiple products or services are processed in batches, the time needed to change equipment settings must also be taken into account.</p>"}, {"heading": "Human, policy, and operational factors", "html": "<p><strong>Human factors:</strong> The tasks that make up a job, the variety of activities involved, and the training, skill, and experience required all affect potential and actual output. Employee motivation, absenteeism, and labor turnover all have a basic relationship to capacity.</p><p><strong>Policy factors:</strong> Management policy can affect capacity by allowing or not allowing capacity options such as overtime or second or third shifts.</p><p><strong>Operational factors:</strong> Scheduling problems may occur from differences in equipment capabilities or job requirements. Inventory stocking decisions, late deliveries, purchasing requirements, and quality inspection and control procedures can all impact effective capacity. Inventory shortages of even one component of an assembled item (such as computers, refrigerators, or automobiles) can cause a temporary halt to assembly operations, affecting overall capacity.</p>"}, {"heading": "Supply chain and external factors", "html": "<p><strong>Supply chain factors:</strong> Substantial capacity changes require considering the impact on suppliers, warehousing, transportation, and distributors — and whether these elements of the supply chain can handle the change. A related tool is subcontracting: a company may subcontract part of its process (such as product testing) to another organization that can perform it when the firm’s own capacity is constrained. Supply chain managers must ensure these subcontractors are available if and when they are needed.</p><p><strong>External factors:</strong> Product standards, especially minimum quality and performance standards, can restrict management’s options for increasing and using capacity. Pollution standards, government regulatory paperwork, and union contracts that limit the number of hours and type of work an employee may do can all reduce effective capacity. Beyond all of these, <i>inadequate planning</i> itself can be a major limiting determinant of effective capacity.</p>"}], "5.5": [{"heading": "Strategy formulation: leading, following, and tracking <span class=\"section-tag\">Section 5.5</span>", "html": "<p>Before deciding whether to do work in-house or outsource it, an organization first settles on its overall capacity strategy. The three primary strategies are leading, following, and tracking. A <span class=\"term\" data-cid=\"leading-capacity-strategy\">leading capacity strategy</span> builds capacity in anticipation of future demand increases — the best option when capacity increases involve a long lead time. A <span class=\"term\" data-cid=\"following-capacity-strategy\">following strategy</span> builds capacity only once demand exceeds current capacity. A <span class=\"term\" data-cid=\"tracking-capacity-strategy\">tracking strategy</span> is similar to a following strategy, but it adds capacity in relatively small increments to keep pace with increasing demand.</p><p>An organization typically bases its capacity strategy on assumptions and predictions about: (1) the growth rate and variability of demand, (2) the costs of building and operating facilities of various sizes, (3) the rate and direction of technological innovation, (4) the likely behavior of competitors, and (5) the availability of capital and other inputs.</p><p>A decision may also incorporate a <span class=\"term\" data-cid=\"capacity-cushion\">capacity cushion</span> — an amount of capacity in excess of expected demand when there is some uncertainty about demand (capacity cushion = capacity − expected demand). Typically, the greater the degree of demand uncertainty, the greater the amount of cushion used; organizations with standard products or services generally have smaller capacity cushions.</p>"}, {"heading": "The eight steps in the capacity planning process", "html": "<ol><li>Estimate future capacity requirements.</li><li>Evaluate existing capacity and facilities and identify gaps.</li><li>Identify alternatives for meeting requirements.</li><li>Conduct financial analyses of each alternative.</li><li>Assess key qualitative issues for each alternative.</li><li>Select the alternative to pursue that will be best in the long term.</li><li>Implement the selected alternative.</li><li>Monitor results.</li></ol>"}, {"heading": "Forecasting capacity requirements <span class=\"section-tag\">Section 5.6</span>", "html": "<p>Capacity planning decisions involve both long- and short-term considerations. Long-term considerations relate to the overall LEVEL of capacity, such as facility size, whereas short-term considerations relate to probable VARIATIONS in capacity requirements created by seasonal, random, and irregular fluctuations in demand.</p><p>Long-term capacity needs require forecasting demand over a time horizon and converting those forecasts into capacity requirements. Common demand patterns identified by a forecast include growth, decline, cyclical, and stable patterns. When trends are identified, the key issues are how long the trend might persist and the slope of the trend; when cycles are identified, interest focuses on the approximate length and amplitude of the cycles.</p><p>Short-term capacity needs are less concerned with cycles or trends than with seasonal variations and other deviations from average — which matter because they can place a severe strain on a system’s ability to satisfy demand at some times, while leaving idle capacity at others. Seasonal variations aren’t limited to annual fluctuations: they also show up in monthly, weekly, and even daily capacity requirements (examples the chapter gives include welfare and Social Security payments on a monthly cycle, retail sales and restaurant meals on a weekly cycle, and power usage and automotive traffic on a daily cycle). When time intervals are too short to show seasonal variation, the analysis can instead describe demand using probability distributions such as the normal, uniform, or Poisson distribution.</p>"}, {"heading": "Calculating processing requirements", "html": "<p>A necessary piece of information for capacity planning is the processing requirements of the products that will be processed. To get this, one must have reasonably accurate demand forecasts for each product, the standard processing time per unit for each product, the number of workdays per year, and the number of shifts that will be used.</p><details class=\"source-box\"><summary>EXAMPLE 2 &mdash; Determining Needed Capacity</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Product</th><th>Annual Demand</th><th>Standard Processing Time per Unit (hr)</th><th>Processing Time Needed (hr)</th></tr><tr><td><span class=\"src-badge b-p1\" data-tbaction=\"flashSrc\" data-src=\"P1\">P1</span> 1</td><td><span class=\"src-badge b-d1\" data-tbaction=\"flashSrc\" data-src=\"D1\">D1</span> 400</td><td><span class=\"src-badge b-t1\" data-tbaction=\"flashSrc\" data-src=\"T1\">T1</span> 5.0</td><td><span class=\"src-badge b-n1\" data-tbaction=\"flashSrc\" data-src=\"N1\">N1</span> 2,000</td></tr><tr><td><span class=\"src-badge b-p2\" data-tbaction=\"flashSrc\" data-src=\"P2\">P2</span> 2</td><td><span class=\"src-badge b-d2\" data-tbaction=\"flashSrc\" data-src=\"D2\">D2</span> 300</td><td><span class=\"src-badge b-t2\" data-tbaction=\"flashSrc\" data-src=\"T2\">T2</span> 8.0</td><td><span class=\"src-badge b-n2\" data-tbaction=\"flashSrc\" data-src=\"N2\">N2</span> 2,400</td></tr><tr><td><span class=\"src-badge b-p3\" data-tbaction=\"flashSrc\" data-src=\"P3\">P3</span> 3</td><td><span class=\"src-badge b-d3\" data-tbaction=\"flashSrc\" data-src=\"D3\">D3</span> 700</td><td><span class=\"src-badge b-t3\" data-tbaction=\"flashSrc\" data-src=\"T3\">T3</span> 2.0</td><td><span class=\"src-badge b-n3\" data-tbaction=\"flashSrc\" data-src=\"N3\">N3</span> 1,400</td></tr><tr><td colspan=\"3\" style=\"text-align:right;\"><strong>Total</strong></td><td><span class=\"src-badge b-tot\" data-tbaction=\"flashSrc\" data-src=\"TOT\">TOT</span> 5,800</td></tr></table><p>Reading this table: each row is one product. Multiplying that product’s annual demand by its own standard processing time per unit gives the processing time THAT product alone needs; adding all three rows gives the total processing time the whole department needs this year.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; How Many Machines Are Needed?</div><div class=\"fc-main\">Units of capacity needed = Processing time needed &divide; Processing time capacity per unit</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Processing time needed</span>&nbsp;=&nbsp;total hours of work the department must get through in a year</span><span class=\"fc-var-chip\"><span class=\"sym\">Processing time capacity per unit</span>&nbsp;=&nbsp;how many hours one machine can provide in a year</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-cap\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-cap\"><li>Add up the processing time needed for all three products: <span class=\"src-badge b-n1\" data-tbaction=\"flashSrc\" data-src=\"N1\">N1</span>2,000 + <span class=\"src-badge b-n2\" data-tbaction=\"flashSrc\" data-src=\"N2\">N2</span>2,400 + <span class=\"src-badge b-n3\" data-tbaction=\"flashSrc\" data-src=\"N3\">N3</span>1,400 = <strong>5,800 hours</strong>.</li><li hidden>Find one machine's annual capacity: working one 8-hour shift, 250 days a year, gives 8 &times; 250 = <strong>2,000 hours per machine per year</strong>.</li><li hidden>Divide the total hours needed by one machine's annual capacity: 5,800 &divide; 2,000.</li></ol><div class=\"fc-answer\">2.90 machines needed &mdash; which means 3 machines must actually be purchased, since you can't buy a fraction of a machine</div></div><p>The task of determining capacity requirements should not be taken lightly: substantial losses can occur from misjudgments, often due to overly optimistic projections of demand and growth, or focusing exclusively on sales and revenue potential without accounting for the PRODUCT MIX needed to generate those sales. A reasonable approach is to obtain a forecast of future demand, translate that demand into both the quantity and timing of capacity requirements, and then decide what capacity changes are needed. Long-term capacity alternatives include expanding or contracting an existing facility, opening or closing branch facilities, and relocating existing operations — at which point a decision must be made about whether to make or buy a good, or provide or buy a service.</p>"}, {"heading": "Additional challenges of planning service capacity <span class=\"section-tag\">Section 5.7</span>", "html": "<p>Capacity planning for services presents special challenges due to the nature of services. Three especially important factors are (1) the need to be near customers, (2) the inability to store services, and (3) the degree of volatility of demand.</p><p>Convenience for customers often means a service must be located near them — hotel rooms must be where customers want to stay, so capacity and location are closely tied. Capacity must also be matched with the TIMING of demand: unlike goods, services cannot be produced in one period and stored for use in a later one (an unsold airplane seat can’t be stored for a later flight), so a customer who wants a service may have to wait, making speed of delivery (customer waiting time) a major concern in service capacity planning.</p><p>Demand volatility tends to be higher for services than for goods, both in timing and in the amount of time required to service individual customers, and a wide range of social, cultural, and even weather factors can cause major peaks and valleys in demand. Because services can’t be stored, service planners can’t turn to inventory to smooth demand the way goods-producing systems can — instead, they might hire extra or temporary workers, outsource some or all of a service, or use pricing and promotion (demand management strategies) to shift some demand away from peak periods and into slower ones.</p>"}, {"heading": "Do it in-house or outsource it? <span class=\"section-tag\">Section 5.8</span>", "html": "<p>Once capacity requirements are determined, the organization must decide whether to produce a good or provide a service itself, or to outsource from another organization. Among the factors to consider are:</p><ul><li><strong>Available capacity.</strong> If an organization has the necessary equipment, skills, and time, it often makes sense to produce in-house, at relatively small additional cost. Outsourcing, on the other hand, can increase capacity and flexibility.</li><li><strong>Expertise.</strong> If a firm lacks the expertise to do a job satisfactorily, buying might be a reasonable alternative — particularly for work outside the firm’s core competencies.</li><li><strong>Quality considerations.</strong> Firms that specialize can usually offer higher quality than an organization can attain itself; conversely, unique quality requirements may cause an organization to perform a job in-house so it can closely monitor quality.</li><li><strong>The nature of demand.</strong> When demand is high and steady, doing the work in-house is often better; wide fluctuations or small orders are usually better handled by specialists who can combine orders from multiple sources.</li><li><strong>Cost.</strong> Any cost savings from buying or making must be weighed against the preceding factors, including any fixed costs that can’t be reallocated if work is outsourced.</li><li><strong>Risks.</strong> Buying goods or services may mean a loss of direct control, risk of knowledge sharing, and the possible need to disclose proprietary information; reputation can also suffer if the public discovers a supplier operates with substandard working conditions.</li></ul><p>In some cases a firm performs part of the work itself and lets others handle the rest, to maintain flexibility and hedge against the loss of a subcontractor. Outsourcing brings with it a host of supply chain considerations of its own.</p>"}], "5.6": [{"heading": "Flexibility, life cycle, and the big-picture (systems) approach <span class=\"section-tag\">Section 5.9</span>", "html": "<p>There are a number of ways to enhance the development of capacity strategies.</p><p><strong>1. Design flexibility into systems.</strong> The long-term nature of many capacity decisions, and the risks inherent in long-term forecasts, suggest real benefits from designing flexible systems. For example, provision for future expansion in a restaurant’s original design (water lines, power hookups, waste disposal) can be obtained at a small price compared to remodeling later; a golf course might start as 9 holes but, with options on adjacent land, expand to a full 18-hole course.</p><p><strong>2. Take stage of life cycle into account.</strong> Capacity requirements are often closely linked to the life cycle stage a product or service is in. In the <i>introduction phase</i>, it can be difficult to determine the size of the market or the organization’s eventual share, so organizations should be cautious about large or inflexible capacity investments. In the <i>growth phase</i>, the real issue is the rate at which the ORGANIZATION’S market share grows, which may differ from the overall market growth rate — growth requires more capacity investment and complexity, and competitors may make similar moves, increasing the risk of market overcapacity. In the <i>maturity phase</i>, market share tends to stabilize, and profitability gains often come from cost reduction and fuller use of capacity rather than expansion. In the <i>decline phase</i>, an organization facing underutilized capacity due to falling demand may eliminate the excess by selling it or introducing new products, or (in manufacturing) transfer capacity to a lower-labor-cost location to keep profiting a while longer.</p><p><strong>3. Take a “big-picture” (systems) approach to capacity changes.</strong> It’s important to consider how parts of the system interrelate — increasing the number of rooms in a motel, for example, should also prompt consideration of increased demand for parking, entertainment, food, and housekeeping, and whether suppliers can handle the increased volume. The risk of NOT taking a big-picture approach is an unbalanced system, evidenced by a <span class=\"term\" data-cid=\"bottleneck-operation\">bottleneck operation</span>: an operation whose capacity is lower than the other operations in the sequence, which caps the capacity of the entire system to its own level.</p><details class=\"source-box\"><summary>FIGURE 5.2 &mdash; Bottleneck Operation</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Operation</th><th>Capacity</th></tr><tr><td>Operation 1</td><td><span class=\"src-badge b-o1\" data-tbaction=\"flashSrc\" data-src=\"O1\">O1</span> 10/hr</td></tr><tr><td>Operation 2</td><td><span class=\"src-badge b-o2\" data-tbaction=\"flashSrc\" data-src=\"O2\">O2</span> 10/hr</td></tr><tr><td>Operation 3</td><td><span class=\"src-badge b-o3\" data-tbaction=\"flashSrc\" data-src=\"O3\">O3</span> 10/hr</td></tr><tr><td>Operation 4</td><td><span class=\"src-badge b-o4\" data-tbaction=\"flashSrc\" data-src=\"O4\">O4</span> 10/hr</td></tr><tr><td>Bottleneck operation (5th, processes all 4 streams combined)</td><td><span class=\"src-badge b-bn\" data-tbaction=\"flashSrc\" data-src=\"BN\">BN</span> 30/hr</td></tr></table><p>Reading this diagram: four parallel operations each feed into one shared fifth operation. Each of the four upstream operations can produce 10 units/hour, for a combined 40 units/hour arriving — but the downstream (bottleneck) operation can only process 30 units/hour.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Why the System Output Is Limited to 30/hr</div><div class=\"fc-main\">System output = capacity of the bottleneck operation (whichever step is slowest)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Combined input capacity</span>&nbsp;=&nbsp;the four upstream operations together</span><span class=\"fc-var-chip\"><span class=\"sym\">Bottleneck capacity</span>&nbsp;=&nbsp;the shared downstream step</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-bottleneck\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-bottleneck\"><li>Add the four upstream operations' capacities: <span class=\"src-badge b-o1\" data-tbaction=\"flashSrc\" data-src=\"O1\">O1</span>10 + <span class=\"src-badge b-o2\" data-tbaction=\"flashSrc\" data-src=\"O2\">O2</span>10 + <span class=\"src-badge b-o3\" data-tbaction=\"flashSrc\" data-src=\"O3\">O3</span>10 + <span class=\"src-badge b-o4\" data-tbaction=\"flashSrc\" data-src=\"O4\">O4</span>10 = <strong>40 units/hour arriving</strong>.</li><li hidden>Compare that to the bottleneck's own capacity: <span class=\"src-badge b-bn\" data-tbaction=\"flashSrc\" data-src=\"BN\">BN</span>30 units/hour.</li><li hidden>Since 40 units/hour arrive but only 30/hour can be processed, the system's actual output is capped at the SMALLER number.</li></ol><div class=\"fc-answer\">System output = 30 units/hour, with unprocessed units building up at the bottleneck at a rate of 10 per hour</div></div><details class=\"source-box\"><summary>FIGURE 5.2 (second diagram) &mdash; A Three-Step Bottleneck Process</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Operation</th><th>Capacity</th></tr><tr><td>Operation 1</td><td><span class=\"src-badge b-s1\" data-tbaction=\"flashSrc\" data-src=\"S1\">S1</span> 20/hr</td></tr><tr><td>Operation 2 (bottleneck)</td><td><span class=\"src-badge b-s2\" data-tbaction=\"flashSrc\" data-src=\"S2\">S2</span> 10/hr</td></tr><tr><td>Operation 3</td><td><span class=\"src-badge b-s3\" data-tbaction=\"flashSrc\" data-src=\"S3\">S3</span> 15/hr</td></tr></table><p>Here the MIDDLE operation is the bottleneck, since its capacity (10/hr) is lower than either neighbor’s. The textbook notes the potential for increasing the capacity of the whole process here is only 5 units — up to 15 units/hour — because beyond that point, Operation 3’s own capacity of 15/hr becomes the new limiting constraint.</p></div></details>"}, {"heading": "Capacity “chunks,” smoothing demand, and the optimal operating level", "html": "<p><strong>4. Prepare to deal with capacity “chunks.”</strong> Capacity increases are often acquired in fairly large chunks rather than smooth increments, making it difficult to match desired and feasible capacity exactly.</p><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Capacity “Chunks”</div><div class=\"fc-main\">Machines needed = Desired capacity &divide; Capacity per machine (rounded up, since partial machines can't be bought)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Desired capacity</span>&nbsp;=&nbsp;55 units per hour</span><span class=\"fc-var-chip\"><span class=\"sym\">Capacity per machine</span>&nbsp;=&nbsp;40 units per hour each</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-chunks\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-chunks\"><li>Try one machine: 55 &minus; 40 = <strong>15 units/hour short</strong> of what's needed.</li><li hidden>Try two machines: 2 &times; 40 = 80, and 80 &minus; 55 = <strong>25 units/hour of excess capacity</strong>.</li></ol><div class=\"fc-answer\">Neither option matches demand exactly — capacity increases come in large chunks (40 units/hour per machine), not smooth increments</div></div><p><strong>5. Attempt to smooth out capacity requirements.</strong> Unevenness in capacity requirements can create real problems — for example, public transportation ridership rises substantially during inclement weather, alternating the system between underutilization and overutilization; adding more buses reduces the burden during heavy demand but worsens overcapacity at other times, adding to operating cost. Demand unevenness can stem from randomness or from seasonality; seasonal variation is generally easier to cope with because it’s predictable. One solution is to identify products or services with COMPLEMENTARY demand patterns — patterns that tend to offset each other, such as demand for snow skis (higher in fall/winter) and water skis (higher in spring/summer) — so that combined demand for the resources behind both stays fairly stable (Figure 5.3).</p><p><strong>6. Identify the optimal operating level.</strong> Production units typically have an ideal or optimal level of operation in terms of unit cost of output, where cost per unit is lowest. If output is below that level, increasing the output rate decreases average unit costs — <span class=\"term\" data-cid=\"economies-of-scale\">economies of scale</span>. If output is increased beyond the optimal level, average unit costs instead become increasingly larger — <span class=\"term\" data-cid=\"diseconomies-of-scale\">diseconomies of scale</span> (Figure 5.4). Reasons for economies of scale include fixed costs spread over more units, construction costs that increase at a decreasing rate relative to facility size, and processing costs that decrease as output becomes more standardized. Reasons for diseconomies of scale include rising distribution costs (congestion, shipping from one centralized facility instead of several smaller ones), increased complexity, inflexibility, and added layers of bureaucracy that slow decision making.</p><p>Both the optimal operating rate and its minimum cost tend to be a function of the general capacity of the operating unit: as plant capacity increases, the optimal output rate increases and the minimum cost at that rate decreases — so larger plants tend to have higher optimal output rates and lower minimum costs than smaller plants (Figure 5.5).</p><p><strong>7. Choose a strategy if expansion is involved.</strong> Consider whether incremental expansion or a single step is more appropriate, weighing competitive pressures, market opportunities, costs and availability of funds, disruption of operations, and training requirements. Also decide whether to lead or follow competitors: leading is riskier, but may have greater potential for rewards.</p>"}], "5.7": [{"heading": "Seven categories of constraints, and five steps to resolve them <span class=\"section-tag\">Section 5.10</span>", "html": "<p>A <span class=\"term\" data-cid=\"constraint\">constraint</span> is something that limits the performance of a process or system in achieving its goals. Constraint management is often based on the work of Eli Goldratt (<i>The Theory of Constraints</i>), and Eli Schragenheim and H. William Dettmer (<i>Manufacturing at Warp Speed</i>). There are seven categories of constraints:</p><ul><li><strong>Market:</strong> Insufficient demand</li><li><strong>Resource:</strong> Too little of one or more resources (e.g., workers, equipment, and space)</li><li><strong>Material:</strong> Too little of one or more materials</li><li><strong>Financial:</strong> Insufficient funds</li><li><strong>Supplier:</strong> Unreliable, long lead time, substandard quality</li><li><strong>Knowledge or competency:</strong> Needed knowledge or skills missing or incomplete</li><li><strong>Policy:</strong> Laws or regulations interfere</li></ul><p>There may be only a few constraints, or there may be more than a few. Constraint issues can be resolved using the following five steps:</p><ol><li>Identify the most pressing constraint. If it can easily be overcome, do so, and return to Step 1 for the next constraint. Otherwise, proceed to Step 2.</li><li>Change the operation to achieve the maximum benefit, given the constraint. This may be a short-term solution.</li><li>Make sure other portions of the process are supportive of the constraint (e.g., bottleneck operation).</li><li>Explore and evaluate ways to overcome the constraint. This depends on the type of constraint: if demand is too low, advertising or a price change may be an option; if capacity is the issue, overtime, new equipment, and outsourcing are possible options; if funds are needed, improving cash flow, borrowing, or issuing stocks or bonds may be options; if suppliers are a problem, work with them or find more desirable ones, or do things in-house; if knowledge or skills are needed, seek training or consultants, or outsource; if laws or regulations are the issue, working with lawmakers or regulators may be an option.</li><li>Repeat the process until the level of constraints is acceptable.</li></ol>"}], "5.8": [{"heading": "Evaluating capacity alternatives <span class=\"section-tag\">Section 5.11</span>", "html": "<p>An organization needs to examine alternatives for future capacity from a number of different perspectives. Most obvious are economic considerations: will an alternative be economically feasible, how much will it cost, how soon can it be available, what will operating and maintenance costs be, what will its useful life be, and will it be compatible with present personnel and operations? Less obvious, but nonetheless important, is possible negative public opinion — building a new power plant, embracing new technology that requires retraining or terminating jobs, or relocating a facility can all generate hostile reactions, particularly if a community stands to lose a major employer.</p><p>A number of techniques are useful for evaluating capacity alternatives from an economic standpoint: <span class=\"term\" data-cid=\"cost-volume-analysis\">cost–volume analysis</span>, financial analysis, decision theory, waiting-line analysis, and simulation. This chapter focuses on cost–volume analysis.</p>"}, {"heading": "Cost–volume analysis", "html": "<p>Cost–volume analysis focuses on relationships between cost, revenue, and volume of output. Its purpose is to estimate an organization’s income under different operating conditions, and it’s particularly useful as a tool for comparing capacity alternatives.</p><p>Using the technique requires identifying all costs related to producing a given product, and designating each as a <span class=\"term\" data-cid=\"fixed-costs\">fixed cost</span> or a <span class=\"term\" data-cid=\"variable-costs\">variable cost</span>. Fixed costs tend to remain constant regardless of volume of output — examples include rental costs, property taxes, equipment costs, heating and cooling expenses, and certain administrative costs. Variable costs vary directly with volume of output, with materials costs and labor costs as their major components. (The simplified model here assumes variable cost per unit stays the same regardless of volume, and that all output can be sold.)</p><details class=\"source-box\"><summary>TABLE 5.4 &mdash; Cost–Volume Symbols</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Symbol</th><th>Meaning</th></tr><tr><td>FC</td><td>Fixed cost</td></tr><tr><td>VC</td><td>Total variable cost</td></tr><tr><td>v</td><td>Variable cost per unit</td></tr><tr><td>TC</td><td>Total cost</td></tr><tr><td>TR</td><td>Total revenue</td></tr><tr><td>R</td><td>Revenue per unit</td></tr><tr><td>Q</td><td>Quantity or volume of output</td></tr><tr><td>Q<sub>BEP</sub></td><td>Break-even quantity</td></tr><tr><td>P</td><td>Profit</td></tr></table></div></details><p>The total cost associated with a given volume of output is the sum of the fixed cost and the total variable cost (which is itself the variable cost per unit times the volume):</p><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Total Cost</div><div class=\"fc-main\">TC = FC + VC</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">FC</span>&nbsp;=&nbsp;fixed cost — doesn't change with volume</span><span class=\"fc-var-chip\"><span class=\"sym\">VC</span>&nbsp;=&nbsp;total variable cost — scales with volume</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-tc\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-tc\"><li>Suppose fixed costs are <span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span>$20,000 and total variable cost at the volume in question is <span class=\"src-badge b-v\" data-tbaction=\"flashSrc\" data-src=\"V\">V</span>$30,000.</li><li hidden>Add them together: $20,000 + $30,000.</li></ol><div class=\"fc-answer\">Total cost = $50,000</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Total Variable Cost</div><div class=\"fc-main\">VC = Q &times; v</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Q</span>&nbsp;=&nbsp;quantity or volume of output</span><span class=\"fc-var-chip\"><span class=\"sym\">v</span>&nbsp;=&nbsp;variable cost per unit</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-vc\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-vc\"><li>Suppose a facility expects to produce <span class=\"src-badge b-q\" data-tbaction=\"flashSrc\" data-src=\"Q\">Q</span>1,000 units, with a variable cost of <span class=\"src-badge b-v\" data-tbaction=\"flashSrc\" data-src=\"v\">v</span>$30 per unit.</li><li hidden>Multiply quantity by variable cost per unit: 1,000 &times; $30.</li></ol><div class=\"fc-answer\">Total variable cost = $30,000</div></div><p>Plotting fixed costs, total variable costs, and total (fixed plus variable) costs against the volume of output (Figure 5.6) shows how all three relate: fixed cost is a flat horizontal line, total variable cost rises in a straight line from zero, and total cost is their sum.</p><p>Revenue per unit, like variable cost per unit, is assumed to be the same regardless of quantity of output. Total revenue has a linear relationship to output:</p><div class=\"formula-card\"><div class=\"fc-title\">Total Revenue</div><div class=\"fc-main\">TR = R &times; Q</div></div><p>Profit is the difference between total revenue and total cost (fixed plus variable):</p><div class=\"formula-card\"><div class=\"fc-title\">Profit</div><div class=\"fc-main\">P = Q(R &minus; v) &minus; FC</div></div><p>The difference between revenue per unit and variable cost per unit, R &minus; v, is known as the <span class=\"term\" data-cid=\"contribution-margin\">contribution margin</span>. The required volume, Q, needed to generate a specified profit is:</p><div class=\"formula-card\"><div class=\"fc-title\">Required Volume for a Target Profit</div><div class=\"fc-main\">Q = (P + FC) &divide; (R &minus; v)</div></div><p>A special case of this is the volume needed for total revenue to exactly equal total cost: the <span class=\"term\" data-cid=\"break-even-point\">break-even point (BEP)</span>. When volume is less than the break-even point, there is a loss; when volume is greater, there is a profit — the greater the deviation from this point in either direction, the greater the resulting profit or loss.</p><div class=\"formula-card\"><div class=\"fc-title\">Break-even Point</div><div class=\"fc-main\">Q<sub>BEP</sub> = FC &divide; (R &minus; v)</div></div><details class=\"source-box\"><summary>EXAMPLE 3 &mdash; Break-even Point and Profit Analysis (Old-Fashioned Berry Pies)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td>Fixed cost (monthly lease)</td><td><span class=\"src-badge b-fc\" data-tbaction=\"flashSrc\" data-src=\"FC\">FC</span> $6,000</td></tr><tr><td>Variable cost per pie</td><td><span class=\"src-badge b-vc\" data-tbaction=\"flashSrc\" data-src=\"VC\">VC</span> $2</td></tr><tr><td>Revenue per pie</td><td><span class=\"src-badge b-r\" data-tbaction=\"flashSrc\" data-src=\"R\">R</span> $7</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; (a) Break-even Point</div><div class=\"fc-main\">Q<sub>BEP</sub> = FC &divide; (R &minus; v)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">FC</span>&nbsp;=&nbsp;fixed cost</span><span class=\"fc-var-chip\"><span class=\"sym\">R</span>&nbsp;=&nbsp;revenue per unit</span><span class=\"fc-var-chip\"><span class=\"sym\">v</span>&nbsp;=&nbsp;variable cost per unit</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-bep\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-bep\"><li>Find the contribution margin: <span class=\"src-badge b-r\" data-tbaction=\"flashSrc\" data-src=\"R\">R</span>$7 &minus; <span class=\"src-badge b-vc\" data-tbaction=\"flashSrc\" data-src=\"VC\">VC</span>$2 = <strong>$5 per pie</strong>.</li><li hidden>Divide fixed cost by the contribution margin: <span class=\"src-badge b-fc\" data-tbaction=\"flashSrc\" data-src=\"FC\">FC</span>$6,000 &divide; $5.</li></ol><div class=\"fc-answer\">Break-even point = 1,200 pies per month</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; (b) Profit at 1,000 Pies</div><div class=\"fc-main\">P = Q(R &minus; v) &minus; FC</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Q</span>&nbsp;=&nbsp;1,000 pies, the quantity sold</span><span class=\"fc-var-chip\"><span class=\"sym\">R − v</span>&nbsp;=&nbsp;the $5 contribution margin</span><span class=\"fc-var-chip\"><span class=\"sym\">FC</span>&nbsp;=&nbsp;$6,000 fixed cost</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-profit\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-profit\"><li>Multiply quantity by the contribution margin: 1,000 &times; (<span class=\"src-badge b-r\" data-tbaction=\"flashSrc\" data-src=\"R\">R</span>$7 &minus; <span class=\"src-badge b-vc\" data-tbaction=\"flashSrc\" data-src=\"VC\">VC</span>$2) = 1,000 &times; $5 = <strong>$5,000</strong>.</li><li hidden>Subtract fixed cost: $5,000 &minus; <span class=\"src-badge b-fc\" data-tbaction=\"flashSrc\" data-src=\"FC\">FC</span>$6,000.</li></ol><div class=\"fc-answer\">Profit = &minus;$1,000 (a loss, since 1,000 pies is below the 1,200-pie break-even point)</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; (c) Quantity Needed for a $4,000 Profit</div><div class=\"fc-main\">Q = (P + FC) &divide; (R &minus; v)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">P</span>&nbsp;=&nbsp;the target profit, $4,000</span><span class=\"fc-var-chip\"><span class=\"sym\">FC</span>&nbsp;=&nbsp;$6,000 fixed cost</span><span class=\"fc-var-chip\"><span class=\"sym\">R − v</span>&nbsp;=&nbsp;the $5 contribution margin</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-solveq\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-solveq\"><li>Add the target profit and fixed cost: $4,000 + <span class=\"src-badge b-fc\" data-tbaction=\"flashSrc\" data-src=\"FC\">FC</span>$6,000 = <strong>$10,000</strong>.</li><li hidden>Divide by the contribution margin: $10,000 &divide; $5.</li></ol><div class=\"fc-answer\">2,000 pies must be sold to realize a $4,000 profit</div></div><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; (d) Price Needed for a $5,000 Profit at 2,000 Pies</div><div class=\"fc-main\">P = Q(R &minus; v) &minus; FC, solved for R</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">P</span>&nbsp;=&nbsp;target profit, $5,000</span><span class=\"fc-var-chip\"><span class=\"sym\">Q</span>&nbsp;=&nbsp;2,000 pies</span><span class=\"fc-var-chip\"><span class=\"sym\">v</span>&nbsp;=&nbsp;$2 variable cost</span><span class=\"fc-var-chip\"><span class=\"sym\">FC</span>&nbsp;=&nbsp;$6,000</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ch5-solver\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ch5-solver\"><li>Set up the equation: $5,000 = 2,000(R &minus; $2) &minus; $6,000.</li><li hidden>Add $6,000 to both sides: $11,000 = 2,000(R &minus; $2).</li><li hidden>Divide both sides by 2,000: $5.50 = R &minus; $2.</li><li hidden>Add $2 to both sides: R = $5.50 + $2.</li></ol><div class=\"fc-answer\">Price must be $7.50 per pie</div></div><p>Different alternatives can be compared by plotting profit lines for each; the quantity at which a decision maker is indifferent between two competing alternatives is called the <strong>indifference point</strong> — below it, one alternative has the higher profit; above it, the other does.</p>"}, {"heading": "Step costs and multiple break-even points", "html": "<p>Capacity alternatives may involve <span class=\"term\" data-cid=\"step-costs\">step costs</span> — costs that increase stepwise as potential volume increases, rather than continuously. A firm might choose between purchasing one, two, or three machines, with each additional machine raising fixed costs (though perhaps not linearly), and with fixed costs and potential output volume both depending on how many machines are purchased. This means there may be MULTIPLE break-even quantities, possibly one for each range — and the total revenue line might not even intersect the fixed-cost line within a particular range at all, meaning there is no valid break-even point in that range.</p><details class=\"source-box\"><summary>EXAMPLE 4 &mdash; Determining the Break-even Point with Step (Fixed) Costs</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Number of Machines</th><th>Total Annual Fixed Costs</th><th>Corresponding Range of Output</th></tr><tr><td><span class=\"src-badge b-m1\" data-tbaction=\"flashSrc\" data-src=\"M1\">M1</span> 1</td><td><span class=\"src-badge b-f1\" data-tbaction=\"flashSrc\" data-src=\"F1\">F1</span> $9,600</td><td>0 to 300</td></tr><tr><td><span class=\"src-badge b-m2\" data-tbaction=\"flashSrc\" data-src=\"M2\">M2</span> 2</td><td><span class=\"src-badge b-f2\" data-tbaction=\"flashSrc\" data-src=\"F2\">F2</span> $15,000</td><td>301 to 600</td></tr><tr><td><span class=\"src-badge b-m3\" data-tbaction=\"flashSrc\" data-src=\"M3\">M3</span> 3</td><td><span class=\"src-badge b-f3\" data-tbaction=\"flashSrc\" data-src=\"F3\">F3</span> $20,000</td><td>601 to 900</td></tr></table><p>Given: variable cost = <span class=\"src-badge b-v4\" data-tbaction=\"flashSr
