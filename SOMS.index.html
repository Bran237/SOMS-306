nd MAPE. Forecast errors are monitored using control charts (based on 0 ± z√MSE) or a tracking signal (cumulative error ÷ MAD); the chapter concludes that control charts are generally superior since they judge every error individually rather than relying on a cumulative total that can hide bias. Choosing a forecasting technique requires balancing cost, accuracy, historical data availability, and the forecast horizon.", "5.1": "5.1 INTRODUCTION TO CAPACITY PLANNING\n\nCapacity refers to an upper limit or ceiling on the load that an operating unit can handle. The goal of strategic capacity planning is to achieve a match between an organization's long-term supply capabilities and the predicted level of long-term demand. The three key questions in capacity planning are: (1) What kind of capacity (capability) is needed? (2) How much capacity is needed to match demand? (3) When is it needed?", "5.2": "5.2 CAPACITY DECISIONS ARE STRATEGIC\n\nCapacity decisions are among the most fundamental of all the design decisions that managers must make. Reasons include: real impact on meeting future demand; effect on operating costs; being a major determinant of initial cost; involving long-term commitment of resources; affecting competitiveness; affecting ease of management; increased complexity from globalization; and the need to plan far in advance given long time lags.", "5.3": "5.3 DEFINING AND MEASURING CAPACITY\n\nDesign capacity is the maximum output rate or service capacity an operation, process, or facility is designed for. Effective capacity is design capacity minus allowances such as personal time and preventive maintenance. Efficiency is the ratio of actual output to effective capacity; capacity utilization is the ratio of actual output to design capacity.", "5.4": "5.4 DETERMINANTS OF EFFECTIVE CAPACITY\n\nMain factors relate to facilities, products and services, processes, human considerations, policy factors, operational factors, the supply chain, and external forces.", "5.5": "5.5 STRATEGY FORMULATION\n\nThe three primary strategies are leading, following, and tracking. Capacity cushion is an amount of capacity in excess of expected demand. Steps in the capacity planning process: estimate future requirements, evaluate existing capacity, identify alternatives, conduct financial analyses, assess qualitative issues, select an alternative, implement it, and monitor results.", "5.6": "5.6 FORECASTING CAPACITY REQUIREMENTS\n\nLong-term considerations relate to the overall level of capacity; short-term considerations relate to probable variations from seasonal, random, and irregular fluctuations. Calculating Processing Requirements: Units of capacity needed = Processing time needed ÷ Processing time capacity per unit.", "5.7": "5.7 ADDITIONAL CHALLENGES OF PLANNING SERVICE CAPACITY\n\nThree important factors: the need to be near customers, the inability to store services, and the degree of volatility of demand.", "5.8": "5.8 DO IT IN-HOUSE OR OUTSOURCE IT?\n\nFactors to consider: available capacity, expertise, quality considerations, the nature of demand, cost, and risks. Reading: My Compliments to the Chef, Er, Buyer describes outsourcing in the restaurant industry.", "5.9": "5.9 DEVELOPING CAPACITY STRATEGIES\n\nSeven approaches: design flexibility into systems; take stage of life cycle into account; take a big-picture (systems) approach to capacity changes; prepare to deal with capacity chunks; attempt to smooth out capacity requirements; identify the optimal operating level; choose a strategy if expansion is involved.", "5.10": "5.10 CONSTRAINT MANAGEMENT\n\nA constraint is something that limits the performance of a process or system in achieving its goals. Seven categories: market, resource, material, financial, supplier, knowledge or competency, and policy. Five steps to resolve constraint issues are described in the text.", "5.11": "5.11 EVALUATING ALTERNATIVES\n\nTechniques include cost-volume analysis, financial analysis, decision theory, waiting-line analysis, and simulation. Cost-volume analysis: TC = FC + VC, and VC = Q × v."}, "loProse": {"2.1": [{"heading": "Marketing’s role in competitiveness", "html": "<p>A firm’s <span class=\"term\" data-cid=\"competitiveness\">competitiveness</span> — how well it stacks up against rivals — hinges on some combination of price, delivery time, and differentiation. Marketing shapes competitiveness in three ways: identifying what customers actually want and need, setting prices that reflect the constant price–quality trade-off buyers weigh, and using advertising and promotion to make sure the right people know about the offer.</p>"}, {"heading": "Operations’ nine competitive levers", "html": "<p>Operations shapes competitiveness through nine interrelated levers:</p><ul><li><strong>Design</strong> — matching financial, operations, and supply-chain capability to what customers want; innovation and time-to-market matter here.</li><li><strong>Cost</strong> — tied directly to productivity; higher relative productivity is a real cost advantage, which is why some firms outsource to get it.</li><li><strong>Location</strong> — near inputs lowers input costs; near markets lowers transport costs and speeds delivery; especially critical in retail.</li><li><strong>Quality</strong> — materials, workmanship, design, and service, judged by how well the offering satisfies its purpose.</li><li><span class=\"term\" data-cid=\"quick-response\">Quick response</span> — speed in bringing new offerings to market, filling orders, and handling complaints.</li><li><span class=\"term\" data-cid=\"flexibility\">Flexibility</span> — the ability to adjust design, volume, or product mix as conditions change.</li><li><strong>Inventory management</strong> — matching supply of goods to demand.</li><li><span class=\"term\" data-cid=\"supply-chain-management\">Supply chain management</span> — coordinating internal and external operations (buyers and suppliers) for timely, cost-effective delivery.</li><li><span class=\"term\" data-cid=\"service-quality\">Service quality</span> — after-sale value (delivery, setup, warranty work) and in-process attentiveness; often a sustainable differentiator, since businesses rated highly on service tend to be more profitable and grow faster.</li></ul>"}, {"heading": "People as the final competitive edge", "html": "<p>Competent, motivated managers and workers provide a distinct edge through their skills and ideas — including something as ordinary as how a phone call or online chat is handled. A rude or unhelpful response creates a negative image; a prompt, cheerful one can itself become a competitive advantage.</p><div class=\"example\"><span class=\"example-label\">Concrete example — offshore call centers</span>Indian call centers handling customer service and software support for Western companies now provide over one million jobs in India — a case where location and cost, two of the nine levers, are being used deliberately as competitive tools.</div>"}], "2.2": [{"heading": "Seven recurring causes of failure", "html": "<p>Organizations rarely fail from one dramatic mistake — it’s usually a pattern of smaller ones: neglecting operations strategy; failing to recognize real strengths, opportunities, or competitive threats; over-emphasizing short-term financial performance at the expense of R&amp;D; over-emphasizing product/service design while under-investing in process design and improvement; neglecting investment in capital and human resources; failing to build good internal communication and cooperation across functional areas; and ignoring what historical data says customers actually want.</p>"}, {"heading": "The two questions that decide competitive success", "html": "<p>Successfully competing comes down to answering two questions in order: What do customers want (which of the competitive factors matter most to them)? And what is the best way to satisfy that want? Operations has to work with marketing to learn the relative importance of each factor to each major customer segment — answering the first question well is what makes the second one solvable.</p>"}], "2.3": [{"heading": "Mission statements and the planning hierarchy", "html": "<p>An organization’s <span class=\"term\" data-cid=\"mission-statement\">mission statement</span> is its reason for existing, answering the question “what business are we in?” A mission cascades into <span class=\"term\" data-cid=\"organizational-goals\">organizational goals</span> (more detail, more scope), which become the foundation for <span class=\"term\" data-cid=\"organizational-strategy\">organizational strategy</span> (the company-wide roadmap), which in turn shapes <span class=\"term\" data-cid=\"functional-strategy\">functional strategy</span> (strategy for one department), which shapes <span class=\"term\" data-cid=\"tactics\">tactics</span> (the specific how-to methods), which finally shapes day-to-day operations.</p><div class=\"example\"><span class=\"example-label\">Concrete example — planning is hierarchical</span>Rita, a high-school student, wants a good career and income. Mission: live a good life. Goal: have a successful career and earn a good income. Strategy: get a college education. Tactics: choose a college and major, decide how to finance it. Operations: register, buy books, take courses, study.</div>"}, {"heading": "Three basic strategies, often combined", "html": "<p>Most organizations lean on some combination of three strategies: <strong>low cost</strong>, <strong>responsiveness</strong> (the ability to react to changing demand), and <strong>differentiation</strong> (on features, quality, reputation, or service). Amazon runs all three at once — low prices and fast, reliable delivery, plus standout customer service.</p>"}, {"heading": "Core competencies, SWOT, and Porter’s Five Forces", "html": "<p>Effective strategy starts with <span class=\"term\" data-cid=\"core-competencies\">core competencies</span> — the special attributes or abilities that give an organization its edge — built around both customer needs and what competitors are doing. A <span class=\"term\" data-cid=\"swot-analysis\">SWOT analysis</span> assesses Strengths and Weaknesses (internal, typically evaluated by operations) alongside Opportunities and Threats (external, typically evaluated by marketing). An alternative lens is Michael Porter’s <strong>five forces model</strong>: the threat of new entrants, the threat of substitutes, the bargaining power of customers, the bargaining power of suppliers, and the intensity of rivalry.</p>"}, {"heading": "Order qualifiers, order winners, and environmental scanning", "html": "<p><span class=\"term\" data-cid=\"order-qualifier\">Order qualifier</span>s are the minimum characteristics a product or service needs just to be considered for purchase; <span class=\"term\" data-cid=\"order-winner\">order winner</span>s are what actually make one organization’s offering look better than a competitor’s. The same characteristic can be a qualifier in one market and a winner in another, and a winner can decay into a mere qualifier over time. <span class=\"term\" data-cid=\"environmental-scanning\">Environmental scanning</span> — monitoring competitors’ activity, changing consumer needs, and legal/economic/political/environmental shifts — feeds directly into deciding which characteristics matter where.</p>"}, {"heading": "Strategy formulation in practice — successes and costly missteps", "html": "<p>Formulating a strategy generally follows four steps: link the strategy directly to the mission or vision; assess SWOT and identify core competencies; identify order qualifiers and order winners; and focus on just one or two strategies rather than spreading effort too thin.</p><div class=\"example\"><span class=\"example-label\">Concrete example — when strategy formulation goes wrong</span>Walmart thrived on a low-cost reputation in many countries, but in Japan, consumers associated “low cost” with “low quality,” forcing Walmart to rethink its approach. Hewlett-Packard’s $19 billion acquisition of Compaq left HP with a smaller combined market share than the two companies had held separately before the merger.</div><div class=\"example\"><span class=\"example-label\">Concrete example — when it goes right</span>Boston Market dazzled investors in the 1990s, expanded too fast, nearly went bankrupt, and was absorbed by McDonald’s in 2000. By contrast, Coach successfully grew its handbag business by introducing totes, clutches, and overnight bags for different occasions.</div>"}], "2.4": [{"heading": "From mission to daily operations, in one table", "html": "<p><span class=\"term\" data-cid=\"organizational-strategy\">Organizational strategy</span> is broad, long-term, and covers the whole enterprise; operations strategy is narrower, translating that direction into decisions about products, processes, costs, and scheduling.</p><table class=\"mini-table\"><tr><th>Level</th><th>Management</th><th>Time horizon</th><th>Relates to</th></tr><tr><td>Mission</td><td>Top</td><td>Long</td><td>Survival, profitability</td></tr><tr><td>Strategy</td><td>Senior</td><td>Long</td><td>Growth rate, market share</td></tr><tr><td>Operations — Strategic</td><td>Senior</td><td>Moderate–long</td><td>Product design, location, technology, new facilities</td></tr><tr><td>Operations — Tactical</td><td>Middle</td><td>Moderate</td><td>Employment levels, output levels, equipment selection, layout</td></tr><tr><td>Operations — Operational</td><td>Low</td><td>Short</td><td>Scheduling, output-rate adjustments, inventory, purchasing</td></tr></table>"}, {"heading": "Why the two strategies must be linked, not built separately", "html": "<p>Operations strategy has to be consistent with the broader organizational strategy and with other functional units — conflicting functional strategies are a genuine threat to organizational success. In the 1970s and 1980s, U.S. operations strategy was often neglected in favor of marketing and financial engineering; foreign competitors filled the resulting gap by focusing squarely on operations strategy.</p>"}, {"heading": "Eleven strategic operations decision areas", "html": "<p>Nearly all strategic operations decisions carry direct cost implications:</p><table class=\"mini-table\"><tr><th>Decision area</th><th>What it affects</th></tr><tr><td>Product/service design</td><td>Costs, quality, liability, environmental issues</td></tr><tr><td>Capacity</td><td>Cost structure, flexibility</td></tr><tr><td>Process selection &amp; layout</td><td>Costs, flexibility, skill level needed, capacity</td></tr><tr><td>Work design</td><td>Quality of work life, safety, productivity</td></tr><tr><td>Location</td><td>Costs, visibility</td></tr><tr><td>Quality</td><td>Ability to meet or exceed customer expectations</td></tr><tr><td>Inventory</td><td>Costs, shortages</td></tr><tr><td>Maintenance</td><td>Costs, equipment reliability, productivity</td></tr><tr><td>Scheduling</td><td>Flexibility, efficiency</td></tr><tr><td>Supply chains</td><td>Costs, quality, agility, shortages, vendor relations</td></tr><tr><td>Projects</td><td>Costs, new products/services/systems</td></tr></table>"}, {"heading": "How the chosen strategy ripples into operations <span class=\"section-tag\">Table 2.5</span>", "html": "<p>Each organization-level strategic choice creates a predictable set of operational burdens or trade-offs:</p><table class=\"mini-table\"><tr><th>Org strategy</th><th>Implication for operations</th></tr><tr><td>Low price</td><td>Low variation; high-volume steady flow; standardized work, material, inventory</td></tr><tr><td>High quality</td><td>Higher initial design cost; more supplier quality assurance</td></tr><tr><td>Quick response</td><td>Flexibility, extra capacity, higher inventory levels</td></tr><tr><td>Newness/innovation</td><td>Large R&amp;D investment; adapting operations to fit new offerings</td></tr><tr><td>Sustainability</td><td>Location planning, process design, outsourcing, waste management</td></tr></table>"}], "2.5": [{"heading": "Quality-based strategy", "html": "<p>A <span class=\"term\" data-cid=\"quality-based-strategy\">quality-based strategy</span> focuses on maintaining, rebuilding, or protecting a reputation for quality — sometimes to overcome a poor-quality image, sometimes to catch up with competitors, sometimes simply to defend an existing reputation.</p>"}, {"heading": "Time-based strategy and the six places organizations cut time", "html": "<p>A <span class=\"term\" data-cid=\"time-based-strategy\">time-based strategy</span> focuses on reducing the time needed to plan, design, produce, deliver, or respond to complaints — less time generally means lower cost, higher productivity, higher quality, faster time-to-market, and better customer service, all at once. Organizations target time reduction across six areas: planning time, product/service design time, processing time, changeover time, delivery time, and response time for complaints.</p>"}, {"heading": "Agile operations", "html": "<p><span class=\"term\" data-cid=\"agile-operations\">Agile operations</span> is a strategic emphasis on flexibility — quick equipment changeovers, adaptable scheduling, varying output volume or product mix — blended with cost, quality, and reliability. Achieving it successfully requires investment across people, flexible equipment, and information technology working together.</p>"}], "2.6": [{"heading": "The productivity formula", "html": "<p><span class=\"term\" data-cid=\"productivity\">Productivity</span> is an index of output relative to the input used to produce it.</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE &mdash; Carpet Installation (Section 2.7)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 4 workers</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 8 hours each</td></tr><tr><td><span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span> 720 sq. yd. installed</td><td>&mdash;</td></tr></table><p>Reading this: the crew size and hours tell you the INPUT (labor); the finished carpet tells you the OUTPUT.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Labor Productivity</div><div class=\"fc-main\">Productivity = Output &divide; Input</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Output</span>&nbsp;=&nbsp;the goods or services actually produced</span><span class=\"fc-var-chip\"><span class=\"sym\">Input</span>&nbsp;=&nbsp;the labor, materials, or energy used to produce it</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-2-6-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-2-6-1\"><li>Find the total input: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>4 workers &times; <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>8 hours each = <strong>32 labor hours</strong>.</li><li hidden>Divide the output by that total input: <span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>720 square yards &divide; 32 hours.</li></ol><div class=\"fc-answer\">Productivity = 22.5 yards per labor hour</div></div><p>A second example, this time for machine productivity &mdash; note that unusable output does not count:</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE &mdash; Machine Output with Defects (Section 2.7)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Given</th><th>Value</th></tr><tr><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 70 pieces produced</td><td><span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span> 2 hours run time</td></tr><tr><td><span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span> 2 pieces defective</td><td>&mdash;</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Machine Productivity</div><div class=\"fc-main\">Productivity = Usable Output &divide; Input</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Usable output</span>&nbsp;=&nbsp;only the pieces that are good, not defective</span><span class=\"fc-var-chip\"><span class=\"sym\">Input</span>&nbsp;=&nbsp;the time or resources used</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-2-6-2\">Show next step →</button><ol class=\"fc-steps\" id=\"w-2-6-2\"><li>Subtract the defective pieces from total output: <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>70 pieces &minus; <span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span>2 unusable = <strong>68 usable pieces</strong>.</li><li hidden>Divide by the input: 68 &divide; <span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span>2 hours.</li></ol><div class=\"fc-answer\">Productivity = 34 usable pieces per hour</div></div>"}, {"heading": "Productivity growth", "html": "<p><span class=\"term\" data-cid=\"productivity-growth\">Productivity growth</span> is the percentage change in productivity from one period to the next.</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE &mdash; Productivity Rising from 80 to 84 (Section 2.7)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><th>Productivity</th></tr><tr><td>Previous</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 80</td></tr><tr><td>Current</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 84</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Productivity Growth Rate</div><div class=\"fc-main\">Growth % = [(Current &minus; Previous) &divide; Previous] &times; 100</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Current</span>&nbsp;=&nbsp;this period's productivity</span><span class=\"fc-var-chip\"><span class=\"sym\">Previous</span>&nbsp;=&nbsp;last period's productivity</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-2-6-3\">Show next step →</button><ol class=\"fc-steps\" id=\"w-2-6-3\"><li>Subtract to find the change: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>84 &minus; <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>80 = <strong>4</strong>.</li><li hidden>Divide the change by the PREVIOUS value: 4 &divide; <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>80 = <strong>0.05</strong>.</li><li hidden>Multiply by 100 to convert to a percent: 0.05 &times; 100.</li></ol><div class=\"fc-answer\">Productivity growth = 5%</div></div>"}, {"heading": "Three ways to measure productivity", "html": "<p><span class=\"term\" data-cid=\"partial-productivity\">Partial productivity</span> uses a single input. <span class=\"term\" data-cid=\"multifactor-productivity\">Multifactor productivity</span> combines two or more inputs. <span class=\"term\" data-cid=\"total-productivity\">Total productivity</span> uses every input at once.</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE &mdash; Multifactor Productivity Inputs (Section 2.7)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Input</th><th>Cost</th></tr><tr><td>Labor</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> $1,000</td></tr><tr><td>Materials</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> $520</td></tr><tr><td>Overhead</td><td><span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span> $2,000</td></tr><tr><td>Output</td><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 7,040 units</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Multifactor Productivity</div><div class=\"fc-main\">Multifactor Productivity = Output &divide; (Labor + Materials + Overhead)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Output</span>&nbsp;=&nbsp;units produced</span><span class=\"fc-var-chip\"><span class=\"sym\">Labor, Materials, Overhead</span>&nbsp;=&nbsp;the combined dollar cost of these inputs</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-2-6-4\">Show next step →</button><ol class=\"fc-steps\" id=\"w-2-6-4\"><li>Add up the input costs: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>$1,000 + <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>$520 + <span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>$2,000 = <strong>$3,520</strong>.</li><li hidden>Divide the output by that total: <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>7,040 units &divide; 3,520.</li></ol><div class=\"fc-answer\">Multifactor productivity = 2 units per dollar of input</div></div>"}, {"heading": "Service productivity and process yield", "html": "<p>Service-sector productivity is harder to measure than manufacturing. A related measure, <span class=\"term\" data-cid=\"process-yield\">process yield</span>, is the ratio of good output to input.</p><div class=\"example\"><span class=\"example-label\">Concrete example — Dutch tomato growers</span>Dutch tomato growers achieve roughly ten times the yield per square yard of growers in Italy and Greece, through climate-controlled greenhouses and an integrated trading company that matches supply to supermarket demand.</div>"}], "2.7": [{"heading": "Five categories of productivity factors", "html": "<p>It’s tempting to assume productivity is mostly about getting employees to work harder, but many gains come from technology. The real drivers cluster into five categories: <strong>Methods</strong>, <strong>Capital</strong>, <strong>Quality</strong>, <strong>Technology</strong>, and <strong>Management</strong>.</p>"}, {"heading": "Improving productivity: the process and the systems viewpoint", "html": "<p>Raising productivity generally follows a sequence: develop productivity measures, take a <span class=\"term\" data-cid=\"systems-viewpoint\">systems viewpoint</span>, solicit ideas, set goals, show management support, and measure/publicize gains.</p><div class=\"example\"><span class=\"example-label\">Concrete example — the systems viewpoint</span>A process has two sequential stages, each capable of 20 units per hour. Doubling the first stage’s productivity to 40 units per hour still caps the system at 20 units per hour.</div>"}, {"heading": "Productivity vs. efficiency", "html": "<p><span class=\"term\" data-cid=\"efficiency\">Efficiency</span> is a narrower idea than productivity: getting the most out of a fixed set of resources. Productivity is the broader question of whether those are even the right resources to use.</p><div class=\"example\"><span class=\"example-label\">Concrete example</span>Stryker Howmedica redesigned a device-packaging line, nearly doubling output from 36 to 60 devices per hour while cutting standard cost by 10%.</div>"}, {"heading": "The Balanced Scorecard: turning strategy into action", "html": "<p>The <strong>Balanced Scorecard</strong>, introduced by Robert Kaplan and David Norton, translates vision and strategy into concrete objectives and metrics across four perspectives — financial, customer, internal process, and learning/growth. It’s a tool for tracking strategy, not for creating it.</p>"}], "4.1": [{"heading": "Why design is a strategic issue, not just an engineering one", "html": "<p>Every organization exists to deliver its products and services, so <span class=\"term\" data-cid=\"product-service-design\">product and service design</span> sits at the center of strategy. It’s a major driver of cost, quality, time-to-market, customer satisfaction, and competitive advantage.</p>"}, {"heading": "When design goes wrong", "html": "<p>A meaningful share of operations failures trace straight back to faulty design. Because a single design change can ripple through the entire organization and supply chain, a “big picture” systems view early in the process helps catch implications before they become expensive surprises.</p><div class=\"example\"><span class=\"example-label\">Concrete example — design thinking at Steelcase</span>Steelcase built its design strategy around deep insight into users’ wants and needs, making that insight the focal point of every design decision.</div>"}], "4.2": [{"heading": "The core activities of design", "html": "<p>Design activities include: translating customer wants into requirements, refining existing offerings, developing new ones, setting quality goals and cost targets, building and testing prototypes, documenting specifications, and translating specs into process specs. Marketing and operations carry most of the load.</p>"}, {"heading": "Objectives: primary versus secondary", "html": "<p>The primary objective of design is always <strong>customer satisfaction</strong>. Secondary considerations — cost/profit, quality, produceability, ethics/safety, and sustainability — are weighed alongside it.</p>"}], "4.3": [{"heading": "Four questions every design decision must answer", "html": "<p>Is there demand for it? Can we actually do it — do we have the <span class=\"term\" data-cid=\"manufacturability\">manufacturability</span> (for products) or <span class=\"term\" data-cid=\"serviceability\">serviceability</span> (for services) to deliver it? What level of quality is appropriate? And does it make economic sense once liability, ethics, and sustainability are factored in?</p>"}], "4.4": [{"heading": "Seven triggers for redesign", "html": "<p>Redesign is usually triggered by market opportunities or threats stemming from one or more changes: economic, social/demographic, political/legal, competitive, cost/availability, technological, or environmental.</p>"}, {"heading": "Technology as a special case", "html": "<p>Technology can drive redesign directly (a faster chip spawning a new phone generation), indirectly (forcing a compatibility redesign), or by reshaping an entire business model — streaming lets viewers skip commercials, pushing advertisers toward embedding products directly into shows.</p>"}], "4.5": [{"heading": "Customers, the supply chain, and competitors", "html": "<p>Design ideas come from customers, the supply chain, and competitors — sometimes through <span class=\"term\" data-cid=\"reverse-engineering\">reverse engineering</span>: buying a competitor’s product, taking it apart, and hunting for ways to improve on it.</p>"}, {"heading": "Research and development: basic, applied, and development", "html": "<p><span class=\"term\" data-cid=\"research-and-development\">Research and development (R&D)</span> spans <span class=\"term\" data-cid=\"basic-research\">basic research</span>, <span class=\"term\" data-cid=\"applied-research\">applied research</span>, and <span class=\"term\" data-cid=\"development\">development</span>. R&D can be expensive — IBM spends roughly $6 billion a year, Hewlett-Packard Enterprise roughly $2 billion.</p><div class=\"example\"><span class=\"example-label\">Concrete example — Vlasic’s big pickle slices</span>To make a larger pickle chip, Vlasic first had to breed larger cucumbers, waiting about 10 weeks per generation, then design new slicing equipment because the old machines broke trying to cut the larger pickles.</div>"}], "4.6": [{"heading": "Regulation and product liability", "html": "<p>Designers answer to a web of regulators — the FDA, OSHA, the EPA. <span class=\"term\" data-cid=\"product-liability\">Product liability</span> is reinforced by implied warranties under the Uniform Commercial Code.</p>"}, {"heading": "Ethical trade-offs in design", "html": "<p>“Vaporware” is a classic case: a software company facing unresolved bugs must choose between releasing on schedule or delaying, each carrying its own risk.</p>"}, {"heading": "Human factors (supplementary)", "html": "<p>Safety and liability are central human-factor concerns — vehicle crashworthiness is a classic example. A related trap is “creeping featurism”: piling on new features until a product becomes harder to use.</p><div class=\"example\"><span class=\"example-label\">Concrete example — the Boeing 787 Dreamliner</span>A battery defect grounded the entire 787 fleet for more than three months.</div>"}], "4.7": [{"heading": "Cradle-to-grave assessment", "html": "<p><span class=\"term\" data-cid=\"cradle-to-grave-assessment\">Cradle-to-grave assessment</span> evaluates a product or service’s environmental impact across its entire life. Its goal is to find the option with the least environmental impact that’s still economically viable; the approach underlies the ISO 14000 standards.</p>"}, {"heading": "End-of-life programs", "html": "<p><span class=\"term\" data-cid=\"end-of-life-programs\">End-of-life (EOL) programs</span> manage products — especially electronics containing toxic materials — once they reach the end of their useful life.</p><div class=\"example\"><span class=\"example-label\">Concrete example — IBM’s EOL program</span>Over 15 years, IBM collected more than 2 billion pounds of product and product waste.</div>"}], "4.8": [{"heading": "Reduce: value analysis", "html": "<p><span class=\"term\" data-cid=\"value-analysis\">Value analysis</span> examines whether a part or material’s function is even necessary, or whether it can be simplified, substituted, or combined with another part.</p>"}, {"heading": "Reuse: remanufacturing", "html": "<p><span class=\"term\" data-cid=\"remanufacturing\">Remanufacturing</span> refurbishes a used product by replacing worn components, then resells it — typically for about 50% of the cost of new.</p>"}, {"heading": "Recycle", "html": "<p><span class=\"term\" data-cid=\"recycling\">Recycling</span> recovers materials for future use. Companies doing business in the EU must show a specified proportion of their products is recyclable.</p><div class=\"example\"><span class=\"example-label\">Concrete example — Kraft’s packaging redesigns</span>Slimmer pizza cartons saved about 1.4 million pounds of packaging a year; a thinner Oscar Mayer package cut 1.2 million pounds annually; a lighter salad-dressing bottle saved 3 million pounds a year.</div><div class=\"example\"><span class=\"example-label\">Concrete example — China’s “National Sword” policy</span>China and Hong Kong bought 60% of the G7’s plastic waste in early 2017 but only 10% by early 2018, after tightening its impurity standard to 0.5%.</div>"}], "4.9": [{"heading": "Life-cycle strategy", "html": "<p>Most products move through <span class=\"term\" data-cid=\"product-life-cycle\">introduction, growth, maturity, and decline</span>. <span class=\"term\" data-cid=\"product-life-cycle-management\">Product life cycle management (PLM)</span> manages a product’s full change history across three phases: beginning, middle, and end of life.</p>"}, {"heading": "Standardization", "html": "<p><span class=\"term\" data-cid=\"standardization\">Standardization</span> means minimizing variety. It lowers cost and improves consistency, but risks freezing an imperfect design in place.</p>"}, {"heading": "Mass customization", "html": "<p><span class=\"term\" data-cid=\"mass-customization\">Mass customization</span> blends standardized production with individual customization via <span class=\"term\" data-cid=\"delayed-differentiation\">delayed differentiation</span> and <span class=\"term\" data-cid=\"modular-design\">modular design</span>.</p>"}, {"heading": "Reliability and robust design", "html": "<p><span class=\"term\" data-cid=\"reliability\">Reliability</span> is the ability to perform as intended under specified conditions; a <span class=\"term\" data-cid=\"failure\">failure</span> covers non-function, substandard, or unintended performance. <span class=\"term\" data-cid=\"robust-design\">Robust design</span> performs well across a wide range of conditions; Taguchi’s <span class=\"term\" data-cid=\"parameter-design\">parameter design</span> tests a small, chosen subset of combinations rather than every possibility.</p>"}, {"heading": "Listening to the customer", "html": "<p><span class=\"term\" data-cid=\"quality-function-deployment\">Quality function deployment (QFD)</span> translates the “voice of the customer” into technical requirements. The <span class=\"term\" data-cid=\"kano-model\">Kano model</span> sorts quality into <span class=\"term\" data-cid=\"basic-quality\">basic quality</span>, <span class=\"term\" data-cid=\"performance-quality\">performance quality</span>, and <span class=\"term\" data-cid=\"excitement-quality\">excitement quality</span>.</p>"}, {"heading": "Cultural and global design factors (supplementary)", "html": "<p>Companies operating globally adapt designs to local culture, law, and religious practice, and increasingly rely on globally distributed design teams.</p><div class=\"example\"><span class=\"example-label\">Concrete example — McDonald’s regional menus</span>Green tea ice cream in China, kale soup in Portugal, poutine in Canada — direct evidence of cultural factors shaping product design.</div>"}, {"heading": "Design strategy tactics (supplementary)", "html": "<p>Other design-strategy tactics for competitive advantage include bundling products with ancillary services (extended warranties, installation), using shared platforms across multiple models to cut cost, and continually monitoring for small improvements rather than betting everything on one “big bang” redesign. Being first to market can let a firm set higher prices before competitors catch up.</p>"}], "4.10": [{"heading": "The eight phases of product development <span class=\"section-tag\">Table 4.4</span>", "html": "<p>Product development typically runs through eight phases: feasibility analysis, product specifications, process specifications, prototype development, design review, market test, product introduction, and follow-up evaluation.</p>"}, {"heading": "Designing for production", "html": "<p><span class=\"term\" data-cid=\"concurrent-engineering\">Concurrent engineering</span> brings design and manufacturing together early, replacing the old “over-the-wall” hand-off. <span class=\"term\" data-cid=\"computer-aided-design\">Computer-aided design (CAD)</span> multiplies designer productivity 3 to 10 times. <span class=\"term\" data-cid=\"design-for-manufacturing\">Design for manufacturing (DFM)</span> and <span class=\"term\" data-cid=\"design-for-assembly\">design for assembly (DFA)</span> keep a design matched to real production capability, while <span class=\"term\" data-cid=\"component-commonality\">component commonality</span> reuses parts across products.</p>"}], "4.11": [{"heading": "Variation in requirements and degree of customer contact", "html": "<p>Unlike most products, <span class=\"term\" data-cid=\"service\">service</span>s are typically created and delivered at the same moment. <span class=\"term\" data-cid=\"service-design\">Service design</span> centers on two issues: how much requirements vary, and how much customer contact the delivery system requires.</p>"}], "4.12": [{"heading": "Nine characteristics of a well-designed service system", "html": "<p>Well-designed service systems tend to be: consistent with the mission, user-friendly, robust against variability, easy to sustain, cost-effective, obviously valuable, well-linked between front and back of house, built around a single unifying theme, and designed with quality checks.</p>"}, {"heading": "Service blueprinting", "html": "<p>A <span class=\"term\" data-cid=\"service-blueprint\">service blueprint</span> maps customer actions, visible staff actions, backstage actions, and support operations.</p><div class=\"example\"><span class=\"example-label\">Concrete example — a restaurant’s blueprint</span>Customer actions at top, server actions below, kitchen (“backstage”) actions next, and support functions — reservations, ordering, cashier — at the bottom.</div>"}], "4.13": [{"heading": "Nine guidelines for successful service design", "html": "<p>Define the service package in detail; design from the customer’s perspective; consider the image projected; get managers bought in; define quality for both tangible and intangible elements; align hiring/training/rewards with service expectations; and build in procedures for both predictable and unpredictable events.</p>"}, {"heading": "Why service management is uniquely challenging", "html": "<p>Service environments face less-structured jobs, much higher customer contact, higher input variability, and performance that can be swayed by workers’ or customers’ emotions — largely outside a manager’s control.</p>"}], "1.1": [{"heading": "Operations, goods, and services", "html": "<p><span class=\"term\" data-cid=\"operations-management\">Operations management</span> is the management of systems or processes that create <span class=\"term\" data-cid=\"goods\">goods</span> (physical items like raw materials, parts, and final products) and/or provide <span class=\"term\" data-cid=\"services\">services</span> (activities providing time, location, form, or psychological value). If a business organization were a car, operations would be its engine — the core of what it does.</p>"}, {"heading": "Supply chains and value-added", "html": "<p>Operations don’t exist in isolation — every organization sits inside a <span class=\"term\" data-cid=\"supply-chain\">supply chain</span>, the sequence of facilities, functions, and activities involved in producing and delivering a product or service, from raw material suppliers to the final customer. Coordinating that sequence deliberately is <span class=\"term\" data-cid=\"supply-chain-management\">supply chain management</span>. The essence of the whole transformation process is <span class=\"term\" data-cid=\"value-added\">value-added</span> — the difference between the cost of inputs and the value or price of outputs — which funds R&D, new equipment, wages, and profit.</p>"}], "1.2": [{"heading": "Goods vs. services, and the continuum between them", "html": "<p>Production of goods yields something tangible; delivery of a service generally implies an act. But most real offerings sit somewhere on a <span class=\"term\" data-cid=\"goods-service-continuum\">goods–service continuum</span> rather than being purely one or the other. Key differences include degree of customer contact (often higher for services), labor content (often higher for services), uniformity of inputs (often higher for goods), and ease of measuring productivity (often easier for goods).</p>"}], "1.3": [{"heading": "Why operations knowledge matters, even outside the field <span class=\"section-tag\">Section 1.3</span>", "html": "<p>Operations and sales are the two <span class=\"term\" data-cid=\"line-functions\">line functions</span> of a business — the ones that directly generate revenue — with every other function (accounting, finance, IT) existing to support them. Understanding operations gives you insight into why companies succeed or fail and how global dependencies actually work, regardless of your major.</p>"}, {"heading": "Career opportunities and professional societies <span class=\"section-tag\">Section 1.4</span>", "html": "<p>Common operations job titles include operations manager, production manager, inventory manager, purchasing manager, distribution manager, supply chain manager, and quality manager. Success in the field calls for both people skills (political awareness, mentoring, negotiation, communication) and knowledge skills (product/process knowledge, industry knowledge, financial and project-management skills).</p><div class=\"example\"><span class=\"example-label\">Concrete example — professional societies</span>Organizations such as the Association for Supply Chain Management (APICS), the American Society for Quality (ASQ), the Institute for Supply Management (ISM), INFORMS, POMS, PMI, and CSCMP offer certification exams and networking that can strengthen a career in operations.</div>"}], "1.4": [{"heading": "The three functional areas and how they overlap", "html": "<p>Every business organization, regardless of type, has the same <span class=\"term\" data-cid=\"functional-areas\">three basic functional areas</span>: finance (securing and allocating money), marketing (assessing wants/needs and promoting offerings), and operations (producing the goods/services). These three constantly interface — marketing tells operations what customers want, operations tells marketing what’s realistically deliverable, and finance funds both.</p>"}], "1.5": [{"heading": "What a process is, and the three process categories", "html": "<p>A <span class=\"term\" data-cid=\"process\">process</span> is one or more actions that transform inputs into outputs — and the chapter argues the central role of ALL management is process management. Businesses run on <span class=\"term\" data-cid=\"business-process-categories\">three categories of processes</span>: upper-management (governance, strategy), operational (the core value stream), and supporting (accounting, HR, IT).</p>"}, {"heading": "Managing demand and process variation", "html": "<p>Process management has two major aspects: matching process capacity to demand, and dealing with variation. There are <span class=\"term\" data-cid=\"four-sources-of-variation\">four sources of variation</span>: the variety of offerings, structural variation (trend/seasonality), random variation (uncontrollable), and assignable variation (correctable, caused by defects or errors).</p>"}], "1.6": [{"heading": "System design vs. system operation decisions", "html": "<p>An operations manager makes two broad types of decisions. <span class=\"term\" data-cid=\"system-design\">System design</span> decisions (capacity, location, layout, equipment) are typically long-term and strategic. <span class=\"term\" data-cid=\"system-operation\">System operation</span> decisions (personnel, inventory, scheduling, quality) are typically tactical and operational, and take up more of an operations manager’s day-to-day time — even though system design decisions ultimately shape what's possible in operation.</p>"}], "1.7": [{"heading": "Models: simplifications that aid decisions", "html": "<p>A <span class=\"term\" data-cid=\"model\">model</span> is an abstraction of reality, classified as physical (a toy car), schematic (a blueprint), or mathematical (a formula) — each trading realism for ease of use. Managers also rely on <span class=\"term\" data-cid=\"trade-offs\">trade-off analysis</span> (weighing competing pros and cons) and <span class=\"term\" data-cid=\"analytics-types\">four types of analytics</span>: descriptive, diagnostic, predictive, and prescriptive.</p>"}, {"heading": "Systems perspective and priorities", "html": "<p>A <span class=\"term\" data-cid=\"systems-perspective\">systems perspective</span> keeps the whole organization's output ahead of any one subsystem's local goals — essential whenever something is designed or changed. And because a relatively few issues usually drive most of the results (the <span class=\"term\" data-cid=\"pareto-phenomenon\">Pareto phenomenon</span>), managers focus disproportionate effort on the few factors that matter most.</p>"}], "1.8": [{"heading": "From craft production to scientific management", "html": "<p>Before the Industrial Revolution, craft production (skilled workers, custom-fit parts) was slow and offered no economies of scale. <span class=\"term\" data-cid=\"scientific-management\">Scientific management</span>, pioneered by Frederick Taylor, brought observation, measurement, and economic incentives to factory work. Key building blocks that followed were <span class=\"term\" data-cid=\"division-of-labor\">division of labor</span> (Adam Smith) and <span class=\"term\" data-cid=\"interchangeable-parts\">interchangeable parts</span> (Eli Whitney), which together let Henry Ford launch mass production.</p>"}, {"heading": "The human relations movement", "html": "<p>Because Taylor and Ford's methods treated workers as replaceable parts of the machine, the <span class=\"term\" data-cid=\"human-relations-movement\">human relations movement</span> pushed back, emphasizing motivation and the human element — including Elton Mayo's Hawthorne studies and later Theory X/Y/Z frameworks about how much workers are trusted and empowered.</p>"}], "1.9": [{"heading": "Mass production, lean production, and agility", "html": "<p><span class=\"term\" data-cid=\"mass-production\">Mass production</span> produces high volumes of standardized goods with low-skill labor and specialized equipment. <span class=\"term\" data-cid=\"lean-production\">Lean production</span> emerged later, blending mass production's volume with craft production's flexibility — using far less space, inventory, and workers for comparable output, but demanding more from a highly skilled, team-based workforce. <span class=\"term\" data-cid=\"agility\">Agility</span> — the ability to respond quickly to demand shifts — has become critical as product life cycles shrink.</p>"}], "1.10": [{"heading": "Ethical decision making", "html": "<p>Managers must weigh how decisions affect shareholders, employees, customers, the community, and the environment. The Markula Center's <span class=\"term\" data-cid=\"five-ethical-principles\">five ethical principles</span> — Utilitarian, Rights, Fairness, Common Good, and Virtue — offer different lenses for evaluating a decision, applied through a five-step framework: recognize the issue, gather facts, evaluate options against principles, choose and stress-test the best option, then reflect afterward.</p>"}, {"heading": "Sustainability and environmental concerns", "html": "<p>Growing pressure to reduce carbon footprints has pushed <span class=\"term\" data-cid=\"sustainability-om\">sustainability</span> into product design, supply chain waste management, and outsourcing decisions — sometimes called “green initiatives.”</p>"}], "1.11": [{"heading": "Why supply chains need active management", "html": "<p>Historically, most organizations focused only on their own operations and immediate suppliers, leading to oscillating inventories, stockouts, late deliveries, and quality problems across the chain. <span class=\"term\" data-cid=\"supply-chain-management\">Supply chain management</span> addresses this by coordinating customers, forecasting, design, capacity, processing, inventory, purchasing, suppliers, location, and logistics as one connected system — increasingly urgent given rising outsourcing, globalization, e-business, and trade-war-driven uncertainty.</p>"}], "3.1": [{"heading": "Features common to every forecast", "html": "<p>Whatever technique is used, all forecasts assume the same underlying causal system that existed in the past will continue into the future. Beyond that assumption, forecasts share three features: they are never perfect (randomness guarantees some error), forecasts for GROUPS of items tend to be more accurate than forecasts for individual items (errors partly cancel out), and accuracy decreases as the <span class=\"term\" data-cid=\"time-horizon\">time horizon</span> increases — short-range forecasts are generally more accurate than long-range ones.</p>"}], "3.2": [{"heading": "Why forecasts are generally wrong <span class=\"section-tag\">Section 3.2</span>", "html": "<p>Forecasts fail to be perfect because random variation is always present, and because unplanned events — weather, tax changes, a competitor's new pricing — can disrupt the stable causal system a forecast assumes. A manager can never fully delegate forecasting to a model and walk away; <span class=\"term\" data-cid=\"forecast-error\">forecast error</span> is simply the rule, not the exception, and models must be watched and overridden when reality shifts.</p>"}, {"heading": "Forecasting and the supply chain <span class=\"section-tag\">Section 3.4</span>", "html": "<p>Forecast accuracy matters beyond a single department. Substantially inaccurate forecasts create shortages and excesses that ripple through an entire supply chain — shortages lead to missed deliveries, work disruption, and poor customer service; excesses lead to bloated inventory and higher costs. Organizations reduce this risk through collaborative planning with supply chain partners, sharing real-time sales and inventory data, and communicating quickly about poor forecasts or unplanned disruptions like severe weather or work stoppages.</p>"}], "3.3": [{"heading": "What makes a forecast \"good\"", "html": "<p>A properly prepared forecast should be timely (covering the lead time needed to act on it), accurate with a stated degree of accuracy, reliable (consistent, not hit-or-miss), expressed in meaningful units, written down, simple enough for users to understand and trust, and cost-effective — its benefits should outweigh what it costs to produce.</p>"}], "3.4": [{"heading": "The six steps in the forecasting process", "html": "<p>Forecasting follows six steps: (1) determine the forecast's purpose, (2) establish a time horizon, (3) obtain, clean, and analyze the data, (4) select a forecasting technique, (5) make the forecast, and (6) monitor forecast errors, revising the approach as needed. Once set up, only steps 3 and 6 typically need repeating as new data arrives.</p>"}], "3.5": [{"heading": "The three families of forecasting techniques <span class=\"section-tag\">Section 3.6</span>", "html": "<p>Before picking a specific technique, it helps to see the big picture. There are two general approaches to forecasting. <span class=\"term\" data-cid=\"qualitative-techniques\">Qualitative techniques</span> rely mainly on subjective inputs — human factors, opinions, hunches — that are hard to quantify precisely. <span class=\"term\" data-cid=\"quantitative-techniques\">Quantitative techniques</span> rely on objective, hard data, either by projecting historical values forward or by building an equation from related variables. In practice the two are often combined: qualitative input helps explain WHY a quantitative forecast came out the way it did.</p><p>Within those two approaches, every specific technique in this chapter sorts into three named families: <span class=\"term\" data-cid=\"judgmental-forecasts\">judgmental forecasts</span> (subjective input from surveys, sales staff, executives, or expert panels), <span class=\"term\" data-cid=\"time-series-forecasts\">time-series forecasts</span> (projecting a variable’s own past values forward, without explaining the cause), and <span class=\"term\" data-cid=\"associative-models\">associative models</span> (equations using one or more separate explanatory variables — like predicting paint demand from its price and advertising spend).</p>"}, {"heading": "Four qualitative forecasting techniques <span class=\"section-tag\">Section 3.7</span>", "html": "<p>When historical data doesn't exist or time is short, forecasters turn to judgment. <span class=\"term\" data-cid=\"executive-opinions\">Executive opinions</span> pool senior managers' knowledge but risk one voice dominating. <span class=\"term\" data-cid=\"salesforce-opinions\">Salesforce opinions</span> tap direct customer contact but can be skewed by recent experience or sales-quota incentives. <span class=\"term\" data-cid=\"consumer-surveys\">Consumer surveys</span> go straight to the source but are costly and vulnerable to irrational buying behavior. The <span class=\"term\" data-cid=\"delphi-method\">Delphi method</span> circulates anonymous questionnaires among experts iteratively, useful for long-term technology forecasts with little hard data.</p>"}], "3.6": [{"heading": "Reading the underlying pattern in a time series <span class=\"section-tag\">Section 3.8</span>", "html": "<p>A <span class=\"term\" data-cid=\"time-series\">time series</span> is a time-ordered sequence of observations. Plotting it usually reveals some mix of <span class=\"term\" data-cid=\"trend\">trend</span> (long-term direction), <span class=\"term\" data-cid=\"seasonality\">seasonality</span> (short-term regular swings), <span class=\"term\" data-cid=\"cycles\">cycles</span> (multi-year waves), <span class=\"term\" data-cid=\"irregular-variations\">irregular variations</span> (one-off disruptions, ideally removed), and <span class=\"term\" data-cid=\"random-variations\">random variations</span> (the unexplainable leftover noise).</p>"}, {"heading": "The naive method <span class=\"section-tag\">Section 3.8</span>", "html": "<p>The <span class=\"term\" data-cid=\"naive-forecast\">naive forecast</span> just carries forward the last known value (or the same value from last “season,” or the last observed change). It has virtually no cost and is fully understandable — its accuracy is the baseline every fancier technique has to beat to justify its extra cost.</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE &mdash; Naive Forecast with a Trend (Section 3.8)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><th>Actual</th><th>Change from Previous Value</th><th>Forecast</th></tr><tr><td>1</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 50</td><td>&mdash;</td><td>&mdash;</td></tr><tr><td>2</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 53</td><td><span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span> +3</td><td>&mdash;</td></tr><tr><td>3</td><td>&mdash;</td><td>&mdash;</td><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 56</td></tr></table><p>Reading this table: each row is one time period. The \"Change\" column is just Actual minus the previous period’s Actual. The naive method assumes that same recent change will happen again.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Naive Forecast with Trend</div><div class=\"fc-main\">F(next) = Last value + (Last value &minus; Previous value)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Last value</span>&nbsp;=&nbsp;the most recent actual data point</span><span class=\"fc-var-chip\"><span class=\"sym\">Previous value</span>&nbsp;=&nbsp;the data point right before that</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-naive\">Show next step →</button><ol class=\"fc-steps\" id=\"w-naive\"><li>Find the most recent change: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>53 &minus; <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>50 = <span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>+3.</li><li hidden>Add that change to the last value: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>53 + <span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>+3.</li></ol><div class=\"fc-answer\">Forecast for the next period = <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>56</div></div>"}], "3.7": [{"heading": "Moving average forecasts", "html": "<p>A <span class=\"term\" data-cid=\"moving-average\">moving average</span> averages the last n actual values, sliding the window forward each period (drop the oldest, add the newest). Fewer periods = more responsive to real changes but more sensitive to noise; more periods = smoother but slower to react.</p><details class=\"source-box\"><summary>EXAMPLE 1 &mdash; Computing a Moving Average (Shopping Cart Demand)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><th>Demand</th><th>Used for the Period-6 forecast?</th></tr><tr><td>1</td><td class=\"excluded\">42</td><td class=\"excluded\">Not used &mdash; too old</td></tr><tr><td>2</td><td class=\"excluded\">40</td><td class=\"excluded\">Not used &mdash; too old</td></tr><tr><td>3</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 43</td><td>Used ✓</td></tr><tr><td>4</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 40</td><td>Used ✓</td></tr><tr><td>5</td><td><span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span> 41</td><td>Used ✓</td></tr></table><p>Reading this table: each row is one time period’s actual demand. A 3-period moving average only ever uses the <strong>3 most recent</strong> values — periods 1 and 2 are excluded here simply because they’ve aged out of the window, not because anything is wrong with them.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; 3-Period Moving Average (forecast for Period 6)</div><div class=\"fc-main\">F(t) = (A(t-3) + A(t-2) + A(t-1)) &divide; n</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">A(t-1), A(t-2), A(t-3)</span>&nbsp;=&nbsp;the 3 most recent actual demand values</span><span class=\"fc-var-chip\"><span class=\"sym\">n</span>&nbsp;=&nbsp;the number of periods averaged (3)</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ma-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ma-1\"><li>Add the three most recent values: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>43 + <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>40 + <span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>41 = <strong>124</strong>.</li><li hidden>Divide by n = 3: 124 &divide; 3.</li></ol><div class=\"fc-answer\">Moving average forecast for Period 6 = 41.33</div></div><p>If actual demand turns out to be 38 in period 6, the window slides forward one period:</p><details class=\"source-box\"><summary>EXAMPLE 1 continued &mdash; The Window Slides Forward</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><th>Demand</th><th>Used for the Period-7 forecast?</th></tr><tr><td>3</td><td class=\"excluded\">43</td><td class=\"excluded\">No longer used &mdash; aged out</td></tr><tr><td>4</td><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 40</td><td>Used ✓</td></tr><tr><td>5</td><td><span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span> 41</td><td>Used ✓</td></tr><tr><td>6 (actual, now known)</td><td><span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span> 38</td><td>Used ✓</td></tr></table><p>Notice period 3 (which WAS used a moment ago) has now aged out, and the newly observed period 6 actual demand (38) has taken its place. This is exactly what “moving” means in moving average.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Updating the Moving Average</div><div class=\"fc-main\">F(t) = (A(t-3) + A(t-2) + A(t-1)) &divide; n</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">New window</span>&nbsp;=&nbsp;the three most recent values now that period 6 has occurred</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-ma-2\">Show next step →</button><ol class=\"fc-steps\" id=\"w-ma-2\"><li>Add the new three most recent values: <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>40 + <span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span>41 + <span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span>38 = <strong>119</strong>.</li><li hidden>Divide by n = 3: 119 &divide; 3.</li></ol><div class=\"fc-answer\">Updated forecast for Period 7 = 39.67</div></div>"}], "3.8": [{"heading": "Weighted moving average forecasts", "html": "<p>A <span class=\"term\" data-cid=\"weighted-moving-average\">weighted moving average</span> works like a moving average, but lets you assign more importance to more recent data. The heaviest weight always goes to the most recent period, and all weights must sum to exactly 1.00.</p><details class=\"source-box\"><summary>EXAMPLE 2 &mdash; Computing a Weighted Moving Average</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><th>Demand</th><th>Weight (for Period-6 forecast)</th></tr><tr><td>1</td><td class=\"excluded\">42</td><td class=\"excluded\">Not used</td></tr><tr><td>2</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 40</td><td><span class=\"src-badge b-wa\" data-tbaction=\"flashSrc\" data-src=\"WA\">WA</span> .10 (oldest of the 4 used)</td></tr><tr><td>3</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 43</td><td><span class=\"src-badge b-wb\" data-tbaction=\"flashSrc\" data-src=\"WB\">WB</span> .20</td></tr><tr><td>4</td><td><span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span> 40</td><td><span class=\"src-badge b-wc\" data-tbaction=\"flashSrc\" data-src=\"WC\">WC</span> .30</td></tr><tr><td>5</td><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 41</td><td><span class=\"src-badge b-wd\" data-tbaction=\"flashSrc\" data-src=\"WD\">WD</span> .40 (most recent)</td></tr></table><p>Reading this table: unlike a plain moving average, each period gets its OWN weight instead of an equal 1/n share. The most recent period (5) gets the heaviest weight, .40; the weights across all 4 periods used must add up to 1.00 (.10+.20+.30+.40=1.00).</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Weighted Moving Average (forecast for Period 6)</div><div class=\"fc-main\">F(t) = W<sub>2</sub>&middot;A<sub>2</sub> + W<sub>3</sub>&middot;A<sub>3</sub> + W<sub>4</sub>&middot;A<sub>4</sub> + W<sub>5</sub>&middot;A<sub>5</sub></div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">Weights</span>&nbsp;=&nbsp;.10, .20, .30, .40 &mdash; must sum to 1.00</span><span class=\"fc-var-chip\"><span class=\"sym\">Demand values</span>&nbsp;=&nbsp;the matching actual demand for each of those periods</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-wma-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-wma-1\"><li>Multiply each period's demand by its own weight: <span class=\"src-badge b-wa\" data-tbaction=\"flashSrc\" data-src=\"WA\">WA</span>.10&times;<span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>40 = 4.0,&nbsp; <span class=\"src-badge b-wb\" data-tbaction=\"flashSrc\" data-src=\"WB\">WB</span>.20&times;<span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>43 = 8.6,&nbsp; <span class=\"src-badge b-wc\" data-tbaction=\"flashSrc\" data-src=\"WC\">WC</span>.30&times;<span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>40 = 12.0,&nbsp; <span class=\"src-badge b-wd\" data-tbaction=\"flashSrc\" data-src=\"WD\">WD</span>.40&times;<span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>41 = 16.4.</li><li hidden>Add all four products together: 4.0 + 8.6 + 12.0 + 16.4.</li></ol><div class=\"fc-answer\">Weighted average forecast for Period 6 = 41.0</div></div><p><strong>Why not just use a plain average?</strong> A plain (unweighted) moving average of periods 2–5 would give (40+43+40+41)÷4 = 41.0 as well in this particular case — but the weighted version lets more recent demand swing the forecast further, which matters more when the underlying pattern is actually shifting.</p>"}], "3.9": [{"heading": "Exponential smoothing", "html": "<p><span class=\"term\" data-cid=\"exponential-smoothing\">Exponential smoothing</span> nudges the previous forecast toward the actual result by a percentage (&alpha;, the smoothing constant, from 0 to 1). A low &alpha; (around .05–.20) smooths heavily and reacts slowly — good for a stable series. A high &alpha; (closer to .50) reacts quickly but smooths less.</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE &mdash; Exponential Smoothing, First Update (Section 3.8)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Quantity</th><th>Value</th></tr><tr><td>Previous forecast, F(t-1)</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 42</td></tr><tr><td>Actual demand, A(t-1)</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 40</td></tr><tr><td>Smoothing constant, &alpha;</td><td><span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span> .10</td></tr></table><p>Reading this: exponential smoothing only ever needs THREE pieces of information &mdash; last period’s forecast, what actually happened, and the alpha dial you’ve chosen.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Exponential Smoothing</div><div class=\"fc-main\">F(t) = F(t-1) + &alpha;[A(t-1) &minus; F(t-1)]</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">F(t-1)</span>&nbsp;=&nbsp;the previous forecast</span><span class=\"fc-var-chip\"><span class=\"sym\">A(t-1)</span>&nbsp;=&nbsp;the actual demand that occurred</span><span class=\"fc-var-chip\"><span class=\"sym\">&alpha;</span>&nbsp;=&nbsp;the smoothing constant</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-es-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-es-1\"><li>Find the forecast error: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>40 &minus; <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>42 = <strong>&minus;2</strong>.</li><li hidden>Multiply the error by alpha: <span class=\"src-badge b-c\" data-tbaction=\"flashSrc\" data-src=\"C\">C</span>.10 &times; (&minus;2) = <strong>&minus;0.2</strong>.</li><li hidden>Add that to the previous forecast: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>42 + (&minus;0.2).</li></ol><div class=\"fc-answer\">New forecast = 41.8</div></div><p>If the next actual demand turns out to be 43, repeat the exact same three steps using the new forecast (41.8) as the starting point:</p><details class=\"source-box\"><summary>TEXTBOOK EXAMPLE continued &mdash; Second Update</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Quantity</th><th>Value</th></tr><tr><td>Previous forecast, F(t-1)</td><td><span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span> 41.8</td> <span style=\"font-size:11px;color:var(--ink-soft);\">(just computed above)</span></td></tr><tr><td>New actual demand, A(t-1)</td><td><span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span> 43</td></tr><tr><td>Smoothing constant, &alpha;</td><td><span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span> .10</td></tr></table></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Updating the Forecast Again</div><div class=\"fc-main\">F(t) = F(t-1) + &alpha;[A(t-1) &minus; F(t-1)]</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">F(t-1)</span>&nbsp;=&nbsp;41.8, the forecast just computed</span><span class=\"fc-var-chip\"><span class=\"sym\">A(t-1)</span>&nbsp;=&nbsp;43, the new actual demand</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-es-2\">Show next step →</button><ol class=\"fc-steps\" id=\"w-es-2\"><li>Find the error: <span class=\"src-badge b-e\" data-tbaction=\"flashSrc\" data-src=\"E\">E</span>43 &minus; <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>41.8 = <strong>1.2</strong>.</li><li hidden>Multiply by alpha: <span class=\"src-badge b-f\" data-tbaction=\"flashSrc\" data-src=\"F\">F</span>.10 &times; 1.2 = <strong>0.12</strong>.</li><li hidden>Add to the previous forecast: <span class=\"src-badge b-d\" data-tbaction=\"flashSrc\" data-src=\"D\">D</span>41.8 + 0.12.</li></ol><div class=\"fc-answer\">New forecast = 41.92</div></div><p>Note: exponential smoothing should ideally start several periods back (using an average of early periods as the starting forecast) rather than starting from just the first actual value, though this book uses the simpler naive starting-point approach for the earliest forecast in a series.</p>"}], "3.10": [{"heading": "The linear trend equation", "html": "<p>The <span class=\"term\" data-cid=\"trend-equation\">trend equation</span> F(t) = a + b&middot;t lets you project many periods into the future at once, unlike a moving average’s single-step-ahead forecast. <strong>a</strong> is the y-intercept (the value at t=0) and <strong>b</strong> is the slope (how much the forecast changes per period). The coefficients are computed the same way as ordinary linear regression, just with t in place of x.</p><details class=\"source-box\"><summary>TABLE 3.1 &mdash; Excel Solution for Example 3 (Cell Phone Sales, 10 Weeks)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Week</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>Sales</th><td>700</td><td>724</td><td>720</td><td>728</td><td>740</td><td>742</td><td>758</td><td>750</td><td>770</td><td>775</td></tr></table><p>Reading this table: each column is one week; the row underneath is that week’s actual sales. Plotting these 10 points shows a fairly steady upward climb — exactly the pattern a linear trend line is built for.</p><table class=\"src-table\" style=\"margin-top:10px;\"><tr><th>Fitted trend line</th><th>Value</th></tr><tr><td>Slope, b</td><td><span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span> 7.51</td></tr><tr><td>Intercept, a</td><td><span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span> 699.4</td></tr></table><p>The textbook computes b and a from all 10 weeks of data using the least-squares formulas — the app’s Excel-style template does this same computation instantly, but the RESULT (b=7.51, a=699.40) is what plugs into the trend equation below.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Forecasting Week 11</div><div class=\"fc-main\">F(t) = a + b&middot;t</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">a</span>&nbsp;=&nbsp;699.40, the fitted y-intercept</span><span class=\"fc-var-chip\"><span class=\"sym\">b</span>&nbsp;=&nbsp;7.51, the fitted slope (units per week)</span><span class=\"fc-var-chip\"><span class=\"sym\">t</span>&nbsp;=&nbsp;the week number being forecast</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-trend-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-trend-1\"><li>Multiply the slope by the time period: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>7.51 &times; 11 = <strong>82.61</strong>.</li><li hidden>Add the y-intercept: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>699.40 + 82.61.</li></ol><div class=\"fc-answer\">Forecast for week 11 = 782.01</div></div><p>Repeating the same two steps for week 12:</p><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; One Week Further Out</div><div class=\"fc-main\">F(t) = a + b&middot;t</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">t</span>&nbsp;=&nbsp;12, the next week</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-trend-2\">Show next step →</button><ol class=\"fc-steps\" id=\"w-trend-2\"><li>Multiply: <span class=\"src-badge b-b\" data-tbaction=\"flashSrc\" data-src=\"B\">B</span>7.51 &times; 12 = <strong>90.12</strong>.</li><li hidden>Add the intercept: <span class=\"src-badge b-a\" data-tbaction=\"flashSrc\" data-src=\"A\">A</span>699.40 + 90.12.</li></ol><div class=\"fc-answer\">Forecast for week 12 = 789.52</div></div>"}], "3.11": [{"heading": "Trend-adjusted exponential smoothing", "html": "<p><span class=\"term\" data-cid=\"trend-adjusted-smoothing\">Trend-adjusted exponential smoothing</span> (double smoothing) fixes a real weakness: plain exponential smoothing always LAGS a trend — forecasting too low when data is rising, too high when falling. It uses two smoothing constants: &alpha; for the average, &beta; for the trend (the book uses &alpha;=.40, &beta;=.30 for this data).</p><details class=\"source-box\"><summary>TABLE 3.2 &mdash; Trend-Adjusted Smoothing Setup (Same Cell Phone Sales Data)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Week</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>Sales</th><td><span class=\"src-badge b-p1\" data-tbaction=\"flashSrc\" data-src=\"P1\">P1</span> 700</td><td><span class=\"src-badge b-p2\" data-tbaction=\"flashSrc\" data-src=\"P2\">P2</span> 724</td><td><span class=\"src-badge b-p3\" data-tbaction=\"flashSrc\" data-src=\"P3\">P3</span> 720</td><td><span class=\"src-badge b-p4\" data-tbaction=\"flashSrc\" data-src=\"P4\">P4</span> 728</td></tr></table><p>Reading this: the book estimates the STARTING trend by looking at the total change across the first 4 weeks (3 gaps between them), then averaging that change.</p></div></details><div class=\"formula-card\"><div class=\"fc-title\">Worked Example &mdash; Setting the Starting Forecast</div><div class=\"fc-main\">TAF(t+1) = S(t) + T(t)</div><div class=\"fc-vars\"><span class=\"fc-var-chip\"><span class=\"sym\">S(t)</span>&nbsp;=&nbsp;previous forecast plus smoothed error</span><span class=\"fc-var-chip\"><span class=\"sym\">T(t)</span>&nbsp;=&nbsp;the current trend estimate</span></div><button class=\"walk-btn\" data-tbaction=\"walkNext\" data-list=\"w-tas-1\">Show next step →</button><ol class=\"fc-steps\" id=\"w-tas-1\"><li>Find the total change across the first 3 gaps: (<span class=\"src-badge b-p2\" data-tbaction=\"flashSrc\" data-src=\"P2\">P2</span>724&minus;<span class=\"src-badge b-p1\" data-tbaction=\"flashSrc\" data-src=\"P1\">P1</span>700) + (<span class=\"src-badge b-p3\" data-tbaction=\"flashSrc\" data-src=\"P3\">P3</span>720&minus;<span class=\"src-badge b-p2\" data-tbaction=\"flashSrc\" data-src=\"P2\">P2</span>724) + (<span class=\"src-badge b-p4\" data-tbaction=\"flashSrc\" data-src=\"P4\">P4</span>728&minus;<span class=\"src-badge b-p3\" data-tbaction=\"flashSrc\" data-src=\"P3\">P3</span>720) = 24 + (&minus;4) + 8 = <strong>28</strong>.</li><li hidden>Average that over the 3 gaps to get the initial trend estimate: 28 &divide; 3 = <strong>9.33</strong>.</li><li hidden>Add that trend estimate to the last known actual value: <span class=\"src-badge b-p4\" data-tbaction=\"flashSrc\" data-src=\"P4\">P4</span>728 + 9.33.</li></ol><div class=\"fc-answer\">Starting forecast (period 5) = 737.33</div></div>"}], "3.12": [{"heading": "Seasonal relatives: deseasonalizing and forecasting", "html": "<p>A <span class=\"term\" data-cid=\"seasonal-relative\">seasonal relative</span> (multiplicative model) expresses a season’s typical deviation from average as a percentage — 1.20 means 20% above average, 0.90 means 10% below.</p><details class=\"source-box\"><summary>EXAMPLE 4 &mdash; Deseasonalizing Hot Chocolate Sales (8 Quarters)</summary><div class=\"source-content\"><table class=\"src-table\"><tr><th>Period</th><th>Quarter</th><th>Sales (gal)</th><th>&divide; Relative</t
